<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PetFBI Posting Board</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #0a121c; color: #dce8f4; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 18px; background: #0e1928; border-bottom: 1px solid #16283a; position: sticky; top: 0; }
  header h1 { font-size: 16px; margin: 0; flex: 1; }
  header .who { font-size: 12px; color: #7f93a8; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 16px 18px 60px; }
  .gate { max-width: 420px; margin: 60px auto; background: #0e1928; border: 1px solid #1c3147; border-radius: 12px; padding: 22px; }
  .gate h2 { margin: 0 0 6px; font-size: 16px; }
  .gate p { color: #8198ad; font-size: 12.5px; margin: 0 0 14px; }
  input, select, button { font: inherit; }
  input, select { width: 100%; padding: 9px 11px; background: #0a141f; color: #e7f1fb; border: 1px solid #21384a; border-radius: 8px; margin: 6px 0; }
  button { cursor: pointer; border: 0; border-radius: 8px; padding: 8px 14px; background: #1d6fe0; color: #fff; font-weight: 600; }
  button.ghost { background: #16283a; color: #bcd2e6; }
  button.warn { background: #8a3b3b; }
  button.ok { background: #2c8a4a; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; }
  .add { display: flex; gap: 8px; margin: 6px 0 16px; }
  .add input { margin: 0; }
  .card { background: #0e1928; border: 1px solid #16283a; border-radius: 11px; padding: 13px 15px; margin: 9px 0; }
  .card.posted { opacity: .62; }
  .card .top { display: flex; align-items: center; gap: 10px; }
  .card .title { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .card .loc { color: #7f93a8; font-size: 12px; margin-top: 2px; }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .b-open { background: #1d3a5a; color: #8fc4ff; }
  .b-claimed { background: #5a4a1d; color: #ffd98f; }
  .b-posted { background: #234a2c; color: #9fe8b3; }
  .acts { display: flex; gap: 7px; margin-top: 10px; flex-wrap: wrap; }
  .acts button { padding: 6px 11px; font-size: 12.5px; }
  .muted { color: #6f8499; }
  .err { color: #ff9a9a; font-size: 12px; min-height: 16px; }
  .foot { color: #5d7186; font-size: 11px; margin-top: 18px; text-align: center; }
</style>
</head>
<body>
<div id="gate" class="gate" style="display:none">
  <h2>PetFBI Posting Board</h2>
  <p>Shared claim / posted status so admins don't double-post. Enter the server token and your name (stored on this device only).</p>
  <input id="gToken" type="password" placeholder="server token (SWEK_TOKEN)">
  <input id="gName" placeholder="your name (e.g. Jess)">
  <button id="gGo" style="width:100%;margin-top:8px">Open board</button>
  <div id="gErr" class="err"></div>
</div>

<div id="app" style="display:none">
  <header>
    <h1>PetFBI Posting Board</h1>
    <span class="who" id="whoami"></span>
    <button class="ghost" id="logout" style="padding:5px 10px">Sign out</button>
  </header>
  <div class="wrap">
    <div class="add">
      <input id="newTitle" placeholder="New report — pet name / summary">
      <input id="newLoc" placeholder="location" style="max-width:180px">
      <button id="addBtn">Add</button>
    </div>
    <div id="err" class="err"></div>
    <div id="list"></div>
    <div class="foot">Live board &middot; updates every few seconds &middot; backed by the SweK rendezvous /room</div>
  </div>
</div>

<script>
const ROOM = "petfbi-board";
let TOKEN = localStorage.getItem("swek_board_token") || "";
let ME = localStorage.getItem("swek_board_name") || "";
let _rev = 0, _items = [], _busy = false, _timer = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[<>&]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]));
const qtok = () => "token=" + encodeURIComponent(TOKEN);

async function getRoom() {
  const r = await fetch("/room/" + ROOM + "?" + qtok(), { cache: "no-store" }).then(x => x.json());
  if (!r || r.ok === false) throw new Error((r && r.error) || "load failed");
  _rev = r.rev || 0;
  _items = (r.value && Array.isArray(r.value.items)) ? r.value.items : [];
  return _items;
}
// read-modify-write with optimistic lock; on a rev conflict, reload and re-apply the mutation.
async function mutate(fn) {
  for (let i = 0; i < 4; i++) {
    await getRoom();
    const next = fn(_items.map(x => Object.assign({}, x)));
    const r = await fetch("/room/" + ROOM + "?" + qtok(), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ value: { items: next }, ifRev: _rev }) }).then(x => x.json());
    if (r && r.ok) { _items = next; _rev = r.rev; render(); return true; }
    if (r && r.error === "rev conflict") continue;   // someone else wrote; retry on fresh rev
    throw new Error((r && r.error) || "save failed");
  }
  throw new Error("too many conflicts, try again");
}

function statusBadge(s) { const m = { open: ["b-open", "OPEN"], claimed: ["b-claimed", "CLAIMED"], posted: ["b-posted", "POSTED"] }; const [c, t] = m[s] || m.open; return '<span class="badge ' + c + '">' + t + "</span>"; }

function render() {
  $("whoami").textContent = "you: " + ME;
  const host = $("list"); host.innerHTML = "";
  if (!_items.length) { host.innerHTML = '<div class="muted">No reports yet. Add one above.</div>'; return; }
  const order = { claimed: 0, open: 1, posted: 2 };
  const sorted = _items.slice().sort((a, b) => (order[a.status] - order[b.status]) || (b.ts - a.ts));
  for (const it of sorted) {
    const card = document.createElement("div"); card.className = "card" + (it.status === "posted" ? " posted" : "");
    let acts = "";
    if (it.status === "open") acts = '<button class="ok" data-act="claim" data-id="' + it.id + '">Claim</button>';
    else if (it.status === "claimed" && it.by === ME) acts = '<button class="ok" data-act="posted" data-id="' + it.id + '">Mark posted</button><button class="ghost" data-act="release" data-id="' + it.id + '">Release</button>';
    else if (it.status === "claimed") acts = '<span class="muted">claimed by ' + esc(it.by) + '</span>';
    else if (it.status === "posted") acts = '<span class="muted">posted by ' + esc(it.by || "?") + '</span><button class="ghost" data-act="reopen" data-id="' + it.id + '">Reopen</button>';
    card.innerHTML = '<div class="top"><div class="title">' + esc(it.title) + "</div>" + statusBadge(it.status) + "</div>" +
      (it.loc ? '<div class="loc">\uD83D\uDCCD ' + esc(it.loc) + "</div>" : "") +
      '<div class="acts">' + acts + '<button class="warn" data-act="del" data-id="' + it.id + '" style="margin-left:auto">Delete</button></div>';
    host.appendChild(card);
  }
  host.querySelectorAll("button[data-act]").forEach(b => b.onclick = () => act(b.getAttribute("data-act"), b.getAttribute("data-id")));
}

async function act(a, id) {
  $("err").textContent = "";
  try {
    await mutate(items => {
      const it = items.find(x => x.id === id); if (!it && a !== "add") return items;
      if (a === "claim") { it.status = "claimed"; it.by = ME; }
      else if (a === "release") { it.status = "open"; it.by = ""; }
      else if (a === "posted") { it.status = "posted"; it.by = ME; }
      else if (a === "reopen") { it.status = "open"; it.by = ""; }
      else if (a === "del") return items.filter(x => x.id !== id);
      return items;
    });
  } catch (e) { $("err").textContent = e.message; }
}

async function addItem() {
  const t = $("newTitle").value.trim(); if (!t) return;
  const loc = $("newLoc").value.trim();
  $("newTitle").value = ""; $("newLoc").value = ""; $("err").textContent = "";
  try { await mutate(items => { items.push({ id: "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), title: t, loc, status: "open", by: "", ts: Date.now() }); return items; }); }
  catch (e) { $("err").textContent = e.message; }
}

async function tick() { if (_busy) return; _busy = true; try { await getRoom(); render(); $("err").textContent = ""; } catch (e) { $("err").textContent = e.message; } finally { _busy = false; } }

function startApp() {
  $("gate").style.display = "none"; $("app").style.display = "block";
  $("addBtn").onclick = addItem;
  $("newTitle").addEventListener("keydown", e => { if (e.key === "Enter") addItem(); });
  $("logout").onclick = () => { localStorage.removeItem("swek_board_token"); location.reload(); };
  tick(); _timer = setInterval(tick, 4000);
}
function showGate() {
  $("app").style.display = "none"; $("gate").style.display = "block";
  $("gToken").value = TOKEN; $("gName").value = ME;
  $("gGo").onclick = async () => {
    TOKEN = $("gToken").value.trim(); ME = $("gName").value.trim() || "admin";
    if (!TOKEN) { $("gErr").textContent = "token required"; return; }
    try { await getRoom(); localStorage.setItem("swek_board_token", TOKEN); localStorage.setItem("swek_board_name", ME); startApp(); }
    catch (e) { $("gErr").textContent = "couldn't reach the board: " + e.message; }
  };
}
if (TOKEN && ME) { getRoom().then(startApp).catch(showGate); } else showGate();
</script>
</body>
</html>
