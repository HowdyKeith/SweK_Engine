<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d0b">
<title>Tasker Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./tasker.css">
</head>
<body>
<div class="scanlines" aria-hidden="true"></div>

<header class="deck-head">
  <canvas id="signal" width="120" height="40" aria-hidden="true"></canvas>
  <div class="title">
    <h1 id="deckName">TASKER DECK</h1>
    <div class="sub">remote trigger console · <span id="conn" class="conn down">link down</span></div>
  </div>
</header>

<nav id="filters" class="filters" aria-label="backend filter"></nav>

<main id="grid" class="grid" aria-live="polite">
  <div class="empty" id="empty">loading tasks…</div>
</main>

<section class="logwrap">
  <div class="logbar"><span>ACTIVITY</span><button id="clearLog" type="button">clear</button></div>
  <ul id="log" class="log"></ul>
</section>

<script src="./app.js"></script>
</body>
</html>
