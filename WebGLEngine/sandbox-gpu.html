<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="demo:title" content="Sandbox on the GPU (the voxel world and its city on gfx/device.js)">
<meta name="demo:desc" content="The main sandbox's world on the device path: world/world.js's VoxelWorld terrain with CityGen's facade buildings, greedy-meshed by the sandbox's own mesher (world/chunkMesherCore.js) with the registry's colours and corner AO, packed as one lit mesh and drawn through render/gpuDriven.mjs and the lit pipeline on WebGPU or WebGL2. Round 1 of the sandbox on the device: the world; dig/build, bodies, damage, save/load and the avatar follow. A seed and the city live, chunk and triangle counts and the mesh time in the HUD, drag to orbit, wheel to dolly.">
<meta name="demo:category" content="world">
<title>Sandbox on the GPU</title>
<style>
  html,body { margin:0; height:100%; background:#050805; color:#9fb2d4; font:12px ui-monospace,Menlo,monospace; }
  #c { display:block; width:100%; }
  #hud { padding:10px 14px; }
  #cap { color:#f6a623; letter-spacing:.14em; text-transform:uppercase; }
  #be { color:#59d1ff; font-size:14px; margin-top:4px; }
  #sub { color:#5f7aa0; font-size:11px; margin-top:2px; line-height:1.7; }
  .bad { color:#ff9a9a; }
  a { color:#59d1ff; }
  input[type=number] { width:48px; background:#0c140f; color:#9fb2d4; border:1px solid #2a3a30; font:inherit; }
</style>
</head>
<body>
<div id="hud">
  <div id="cap">Sandbox on the GPU: the voxel world and its city through gfx/device.js</div>
  <div id="be">requesting a device&hellip;</div>
  <div id="sub">seed <input id="seed" type="number" value="1"> &middot; <label><input type="checkbox" id="city" checked> city with facades</label> &middot; buildings <input id="count" type="number" value="30" min="0" max="120">
    &middot; <a href="?webgl=1">force WebGL2</a><br>
    <span id="tick">building the world&hellip;</span> &middot; drag to orbit, wheel to dolly</div>
</div>
<canvas id="c"></canvas>
<script type="module" src="/ui/originNotice.js"></script>
<script type="module">
import { requestDevice } from "./gfx/device.js";
import * as G from "./render/gpuDriven.mjs";
import * as L from "./render/litSphere.mjs";
import { meshWorld, voxelScene } from "./render/voxelDevice.mjs";
import { VoxelWorld } from "./world/world.js";
import { CityGen } from "./world/CityGen.js";

const cvs = document.getElementById("c"), beEl = document.getElementById("be");
const fail = (m) => { beEl.innerHTML = '<span class="bad">' + m + "</span>"; };
let device, scene = null, world = null, yaw = 0.7, pitch = 0.55, dist = 170, dragging = null, dirty = true;
const $ = (id) => document.getElementById(id);

function rebuild() {
  const t0 = performance.now();
  world = new VoxelWorld();
  const city = $("city").checked ? new CityGen(world) : null;
  if (city) city.generate({ seed: (+$("seed").value) >>> 0, facades: true, buildingCount: Math.max(0, +$("count").value | 0) });
  const t1 = performance.now(), packed = meshWorld(world), t2 = performance.now();
  if (scene && scene.destroy) scene.destroy();
  scene = voxelScene(device, packed, G, L);
  $("tick").textContent = `${packed.chunks} chunks, ${packed.triangles.toLocaleString()} triangles, ${city ? city.buildings.length : 0} buildings` +
    ` · world ${(t1 - t0).toFixed(0)} ms, mesh ${(t2 - t1).toFixed(0)} ms · hash ${packed.hash}`;
  dirty = false;
}
async function init() {
  const forceGl = new URLSearchParams(location.search).get("webgl") === "1";
  try { device = await requestDevice(cvs, forceGl ? { backend: "webgl2" } : { prefer: "webgpu" }); }
  catch (e) { return fail("requestDevice threw: " + e.message); }
  if (!device || device.backend === "null") return fail("no GPU backend here (WebGPU needs a secure origin: localhost or https).");
  try { rebuild(); } catch (e) { return fail("scene: " + e.message); }
  beEl.textContent = "backend: " + device.backend + " · " + scene.path + " · the sandbox's world through the sandbox's mesher, lit on the device";
  for (const id of ["seed", "city", "count"]) $(id).addEventListener("change", () => { dirty = true; $("tick").textContent = "building the world…"; });
  cvs.addEventListener("pointerdown", (e) => { dragging = [e.clientX, e.clientY]; });
  addEventListener("pointerup", () => { dragging = null; });
  addEventListener("pointermove", (e) => { if (!dragging) return; yaw += (e.clientX - dragging[0]) * 0.006; pitch = Math.max(0.05, Math.min(1.5, pitch + (e.clientY - dragging[1]) * 0.006)); dragging = [e.clientX, e.clientY]; });
  cvs.addEventListener("wheel", (e) => { dist = Math.max(20, Math.min(600, dist * (e.deltaY > 0 ? 1.1 : 0.9))); e.preventDefault(); }, { passive: false });
  requestAnimationFrame(frame);
}
function dpr() { return Math.min(2, devicePixelRatio || 1); }
function frame() {
  const d = dpr(), w = Math.round((cvs.clientWidth || 1200) * d), h = Math.round(w * 0.55);
  if (cvs.width !== w || cvs.height !== h) { cvs.width = w; cvs.height = h; }
  if (dirty) { try { rebuild(); } catch (e) { fail("scene: " + e.message); return; } }
  if (!dragging) yaw += 0.0015;
  const eye = [Math.sin(yaw) * Math.cos(pitch) * dist, Math.sin(pitch) * dist + 10, Math.cos(yaw) * Math.cos(pitch) * dist];
  const cam = { viewProj: G.multiply(G.perspective(0.9, w / h, 0.5, 1200), G.lookAt(eye, [0, 10, 0])), eye };
  scene.frame({ ...cam, clear: [0.03, 0.05, 0.08, 1] });
  requestAnimationFrame(frame);
}
init();
</script>
</body>
</html>
