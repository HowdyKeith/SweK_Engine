<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="demo:title" content="Sandbox on the GPU (the voxel world and its city on gfx/device.js)">
<meta name="demo:desc" content="The main sandbox's world on the device path: world/world.js's VoxelWorld terrain with CityGen's facade buildings, greedy-meshed by the sandbox's own mesher (world/chunkMesherCore.js) with the registry's colours and corner AO, every chunk in its own slot of one lit mesh, drawn through render/gpuDriven.mjs and the lit pipeline on WebGPU or WebGL2. Rounds 1 to 3 of the sandbox on the device: the world; dig/build -- click a voxel to dig it, shift-click or right-click to build across its face, the touched chunks re-meshed and their slots rewritten in place (render/voxelDeviceEdit.mjs); and Box3D crates (render/voxelBodies.mjs) dropped from the Drop a crate button onto the voxels, which reach box3d as a collision window of merged static boxes around each body -- dig under a crate and it falls. Damage, save/load and the avatar follow. A seed and the city live, chunk and triangle counts, the mesh time and the last edit in the HUD, drag to orbit, wheel to dolly.">
<meta name="demo:category" content="world">
<title>Sandbox on the GPU</title>
<style>
  html,body { margin:0; height:100%; background:#050805; color:#9fb2d4; font:12px ui-monospace,Menlo,monospace; }
  #c { display:block; width:100%; }
  #hud { padding:10px 14px; }
  #cap { color:#f6a623; letter-spacing:.14em; text-transform:uppercase; }
  #be { color:#59d1ff; font-size:14px; margin-top:4px; }
  #sub { color:#5f7aa0; font-size:11px; margin-top:2px; line-height:1.7; }
  .bad { color:#ff9a9a; }
  a { color:#59d1ff; }
  input[type=number] { width:48px; background:#0c140f; color:#9fb2d4; border:1px solid #2a3a30; font:inherit; }
</style>
</head>
<body>
<div id="hud">
  <div id="cap">Sandbox on the GPU: the voxel world and its city through gfx/device.js</div>
  <div id="be">requesting a device&hellip;</div>
  <div id="sub">seed <input id="seed" type="number" value="1"> &middot; <label><input type="checkbox" id="city" checked> city with facades</label> &middot; buildings <input id="count" type="number" value="30" min="0" max="120">
    &middot; build with <select id="mat"><option value="1">stone</option><option value="2">dirt</option><option value="3">grass</option><option value="4">sand</option><option value="5">glass</option></select>
    &middot; <button id="drop">Drop a crate</button> <span id="phys"></span>
    &middot; <a href="?webgl=1">force WebGL2</a><br>
    <span id="tick">building the world&hellip;</span> &middot; <span id="edit">click to dig, shift-click or right-click to build</span> &middot; drag to orbit, wheel to dolly</div>
</div>
<canvas id="c"></canvas>
<script type="module" src="/ui/originNotice.js"></script>
<script type="module">
import { requestDevice } from "./gfx/device.js";
import * as G from "./render/gpuDriven.mjs";
import * as L from "./render/litSphere.mjs";
import { editState, editScene, pickVoxel, digAt, buildAt } from "./render/voxelDeviceEdit.mjs";
import { createBodyWorld, sandboxScene } from "./render/voxelBodies.mjs";
import { box3d } from "./physics/box3d/box3dLoader.js";
import { VoxelWorld } from "./world/world.js";
import { CityGen } from "./world/CityGen.js";

const cvs = document.getElementById("c"), beEl = document.getElementById("be");
const fail = (m) => { beEl.innerHTML = '<span class="bad">' + m + "</span>"; };
let device, scene = null, world = null, state = null, bodies = null, physMod = null, yaw = 0.7, pitch = 0.55, dist = 170, dragging = null, moved = 0, dirty = true, camNow = null, lastHit = null;
const $ = (id) => document.getElementById(id);

function rebuild() {
  const t0 = performance.now();
  world = new VoxelWorld();
  const city = $("city").checked ? new CityGen(world) : null;
  if (city) city.generate({ seed: (+$("seed").value) >>> 0, facades: true, buildingCount: Math.max(0, +$("count").value | 0) });
  const t1 = performance.now(); state = editState(world); const t2 = performance.now();
  if (scene && scene.destroy) scene.destroy();
  if (bodies) { bodies.destroy(); bodies = null; }
  if (physMod) { bodies = createBodyWorld(physMod, world); scene = sandboxScene(device, state, bodies, G, L); }
  else scene = editScene(device, state, G, L);
  $("tick").textContent = `${state.slots.size} chunks, ${state.used.toLocaleString()} vertices in ${state.capacity.toLocaleString()} slots, ${city ? city.buildings.length : 0} buildings` +
    ` · world ${(t1 - t0).toFixed(0)} ms, mesh ${(t2 - t1).toFixed(0)} ms`;
  dirty = false;
}
async function init() {
  const forceGl = new URLSearchParams(location.search).get("webgl") === "1";
  try { device = await requestDevice(cvs, forceGl ? { backend: "webgl2" } : { prefer: "webgpu" }); }
  catch (e) { return fail("requestDevice threw: " + e.message); }
  if (!device || device.backend === "null") return fail("no GPU backend here (WebGPU needs a secure origin: localhost or https).");
  try { const ps = await box3d.init(); if (ps.ready) physMod = box3d._mod; else $("phys").textContent = "(box3d: " + ps.reason.slice(0, 80) + ")"; } catch (e) { $("phys").textContent = "(box3d: " + e.message + ")"; }
  try { rebuild(); } catch (e) { return fail("scene: " + e.message); }
  $("drop").addEventListener("click", () => {
    if (!bodies) { $("phys").textContent = "(no box3d here)"; return; }
    const at = lastHit ? [lastHit.x + 0.5, lastHit.y + 8, lastHit.z + 0.5] : [0.5, 40, 0.5];
    try { bodies.spawn(at, 0.5); $("phys").textContent = `${bodies.bodies.length} crate${bodies.bodies.length === 1 ? "" : "s"}`; } catch (e) { $("phys").textContent = "(" + e.message + ")"; }
  });
  beEl.textContent = "backend: " + device.backend + " · " + scene.path + " · the sandbox's world through the sandbox's mesher, lit on the device";
  for (const id of ["seed", "city", "count"]) $(id).addEventListener("change", () => { dirty = true; $("tick").textContent = "building the world…"; });
  cvs.addEventListener("pointerdown", (e) => { dragging = [e.clientX, e.clientY]; moved = 0; });
  cvs.addEventListener("contextmenu", (e) => e.preventDefault());
  cvs.addEventListener("pointerup", (e) => {
    if (dragging && moved < 4 && camNow && state) {
      const r = cvs.getBoundingClientRect(), px = (e.clientX - r.left) * cvs.width / r.width, py = (e.clientY - r.top) * cvs.height / r.height;
      const hit = pickVoxel(world, camNow, px, py), build = e.shiftKey || e.button === 2; if (hit) lastHit = hit;
      const res = build ? buildAt(state, hit, +$("mat").value || 1) : digAt(state, hit);
      $("edit").textContent = res.refused ? res.refused : `${build ? "built" : "dug"} at ${build ? [hit.x + hit.normal[0], hit.y + hit.normal[1], hit.z + hit.normal[2]].join(",") : [hit.x, hit.y, hit.z].join(",")}: ${res.chunks.length} chunk${res.chunks.length === 1 ? "" : "s"} rewritten in ${res.ms} ms${res.rebuilt ? " (a slot overflowed: the world was repacked)" : ""}`;
    }
    dragging = null;
  });
  addEventListener("pointerup", () => { dragging = null; });
  addEventListener("pointermove", (e) => { if (!dragging) return; moved += Math.abs(e.clientX - dragging[0]) + Math.abs(e.clientY - dragging[1]); yaw += (e.clientX - dragging[0]) * 0.006; pitch = Math.max(0.05, Math.min(1.5, pitch + (e.clientY - dragging[1]) * 0.006)); dragging = [e.clientX, e.clientY]; });
  cvs.addEventListener("wheel", (e) => { dist = Math.max(20, Math.min(600, dist * (e.deltaY > 0 ? 1.1 : 0.9))); e.preventDefault(); }, { passive: false });
  requestAnimationFrame(frame);
}
function dpr() { return Math.min(2, devicePixelRatio || 1); }
function frame() {
  const d = dpr(), w = Math.round((cvs.clientWidth || 1200) * d), h = Math.round(w * 0.55);
  if (cvs.width !== w || cvs.height !== h) { cvs.width = w; cvs.height = h; }
  if (dirty) { try { rebuild(); } catch (e) { fail("scene: " + e.message); return; } }
  if (!dragging) yaw += 0.0015;
  const eye = [Math.sin(yaw) * Math.cos(pitch) * dist, Math.sin(pitch) * dist + 10, Math.cos(yaw) * Math.cos(pitch) * dist];
  const cam = { viewProj: G.multiply(G.perspective(0.9, w / h, 0.5, 1200), G.lookAt(eye, [0, 10, 0])), eye };
  camNow = { W: w, H: h, fov: 0.9, eye, target: [0, 10, 0] };
  if (bodies && bodies.bodies.length) { bodies.tick(); if ((bodies.ticks() & 31) === 0) $("phys").textContent = `${bodies.bodies.length} crate${bodies.bodies.length === 1 ? "" : "s"}, ${bodies.poolSize()} static boxes in the pool`; }
  scene.frame({ ...cam, clear: [0.03, 0.05, 0.08, 1] });
  requestAnimationFrame(frame);
}
init();
</script>
</body>
</html>
