<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="stylesheet" href="/theme.css" />
<title>SweK Engine — Avatars</title>
<style>
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; min-height:100%; background:var(--bg); color:var(--ink); font:14px/1.5 ui-rounded,system-ui,sans-serif; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .title { font-weight:700; font-size:18px; } .title .g { color:var(--acc); }
  header .sp { flex:1; }
  header input { background:#0e141d; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:7px 10px; font:inherit; width:170px; }
  header button { background:#0e141d; color:var(--dim); border:1px solid var(--line); border-radius:9px; padding:7px 11px; font:inherit; cursor:pointer; }
  main { max-width:860px; margin:0 auto; padding:14px 16px 28px; }
  .note { color:var(--dim); font-size:12px; margin-bottom:14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:11px; }
  .av { background:var(--panel); border:1px solid var(--line); border-radius:13px; padding:13px 14px; display:flex; flex-direction:column; gap:8px; }
  .av.cur { border-color:#2c5a3e; background:linear-gradient(160deg,#13241b,#101820); }
  .av .nm { font-weight:600; word-break:break-word; }
  .av .nm .badge { font-size:10px; color:var(--go); border:1px solid #2c5a3e; border-radius:6px; padding:1px 6px; margin-left:6px; }
  .av .row { display:flex; gap:7px; }
  .av button { flex:1; border-radius:8px; padding:8px; font:inherit; cursor:pointer; border:1px solid var(--line); background:#0e141d; color:var(--ink); }
  .av button.push { background:#11243a; color:var(--acc); border-color:#26506f; font-weight:600; }
  .av button.shield { background:#0e141d; color:var(--dim); }
  #msg { color:var(--dim); font-size:12.5px; margin-top:14px; min-height:18px; }
  .search { width:100%; margin-bottom:12px; background:#0e141d; color:var(--ink); border:1px solid var(--line); border-radius:9px; padding:9px 12px; font:inherit; }
</style>
</head>
<body>
  <header>
    <span class="title"><span class="g">🧑‍🚀</span> Avatars</span>
    <span class="sp"></span>
    <span style="color:var(--dim);font-size:12px;">Shield IP</span>
    <input id="ip" value="192.168.50.114" />
    <button id="openHere">Open avatar window</button>
  </header>
  <main>
    <div class="note">Pushing an avatar swaps it <b>live</b> on every avatar surface — the engine window, the standalone avatar window, and the Shield/phone — with no reload. “Show on Shield” opens the avatar window on the Shield first; after that, pushes hot-swap it there too.</div>
    <input class="search" id="search" placeholder="filter avatars…" />
    <div class="grid" id="grid"></div>
    <div id="msg"></div>
  </main>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  let files = [], current = null, filter = "";

  async function load(){
    try { const j = await (await fetch("/avatar/imported", { cache:"no-store" })).json(); files = (j && j.files) || []; current = j && j.current; }
    catch { files = []; }
    render();
  }
  function render(){
    const list = files.filter(f => !filter || f.name.toLowerCase().includes(filter));
    if (!list.length) { $("grid").innerHTML = '<div style="color:var(--dim)">' + (files.length ? "no matches" : "No .glb avatars found in GPU_Assets.") + "</div>"; return; }
    $("grid").innerHTML = list.map(f => {
      const cur = f.url === current;
      return '<div class="av ' + (cur?"cur":"") + '"><div class="nm">' + esc(f.name.replace(/\.glb$/i,"")) + (cur?'<span class="badge">live</span>':"") + '</div>' +
        '<div class="row"><button class="push" data-url="' + esc(f.url) + '">▶ Push live</button><button class="shield" data-shield="' + esc(f.url) + '">📺 Shield</button></div></div>';
    }).join("");
    $("grid").querySelectorAll("button[data-url]").forEach(b => b.onclick = () => push(b.getAttribute("data-url")));
    $("grid").querySelectorAll("button[data-shield]").forEach(b => b.onclick = () => showOnShield(b.getAttribute("data-shield")));
  }

  async function push(url){
    $("msg").textContent = "pushing…";
    try { await fetch("/avatar/set", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ url }) }); current = url; render(); $("msg").textContent = "▶ pushed live: " + url.split("/").pop(); }
    catch (e) { $("msg").textContent = "✗ " + e; }
  }
  async function showOnShield(url){
    const ip = $("ip").value.trim();
    if (!/^\d{1,3}(\.\d{1,3}){3}$/.test(ip)) { $("msg").textContent = "✗ enter a valid Shield IP"; return; }
    $("msg").textContent = "pushing + opening on Shield…";
    try {
      await fetch("/avatar/set", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ url }) }); current = url; render();
      const target = location.origin + "/avatarstage.html";
      const r = await (await fetch("/shield/exec", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ action:"openUrl", ip, url: target }) })).json();
      $("msg").textContent = r && r.ok ? ("📺 opened the avatar window on the Shield — now showing " + url.split("/").pop()) : ("⚠ pushed live, but Shield open failed: " + (r && r.error || "?") + " (adb authorized?)");
    } catch (e) { $("msg").textContent = "✗ " + e; }
  }

  $("openHere").onclick = () => { try { window.open("/avatarstage.html", "_blank"); } catch { location.href = "/avatarstage.html"; } };
  $("search").oninput = () => { filter = $("search").value.trim().toLowerCase(); render(); };
  load(); setInterval(load, 8000);
</script>
</body>
</html>
