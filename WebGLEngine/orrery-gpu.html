<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SweK Orrery -- on the GPU</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #06120b; color: #cfe6d6; font: 13px ui-monospace, monospace; overflow: hidden; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  #hud { position: absolute; left: 12px; top: 10px; background: rgba(4, 18, 11, .82); border: 1px solid #14351f; padding: 8px 10px; max-width: 520px; line-height: 1.5; }
  #hud b { color: #9ef0b4; }
  #hud .warn { color: #f0c66a; }
  label { display: inline-block; margin-right: 12px; }
  input[type=range] { width: 160px; vertical-align: middle; }
  a { color: #9ef0b4; }
</style>
</head>
<body>
<!--
  Level 12 -- THE WebGPU ORRERY. orrery.html draws the system in canvas 2D and (since v4273) can pass that picture
  through a device post stage. THIS page draws the system THROUGH the device: a compute pass places every body
  from its orbital elements (render/gpuOrbits.mjs, positionAt to the letter), a second culls and picks LOD
  (render/gpuDriven.mjs), and each LOD is one drawIndexedIndirect. On a browser without WebGPU the same scene
  draws on WebGL2 through the CPU twin, and the HUD says which route it took -- the route is a fact about the
  browser, not a promise about the page.

  The 2D orrery stays the product: this is the same data (orrery.json, buildOrrery) on the Level 11/12 path.

  Level 13 -- LIFE. world/gitEconomy.mjs runs ev/esEconomy.js's trading among these bodies: each repository is a
  market stocked from its own files, each of git's contributors a hauler chasing the best margin. The traders
  are a second GPU-driven scene drawn over the first without clearing; the pointer names a body or a trader
  from a one-pixel pick, and the log shows what was just bought and sold, and where it is bound.

  Level 16 (v4314) -- A UNIVERSE THAT PERSISTS, AND IS SHARED. Time is git time: sim day 0 is the day the first
  body was vendored and each market opens on its own day (?history=0 for the v4300 sky where everything is
  there at once). The universe is a seed and a journal: "save" keeps the journal in localStorage, "restore"
  reloads and REPLAYS it (the HUD says whether the replay reached the saved hash). Two tabs share one universe:
  open ?peer=a in one and ?peer=b in another and both trade in lockstep over a BroadcastChannel, every tick's
  hash checked (world/economyLockstep.mjs). "a week of commits" feeds the fixture commits (world/commitsFeed.mjs)
  in as production -- journaled, so it replays and lockstops like anything else.

  v4318 -- GIT TIME ON THE GPU (a body not yet vendored on day t is dropped in the cull, both backends), the LIVE
  commits source ("live commits" asks the ai-bridge's /github/commits for every vendored repository, ?owner=),
  the MASK ON THE DEVICE (the masked look draws the sky and the traders into a target, the identity picture into
  another, the mask from it in a pass, badTv through it -- no readback), and TWO UNIVERSES COMPOSITED: ?twin=1
  runs a second economy (seed 8, the same crew) beside this one, and the masked race is the window through which
  the other universe shows (A where the race is, B everywhere else; render/fleetMask.mjs makeMaskRig).
-->
<canvas id="stage"></canvas>
<div id="hud">
  <div><b>SweK orrery, GPU-driven</b> &mdash; <span id="route">starting&hellip;</span></div>
  <div id="bodies"></div>
  <div>
    <label>tilt <input id="tilt" type="range" min="0" max="80" value="35"></label>
    <label>days/s <input id="speed" type="range" min="0" max="40" value="8"></label>
    <label><input id="occ" type="checkbox" checked> occlusion (WebGPU)</label>
  </div>
  <div><label><input id="life" type="checkbox" checked> life: the economy's traders</label> <span id="pick" style="color:#f0e29e">point at something</span></div>
  <div style="color:#9fb8a8">races: <span id="races"></span></div>
  <div id="trade" style="color:#9fb8a8; max-height: 4.5em; overflow: hidden"></div>
  <div style="color:#9fb8a8"><span id="date"></span> &middot; tick <span id="tick">0</span> &middot; hash <span id="hash"></span> &middot; <span id="peer">alone</span></div>
  <div><button id="save">save universe</button> <button id="restore">restore</button> <button id="commits">a week of commits</button> <button id="live">live commits (the bridge)</button> <span id="persist" style="color:#f0e29e"></span></div>
  <div id="key" style="color:#9fb8a8">cross-browser key: computing&hellip;</div>
  <div id="cockpit" style="color:#f0e29e">you: starting&hellip;</div>
  <div><label>mask a race with badTv (or, with ?twin=1, the window onto the twin universe) <select id="mask"><option value="">none</option></select></label> &middot; <label><input id="landmode" type="checkbox"> land on the pointed body (or press G)</label> <span id="landing" style="color:#9fb8a8"></span></div>
  <div><label>scrub <input id="scrub" type="range" min="0" max="0" value="0" style="width:40%"></label> <span id="scrubAt" style="color:#9fb8a8">live</span></div>
  <div><a href="./orrery.html">the 2D orrery</a> &middot; t = <span id="t">0</span> days &middot; drawn <span id="drawn">?</span></div>
</div>
<script type="module">
import { buildOrrery } from "./world/orrery.mjs";
import { extentOf, slowestPeriod, positionAt } from "./world/orreryView.mjs";
import { requestDevice } from "./gfx/device.js";
import * as G from "./render/gpuDriven.mjs";
import { makeOrbitSource } from "./render/gpuOrbits.mjs";
import { makeGitEconomy } from "./world/gitEconomy.mjs";
import { standardFleets, fleetsForNames, userModelSources, loadUserModel, RACES } from "./render/fleets.mjs";
import { makePeer, broadcastWire } from "./world/economyLockstep.mjs";
import { wireFromParams, hashKey, compareKey } from "./world/universeWire.mjs";
import { p2pTransport } from "./ev/p2p.js";
import { crewForRaces } from "./world/racePolicies.mjs";
import { makeFlight, makeCockpit } from "./world/playerShip.mjs";
import { traders as gitTraders } from "./world/traderGraph.mjs";
import { bodyHeightfield, landingRecords, fileOfChunk } from "./render/bodyTerrain.mjs";
import * as T from "./render/gpuTerrain.mjs";
import { makeMaskRig } from "./render/fleetMask.mjs";
import { applyCommitsFeed, fixtureFeed, liveFeed, marketForRepo } from "./world/commitsFeed.mjs";

const cv = document.getElementById("stage"), route = document.getElementById("route");
const say = (s, warn) => { route.innerHTML = warn ? `<span class="warn">${s}</span>` : s; };

const raw = await fetch("./orrery.json").then((r) => r.json()).catch(() => null);
if (!raw) { say("orrery.json not found -- run: node tools/ship/orreryBake.mjs --write", true); throw new Error("no orrery.json"); }
const system = buildOrrery(raw.bodies);
document.getElementById("bodies").textContent = `${system.bodies.length} bodies around ${system.centre}; ${system.captured} captured, ${system.reached} reached, ${system.unpapered.length} unpapered`;

function size() { const d = window.devicePixelRatio || 1; cv.width = Math.round(innerWidth * d); cv.height = Math.round(innerHeight * d); }
size();

let device = null;
try { device = await requestDevice(cv, {}); } catch (e) { say("requestDevice threw: " + e.message, true); throw e; }
if (!device || device.backend === "null") { say("neither WebGPU nor WebGL2 is available on this origin -- nothing can be drawn (WebGPU needs https or localhost)", true); throw new Error("no device"); }

// LODs: a finer disc up close, a coarser one far away; the ORDER is derived from the meshes, not typed here.
const lods = [{ name: "far", mesh: G.quadMesh(1, [0.55, 0.75, 0.62, 1]) }, { name: "near", mesh: G.quadMesh(6, [0.62, 0.94, 0.71, 1]) }];
const source = makeOrbitSource(device, system);
// v4318 -- GIT TIME ON THE GPU: every body record carries its market's opening day in extra.z and the cull is handed the
// sim day; a body not yet vendored on day t is not drawn, not picked, not counted -- decided in the cull, not by the page.
const bodyExtras = G.defaultExtras(source.count);
const scene = G.makeGpuDrivenScene(device, { lods, thresholds: [0.012], records: source, occlusion: true, headings: { cpu: () => bodyExtras }, clock: () => (history ? (scrub.ghost || economy).t : null) });
say(`${device.backend} &middot; orbits by ${device.backend === "webgpu" ? "compute" : "the CPU twin"} &middot; ${scene.path}${scene.occlusion ? " &middot; Hi-Z occlusion" : ""}`);

// the economy: haulers as a second scene over the bodies. Its records come from the CPU sim every frame.
const params = new URLSearchParams(location.search);
const history = params.get("history") !== "0", peerId = params.get("peer"), JOURNAL_KEY = "swek.orrery.journal";
let tslLook = null;   // v4323: set when ?tsl=1 swapped the Chaos look for a generated one (see below); v4325 adds .sprite, the Pixel race in the second shell
// v4317 (Level 17) -- RACES THAT ACT: every owner's race brings its own economy (world/racePolicies.mjs); and YOU: a
// manual crew member the sim never routes, flown from the keys, trading by interventions (world/playerShip.mjs).
const crewNames = [...gitTraders().map((t) => t.name || t.id), ...system.bodies.map((b) => "hauler of " + b.name)];
const crewFleet = fleetsForNames(crewNames, RACES.length);
const crewList = crewForRaces(crewNames, crewFleet, RACES);   // a hauler's joining day is its market's (makeGitEconomy fills it under history)
crewList.push({ name: "you", manual: true, joins: 0 });
const YOU = crewList.length - 1;
const economy = makeGitEconomy(system, { seed: 7, history, traders: crewList });
for (const m of economy.markets) bodyExtras[m.id * G.EXTRA_FLOATS + 2] = m.opens || 0;   // v4318: record m.id is body m.id - 1 (the centre is record 0)
// v4314 -- restore: replay the saved journal on this fresh economy before anything moves
let restored = null;
if (params.get("restore") === "1") { try { const lg = JSON.parse(localStorage.getItem(JOURNAL_KEY) || "null"); if (lg) { const r = economy.replay(lg); restored = { ...r, saved: lg.hash, tick: lg.tick }; } } catch (e) { restored = { error: e.message }; } }
// v4314 -- two tabs, one universe: this tab is peer a or b over a BroadcastChannel, and steps only in lockstep
// v4316 -- the wire from the params: two tabs (BroadcastChannel) or two machines (?webrtc=<rendezvous>&room=<room>, ev/p2p.js)
let peer = null, chosen = { kind: "none" };
try { chosen = wireFromParams(params, { broadcast: broadcastWire, p2p: p2pTransport }); } catch (e) { say("wire: " + e.message, true); }
if (chosen.wire) { const wire = chosen.wire; peer = makePeer({ economy, selfId: chosen.peer, peers: ["a", "b"], send: (m) => wire.send(m), inputDelay: chosen.kind === "webrtc" ? 6 : 3, dt: 0.25 }); wire.onMessage = (m) => peer.receive(m); }
// v4316 -- the cross-browser key: a fresh economy to tick 400 from seed 7, its hash beside the one Node recorded
try { const mine = hashKey((seed, today) => makeGitEconomy(buildOrrery(raw.bodies, { today }), { seed, history: true }), { seed: 7, ticks: 400 }); const expected = await fetch("./tools/ship/universe-hash-expected.json").then((r) => r.json()).catch(() => null);
    const cmp = compareKey(mine, expected); document.getElementById("key").textContent = `cross-browser key: ${cmp.verdict} -- ${cmp.detail}`; window.__universeKey = { mine, expected, ...cmp }; } catch (e) { document.getElementById("key").textContent = "key: " + e.message; }
let feedSeen = new Set();
const intervene = (kind, args) => { if (peer) peer.queue(kind, args); else economy.intervene(kind, args); };
document.getElementById("save").onclick = () => { try { localStorage.setItem(JOURNAL_KEY, JSON.stringify(economy.log())); document.getElementById("persist").textContent = `saved at tick ${economy.tick}, hash ${economy.hash()}`; } catch (e) { document.getElementById("persist").textContent = "save failed: " + e.message; } };
document.getElementById("restore").onclick = () => { const u = new URL(location.href); u.searchParams.set("restore", "1"); location.href = u.toString(); };
document.getElementById("commits").onclick = () => { const feed = fixtureFeed(economy.markets, { seed: 5 + economy.tick }); const r = peer ? applyCommitsFeedQueued(feed) : applyCommitsFeed(economy, feed, { seen: feedSeen }); feedSeen = r.seen; document.getElementById("persist").textContent = `${r.applied.length} commit record(s) fed as production`; };
function applyCommitsFeedQueued(feed) { const r = { applied: [], seen: new Set(feedSeen) }; for (const f of feed) { const m = marketForRepo(f.repo, economy.markets); if (m) { peer.queue("commits", { market: m.id, commits: f.commits }); r.applied.push(f); } } return r; }
// v4318 -- the LIVE source: the ai-bridge's /github/commits per vendored repository (?owner=<github account>, default HowdyKeith)
document.getElementById("live").onclick = async () => { const owner = params.get("owner") || "HowdyKeith", el = document.getElementById("persist"); el.textContent = `asking the bridge for ${economy.markets.length} repositories under ${owner}...`;
    try { const feed = await liveFeed(economy.markets, { fetchFn: (u) => fetch(u), owner }); const r = peer ? applyCommitsFeedQueued(feed.records) : applyCommitsFeed(economy, feed.records, { seen: feedSeen }); feedSeen = r.seen;
        el.textContent = `live: ${feed.records.length} day-records from ${feed.asked.length - feed.failed.length} of ${feed.asked.length} repositories, ${r.applied.length} booked${feed.failed.length ? "; failed: " + feed.failed.slice(0, 3).map((f) => f.repo.split("/").pop() + " (" + f.why + ")").join(", ") : ""}`; }
    catch (e) { el.textContent = "live commits: " + e.message; } };
if (restored) document.getElementById("persist").textContent = restored.error ? "restore failed: " + restored.error : `restored: replayed ${restored.tick} ticks, replay ${restored.matches ? "MATCHES" : "DOES NOT MATCH"} the saved hash ${restored.saved}`;
window.__universe = { economy, get tslLook() { return tslLook; }, get tick() { return economy.tick; }, hash: () => economy.hash(), log: () => economy.log(), restored, peer: peerId, history, get inStep() { return peer ? (peer.desync() ? false : true) : null; }, get desync() { return peer ? peer.desync() : null; } };
// v4317 -- THE SCRUBBER: a replay is a function of tick, so the slider replays the journal on a scratch economy to any
// tick and the sky shows THAT day; the live sim pauses while scrubbed and resumes at the right end
const scrub = { at: null, ghost: null };
const scrubEl = document.getElementById("scrub");
scrubEl.addEventListener("input", () => { const at = Number(scrubEl.value); if (at >= economy.tick) { scrub.at = null; scrub.ghost = null; document.getElementById("scrubAt").textContent = "live"; return; }
    const lg = economy.log(); const cut = { ...lg, interventions: lg.interventions.filter((iv) => iv.tick < at), steps: [[0.25, at]] };
    const g = makeGitEconomy(system, { seed: 7, history, traders: crewList }); g.replay(cut); scrub.at = at; scrub.ghost = g; document.getElementById("scrubAt").textContent = `tick ${at} of ${economy.tick}${g.date ? ", " + g.date : ""} (replayed)`; });
const lifeSource = { count: economy.ships.length, cpu: () => (scrub.ghost || economy).records(0.14) };
// v4301 (Level 15) -- FLEETS: every owner in the git graph is a race, and every race is its own architecture and
// shader (render/fleets.mjs). If the person assigned a ship model in Escape Velocity or a plane on the radar,
// the raised hull is theirs: the Wedge race wears it, the Krbn race skins it, the Glyph race pins glyphs to it.
let userHull = null;
try { const src = userModelSources(localStorage).find((x) => x.loadable); if (src) { userHull = await loadUserModel(src); say(`the ${src.kind} model for ${src.cls} (${src.url}) is the raised hull`); } } catch (e) { console.warn("user model:", e.message); }
const std = standardFleets(device, { userHull });
// v4323 -- ?tsl=1: the Chaos race painted by a TSL node ON THE PAGE (v4325: the Pixel race too, in the sprite shell). three (vendor/three-webgpu, 3 MB, loaded only then) runs on
// the same backend as the device, emits the Lyapunov look from the TSL graph in that backend's language, and
// render/tslSource.mjs transplants the fragment into the fleet's own shell; the fleet's pipeline is swapped before the scene
// is built. tslRace-selfcheck holds the generated race to the hand-written one to the byte; this is the same swap, live.
if (params.get("tsl") === "1") {
    try {
        const [THREE, T, P, S] = await Promise.all([import("./vendor/three-webgpu/three.webgpu.js"), import("./vendor/three-webgpu/three.tsl.js"), import("./render/physicsTsl.mjs"), import("./render/tslSource.mjs")]);
        const off = document.createElement("canvas"); off.width = 64; off.height = 64;
        const renderer = new THREE.WebGPURenderer({ canvas: off, forceWebGL: device.backend === "webgl2", antialias: false }); await renderer.init();
        const look = P.makeLyapunovLookTsl(THREE, T, { breathe: 0.06 }); renderer.setRenderTarget(new THREE.RenderTarget(64, 64));   // v4324: the hull breathes -- a position node, carried into the fleet's vertex stage
        const em = await S.emitShaders(renderer, { scene: look.scene, camera: look.camera, mesh: look.scene.children[0] });
        const CH = RACES.findIndex((r) => r.name === "Chaos");
        const desc = S.transplantIntoShell({ [em.language]: em }, P.lyapunovLookShell(std.fleets[CH].pipeline.buffers, { extraUniforms: [{ name: "amp", type: "f32" }] }));
        const ob = std.fleets[CH].bind; std.fleets[CH] = { ...std.fleets[CH], pipeline: desc, bind: (pass, ctx) => { ob(pass, ctx); pass.uniform("amp", 0.06 * (1 + Math.sin(ctx.time * 2))); } };
        tslLook = { language: em.language, revision: THREE.REVISION, applied: std.fleets[CH].pipeline === desc, shaders: Object.keys(desc.shaders), displaced: desc.displaced };
        say(`${device.backend} &middot; the Chaos race's look is GENERATED: a TSL graph, three ${THREE.REVISION} emitted its ${em.language.toUpperCase()}, transplanted into the fleet's shell${desc.displaced ? ", and its hull breathes by the graph's position node" : ""}`);
        // v4325 -- a SECOND shell and a second race: the Pixel race's sprite layout (p, color, uv -- no normal), painted by the
        // Heidler return-stroke current across the quad's own uv. Its own try, so a failure here leaves the Chaos race generated.
        try {
            const sprite = P.makeHeidlerSpriteTsl(THREE, T, {}); renderer.setRenderTarget(new THREE.RenderTarget(64, 64));
            const emS = await S.emitShaders(renderer, { scene: sprite.scene, camera: sprite.camera, mesh: sprite.scene.children[0] });
            const PX = RACES.findIndex((r) => r.name === "Pixel");
            const dS = S.transplantIntoShell({ [emS.language]: emS }, P.heidlerSpriteShell(std.fleets[PX].pipeline.buffers));
            std.fleets[PX] = { ...std.fleets[PX], pipeline: dS, bind: (pass) => { pass.uniform("bolt", sprite.knobs.bolt); pass.uniform("span", sprite.knobs.span); } };
            tslLook.sprite = { language: emS.language, applied: std.fleets[PX].pipeline === dS, shell: dS.shell, varyings: Object.keys(P.heidlerSpriteShell([])[emS.language].varyings) };
            say(`${device.backend} &middot; and the Pixel race's quad is GENERATED too, in a SECOND shell -- the sprite layout, no normal in it: the lightning's current (swk_heidler) across the sprite's own uv`);
        } catch (e) { say("the generated sprite look failed, the Pixel race keeps its bitmap: " + e.message, true); console.warn("tsl sprite:", e); }
    } catch (e) { say("TSL look failed, the hand-written Chaos look stands: " + e.message, true); console.warn("tsl look:", e); }
}
const fleetOf = Uint32Array.from(economy.names, (n, i) => (i === YOU ? 1 : crewFleet[i]));   // you fly the Wedge race: the user's hull
const lifeScene = G.makeGpuDrivenScene(device, { fleets: std.fleets, fleetOf, thresholds: [0.02], records: lifeSource, headings: { cpu: () => (scrub.ghost || economy).headings() } });
window.__lifeScene = lifeScene;   // v4323: the gate counts a race's pixels off the identity picture
// v4318 -- the twin universe (?twin=1): seed 8, the same crew, stepped beside this one (alone only: the wire carries one universe)
const twin = params.get("twin") === "1" && !peer;
const economyB = twin ? makeGitEconomy(system, { seed: 8, history, traders: crewList }) : null;
const lifeSceneB = twin ? G.makeGpuDrivenScene(device, { fleets: std.fleets, fleetOf, thresholds: [0.02], records: { count: economyB.ships.length, cpu: () => economyB.records(0.14) }, headings: { cpu: () => economyB.headings() } }) : null;
let maskRig = null, rigOther = null;
const rigFor = () => { if (!maskRig || maskRig.width !== cv.width || maskRig.height !== cv.height) { if (maskRig) maskRig.destroy(); maskRig = makeMaskRig(device, { width: cv.width, height: cv.height }); rigOther = twin ? maskRig.target() : null; } return maskRig; };   // v4317: a trader faces its next market
document.getElementById("races").textContent = std.fleets.map((f, i) => `${f.name} ${fleetOf.reduce((n, x) => n + (x === i), 0)}`).join(" / ");
const bodyNames = ["SweK", ...system.bodies.map((b) => b.name)];
let pointer = null, lastSimT = economy.t;
// v4317 -- LANDING: the pointed body becomes the heightfield of its own file tree, drawn through gpuTerrain's pipeline
// with the same LOD ladder and pick; a pick on a ridge names the file. G toggles; the sky view pauses meanwhile.
const landing = { on: false, body: null, scene: null, bt: null, tex: null, side: 8, last: null };
function landOn(bodyIndex) {
    const b = system.bodies[bodyIndex - 1]; if (!b || !b.files || !b.files.length) { document.getElementById("landing").textContent = b ? `${b.name} has no files to land on` : ""; return; }
    if (landing.scene) { try { landing.scene.destroy(); landing.tex.destroy(); } catch (e) {} }
    const bt = bodyHeightfield(b), L = landingRecords(bt, landing.side);
    const tex = device.texture({ width: bt.field.width, height: bt.field.height, data: bt.field.data, nearest: true });
    const scene = G.makeGpuDrivenScene(device, { lods: [{ name: "coarse", mesh: T.skirtedQuadMesh(1) }, { name: "fine", mesh: T.skirtedQuadMesh(6) }], thresholds: [0.08], records: L.records, pipeline: T.terrainPipelineDesc(), bind: (pass) => { pass.uniform("terrain", L.params); pass.uniform("light", new Float32Array(T.LIGHT)); pass.texture("heightTex", tex, 0); } });
    Object.assign(landing, { on: true, body: b, scene, bt, tex, name: b.name });
    document.getElementById("landing").textContent = `landed on ${b.name}: ${bt.files.length} files as hills -- point at a ridge; G returns to the sky`;
}
addEventListener("keydown", (e) => { if (e.key === "g" || e.key === "G") { if (landing.on) { landing.on = false; document.getElementById("landing").textContent = "back in the sky"; } else if (landing.last) landOn(landing.last); } });
// v4317 -- THE MASK: the pick picture as a strength field; badTv through it over one race, both pictures read back this round
const maskSel = document.getElementById("mask"); for (const r of RACES) { const o = document.createElement("option"); o.value = r.name; o.textContent = r.name; maskSel.appendChild(o); }
// v4317 -- the cockpit: arrows fly, L lands or launches, B/S buy or sell the first good on the screen (a demo of the interventions)
const flight = makeFlight({ x: 0, y: 0, yaw: 0 }), cockpit = makeCockpit(economy, YOU, { intervene: (k, a) => intervene(k, a) });
const keys = new Set(); addEventListener("keydown", (e) => { keys.add(e.key); if (e.key === "l" || e.key === "L") { const s = economy.ships[YOU]; if (s.landed) { cockpit.launch(); flight.launch(); } else { const m = flight.nearest(economy.markets, (m) => economy.uni.systemById[m.id] && (() => { const p = positionAt(m.body, economy.t); return [p.x, p.y]; })()); if (m) { cockpit.land(m.id); flight.land(m, () => { const p = positionAt(m.body, economy.t); return [p.x, p.y]; }); } } }
    if (e.key === "b" || e.key === "B") { const sc = cockpit.screen(); const g = sc && sc.goods.find((x) => x.canBuy > 0); if (g) cockpit.buy(g.good, Math.min(10, g.canBuy)); }
    if (e.key === "s" || e.key === "S") { const sc = cockpit.screen(); const g = sc && sc.goods.find((x) => x.canSell > 0); if (g) cockpit.sell(g.good, g.canSell); } });
addEventListener("keyup", (e) => keys.delete(e.key));
let lastFlight = performance.now();
function flyYou(now) { const dt = Math.min(0.05, (now - lastFlight) / 1000); lastFlight = now; const s = economy.ships[YOU];
    if (s.landed) { const m = economy.uni.systemById[s.at]; const p = positionAt(m.body, economy.t); flight.state.x = p.x; flight.state.y = p.y; }
    else flight.step(dt, { thrust: keys.has("ArrowUp") ? 1 : 0, turn: (keys.has("ArrowLeft") ? 1 : 0) - (keys.has("ArrowRight") ? 1 : 0) });
    s.x = flight.state.x; s.y = flight.state.y; s.yaw = flight.state.yaw;
    const sc = cockpit.screen(), near = s.landed ? null : flight.nearest(economy.markets, (m) => { const p = positionAt(m.body, economy.t); return [p.x, p.y]; });
    document.getElementById("cockpit").textContent = sc ? `landed at ${sc.market}: ${sc.credits} cr, hold ${sc.held}/${sc.holdTons}; ` + sc.goods.map((g) => `${g.good} ${g.price} (buy ${g.canBuy}, sell ${g.canSell})`).join(", ") + " -- B buys, S sells, L launches"
        : `you: ${s.store.get("credits")} cr, ${near ? "over " + near.name + " -- L lands" : "flying (arrows)"}`; }
cv.addEventListener("pointermove", (e) => { const d = window.devicePixelRatio || 1; pointer = [e.clientX * d, e.clientY * d]; });
const ext = Math.max(1, extentOf(system)), span = slowestPeriod(system) / 24;
let t = economy.t, last = performance.now();
function camera() {
    const tilt = Number(document.getElementById("tilt").value) * Math.PI / 180, dist = ext * 2.4;
    const eye = [0, Math.sin(tilt) * dist, Math.cos(tilt) * dist];
    const aspect = cv.width / Math.max(1, cv.height);
    const proj = G.perspective(0.9, aspect, 0.1, dist * 4), view = G.lookAt(eye, [0, 0, 0], [0, 0, -1]);
    return { eye, proj, view, viewProj: G.multiply(proj, view) };
}
let frames = 0;
async function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    t += dt * Number(document.getElementById("speed").value) * span / 8;
    if (cv.width !== Math.round(innerWidth * (window.devicePixelRatio || 1))) size();
    source.advance(t);
    const cam = camera();
    if (landing.on && landing.scene) {
        // the landing view: the field from above and a little in front, y up (gpuTerrain's plane is XZ)
        const eye = [0, 9, 9], viewProj = G.multiply(G.perspective(0.9, cv.width / Math.max(1, cv.height), 0.1, 100), G.lookAt(eye, [0, 0, 0]));
        landing.scene.frame({ viewProj, eye, clear: [0.03, 0.05, 0.08, 1] });
        if (pointer && (frames & 3) === 0) { try { const hit = await landing.scene.pick(pointer[0], pointer[1]); const f = hit ? fileOfChunk(landing.bt, landing.side, hit.id) : null; document.getElementById("pick").textContent = f && f.file ? `${landing.name}/${f.file.path} (${f.file.bytes} bytes, height ${f.height.toFixed(2)})` : hit ? "a valley between files" : "off the field"; } catch (e) {} }
        document.getElementById("t").textContent = t.toFixed(1); frames++; requestAnimationFrame(frame); return;
    }
    const life = document.getElementById("life").checked;
    // v4318 -- the masked look draws through the rig's targets instead of the canvas: nothing is read back
    const masked = maskSel.value && life ? RACES.findIndex((r) => r.name === maskSel.value) : -1;
    const drawSky = (target) => scene.frame({ viewProj: cam.viewProj, view: cam.view, proj: cam.proj, eye: cam.eye, clear: [0.024, 0.07, 0.043, 1], ...(target ? { target } : {}) });
    if (masked < 0) drawSky(null);
    if (life) {
        // the sim steps in orrery days, a quarter day at a time, however fast the wall clock runs
        // Level 16: alone, step; as a peer, pump -- the net steps when every peer's inputs for the tick are in
        if (scrub.at == null) { while (lastSimT + 0.25 <= t) { if (peer) peer.pump(); else { economy.step(0.25); if (economyB) economyB.step(0.25); } lastSimT += 0.25; } }
        flyYou(now);
        if ((frames & 7) === 0) { document.getElementById("date").textContent = economy.date ? economy.date + ` (${economy.openMarkets()} markets open, ${economy.joinedShips()} ships)` : "no calendar"; document.getElementById("tick").textContent = economy.tick; document.getElementById("hash").textContent = economy.hash();
            scrubEl.max = economy.tick; if (scrub.at == null) scrubEl.value = economy.tick;
            if (peer) { const d = peer.desync(); document.getElementById("peer").textContent = d ? `peer ${peerId}: DESYNC at tick ${d.tick} (ours ${d.ours}, theirs ${d.theirs})` : `peer ${peerId} over ${chosen.kind}${chosen.kind === "webrtc" ? " (" + chosen.wire.connections() + " connected)" : ""}: in step, lead ${peer.lead()}`; } }
        if (masked < 0) lifeScene.frame({ viewProj: cam.viewProj, eye: cam.eye, clear: null });
        else { const rig = rigFor(); const colourA = (tg) => { drawSky(tg); lifeScene.frame({ viewProj: cam.viewProj, eye: cam.eye, clear: null, target: tg }); };
            if (twin) rig.composite({ a: colourA, b: (tg) => { drawSky(tg); lifeSceneB.frame({ viewProj: cam.viewProj, eye: cam.eye, clear: null, target: tg }); }, pick: (tg) => lifeScene.pickTo(tg), fleets: masked, other: rigOther });
            else rig.draw({ colour: colourA, pick: (tg) => lifeScene.pickTo(tg), fleets: masked, time: t * 0.05 }); }
        if ((frames & 15) === 0) { const ev = economy.events.slice(-3).reverse(); document.getElementById("trade").innerHTML = ev.map((x) => `<div>${x.replace(/</g, "&lt;")}</div>`).join(""); }
    }
    if (pointer && (frames & 3) === 0) {
        try {
            let hit = life ? await lifeScene.pick(pointer[0], pointer[1]) : null;
            document.getElementById("pick").textContent = hit ? `[${hit.fleetName}: ${RACES[hit.fleet].architecture}] ` + economy.describe(hit.id)
                : ((hit = await scene.pick(pointer[0], pointer[1])) ? `${bodyNames[hit.id]}${hit.id ? " -- " + Object.entries(economy.markets[hit.id - 1].trade).map(([g, p]) => g + " " + p).join(", ") : ""}` : "nothing under the pointer");
            if (hit && !life && hit.id > 0) { landing.last = hit.id; if (document.getElementById("landmode").checked) landOn(hit.id); }
            else if (hit && life) { /* a trader */ } else if (!hit) {}
        } catch (e) { document.getElementById("pick").textContent = "pick failed: " + e.message; }
    }
    document.getElementById("t").textContent = t.toFixed(1);
    if ((frames++ & 31) === 0) { try { const c = await scene.readCounts(); if (c) document.getElementById("drawn").textContent = c.join(" + ") + " of " + source.count + (life ? " bodies, " + economy.ships.length + " traders" : ""); } catch (e) {} }
    requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
