<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SweK Orrery -- on the GPU</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #06120b; color: #cfe6d6; font: 13px ui-monospace, monospace; overflow: hidden; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  #hud { position: absolute; left: 12px; top: 10px; background: rgba(4, 18, 11, .82); border: 1px solid #14351f; padding: 8px 10px; max-width: 520px; line-height: 1.5; }
  #hud b { color: #9ef0b4; }
  #hud .warn { color: #f0c66a; }
  label { display: inline-block; margin-right: 12px; }
  input[type=range] { width: 160px; vertical-align: middle; }
  a { color: #9ef0b4; }
</style>
</head>
<body>
<!--
  Level 12 -- THE WebGPU ORRERY. orrery.html draws the system in canvas 2D and (since v4273) can pass that picture
  through a device post stage. THIS page draws the system THROUGH the device: a compute pass places every body
  from its orbital elements (render/gpuOrbits.mjs, positionAt to the letter), a second culls and picks LOD
  (render/gpuDriven.mjs), and each LOD is one drawIndexedIndirect. On a browser without WebGPU the same scene
  draws on WebGL2 through the CPU twin, and the HUD says which route it took -- the route is a fact about the
  browser, not a promise about the page.

  The 2D orrery stays the product: this is the same data (orrery.json, buildOrrery) on the Level 11/12 path.

  Level 13 -- LIFE. world/gitEconomy.mjs runs ev/esEconomy.js's trading among these bodies: each repository is a
  market stocked from its own files, each of git's contributors a hauler chasing the best margin. The traders
  are a second GPU-driven scene drawn over the first without clearing; the pointer names a body or a trader
  from a one-pixel pick, and the log shows what was just bought and sold, and where it is bound.

  Level 16 (v4314) -- A UNIVERSE THAT PERSISTS, AND IS SHARED. Time is git time: sim day 0 is the day the first
  body was vendored and each market opens on its own day (?history=0 for the v4300 sky where everything is
  there at once). The universe is a seed and a journal: "save" keeps the journal in localStorage, "restore"
  reloads and REPLAYS it (the HUD says whether the replay reached the saved hash). Two tabs share one universe:
  open ?peer=a in one and ?peer=b in another and both trade in lockstep over a BroadcastChannel, every tick's
  hash checked (world/economyLockstep.mjs). "a week of commits" feeds the fixture commits (world/commitsFeed.mjs)
  in as production -- journaled, so it replays and lockstops like anything else.
-->
<canvas id="stage"></canvas>
<div id="hud">
  <div><b>SweK orrery, GPU-driven</b> &mdash; <span id="route">starting&hellip;</span></div>
  <div id="bodies"></div>
  <div>
    <label>tilt <input id="tilt" type="range" min="0" max="80" value="35"></label>
    <label>days/s <input id="speed" type="range" min="0" max="40" value="8"></label>
    <label><input id="occ" type="checkbox" checked> occlusion (WebGPU)</label>
  </div>
  <div><label><input id="life" type="checkbox" checked> life: the economy's traders</label> <span id="pick" style="color:#f0e29e">point at something</span></div>
  <div style="color:#9fb8a8">races: <span id="races"></span></div>
  <div id="trade" style="color:#9fb8a8; max-height: 4.5em; overflow: hidden"></div>
  <div style="color:#9fb8a8"><span id="date"></span> &middot; tick <span id="tick">0</span> &middot; hash <span id="hash"></span> &middot; <span id="peer">alone</span></div>
  <div><button id="save">save universe</button> <button id="restore">restore</button> <button id="commits">a week of commits</button> <span id="persist" style="color:#f0e29e"></span></div>
  <div id="key" style="color:#9fb8a8">cross-browser key: computing&hellip;</div>
  <div><a href="./orrery.html">the 2D orrery</a> &middot; t = <span id="t">0</span> days &middot; drawn <span id="drawn">?</span></div>
</div>
<script type="module">
import { buildOrrery } from "./world/orrery.mjs";
import { extentOf, slowestPeriod } from "./world/orreryView.mjs";
import { requestDevice } from "./gfx/device.js";
import * as G from "./render/gpuDriven.mjs";
import { makeOrbitSource } from "./render/gpuOrbits.mjs";
import { makeGitEconomy } from "./world/gitEconomy.mjs";
import { standardFleets, fleetsForNames, userModelSources, loadUserModel, RACES } from "./render/fleets.mjs";
import { makePeer, broadcastWire } from "./world/economyLockstep.mjs";
import { wireFromParams, hashKey, compareKey } from "./world/universeWire.mjs";
import { p2pTransport } from "./ev/p2p.js";
import { applyCommitsFeed, fixtureFeed } from "./world/commitsFeed.mjs";

const cv = document.getElementById("stage"), route = document.getElementById("route");
const say = (s, warn) => { route.innerHTML = warn ? `<span class="warn">${s}</span>` : s; };

const raw = await fetch("./orrery.json").then((r) => r.json()).catch(() => null);
if (!raw) { say("orrery.json not found -- run: node tools/ship/orreryBake.mjs --write", true); throw new Error("no orrery.json"); }
const system = buildOrrery(raw.bodies);
document.getElementById("bodies").textContent = `${system.bodies.length} bodies around ${system.centre}; ${system.captured} captured, ${system.reached} reached, ${system.unpapered.length} unpapered`;

function size() { const d = window.devicePixelRatio || 1; cv.width = Math.round(innerWidth * d); cv.height = Math.round(innerHeight * d); }
size();

let device = null;
try { device = await requestDevice(cv, {}); } catch (e) { say("requestDevice threw: " + e.message, true); throw e; }
if (!device || device.backend === "null") { say("neither WebGPU nor WebGL2 is available on this origin -- nothing can be drawn (WebGPU needs https or localhost)", true); throw new Error("no device"); }

// LODs: a finer disc up close, a coarser one far away; the ORDER is derived from the meshes, not typed here.
const lods = [{ name: "far", mesh: G.quadMesh(1, [0.55, 0.75, 0.62, 1]) }, { name: "near", mesh: G.quadMesh(6, [0.62, 0.94, 0.71, 1]) }];
const source = makeOrbitSource(device, system);
const scene = G.makeGpuDrivenScene(device, { lods, thresholds: [0.012], records: source, occlusion: true });
say(`${device.backend} &middot; orbits by ${device.backend === "webgpu" ? "compute" : "the CPU twin"} &middot; ${scene.path}${scene.occlusion ? " &middot; Hi-Z occlusion" : ""}`);

// the economy: haulers as a second scene over the bodies. Its records come from the CPU sim every frame.
const params = new URLSearchParams(location.search);
const history = params.get("history") !== "0", peerId = params.get("peer"), JOURNAL_KEY = "swek.orrery.journal";
const economy = makeGitEconomy(system, { seed: 7, history });
// v4314 -- restore: replay the saved journal on this fresh economy before anything moves
let restored = null;
if (params.get("restore") === "1") { try { const lg = JSON.parse(localStorage.getItem(JOURNAL_KEY) || "null"); if (lg) { const r = economy.replay(lg); restored = { ...r, saved: lg.hash, tick: lg.tick }; } } catch (e) { restored = { error: e.message }; } }
// v4314 -- two tabs, one universe: this tab is peer a or b over a BroadcastChannel, and steps only in lockstep
// v4316 -- the wire from the params: two tabs (BroadcastChannel) or two machines (?webrtc=<rendezvous>&room=<room>, ev/p2p.js)
let peer = null, chosen = { kind: "none" };
try { chosen = wireFromParams(params, { broadcast: broadcastWire, p2p: p2pTransport }); } catch (e) { say("wire: " + e.message, true); }
if (chosen.wire) { const wire = chosen.wire; peer = makePeer({ economy, selfId: chosen.peer, peers: ["a", "b"], send: (m) => wire.send(m), inputDelay: chosen.kind === "webrtc" ? 6 : 3, dt: 0.25 }); wire.onMessage = (m) => peer.receive(m); }
// v4316 -- the cross-browser key: a fresh economy to tick 400 from seed 7, its hash beside the one Node recorded
try { const mine = hashKey((seed, today) => makeGitEconomy(buildOrrery(raw.bodies, { today }), { seed, history: true }), { seed: 7, ticks: 400 }); const expected = await fetch("./tools/ship/universe-hash-expected.json").then((r) => r.json()).catch(() => null);
    const cmp = compareKey(mine, expected); document.getElementById("key").textContent = `cross-browser key: ${cmp.verdict} -- ${cmp.detail}`; window.__universeKey = { mine, expected, ...cmp }; } catch (e) { document.getElementById("key").textContent = "key: " + e.message; }
let feedSeen = new Set();
const intervene = (kind, args) => { if (peer) peer.queue(kind, args); else economy.intervene(kind, args); };
document.getElementById("save").onclick = () => { try { localStorage.setItem(JOURNAL_KEY, JSON.stringify(economy.log())); document.getElementById("persist").textContent = `saved at tick ${economy.tick}, hash ${economy.hash()}`; } catch (e) { document.getElementById("persist").textContent = "save failed: " + e.message; } };
document.getElementById("restore").onclick = () => { const u = new URL(location.href); u.searchParams.set("restore", "1"); location.href = u.toString(); };
document.getElementById("commits").onclick = () => { const feed = fixtureFeed(economy.markets, { seed: 5 + economy.tick }); const r = peer ? applyCommitsFeedQueued(feed) : applyCommitsFeed(economy, feed, { seen: feedSeen }); feedSeen = r.seen; document.getElementById("persist").textContent = `${r.applied.length} commit record(s) fed as production`; };
function applyCommitsFeedQueued(feed) { const r = { applied: [], seen: new Set(feedSeen) }; for (const f of feed) { const m = economy.markets.find((x) => "vendor/" + x.name === f.repo); if (m) { peer.queue("commits", { market: m.id, commits: f.commits }); r.applied.push(f); } } return r; }
if (restored) document.getElementById("persist").textContent = restored.error ? "restore failed: " + restored.error : `restored: replayed ${restored.tick} ticks, replay ${restored.matches ? "MATCHES" : "DOES NOT MATCH"} the saved hash ${restored.saved}`;
window.__universe = { economy, get tick() { return economy.tick; }, hash: () => economy.hash(), log: () => economy.log(), restored, peer: peerId, history, get inStep() { return peer ? (peer.desync() ? false : true) : null; }, get desync() { return peer ? peer.desync() : null; } };
const lifeSource = { count: economy.ships.length, cpu: () => economy.records(0.14) };
// v4301 (Level 15) -- FLEETS: every owner in the git graph is a race, and every race is its own architecture and
// shader (render/fleets.mjs). If the person assigned a ship model in Escape Velocity or a plane on the radar,
// the raised hull is theirs: the Wedge race wears it, the Krbn race skins it, the Glyph race pins glyphs to it.
let userHull = null;
try { const src = userModelSources(localStorage).find((x) => x.loadable); if (src) { userHull = await loadUserModel(src); say(`the ${src.kind} model for ${src.cls} (${src.url}) is the raised hull`); } } catch (e) { console.warn("user model:", e.message); }
const std = standardFleets(device, { userHull });
const fleetOf = fleetsForNames(economy.names, std.fleets.length);
const lifeScene = G.makeGpuDrivenScene(device, { fleets: std.fleets, fleetOf, thresholds: [0.02], records: lifeSource });
document.getElementById("races").textContent = std.fleets.map((f, i) => `${f.name} ${fleetOf.reduce((n, x) => n + (x === i), 0)}`).join(" / ");
const bodyNames = ["SweK", ...system.bodies.map((b) => b.name)];
let pointer = null, lastSimT = economy.t;
cv.addEventListener("pointermove", (e) => { const d = window.devicePixelRatio || 1; pointer = [e.clientX * d, e.clientY * d]; });
const ext = Math.max(1, extentOf(system)), span = slowestPeriod(system) / 24;
let t = economy.t, last = performance.now();
function camera() {
    const tilt = Number(document.getElementById("tilt").value) * Math.PI / 180, dist = ext * 2.4;
    const eye = [0, Math.sin(tilt) * dist, Math.cos(tilt) * dist];
    const aspect = cv.width / Math.max(1, cv.height);
    const proj = G.perspective(0.9, aspect, 0.1, dist * 4), view = G.lookAt(eye, [0, 0, 0], [0, 0, -1]);
    return { eye, proj, view, viewProj: G.multiply(proj, view) };
}
let frames = 0;
async function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    t += dt * Number(document.getElementById("speed").value) * span / 8;
    if (cv.width !== Math.round(innerWidth * (window.devicePixelRatio || 1))) size();
    source.advance(t);
    const cam = camera();
    scene.frame({ viewProj: cam.viewProj, view: cam.view, proj: cam.proj, eye: cam.eye, clear: [0.024, 0.07, 0.043, 1] });
    const life = document.getElementById("life").checked;
    if (life) {
        // the sim steps in orrery days, a quarter day at a time, however fast the wall clock runs
        // Level 16: alone, step; as a peer, pump -- the net steps when every peer's inputs for the tick are in
        while (lastSimT + 0.25 <= t) { if (peer) peer.pump(); else economy.step(0.25); lastSimT += 0.25; }
        if ((frames & 7) === 0) { document.getElementById("date").textContent = economy.date ? economy.date + ` (${economy.openMarkets()} markets open, ${economy.joinedShips()} ships)` : "no calendar"; document.getElementById("tick").textContent = economy.tick; document.getElementById("hash").textContent = economy.hash();
            if (peer) { const d = peer.desync(); document.getElementById("peer").textContent = d ? `peer ${peerId}: DESYNC at tick ${d.tick} (ours ${d.ours}, theirs ${d.theirs})` : `peer ${peerId} over ${chosen.kind}${chosen.kind === "webrtc" ? " (" + chosen.wire.connections() + " connected)" : ""}: in step, lead ${peer.lead()}`; } }
        lifeScene.frame({ viewProj: cam.viewProj, eye: cam.eye, clear: null });
        if ((frames & 15) === 0) { const ev = economy.events.slice(-3).reverse(); document.getElementById("trade").innerHTML = ev.map((x) => `<div>${x.replace(/</g, "&lt;")}</div>`).join(""); }
    }
    if (pointer && (frames & 3) === 0) {
        try {
            let hit = life ? await lifeScene.pick(pointer[0], pointer[1]) : null;
            document.getElementById("pick").textContent = hit ? `[${hit.fleetName}: ${RACES[hit.fleet].architecture}] ` + economy.describe(hit.id)
                : ((hit = await scene.pick(pointer[0], pointer[1])) ? `${bodyNames[hit.id]}${hit.id ? " -- " + Object.entries(economy.markets[hit.id - 1].trade).map(([g, p]) => g + " " + p).join(", ") : ""}` : "nothing under the pointer");
        } catch (e) { document.getElementById("pick").textContent = "pick failed: " + e.message; }
    }
    document.getElementById("t").textContent = t.toFixed(1);
    if ((frames++ & 31) === 0) { try { const c = await scene.readCounts(); if (c) document.getElementById("drawn").textContent = c.join(" + ") + " of " + source.count + (life ? " bodies, " + economy.ships.length + " traders" : ""); } catch (e) {} }
    requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
