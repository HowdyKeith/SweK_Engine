<!DOCTYPE html>
<!-- v1256 (#12) — Animation preview for imported rigs. Opened from the control.html
     Mesh2Motion picker as avatarpreview.html?glb=<url>. Loads the GLB with the
     vendored three GLTFLoader, lists its animation clips, and plays the selected clip
     through an AnimationMixer so you can audition a rig BEFORE setting it as the avatar.
     Self-contained; no bridge state. "Use as avatar" posts /avatar/set. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avatar / rig preview</title>
<style>
  :root{ --bg:#0a0f14; --panel:rgba(8,16,22,.86); --line:#1b3a4d; --ink:#bfe6ff; --dim:#6f93a8; --accent:#37d0a0; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink);
    font:14px/1.4 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; overflow:hidden; }
  #view{ position:fixed; inset:0; }
  #view canvas{ display:block; }
  #panel{ position:fixed; left:12px; right:12px; bottom:12px; max-width:560px; margin:0 auto;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 12px;
    backdrop-filter:blur(7px); box-shadow:0 8px 30px rgba(0,0,0,.5); }
  #title{ font-weight:700; letter-spacing:.3px; margin-bottom:8px; color:#d8f3ff;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row{ display:flex; gap:8px; align-items:center; margin-top:6px; }
  select,button{ font:13px inherit; color:var(--ink); background:#0e1c26; border:1px solid var(--line);
    border-radius:8px; padding:7px 9px; cursor:pointer; }
  select{ flex:1; min-width:0; }
  button:hover{ border-color:var(--accent); }
  button.accent{ background:var(--accent); color:#04130d; border-color:var(--accent); font-weight:700; }
  #meta{ color:var(--dim); font-size:12px; margin-top:8px; }
  #status{ position:fixed; top:14px; left:0; right:0; text-align:center; color:var(--dim); font-size:13px; }
  #status.err{ color:#ff8c8c; }
  input[type=range]{ flex:1; }
  a{ color:var(--accent); }
</style>
</head>
<body>
<div id="view"></div>
<div id="status">Loading rig …</div>
<div id="panel">
  <div id="title">Rig preview</div>
  <div class="row">
    <select id="clipSel"><option value="">— animation clips —</option></select>
    <button id="playBtn" class="accent" title="Play / pause">⏸</button>
  </div>
  <div class="row">
    <label style="color:var(--dim);font-size:12px;white-space:nowrap;">Speed</label>
    <input type="range" id="speed" min="0.1" max="2" step="0.1" value="1">
    <button id="spinBtn" title="Auto-rotate">🔄 Spin</button>
  </div>
  <div class="row">
    <button id="useBtn" style="flex:1;">🎭 Use as avatar</button>
    <button id="closeBtn" title="Close">✕ Close</button>
  </div>
  <div id="meta"></div>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js" } }
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "./vendor/three/jsm/loaders/GLTFLoader.js";
import { enableMeshopt } from "/vendor/three/jsm/libs/meshoptGltf.js";
import { OrbitControls } from "./vendor/three/jsm/controls/OrbitControls.js";

const qs = new URLSearchParams(location.search);
const glbUrl = qs.get("glb") || "";
const statusEl = document.getElementById("status");
const titleEl  = document.getElementById("title");
const metaEl   = document.getElementById("meta");
const clipSel  = document.getElementById("clipSel");
const playBtn  = document.getElementById("playBtn");
const spinBtn  = document.getElementById("spinBtn");
const speedEl  = document.getElementById("speed");
const useBtn   = document.getElementById("useBtn");
const closeBtn = document.getElementById("closeBtn");

function setStatus(m, err){ statusEl.textContent = m || ""; statusEl.className = err ? "err" : ""; statusEl.style.display = m ? "" : "none"; }
const niceName = (u)=>{ try{ return decodeURIComponent(u.split("/").pop()); }catch{ return u; } };
titleEl.textContent = glbUrl ? niceName(glbUrl) : "Rig preview";

const view = document.getElementById("view");
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0f14);
const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 1000);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
if ("outputColorSpace" in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace;
view.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
// v1966 — shared 3D navigation pad (buttons + keyboard + gamepad) driving these OrbitControls.
import("/ui/orbitNavPad.js").then(m => m.mountOrbitNavPad({ camera, controls, THREE })).catch(()=>{});
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.target.set(0, 0, 0);

scene.add(new THREE.HemisphereLight(0xbfeacb, 0x16301f, 1.05));
const key = new THREE.DirectionalLight(0xffffff, 1.5); key.position.set(3, 5, 4); scene.add(key);
const fill = new THREE.DirectionalLight(0x9fd8b4, 0.6); fill.position.set(-4, 1, -2); scene.add(fill);
scene.add(new THREE.AmbientLight(0x335544, 0.5));
const grid = new THREE.GridHelper(8, 16, 0x1c5a30, 0x123a20); grid.position.y = -1.2; scene.add(grid);

function resize(){ const w = innerWidth, h = innerHeight; camera.aspect = w/h; camera.updateProjectionMatrix(); renderer.setSize(w, h); }
addEventListener("resize", resize); resize();

let pivot = null, mixer = null, clips = [], action = null, autoSpin = false, playing = true;
const clock = new THREE.Clock();

function frameModel(targetSize){
  pivot.position.set(0,0,0); pivot.scale.setScalar(1);
  const box = new THREE.Box3().setFromObject(pivot);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  const s = (targetSize || 2) / maxDim;
  pivot.children.forEach(ch => ch.position.sub(center));
  pivot.scale.setScalar(s);
  const dist = (targetSize || 2) * 1.9;
  camera.position.set(0, (targetSize||2)*0.25, dist);
  controls.target.set(0, 0, 0); controls.update();
}

function playClip(i){
  if (!mixer || !clips.length) return;
  if (action) action.fadeOut(0.2);
  const clip = clips[i] || clips[0];
  action = mixer.clipAction(clip);
  action.reset(); action.setEffectiveTimeScale(parseFloat(speedEl.value)||1);
  action.fadeIn(0.2).play();
  playing = true; playBtn.textContent = "⏸"; playBtn.classList.add("accent");
}

if (!glbUrl){ setStatus("No ?glb= supplied", true); }
else {
  enableMeshopt(new GLTFLoader()).load(glbUrl, (gltf)=>{
    pivot = new THREE.Group(); pivot.add(gltf.scene); scene.add(pivot);
    frameModel(2);
    clips = gltf.animations || [];
    if (clips.length){
      mixer = new THREE.AnimationMixer(gltf.scene);
      clipSel.innerHTML = "";
      clips.forEach((c, i)=>{ const o=document.createElement("option"); o.value=String(i); o.textContent=(c.name||("clip "+(i+1)))+"  ("+c.duration.toFixed(2)+"s)"; clipSel.appendChild(o); });
      playClip(0);
      metaEl.textContent = clips.length + " animation clip" + (clips.length>1?"s":"") + " · drag to orbit, scroll to zoom";
    } else {
      clipSel.innerHTML = "<option value=''>(no animation clips in this rig)</option>";
      playBtn.disabled = true; playBtn.classList.remove("accent");
      metaEl.textContent = "Static rig — no embedded clips. It will still pose/idle in the engine. Drag to orbit, scroll to zoom.";
    }
    setStatus("");
  }, undefined, (err)=>{ setStatus("Failed to load: " + (err && err.message || err), true); });
}

clipSel.addEventListener("change", ()=>{ const i = parseInt(clipSel.value,10); if (Number.isFinite(i)) playClip(i); });
speedEl.addEventListener("input", ()=>{ if (action) action.setEffectiveTimeScale(parseFloat(speedEl.value)||1); });
playBtn.addEventListener("click", ()=>{ if (!mixer) return; playing = !playing; mixer.timeScale = playing ? 1 : 0; playBtn.textContent = playing ? "⏸" : "▶"; playBtn.classList.toggle("accent", playing); });
spinBtn.addEventListener("click", ()=>{ autoSpin = !autoSpin; spinBtn.classList.toggle("accent", autoSpin); });
closeBtn.addEventListener("click", ()=>{ try{ window.close(); }catch{} history.length>1 ? history.back() : (location.href="./control.html"); });
useBtn.addEventListener("click", ()=>{
  if (!glbUrl) return;
  useBtn.textContent = "switching …";
  fetch("/avatar/set", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ url: glbUrl }) })
    .then(r=>r.json()).then(j=>{ useBtn.textContent = j && j.ok ? "✓ set as avatar" : "set failed"; })
    .catch(()=>{ useBtn.textContent = "bridge unreachable"; });
});

(function loop(){
  requestAnimationFrame(loop);
  const dt = clock.getDelta();
  if (mixer && playing) mixer.update(dt);
  if (autoSpin && pivot) pivot.rotation.y += dt * 0.6;
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
