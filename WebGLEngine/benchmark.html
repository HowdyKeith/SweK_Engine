<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Device Benchmark</title>
<!-- v822 — universal viewer discovery meta -->
<meta name="demo:title"  content="Device Benchmark">
<meta name="demo:desc"   content="GPU + CPU benchmark suite.">
<meta name="demo:cats"   content="debug">
<meta name="demo:swatch" content="⚙">

<style>
  html,body{margin:0;padding:0;min-height:100%;background:#04030a;color:#cdf;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",monospace;overflow-x:hidden}
  #wrap{padding:14px;max-width:780px;margin:0 auto}
  h1{font-size:18px;margin:0 0 10px;color:#cdf}
  h2{font-size:14px;margin:18px 0 8px;color:#9af;border-bottom:1px solid rgba(180,140,220,0.25);padding-bottom:4px}
  .row{display:flex;gap:10px;margin:8px 0;align-items:center}
  button{padding:8px 14px;border-radius:6px;border:1px solid rgba(180,140,220,0.4);background:rgba(10,16,30,0.85);color:#cdf;font-size:13px;cursor:pointer}
  button:disabled{opacity:0.4;cursor:default}
  #status{font-size:13px;color:#9fc;flex:1}
  .test{padding:8px;background:rgba(15,20,35,0.5);border-radius:6px;margin:6px 0;font-size:12px}
  .test .label{color:#9af;margin-bottom:4px}
  .test .score{font-size:18px;color:#5eff8a;font-weight:600}
  .test .unit{font-size:11px;color:#789;margin-left:6px}
  table{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
  th,td{padding:5px 6px;text-align:left;border-bottom:1px solid rgba(180,140,220,0.15)}
  th{color:#9af;font-weight:600}
  tr:hover{background:rgba(180,140,220,0.05)}
  #renderer{font-size:11px;color:#789;margin-top:6px;word-break:break-all}
  canvas#bgl{display:none}
</style>
</head>
<body>
<div id="wrap">
  <h1>📊 Device Benchmark</h1>
  <div class="row">
    <button id="btnRun">▶ Run Tests</button>
    <button id="btnRefresh">🔄 Load Saved</button>
    <button id="btnBack">← Back</button>
    <span id="status">Ready</span>
  </div>
  <div id="renderer"></div>
  <canvas id="bgl" width="512" height="512"></canvas>

  <h2>This Device</h2>
  <div id="results"></div>

  <h2>Stored Results (newest first)</h2>
  <div id="stored"></div>
</div>
<script>
"use strict";
document.getElementById("btnBack").addEventListener("click", () => location.href = "/control.html");

function setStatus(s){ document.getElementById("status").textContent = s; }
const resultsDiv = document.getElementById("results");
const storedDiv  = document.getElementById("stored");
const rendererDiv = document.getElementById("renderer");

function clientId(){
  let id = localStorage.getItem("voxelengine.benchClientId");
  if (!id) {
    id = "bench_" + Math.random().toString(36).slice(2, 10);
    localStorage.setItem("voxelengine.benchClientId", id);
  }
  return id;
}

function detectRenderer(gl){
  const dbg = gl.getExtension("WEBGL_debug_renderer_info");
  if (dbg) {
    return {
      vendor:   gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL),
      renderer: gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL),
    };
  }
  return { vendor: gl.getParameter(gl.VENDOR), renderer: gl.getParameter(gl.RENDERER) };
}

// --- Test 1: WebGL2 triangle throughput ---
async function testTriangleThroughput(gl){
  setStatus("Test 1/4: WebGL2 triangles…");
  await new Promise(r => setTimeout(r, 50));
  const VS = `#version 300 es
    in vec2 aPos; void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }`;
  const FS = `#version 300 es
    precision mediump float; out vec4 outColor;
    void main(){ outColor = vec4(0.5, 0.6, 0.9, 1.0); }`;
  const vs = gl.createShader(gl.VERTEX_SHADER); gl.shaderSource(vs, VS); gl.compileShader(vs);
  const fs = gl.createShader(gl.FRAGMENT_SHADER); gl.shaderSource(fs, FS); gl.compileShader(fs);
  const p = gl.createProgram(); gl.attachShader(p, vs); gl.attachShader(p, fs); gl.bindAttribLocation(p, 0, "aPos"); gl.linkProgram(p);
  // 100K triangles per draw call
  const TRI_COUNT = 100000;
  const verts = new Float32Array(TRI_COUNT * 6);
  for (let i = 0; i < TRI_COUNT * 6; i += 6) {
    const cx = Math.random()*2-1, cy = Math.random()*2-1;
    verts[i]=cx; verts[i+1]=cy;
    verts[i+2]=cx+0.005; verts[i+3]=cy;
    verts[i+4]=cx; verts[i+5]=cy+0.005;
  }
  const vbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vbo); gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);
  const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.useProgram(p);
  gl.viewport(0, 0, 512, 512);
  // Warm up
  for (let i = 0; i < 3; i++) { gl.clear(gl.COLOR_BUFFER_BIT); gl.drawArrays(gl.TRIANGLES, 0, TRI_COUNT*3); }
  gl.finish();
  const t0 = performance.now();
  const FRAMES = 30;
  for (let i = 0; i < FRAMES; i++) { gl.clear(gl.COLOR_BUFFER_BIT); gl.drawArrays(gl.TRIANGLES, 0, TRI_COUNT*3); }
  gl.finish();
  const dt = (performance.now() - t0) / 1000;
  const triPerSec = (TRI_COUNT * FRAMES) / dt;
  return { ms: dt*1000/FRAMES, score: triPerSec / 1e6 };   // millions of triangles/sec
}

// --- Test 2: FBO ping-pong rate ---
async function testFboPingPong(gl){
  setStatus("Test 2/4: FBO ping-pong…");
  await new Promise(r => setTimeout(r, 50));
  if (!gl.getExtension("EXT_color_buffer_float")) return { ms: 0, score: 0, skipped: "float textures unavailable" };
  const SIZE = 256;
  const FS = `#version 300 es
    precision highp float; in vec2 vUV; out vec4 outColor;
    uniform sampler2D uState; uniform vec2 uTexel;
    void main(){
      vec3 s = vec3(0); for(int y=-1;y<=1;y++) for(int x=-1;x<=1;x++)
        s += texture(uState, vUV + vec2(float(x),float(y))*uTexel).rgb;
      outColor = vec4(s/9.0, 1.0);
    }`;
  const VS = `#version 300 es
    in vec2 aPos; out vec2 vUV;
    void main(){ vUV=aPos*0.5+0.5; gl_Position=vec4(aPos,0.0,1.0); }`;
  const vs = gl.createShader(gl.VERTEX_SHADER); gl.shaderSource(vs, VS); gl.compileShader(vs);
  const fs = gl.createShader(gl.FRAGMENT_SHADER); gl.shaderSource(fs, FS); gl.compileShader(fs);
  const p = gl.createProgram(); gl.attachShader(p, vs); gl.attachShader(p, fs); gl.bindAttribLocation(p, 0, "aPos"); gl.linkProgram(p);
  const verts = new Float32Array([-1,-1, 3,-1, -1,3]);
  const vbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vbo); gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);
  const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  function mkTex(){ const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, SIZE, SIZE, 0, gl.RGBA, gl.FLOAT, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR); return t; }
  const a = mkTex(), b = mkTex();
  function mkFbo(t){ const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0); return f; }
  const fa = mkFbo(a), fb = mkFbo(b);
  gl.useProgram(p);
  gl.uniform2f(gl.getUniformLocation(p, "uTexel"), 1/SIZE, 1/SIZE);
  gl.uniform1i(gl.getUniformLocation(p, "uState"), 0);
  gl.viewport(0, 0, SIZE, SIZE);
  // Warm up
  for (let i = 0; i < 30; i++) {
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, i%2?b:a);
    gl.bindFramebuffer(gl.FRAMEBUFFER, i%2?fa:fb);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  gl.finish();
  const t0 = performance.now();
  const STEPS = 500;
  for (let i = 0; i < STEPS; i++) {
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, i%2?b:a);
    gl.bindFramebuffer(gl.FRAMEBUFFER, i%2?fa:fb);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  gl.finish();
  const dt = (performance.now() - t0) / 1000;
  return { ms: dt*1000/STEPS, score: STEPS/dt };   // steps/sec
}

// --- Test 3: CPU Math.sin loop ---
async function testCpuMath(){
  setStatus("Test 3/4: CPU math…");
  await new Promise(r => setTimeout(r, 50));
  // Warm up
  let warm = 0; for (let i = 0; i < 100000; i++) warm += Math.sin(i);
  const ITER = 5_000_000;
  let s = 0;
  const t0 = performance.now();
  for (let i = 0; i < ITER; i++) s += Math.sin(i * 0.0001) * Math.cos(i * 0.00013);
  const dt = (performance.now() - t0) / 1000;
  // Prevent dead-code elimination
  document.getElementById("bgl").dataset.r = String(s);
  return { ms: dt*1000, score: ITER/dt/1e6 };   // millions of iter/sec
}

// --- Test 4: Memory allocation (Float32Array) ---
async function testMemoryAlloc(){
  setStatus("Test 4/4: Memory allocation…");
  await new Promise(r => setTimeout(r, 50));
  const N = 5_000_000;   // ~20 MB
  const t0 = performance.now();
  const TRIALS = 5;
  for (let t = 0; t < TRIALS; t++) {
    const arr = new Float32Array(N);
    for (let i = 0; i < N; i += 100) arr[i] = Math.random();
  }
  const dt = (performance.now() - t0) / 1000;
  const mbPerSec = (N * 4 / 1024 / 1024 * TRIALS) / dt;
  return { ms: dt*1000/TRIALS, score: mbPerSec };
}

function renderResults(tests){
  resultsDiv.innerHTML = "";
  for (const t of tests) {
    const d = document.createElement("div"); d.className = "test";
    const score = t.skipped ? `<span style="color:#f88">skipped: ${t.skipped}</span>`
      : `<span class="score">${t.score.toFixed(2)}</span><span class="unit">${t.unit}</span>`;
    d.innerHTML = `<div class="label">${t.label}</div>${score} <span style="color:#789;margin-left:8px">${t.ms.toFixed(2)}ms/op</span>`;
    resultsDiv.appendChild(d);
  }
}

function renderStored(results){
  if (!results || results.length === 0) { storedDiv.innerHTML = '<div style="color:#789">No saved results yet.</div>'; return; }
  let html = '<table><tr><th>Device</th><th>Tri/s (M)</th><th>FBO/s</th><th>Math (M)</th><th>Mem (MB/s)</th><th>When</th></tr>';
  for (const r of results) {
    const t = r.tests || [];
    const triM = t[0]?.score?.toFixed(1) || "—";
    const fbo  = t[1]?.score?.toFixed(0) || "—";
    const mathM= t[2]?.score?.toFixed(0) || "—";
    const mem  = t[3]?.score?.toFixed(0) || "—";
    const when = new Date(r.timestamp).toLocaleString();
    const dev = (r.label || r.ua || "unknown").slice(0, 40);
    html += `<tr><td>${dev}</td><td>${triM}</td><td>${fbo}</td><td>${mathM}</td><td>${mem}</td><td>${when}</td></tr>`;
  }
  html += '</table>';
  storedDiv.innerHTML = html;
}

async function loadStored(){
  try {
    const r = await fetch("/benchmark/list", { cache: "no-store" });
    const j = await r.json();
    renderStored(j.results || []);
  } catch (e) { storedDiv.innerHTML = `<div style="color:#f88">load failed: ${e.message}</div>`; }
}

async function runAll(){
  document.getElementById("btnRun").disabled = true;
  resultsDiv.innerHTML = "";
  const canvas = document.getElementById("bgl");
  const gl = canvas.getContext("webgl2", { antialias: false, depth: false });
  if (!gl) { setStatus("WebGL2 not supported"); document.getElementById("btnRun").disabled = false; return; }
  const ren = detectRenderer(gl);
  rendererDiv.textContent = `${ren.vendor} · ${ren.renderer}`;
  const tests = [];
  const t1 = await testTriangleThroughput(gl);
  tests.push({ label: "WebGL2 triangle throughput", unit: "M triangles/sec", ...t1 });
  renderResults(tests);
  const t2 = await testFboPingPong(gl);
  tests.push({ label: "FBO ping-pong (256² float)", unit: "steps/sec", ...t2 });
  renderResults(tests);
  const t3 = await testCpuMath();
  tests.push({ label: "CPU Math.sin + Math.cos loop", unit: "M iter/sec", ...t3 });
  renderResults(tests);
  const t4 = await testMemoryAlloc();
  tests.push({ label: "Float32Array(5M) alloc + fill", unit: "MB/sec", ...t4 });
  renderResults(tests);
  setStatus("Saving…");
  try {
    const r = await fetch("/benchmark/store", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        clientId: clientId(),
        role: /Mobile|Android|iPhone|iPad/i.test(navigator.userAgent) ? "phone" : "pc",
        label: navigator.userAgent.match(/(iPhone|iPad|Android|Windows|Mac OS|Linux)[^)]*/)?.[0] || "unknown",
        ua: navigator.userAgent,
        renderer: ren,
        tests,
        timestamp: Date.now(),
      }),
    });
    const j = await r.json();
    setStatus(`Done — saved (${j.count} total)`);
    await loadStored();
  } catch (e) {
    setStatus("Saved locally only — bridge offline? " + e.message);
  }
  document.getElementById("btnRun").disabled = false;
}

document.getElementById("btnRun").addEventListener("click", runAll);
document.getElementById("btnRefresh").addEventListener("click", loadStored);
loadStored();


// ─── v822 — Universal viewer protocol ────────────────────
// Demos opt-in via meta tags + postMessage. Viewer at
// universal-viewer.html iframes this page + exchanges:
//   demo:params  (demo → viewer)   announce tunable schema
//   demo:set     (viewer → demo)   apply parameter change
//   demo:thumb   (demo → viewer)   snapshot of canvas
//   demo:request-thumb/params      pulled by viewer
(function demoProtocol() {
    const params = [
        // No tunable parameters exposed.
    ];
    function getCanvas() {
        return document.querySelector("canvas");
    }
    function announce() {
        try {
            window.parent?.postMessage({
                type: "demo:params",
                params: params.map(({ set, ...p }) => p),
            }, "*");
        } catch (e) {}
    }
    window.addEventListener("message", (e) => {
        const d = e.data;
        if (!d || typeof d !== "object") return;
        if (d.type === "demo:set") {
            const p = params.find(x => x.name === d.name);
            if (p && typeof d.value === "number") {
                try { p.set(d.value); } catch (err) {}
            }
        } else if (d.type === "demo:request-thumb") {
            try {
                const c = getCanvas();
                if (!c) return;
                window.parent?.postMessage({
                    type: "demo:thumb",
                    dataUrl: c.toDataURL("image/jpeg", 0.6),
                }, "*");
            } catch (err) {}
        } else if (d.type === "demo:request-params") {
            announce();
        }
    });
    setTimeout(announce, 200);
})();
</script>

<script type="module" src="/ui/demoChrome.js"></script>
</body>
</html>
