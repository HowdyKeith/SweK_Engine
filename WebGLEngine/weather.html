<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SweK Engine — THE WEATHER</title>
<style>
  :root { --bg:#070b12; --panel:#0e1420; --line:#223247; --ink:#dce8f8; --dim:#7d8aa0; --accent:#5fb0ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:radial-gradient(1200px 600px at 50% -10%, #14233b 0%, var(--bg) 60%); color:var(--ink);
         font:14px/1.5 -apple-system,Segoe UI,Roboto,system-ui,sans-serif; min-height:100vh; }
  header { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; padding:18px 22px 6px; }
  h1 { margin:0; font-size:22px; letter-spacing:3px; font-weight:800; text-transform:uppercase;
       background:linear-gradient(90deg,#9bd6ff,#5fb0ff); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .place { color:var(--dim); font-size:13px; }
  .now { padding:4px 22px 12px; color:var(--ink); display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .now .big { font-size:30px; font-weight:700; }
  .now .cond { color:var(--accent); font-weight:600; }
  .grid { display:flex; gap:12px; overflow-x:auto; padding:6px 22px 26px; scroll-snap-type:x mandatory; }
  .card { flex:0 0 150px; scroll-snap-align:start; background:var(--panel); border:1px solid var(--line);
          border-radius:14px; overflow:hidden; box-shadow:0 8px 28px rgba(0,0,0,.35); }
  .card .day { padding:8px 12px 4px; font-weight:700; letter-spacing:1px; }
  .card .date { padding:0 12px; color:var(--dim); font-size:11px; }
  canvas { display:block; width:100%; height:104px; }
  .card .label { padding:6px 12px 2px; font-size:12px; color:var(--accent); font-weight:600; min-height:20px; }
  .card .temps { padding:2px 12px 12px; font-size:13px; }
  .card .temps .hi { font-weight:700; }
  .card .temps .lo { color:var(--dim); margin-left:6px; }
  .bar { padding:2px 22px 22px; color:var(--dim); font-size:12px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  button { background:#1a2740; color:#cde; border:1px solid var(--line); border-radius:8px; padding:6px 14px; cursor:pointer; font-size:12px; }
  button:hover { border-color:var(--accent); }
  .err { color:#ff9b9b; padding:14px 22px; }
</style>
</head>
<body>
  <header>
    <h1>The Weather</h1>
    <span class="place" id="place">locating…</span>
  </header>
  <div class="search" style="display:flex;gap:6px;margin:6px 0 10px;">
    <input id="q" placeholder="Search a city or address…" style="flex:1;padding:7px 10px;background:#0c0f14;color:#e8eef8;border:1px solid #2a3340;border-radius:6px;font:13px ui-monospace,monospace;">
    <button id="go" style="padding:7px 14px;background:#2a3d4d;color:#cfe;border:1px solid #3a5d6d;border-radius:6px;cursor:pointer;">Go</button>
  </div>
  <div class="now" id="now"></div>
  <div class="grid" id="grid"></div>
  <div class="bar">
    <button id="refresh">↻ Refresh</button>
    <span id="status"></span>
  </div>

<script>
// WMO weather code -> { state (for visuals), label }.
function decode(code) {
  if (code == null) return { state: "clear", label: "—" };
  const m = {
    0:["clear","Clear"],1:["clear","Mainly clear"],2:["cloudy","Partly cloudy"],3:["cloudy","Overcast"],
    45:["fog","Fog"],48:["fog","Rime fog"],
    51:["rain","Light drizzle"],53:["rain","Drizzle"],55:["rain","Heavy drizzle"],56:["rain","Freezing drizzle"],57:["rain","Freezing drizzle"],
    61:["rain","Light rain"],63:["rain","Rain"],65:["rain","Heavy rain"],66:["rain","Freezing rain"],67:["rain","Freezing rain"],
    71:["snow","Light snow"],73:["snow","Snow"],75:["snow","Heavy snow"],77:["snow","Snow grains"],
    80:["rain","Rain showers"],81:["rain","Rain showers"],82:["rain","Violent showers"],
    85:["snow","Snow showers"],86:["snow","Snow showers"],
    95:["storm","Thunderstorm"],96:["storm","Storm + hail"],99:["storm","Storm + hail"],
  };
  return m[code] ? { state: m[code][0], label: m[code][1] } : { state: "clear", label: "Code " + code };
}

// ---- Animated weather scenes (no WebGL; layered 2D with depth) ----
const scenes = [];   // { ctx, w, h, state, seed }
function rnd(s){ s=Math.sin(s)*10000; return s-Math.floor(s); }

function sky(ctx, w, h, state) {
  const g = ctx.createLinearGradient(0,0,0,h);
  const P = {
    clear:  ["#2b6fd6","#9fd0ff"], cloudy: ["#41506a","#8294b0"],
    rain:   ["#2c3850","#566379"], storm:  ["#171f2e","#3a4458"],
    snow:   ["#5a6680","#aab6cc"], fog:    ["#586172","#9aa3b3"],
  }[state] || ["#2b6fd6","#9fd0ff"];
  g.addColorStop(0,P[0]); g.addColorStop(1,P[1]);
  ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
}
function sun(ctx,w,h,t){ const cx=w*0.74, cy=h*0.32, r=15;
  const g=ctx.createRadialGradient(cx,cy,2,cx,cy,r*2.4); g.addColorStop(0,"#fff4c2"); g.addColorStop(.5,"#ffd24a99"); g.addColorStop(1,"#ffd24a00");
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,r*2.4,0,7); ctx.fill();
  ctx.fillStyle="#ffe27a"; ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.fill(); }
function cloud(ctx,x,y,s,c){ ctx.fillStyle=c; for(const [dx,dy,r] of [[0,0,15],[14,4,12],[-14,4,12],[0,8,16],[26,8,9],[-26,8,9]]){ ctx.beginPath(); ctx.arc(x+dx*s,y+dy*s,r*s,0,7); ctx.fill(); } }
function clouds(ctx,w,h,t,n,c){ for(let i=0;i<n;i++){ const base=rnd(i+1)*w; const x=((base + t*(8+i*4)) % (w+80))-40; cloud(ctx,x,h*(0.22+0.12*i)+8,0.9-i*0.12,c); } }
function precip(ctx,w,h,t,state){ const n = state==="storm"?70:48; ctx.strokeStyle = state==="snow"?"":"#cfe6ff"; ctx.fillStyle="#ffffff";
  for(let i=0;i<n;i++){ const sx=rnd(i*3.1)*w; const speed= state==="snow"?22:90; const y=((rnd(i*1.7)*h + t*speed) % h);
    const x=(sx + (state==="snow"? Math.sin((t+i)*0.6)*8 : 0)) % w;
    if(state==="snow"){ ctx.beginPath(); ctx.arc(x,y,1.6,0,7); ctx.fill(); }
    else { ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-2,y+9); ctx.stroke(); } } }
function fog(ctx,w,h,t){ ctx.fillStyle="rgba(220,226,236,.22)"; for(let i=0;i<4;i++){ const y=h*(0.3+i*0.16); const x=((t*(6+i*3))% (w+60))-30; ctx.fillRect(x-40,y,90,10); } }
let _flash=0;
function drawScene(sc, t) {
  const { ctx, w, h, state } = sc;
  sky(ctx,w,h,state);
  if (state==="clear") { sun(ctx,w,h,t); clouds(ctx,w,h,t,1,"#ffffffcc"); }
  else if (state==="cloudy") { sun(ctx,w,h,t); clouds(ctx,w,h,t,3,"#e8eef8"); }
  else if (state==="rain") { clouds(ctx,w,h,t,3,"#c2ccdb"); precip(ctx,w,h,t,"rain"); }
  else if (state==="snow") { clouds(ctx,w,h,t,3,"#dfe6f2"); precip(ctx,w,h,t,"snow"); }
  else if (state==="fog")  { clouds(ctx,w,h,t,2,"#cfd6e2"); fog(ctx,w,h,t); }
  else if (state==="storm"){ clouds(ctx,w,h,t,3,"#9aa6ba"); precip(ctx,w,h,t,"storm");
     if (Math.random()<0.012) _flash=1; if(_flash>0){ ctx.fillStyle="rgba(255,255,210,"+(_flash*0.5)+")"; ctx.fillRect(0,0,w,h);
       ctx.strokeStyle="#fff7c0"; ctx.lineWidth=2; ctx.beginPath(); const bx=w*0.4; ctx.moveTo(bx,8); ctx.lineTo(bx-8,h*0.4); ctx.lineTo(bx+2,h*0.45); ctx.lineTo(bx-6,h*0.72); ctx.stroke(); _flash-=0.06; } }
}
function loop(ts){ const t = ts/1000; for (const sc of scenes) drawScene(sc, t); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

const DAY = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
async function load(coords) {
  const status = document.getElementById("status"); status.textContent = "fetching…";
  const qs = (coords && isFinite(coords.lat) && isFinite(coords.lon)) ? ("?lat=" + coords.lat + "&lon=" + coords.lon) : "";
  let j = null;
  try { j = await (await fetch("/weather/forecast" + qs)).json(); } catch (e) { j = { ok:false, error:e.message }; }
  if (!j || !j.ok) { document.getElementById("grid").innerHTML = '<div class="err">Couldn\'t load the forecast: ' + ((j&&j.error)||"?") + '<br>(The bridge needs internet to reach Open-Meteo.)</div>'; document.getElementById("place").textContent = (j&&j.place)||""; status.textContent=""; return; }
  document.getElementById("place").textContent = j.place + (j.detected ? " · auto-detected" : "");
  scenes.length = 0;
  const cur = j.current ? decode(j.current.code) : null;
  const c = j.current || {};
  const extras = [];
  if (c.cloud != null) extras.push("\u2601 " + c.cloud + "% cloud");
  if (c.pressure != null) { const p = c.pressure; const tag = p >= 1022 ? "high \u00b7 fair" : p <= 1009 ? "low \u00b7 unsettled" : "steady"; extras.push("\uD83D\uDCCA " + p + " hPa (" + tag + ")"); }
  if (c.windMph != null) extras.push("\uD83D\uDCA8 " + c.windMph + " mph");
  document.getElementById("now").innerHTML = cur
    ? '<span class="big">' + j.current.tempF + '\u00b0</span><span class="cond">' + cur.label + '</span>'
      + (extras.length ? '<span class="extras" style="display:block;margin-top:4px;color:#9fb3cc;font-size:12px;">' + extras.join("  \u00b7  ") + '</span>' : '')
    : "";
  const grid = document.getElementById("grid"); grid.innerHTML = "";
  j.days.forEach((d, i) => {
    const dec = decode(d.code);
    const dt = new Date(d.date + "T12:00:00");
    const card = document.createElement("div"); card.className = "card";
    card.innerHTML = '<div class="day">' + (i===0 ? "Today" : DAY[dt.getDay()]) + '</div>'
      + '<div class="date">' + (dt.getMonth()+1) + "/" + dt.getDate() + '</div>'
      + '<canvas width="150" height="104"></canvas>'
      + '<div class="label">' + dec.label + '</div>'
      + '<div class="temps"><span class="hi">' + d.tMax + '°</span><span class="lo">' + d.tMin + '°</span></div>';
    grid.appendChild(card);
    const cv = card.querySelector("canvas");
    scenes.push({ ctx: cv.getContext("2d"), w: cv.width, h: cv.height, state: dec.state });
  });
  status.textContent = "updated " + new Date().toLocaleTimeString();
}
document.getElementById("refresh").addEventListener("click", () => load());
async function geocode(q) { try { const j = await (await fetch("https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(q) + "&count=1&language=en&format=json")).json(); const r = j && j.results && j.results[0]; return r ? { lat: r.latitude, lon: r.longitude, name: [r.name, r.admin1, r.country_code].filter(Boolean).join(", ") } : null; } catch { return null; } }
async function doSearch() { const q = document.getElementById("q").value.trim(); if (!q) return; const status = document.getElementById("status"); status.textContent = "finding " + q + "\u2026"; const g = await geocode(q); if (!g) { status.textContent = "couldn't find \"" + q + "\""; return; } load({ lat: g.lat, lon: g.lon }); }
document.getElementById("go").addEventListener("click", doSearch);
document.getElementById("q").addEventListener("keydown", (e) => { if (e.key === "Enter") doSearch(); });
load();
</script>
<!-- v1759 page gauges + avatar dock (non-render pages) -->
<script type="module">try{const{mountPageGauges}=await import("/ui/pageGauges.js");mountPageGauges();}catch(e){}</script>
</body>
</html>
