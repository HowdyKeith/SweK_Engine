<!-- v4019 -- THE STUB EXISTS BECAUSE PHONES ALREADY HOLD THIS URL.
     Keith: "that control page is actually the Phone view page ... Let's rename that Control.html to Phone.html."
     Renaming a page is free for every reference inside the tree -- all 46 were updated in the same commit -- and
     NOT free for the ones outside it. ui/phoneConnectQR.js pairs a phone by handing it a URL, and a phone that
     paired before this rename has /control.html saved in a bookmark, a home-screen icon, or a QR someone printed.
     Deleting the name outright would break exactly the devices this page exists for, silently, with a 404 that
     says nothing about where it went.

     So the old name keeps answering and says where it went, which is this tree's own rule about a signpost that
     lies being worse than no signpost. Both a meta refresh AND a real link: the refresh handles the phone that
     just opens it, the link handles anything that ignores meta refresh, and the sentence handles the person who
     wants to know why their bookmark changed rather than being bounced without explanation.

     RETIRE THIS when the phones that matter have re-paired -- it is a bridge, not a page. -->
<style>
  html,body{margin:0;height:100%;background:#0a0e0c;color:#cfe9d8;
            font:14px/1.6 ui-monospace,Menlo,Consolas,monospace;display:grid;place-items:center;text-align:center}
  a{color:#7fd1ff}
  .box{max-width:34em;padding:20px}
  h1{font-size:16px;margin:0 0 10px}
  .dim{color:#6f8a7c;font-size:12px;margin-top:12px}
</style>
</head>
<body>
  <div class="box">
    <h1>This page is now <a href="/phone.html">phone.html</a></h1>
    <p>Control was always the phone view, so it is named that now. Taking you there&hellip;</p>
    <p><a href="/phone.html">Open the phone view &rarr;</a></p>
    <p class="dim">This address still works so already-paired phones keep going. Re-pair, or update your bookmark,
       and you can forget it existed.</p>
  </div>
</body>
