<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Engine Spectator</title>
<style>
  /* Round 182 — minimal viewer. The whole page is a black background
     with the JPEG frame stretched to fit, plus a small stats overlay
     and a "no signal" placeholder when no frame has arrived. */
  html, body {
    margin: 0; padding: 0; height: 100%; background: #000;
    font-family: monospace; color: #ccc; overflow: hidden;
  }
  #frame {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    object-fit: contain; image-rendering: auto;
    background: #000;
  }
  #status {
    position: absolute; top: 10px; left: 10px;
    background: rgba(0,0,0,0.65); border: 1px solid #444;
    padding: 6px 10px; font-size: 11px; color: #ccc;
    border-radius: 4px; pointer-events: none; user-select: none;
  }
  #status .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 6px; vertical-align: middle; background: #555;
  }
  #status.live .dot   { background: #8aff9e; box-shadow: 0 0 6px #8aff9e; }
  #status.stale .dot  { background: #ffd884; }
  #status.dead .dot   { background: #ff8a8a; }
  #placeholder {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; flex-direction: column; gap: 12px;
    color: #666; font-size: 13px; text-align: center;
    pointer-events: none;
  }
  #placeholder .big { font-size: 16px; color: #888; }
  #placeholder code { color: #8aff9e; background: #111; padding: 2px 6px;
                       border-radius: 3px; font-size: 12px; }
</style>
</head>
<body>
  <img id="frame" alt="" />
  <div id="placeholder">
    <div class="big">📺 waiting for cast…</div>
    <div>open the engine in another tab and run <code>spectatorCast.start()</code></div>
    <div>or click the 📡 Cast button in the engine UI</div>
  </div>
  <div id="status"><span class="dot"></span><span class="text">connecting…</span></div>

<script>
// =============================================================================
// Spectator viewer — receives binary JPEG frames over the bridge's WebSocket
// and renders them in the <img> element. Tracks fps / bytes / staleness.
// =============================================================================

const frameEl       = document.getElementById("frame");
const placeholderEl = document.getElementById("placeholder");
const statusEl      = document.getElementById("status");
const statusText    = statusEl.querySelector(".text");

let lastObjectUrl = null;
let frameCount    = 0;
let bytesTotal    = 0;
let lastFrameAt   = 0;
let viewerCount   = 0;        // Round 184 — populated from bridge broadcast
let lastBytesShown = 0;       // Round 184 — last rendered frame size for refresh on viewer-count change
let recentFrameTimes = [];   // for rolling fps calc

function currentFps() {
    if (recentFrameTimes.length < 2) return "—";
    const span = (recentFrameTimes[recentFrameTimes.length - 1] - recentFrameTimes[0]) / 1000;
    return span > 0 ? (recentFrameTimes.length / span).toFixed(1) : "—";
}

function setStatus(state, text) {
    statusEl.className = state;   // live | stale | dead | "" (connecting)
    statusText.textContent = text;
}

function statusText_withViewers(base) {
    // Round 184 — append ", N viewers" if known. The count includes
    // THIS viewer, so show "you + N-1 others" when count > 1.
    if (viewerCount === 0) return base;
    if (viewerCount === 1) return base + " · just you";
    return base + ` · you + ${viewerCount - 1} other${viewerCount === 2 ? "" : "s"}`;
}

function renderFrame(blob) {
    const url = URL.createObjectURL(blob);
    frameEl.src = url;
    // Defer revoke so the <img> has a chance to start loading the new URL
    // before we tear down the previous one.
    const prev = lastObjectUrl;
    lastObjectUrl = url;
    if (prev) setTimeout(() => { try { URL.revokeObjectURL(prev); } catch {} }, 100);
    if (placeholderEl.style.display !== "none") {
        placeholderEl.style.display = "none";
    }
}

function connect() {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    const url   = `${proto}//${location.host}`;
    setStatus("", `connecting to ${url}…`);
    const ws = new WebSocket(url);
    ws.binaryType = "blob";

    ws.onopen = () => {
        setStatus("stale", "connected — waiting for first frame");
        // Round 184 — announce as a spectator viewer so the bridge can
        // count us separately from regular multiplayer participants.
        try { ws.send(JSON.stringify({ type: "spectator:viewer-hello" })); } catch {}
        // Try a one-shot HTTP fetch for the latest cached frame so we
        // don't sit empty if the host has been casting for a while.
        fetch("/spectator/latest.jpg", { cache: "no-store" })
            .then(r => r.ok ? r.blob() : null)
            .then(b => { if (b) { renderFrame(b); lastFrameAt = Date.now(); } })
            .catch(() => {});
    };

    ws.onmessage = (ev) => {
        // Round 184 — JSON messages from the bridge (viewer count
        // updates, viewer-ack). Parse and apply, then return — only
        // binary messages are spectator frames.
        if (typeof ev.data === "string") {
            try {
                const m = JSON.parse(ev.data);
                if (m?.type === "spectator:viewers" && typeof m.count === "number") {
                    viewerCount = m.count;
                    // Re-render the current status text with the updated tail
                    if (lastFrameAt && (Date.now() - lastFrameAt) < 4000) {
                        const fps = currentFps();
                        const kb  = (lastBytesShown / 1024).toFixed(1);
                        const totalKB = (bytesTotal / 1024).toFixed(0);
                        setStatus("live", statusText_withViewers(`📡 live · ${fps}fps · ${kb}KB · ${frameCount}f (${totalKB}KB total)`));
                    }
                } else if (m?.type === "spectator:viewer-ack") {
                    viewerCount = m.count || 1;
                }
            } catch {}
            return;
        }
        const blob = ev.data;   // already a Blob since binaryType="blob"
        if (!blob || blob.size === 0) return;
        frameCount++;
        bytesTotal += blob.size;
        lastBytesShown = blob.size;
        const now = Date.now();
        recentFrameTimes.push(now);
        while (recentFrameTimes.length > 0 && now - recentFrameTimes[0] > 3000) {
            recentFrameTimes.shift();
        }
        const fps = currentFps();
        const kb = (blob.size / 1024).toFixed(1);
        const totalKB = (bytesTotal / 1024).toFixed(0);
        setStatus("live", statusText_withViewers(`📡 live · ${fps}fps · ${kb}KB · ${frameCount}f (${totalKB}KB total)`));
        lastFrameAt = now;
        renderFrame(blob);
    };

    ws.onclose = () => {
        setStatus("dead", "bridge disconnected — retrying in 3s");
        setTimeout(connect, 3000);
    };

    ws.onerror = () => {
        // onclose will fire next; let it handle status + retry
    };
}

// Watchdog: if we go > 4s without a frame and the WS is still open,
// the host probably stopped casting. Show a "stale" indicator.
setInterval(() => {
    if (!lastFrameAt) return;
    const age = Date.now() - lastFrameAt;
    if (age > 4000 && statusEl.className === "live") {
        const sec = (age / 1000).toFixed(0);
        setStatus("stale", `last frame ${sec}s ago — host paused casting?`);
    }
}, 1000);

connect();
</script>
<!-- v1759 page gauges + avatar dock (non-render pages) -->
<script type="module">try{const{mountPageGauges}=await import("/ui/pageGauges.js");mountPageGauges();}catch(e){}</script>
</body>
</html>
