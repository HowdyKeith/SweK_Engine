<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Star &amp; Gas Field</title>
<!-- universal viewer discovery meta -->
<meta name="demo:title"  content="Star &amp; Gas Field">
<meta name="demo:desc"   content="Navigate a 3D star catalog + gas-density cloud loaded from Google Sheets. Click a star to read its light properties.">
<meta name="demo:cats"   content="sim,data,space">
<meta name="demo:swatch" content="🌌">
<style>
  html,body{margin:0;padding:0;height:100%;width:100%;background:#03030a;color:#bcd;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",monospace;overflow:hidden}
  #wrap{display:flex;flex-direction:column;height:100%}
  #topbar{display:flex;gap:8px;padding:9px 12px;background:rgba(12,16,30,0.9);border-bottom:1px solid rgba(120,160,220,0.25);align-items:center;flex-wrap:wrap}
  #topbar h1{margin:0;font-size:14px;font-weight:600;color:#cdf;flex:1;min-width:140px}
  #topbar input{background:rgba(8,12,22,0.9);color:#cde;border:1px solid rgba(120,160,220,0.3);border-radius:5px;padding:5px 8px;font-size:11px;min-width:150px;flex:1}
  #topbar button{padding:6px 11px;border-radius:6px;border:1px solid rgba(120,160,220,0.4);background:rgba(10,16,30,0.85);color:#cdf;font-size:12px;cursor:pointer}
  #host{flex:1;position:relative;overflow:hidden}
  #sim{display:block;width:100%;height:100%;background:#03030a;touch-action:none}
  #hud{position:absolute;left:10px;top:10px;font-size:11px;color:#8ab;line-height:1.5;background:rgba(6,10,20,0.55);padding:8px 10px;border-radius:6px;pointer-events:none;max-width:46%}
  #props{position:absolute;right:10px;top:10px;font-size:11px;color:#cde;background:rgba(8,14,26,0.92);border:1px solid rgba(120,160,220,0.3);padding:10px 12px;border-radius:7px;min-width:170px;display:none}
  #props .sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle;margin-right:5px;border:1px solid #0006}
  #props b{color:#cef}
  #ctrls{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap}
  #ctrls button{padding:5px 9px;border-radius:5px;border:1px solid rgba(120,160,220,0.3);background:rgba(10,16,30,0.8);color:#bcd;font-size:11px;cursor:pointer}
  #ctrls button.on{background:rgba(80,140,200,0.5);color:#dff;border-color:rgba(140,200,255,0.6)}
  #msg{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-size:11px;color:#9ab}
</style>
</head>
<body>
<div id="wrap">
  <div id="topbar">
    <h1>🌌 Star &amp; Gas Field</h1>
    <input id="sheetId" type="text" placeholder="Google Sheet ID (tabs: Stars / GasDensity)" autocomplete="off">
    <button id="btnLoad">⬇ Load</button>
    <button id="btnSample">✨ Sample</button>
    <button id="btnBack">← Back</button>
  </div>
  <div id="host">
    <canvas id="sim"></canvas>
    <div id="hud"></div>
    <div id="props"></div>
    <div id="ctrls">
      <button id="tStars" class="on">★ Stars</button>
      <button id="tGas" class="on">☁ Gas</button>
      <button id="tPalette">🎨 Plasma</button>
      <button id="tBright">☀ Bright</button>
    </div>
    <div id="msg"></div>
  </div>
</div>
<script>
"use strict";
document.getElementById("btnBack").addEventListener("click", () => location.href = "/phone.html");
const canvas = document.getElementById("sim");
const gl = canvas.getContext("webgl2", { antialias: true, alpha: false });
const msg = (t) => { document.getElementById("msg").textContent = t || ""; };
if (!gl) { msg("WebGL2 not available in this browser."); }

// ─── tiny column-major mat4 ────────────────────────────────
function mPersp(fovy, asp, n, f){ const t=1/Math.tan(fovy/2); return [t/asp,0,0,0, 0,t,0,0, 0,0,(f+n)/(n-f),-1, 0,0,(2*f*n)/(n-f),0]; }
function mLook(e, c, up){ let zx=e[0]-c[0],zy=e[1]-c[1],zz=e[2]-c[2]; let zl=Math.hypot(zx,zy,zz)||1; zx/=zl;zy/=zl;zz/=zl;
  let xx=up[1]*zz-up[2]*zy, xy=up[2]*zx-up[0]*zz, xz=up[0]*zy-up[1]*zx; let xl=Math.hypot(xx,xy,xz)||1; xx/=xl;xy/=xl;xz/=xl;
  let yx=zy*xz-zz*xy, yy=zz*xx-zx*xz, yz=zx*xy-zy*xx;
  return [xx,yx,zx,0, xy,yy,zy,0, xz,yz,zz,0, -(xx*e[0]+xy*e[1]+xz*e[2]), -(yx*e[0]+yy*e[1]+yz*e[2]), -(zx*e[0]+zy*e[1]+zz*e[2]), 1]; }
function mMul(a,b){ const o=new Array(16); for(let c=0;c<4;c++)for(let r=0;r<4;r++){ let s=0; for(let k=0;k<4;k++) s+=a[k*4+r]*b[c*4+k]; o[c*4+r]=s; } return o; }
function mulV(m,v){ const o=[0,0,0,0]; for(let r=0;r<4;r++) o[r]=m[r]*v[0]+m[4+r]*v[1]+m[8+r]*v[2]+m[12+r]*v[3]; return o; }

// ─── color science (ported from StellarColorMap) ──────────
function tempFromBV(bv){ bv = Math.max(-0.4, Math.min(2.0, bv)); return 4600*(1/(0.92*bv+1.7) + 1/(0.92*bv+0.62)); }
function tempToRGB(t){ // blackbody approx (Tanner Helland), t in Kelvin
  t = Math.max(1000, Math.min(40000, t)) / 100; let r,g,b;
  if (t<=66){ r=255; g=99.47*Math.log(t)-161.12; } else { r=329.7*Math.pow(t-60,-0.1332); g=288.12*Math.pow(t-60,-0.0755); }
  if (t<=66) b = t<=19 ? 0 : 138.52*Math.log(t-10)-305.04; else b=255;
  const cl=(x)=>Math.max(0,Math.min(255,x))/255; return [cl(r),cl(g),cl(b)];
}
function bvToRGB(bv){ return tempToRGB(tempFromBV(bv)); }
const SPECTRAL_BV = { O:-0.33, B:-0.17, A:0.0, F:0.45, G:0.7, K:1.0, M:1.6 };
function spectralToRGB(s){ const c=String(s||"").trim().toUpperCase()[0]; return bvToRGB(SPECTRAL_BV[c] != null ? SPECTRAL_BV[c] : 0.65); }
const PALETTES = ["Plasma","Inferno","Viridis","Oxygen"];
function paletteRGB(name, d){ d=Math.max(0,Math.min(1,d));
  const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
  const ramp=(stops)=>{ const n=stops.length-1, x=d*n, i=Math.min(n-1,Math.floor(x)); return lerp(stops[i],stops[i+1],x-i); };
  if(name==="Inferno") return ramp([[0,0,0.01],[0.3,0.05,0.4],[0.7,0.18,0.3],[0.95,0.5,0.1],[1,0.95,0.6]]);
  if(name==="Viridis") return ramp([[0.27,0,0.33],[0.2,0.4,0.55],[0.13,0.66,0.51],[0.5,0.8,0.25],[0.99,0.9,0.14]]);
  if(name==="Oxygen")  return ramp([[0.0,0.02,0.08],[0.0,0.25,0.5],[0.1,0.6,0.7],[0.5,0.95,0.85],[0.95,1,1]]);
  return ramp([[0.05,0.03,0.53],[0.4,0.0,0.66],[0.78,0.16,0.5],[0.98,0.55,0.25],[0.94,0.97,0.13]]); // Plasma
}

// ─── GL programs ───────────────────────────────────────────
function sh(type, src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){ console.error(gl.getShaderInfoLog(s),src); } return s; }
function prog(vs,fs){ const p=gl.createProgram(); gl.attachShader(p,sh(gl.VERTEX_SHADER,vs)); gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs)); gl.linkProgram(p); return p; }

const starVS = `#version 300 es
layout(location=0) in vec3 aPos; layout(location=1) in float aSize; layout(location=2) in vec3 aColor;
uniform mat4 uVP; uniform float uBright; uniform float uSizeMul; out vec3 vColor;
void main(){ vec4 cs = uVP * vec4(aPos,1.0); gl_Position = cs;
  float d = max(0.5, cs.w); gl_PointSize = clamp(aSize*uSizeMul*200.0/d, 1.0, 64.0); vColor = aColor*uBright; }`;
const starFS = `#version 300 es
precision highp float; in vec3 vColor; out vec4 o;
void main(){ vec2 p = gl_PointCoord*2.0-1.0; float r=dot(p,p); if(r>1.0) discard;
  float core=exp(-r*3.0); float halo=exp(-r*1.2)*0.5; o=vec4(vColor*(core+halo), core+halo); }`;
const gasVS = `#version 300 es
layout(location=0) in vec3 aPos; layout(location=1) in float aDens; layout(location=2) in vec3 aColor;
uniform mat4 uVP; uniform float uSizeMul; out vec3 vColor; out float vDens;
void main(){ vec4 cs=uVP*vec4(aPos,1.0); gl_Position=cs; float d=max(0.5,cs.w);
  gl_PointSize=clamp(uSizeMul*900.0/d, 2.0, 64.0); vColor=aColor; vDens=aDens; }`;
const gasFS = `#version 300 es
precision highp float; in vec3 vColor; in float vDens; out vec4 o;
void main(){ vec2 p=gl_PointCoord*2.0-1.0; float r=dot(p,p); float g=exp(-r*2.5);
  o=vec4(vColor*g*vDens*1.4, g*vDens); }`;

const starP = prog(starVS, starFS), gasP = prog(gasVS, gasFS);
const U = (p,n)=>gl.getUniformLocation(p,n);
const uStarVP=U(starP,"uVP"), uStarBright=U(starP,"uBright"), uStarSize=U(starP,"uSizeMul");
const uGasVP=U(gasP,"uVP"), uGasSize=U(gasP,"uSizeMul");

function makeVAO(){ const vao=gl.createVertexArray(); const buf={pos:gl.createBuffer(),a:gl.createBuffer(),col:gl.createBuffer()}; return {vao,buf,n:0}; }
function fillVAO(o, pos, scal, col){
  gl.bindVertexArray(o.vao);
  gl.bindBuffer(gl.ARRAY_BUFFER,o.buf.pos); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(pos),gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,o.buf.a); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(scal),gl.STATIC_DRAW);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1,1,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,o.buf.col); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(col),gl.STATIC_DRAW);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2,3,gl.FLOAT,false,0,0);
  gl.bindVertexArray(null); o.n = pos.length/3;
}
const starVAO = makeVAO(), gasVAO = makeVAO();

// ─── scene state ───────────────────────────────────────────
let stars = [];   // {name,x,y,z,mag,bv,spect,rgb}
let center=[0,0,0], radius=10;
let cam = { yaw:0.5, pitch:0.3, dist:30, tgt:[0,0,0] };
let show = { stars:true, gas:true }, palIdx=0, bright=1.4, sizeMul=1.0;

function recenter(pts){ if(!pts.length){ center=[0,0,0]; radius=10; return; }
  let mn=[1e9,1e9,1e9], mx=[-1e9,-1e9,-1e9]; for(const p of pts){ for(let k=0;k<3;k++){ mn[k]=Math.min(mn[k],p[k]); mx[k]=Math.max(mx[k],p[k]); } }
  center=[(mn[0]+mx[0])/2,(mn[1]+mx[1])/2,(mn[2]+mx[2])/2];
  radius=Math.max(1, 0.5*Math.hypot(mx[0]-mn[0],mx[1]-mn[1],mx[2]-mn[2]));
  cam.tgt=center.slice(); cam.dist=radius*2.2; }

function buildStars(rows){ stars = rows; const pos=[],scal=[],col=[];
  for(const s of stars){ pos.push(s.x,s.y,s.z); scal.push(Math.max(0.15, 1.6 - s.mag*0.18)); const c=s.rgb; col.push(c[0],c[1],c[2]); }
  fillVAO(starVAO,pos,scal,col); }
function buildGas(rows){ const pos=[],scal=[],col=[];
  for(const r of rows){ pos.push(r.x,r.y,r.z); scal.push(r.d); const c=r.rgb||paletteRGB(PALETTES[palIdx],r.d); col.push(c[0],c[1],c[2]); }
  fillVAO(gasVAO,pos,scal,col); }
let gasRows=[];
function rebuildGasColor(){ const col=[]; for(const r of gasRows){ const c=r.rgb||paletteRGB(PALETTES[palIdx],r.d); col.push(c[0],c[1],c[2]); }
  gl.bindVertexArray(gasVAO.vao); gl.bindBuffer(gl.ARRAY_BUFFER,gasVAO.buf.col); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(col),gl.STATIC_DRAW); gl.bindVertexArray(null); }

// ─── sample data (works with no sheet) ─────────────────────
function sampleData(){
  const sRows=[], gRows=[]; const SP=["O","B","A","F","G","K","M"];
  for(let i=0;i<1400;i++){ const arm=i%2, t=Math.random()*6.5; const a=t+arm*Math.PI + (Math.random()-0.5)*0.5;
    const rr=t*1.6+Math.random()*1.2; const x=Math.cos(a)*rr, z=Math.sin(a)*rr, y=(Math.random()-0.5)*Math.max(0.6,3-rr*0.25);
    const sp=SP[(Math.random()*SP.length)|0]; const bv=(SPECTRAL_BV[sp]||0.6)+(Math.random()-0.5)*0.2;
    sRows.push({ name:sp+"-"+i, x,y,z, mag:Math.random()*6, bv, spect:sp+((Math.random()*9)|0), rgb:bvToRGB(bv) }); }
  for(let i=0;i<900;i++){ const a=Math.random()*Math.PI*2, rr=Math.pow(Math.random(),0.6)*9;
    const x=Math.cos(a)*rr+(Math.random()-0.5)*2, z=Math.sin(a)*rr+(Math.random()-0.5)*2, y=(Math.random()-0.5)*2.4;
    const d=Math.max(0.05, 1-rr/10 + (Math.random()-0.5)*0.3); gRows.push({ x,y,z, d:Math.min(1,d) }); }
  load(sRows, gRows, "sample field (1400 stars · 900 gas points)");
}
function load(sRows, gRows, label){
  gasRows = gRows; recenter([...sRows.map(s=>[s.x,s.y,s.z]), ...gRows.map(g=>[g.x,g.y,g.z])]);
  buildStars(sRows); buildGas(gRows); msg(label||""); }

// ─── Google Sheets loading ─────────────────────────────────
async function readSheet(id, range){ const r=await fetch(`/sheets/read?id=${encodeURIComponent(id)}&range=${encodeURIComponent(range)}`); return await r.json(); }
async function loadFromSheets(id){
  if(!id){ msg("Enter a Google Sheet ID first."); return; }
  msg("loading from Google Sheets…");
  try{
    const sj = await readSheet(id, "Stars!A2:G20000");
    const rows = (sj && sj.values) || [];
    const sRows = rows.filter(r=>r && r.length>=4).map((r,i)=>{ const bv=parseFloat(r[5]); const bvv=Number.isFinite(bv)?bv:0.65;
      return { name:r[0]||("star"+i), x:+r[1]||0, y:+r[2]||0, z:+r[3]||0, mag:Number.isFinite(+r[4])?+r[4]:3, bv:bvv, spect:r[6]||"", rgb: r[6]?spectralToRGB(r[6]):bvToRGB(bvv) }; });
    let gRows=[];
    try{ const gj=await readSheet(id,"GasDensity!A2:G20000"); const gr=(gj&&gj.values)||[];
      gRows = gr.filter(r=>r&&r.length>=4).map(r=>{ const hasC=r.length>=7&&r[4]!=="";
        return { x:+r[0]||0,y:+r[1]||0,z:+r[2]||0,d:Math.max(0,Math.min(1,+r[3]||0)), rgb: hasC?[+r[4]||0,+r[5]||0,+r[6]||0]:null }; }); }catch(e){}
    if(!sRows.length && !gRows.length){ msg("No rows found (check tab names: Stars / GasDensity, and that creds are configured)."); return; }
    try{ localStorage.setItem("voxelengine.starGasSheetId", id); }catch{}
    load(sRows, gRows, `loaded ${sRows.length} stars · ${gRows.length} gas points`);
  }catch(e){ msg("Sheets load failed — is the bridge running + creds configured? "+(e.message||e)); }
}

// ─── camera + render ───────────────────────────────────────
function resize(){ const dpr=Math.min(2,window.devicePixelRatio||1); const w=canvas.clientWidth*dpr, h=canvas.clientHeight*dpr;
  if(canvas.width!==w||canvas.height!==h){ canvas.width=w; canvas.height=h; } }
function camEye(){ const cp=Math.cos(cam.pitch), sp=Math.sin(cam.pitch), cy=Math.cos(cam.yaw), sy=Math.sin(cam.yaw);
  return [cam.tgt[0]+cam.dist*cp*sy, cam.tgt[1]+cam.dist*sp, cam.tgt[2]+cam.dist*cp*cy]; }
function viewProj(){ resize(); const asp=canvas.width/Math.max(1,canvas.height);
  const P=mPersp(60*Math.PI/180, asp, Math.max(0.01,radius*0.002), radius*30);
  return mMul(P, mLook(camEye(), cam.tgt, [0,1,0])); }

let curVP=null;
function frame(){
  resize(); gl.viewport(0,0,canvas.width,canvas.height);
  gl.clearColor(0.012,0.012,0.04,1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE); gl.disable(gl.DEPTH_TEST);
  curVP = viewProj();
  if(show.gas && gasVAO.n){ gl.useProgram(gasP); gl.uniformMatrix4fv(uGasVP,false,curVP); gl.uniform1f(uGasSize,sizeMul);
    gl.bindVertexArray(gasVAO.vao); gl.drawArrays(gl.POINTS,0,gasVAO.n); }
  if(show.stars && starVAO.n){ gl.useProgram(starP); gl.uniformMatrix4fv(uStarVP,false,curVP); gl.uniform1f(uStarBright,bright); gl.uniform1f(uStarSize,sizeMul);
    gl.bindVertexArray(starVAO.vao); gl.drawArrays(gl.POINTS,0,starVAO.n); }
  gl.bindVertexArray(null);
  requestAnimationFrame(frame);
}

// ─── interaction ───────────────────────────────────────────
let drag=null;
canvas.addEventListener("pointerdown", e=>{ drag={x:e.clientX,y:e.clientY,moved:0}; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("pointermove", e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.moved+=Math.abs(dx)+Math.abs(dy);
  cam.yaw-=dx*0.005; cam.pitch=Math.max(-1.4,Math.min(1.4,cam.pitch+dy*0.005)); drag.x=e.clientX; drag.y=e.clientY; });
canvas.addEventListener("pointerup", e=>{ if(drag && drag.moved<6) pick(e); drag=null; });
canvas.addEventListener("wheel", e=>{ e.preventDefault(); cam.dist=Math.max(radius*0.05,Math.min(radius*25,cam.dist*(1+Math.sign(e.deltaY)*0.12))); }, {passive:false});
window.addEventListener("keydown", e=>{ const k=e.key.toLowerCase(); const step=radius*0.06;
  const eye=camEye(); let fx=cam.tgt[0]-eye[0],fy=cam.tgt[1]-eye[1],fz=cam.tgt[2]-eye[2]; const fl=Math.hypot(fx,fy,fz)||1; fx/=fl;fz/=fl;
  const rx=fz, rz=-fx;
  if(k==="w"){ cam.tgt[0]+=fx*step; cam.tgt[2]+=fz*step; } if(k==="s"){ cam.tgt[0]-=fx*step; cam.tgt[2]-=fz*step; }
  if(k==="a"){ cam.tgt[0]-=rx*step; cam.tgt[2]-=rz*step; } if(k==="d"){ cam.tgt[0]+=rx*step; cam.tgt[2]+=rz*step; }
  if(k==="p") cyclePalette(); if(k==="g") toggle("gas"); if(k==="r"){ cam.tgt=center.slice(); cam.dist=radius*2.2; } });

function pick(e){ if(!stars.length||!curVP) return; const r=canvas.getBoundingClientRect();
  const mx=(e.clientX-r.left)/r.width*2-1, my=-((e.clientY-r.top)/r.height*2-1);
  let best=-1, bd=0.04; for(let i=0;i<stars.length;i++){ const s=stars[i]; const c=mulV(curVP,[s.x,s.y,s.z,1]); if(c[3]<=0) continue;
    const sx=c[0]/c[3], sy=c[1]/c[3]; const d=(sx-mx)*(sx-mx)+(sy-my)*(sy-my); if(d<bd){ bd=d; best=i; } }
  if(best<0){ document.getElementById("props").style.display="none"; return; }
  const s=stars[best]; const T=Math.round(tempFromBV(s.bv)); const c=s.rgb.map(v=>Math.round(v*255));
  const el=document.getElementById("props"); el.style.display="block";
  el.innerHTML = `<div><b>${s.name}</b></div>`+
    `<div><span class="sw" style="background:rgb(${c[0]},${c[1]},${c[2]})"></span>spectral: <b>${s.spect||"—"}</b></div>`+
    `<div>apparent mag: <b>${s.mag.toFixed(2)}</b></div>`+
    `<div>B–V index: <b>${s.bv.toFixed(2)}</b></div>`+
    `<div>est. temp: <b>${T.toLocaleString()} K</b></div>`+
    `<div>pos: ${s.x.toFixed(1)}, ${s.y.toFixed(1)}, ${s.z.toFixed(1)}</div>`;
}

// ─── control buttons ───────────────────────────────────────
function toggle(which){ show[which]=!show[which]; document.getElementById(which==="gas"?"tGas":"tStars").classList.toggle("on",show[which]); }
function cyclePalette(){ palIdx=(palIdx+1)%PALETTES.length; document.getElementById("tPalette").textContent="🎨 "+PALETTES[palIdx]; rebuildGasColor(); }
document.getElementById("tStars").addEventListener("click",()=>toggle("stars"));
document.getElementById("tGas").addEventListener("click",()=>toggle("gas"));
document.getElementById("tPalette").addEventListener("click",cyclePalette);
document.getElementById("tBright").addEventListener("click",()=>{ bright = bright>2 ? 0.8 : bright+0.4; });
document.getElementById("btnSample").addEventListener("click",sampleData);
document.getElementById("btnLoad").addEventListener("click",()=>loadFromSheets(document.getElementById("sheetId").value.trim()));

// ─── boot ──────────────────────────────────────────────────
document.getElementById("hud").innerHTML = "drag: orbit · wheel: zoom · WASD: pan · R: recenter<br>click a star to inspect · sheets tabs: <b>Stars</b> (A:name B-D:xyz E:mag F:B-V G:class) + <b>GasDensity</b> (A-C:xyz D:density E-G:rgb)";
try{ const sid=localStorage.getItem("voxelengine.starGasSheetId"); if(sid) document.getElementById("sheetId").value=sid; }catch{}
sampleData();
if(gl) requestAnimationFrame(frame);
</script>
</body>
</html>
