<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="demo:title" content="Sprite to 3D">
<meta name="demo:desc" content="Turns a 2D sprite into an extruded 3D mesh -- trace the silhouette from the centroid, fan-triangulate, extrude for depth -- then spins it so you see real parallax. The missing link for offline-scanning sprites into 3D: true blueprints + a 3D-parallax comic-character filter, from art we already have.">
<meta name="demo:category" content="fx">
<title>Sprite to 3D</title>
<style>
  :root { --amber:#f6a623; --cyan:#59d1ff; }
  html,body { margin:0; height:100%; background:#04060d; overflow:hidden; color:#dbe7ff; font:13px ui-monospace,Menlo,monospace; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #cap { position:fixed; left:14px; top:12px; color:var(--amber); letter-spacing:.15em; text-transform:uppercase; z-index:3; }
  #st { position:fixed; right:14px; top:12px; color:#7c93b8; font-size:11px; z-index:3; }
  #bar { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:3; display:flex; gap:10px; }
  button { background:rgba(8,14,26,.7); color:var(--cyan); border:1px solid #1c2942; border-radius:8px; padding:9px 18px; font:600 12px ui-monospace,monospace; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; }
  button:hover { border-color:var(--cyan); }
  #hint { position:fixed; left:50%; bottom:64px; transform:translateX(-50%); color:#7c93b8; font-size:11px; z-index:3; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cap">&#9670; Sprite &rarr; 3D</div>
<div id="st"></div>
<div id="hint">drag to rotate &middot; the ship is now a mesh</div>
<div id="bar"><button id="next">Next sprite</button><button id="spin">Toggle spin</button></div>
<script type="module">
import { spriteToMesh } from "./fx/spritemesh/spriteMesh.js";

const cv = document.getElementById("c"), ctx = cv.getContext("2d"), st = document.getElementById("st");
let W = 0, H = 0;
function resize() { W = innerWidth; H = innerHeight; cv.width = W; cv.height = H; }
addEventListener("resize", resize); resize();

function makeShip(kind) {
  const S = 96, sc = document.createElement("canvas"); sc.width = S; sc.height = S; const g = sc.getContext("2d"); g.translate(S / 2, S / 2); g.fillStyle = "#8fa8c8";
  if (kind === 0) { g.beginPath(); g.moveTo(0, -40); g.lineTo(12, 16); g.lineTo(30, 30); g.lineTo(8, 26); g.lineTo(0, 36); g.lineTo(-8, 26); g.lineTo(-30, 30); g.lineTo(-12, 16); g.closePath(); g.fill(); }
  else if (kind === 1) { g.fillRect(-16, -34, 32, 68); g.beginPath(); g.moveTo(-16, -34); g.lineTo(0, -44); g.lineTo(16, -34); g.closePath(); g.fill(); }
  else { g.beginPath(); g.moveTo(0, -42); g.lineTo(6, 0); g.lineTo(34, 22); g.lineTo(4, 16); g.lineTo(0, 34); g.lineTo(-4, 16); g.lineTo(-34, 22); g.lineTo(-6, 0); g.closePath(); g.fill(); }
  return sc;
}

let kind = 0, mesh = spriteToMesh(makeShip(0), { segments: 56, depth: 0.4 }), spin = true, ry = 0.5, rx = -0.25;
document.getElementById("next").addEventListener("click", () => { kind = (kind + 1) % 3; mesh = spriteToMesh(makeShip(kind), { segments: 56, depth: 0.4 }); });
document.getElementById("spin").addEventListener("click", () => { spin = !spin; });
let drag = false, lx = 0, ly = 0;
cv.addEventListener("pointerdown", e => { drag = true; lx = e.clientX; ly = e.clientY; spin = false; });
addEventListener("pointerup", () => drag = false);
addEventListener("pointermove", e => { if (!drag) return; ry += (e.clientX - lx) * 0.01; rx += (e.clientY - ly) * 0.01; lx = e.clientX; ly = e.clientY; });

function frame() {
  if (spin) ry += 0.012;
  ctx.fillStyle = "#04060d"; ctx.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2, sc = Math.min(W, H) * 0.32, cyaw = Math.cos(ry), syaw = Math.sin(ry), cpit = Math.cos(rx), spit = Math.sin(rx);
  const light = [0.4, -0.5, 0.75], ll = Math.hypot(...light); for (let i = 0; i < 3; i++) light[i] /= ll;
  // rotate + project
  const P = mesh.positions.map(([x, y, z]) => { let X = x * cyaw + z * syaw, Z = -x * syaw + z * cyaw, Y = y * cpit - Z * spit, Z2 = y * spit + Z * cpit; const persp = 2.6 / (2.6 - Z2); return { sx: cx + X * sc * persp, sy: cy + Y * sc * persp, z: Z2 }; });
  // shade + painter-sort triangles
  const tris = mesh.cells.map(c => { const a = mesh.positions[c[0]], b = mesh.positions[c[1]], d = mesh.positions[c[2]];
    const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2], vx = d[0] - a[0], vy = d[1] - a[1], vz = d[2] - a[2];
    let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx; const nl = Math.hypot(nx, ny, nz) || 1; nx /= nl; ny /= nl; nz /= nl;
    // rotate normal to view for lighting
    let NX = nx * cyaw + nz * syaw, NZ = -nx * syaw + nz * cyaw, NY = ny * cpit - NZ * spit;
    const lit = Math.max(0.12, NX * light[0] + NY * light[1] + Math.abs(NZ) * light[2]);
    const zc = (P[c[0]].z + P[c[1]].z + P[c[2]].z) / 3; return { c, lit, z: zc }; });
  tris.sort((a, b) => a.z - b.z);
  for (const t of tris) { const p0 = P[t.c[0]], p1 = P[t.c[1]], p2 = P[t.c[2]];
    const r = (0.55 + 0.45 * t.lit) * 246, g = (0.55 + 0.45 * t.lit) * 166, bl = (0.55 + 0.45 * t.lit) * 60;
    ctx.fillStyle = "rgb(" + (r * t.lit | 0) + "," + (166 * t.lit + 40 | 0) + "," + (90 + 120 * t.lit | 0) + ")";
    ctx.strokeStyle = "rgba(89,209,255,0.15)"; ctx.beginPath(); ctx.moveTo(p0.sx, p0.sy); ctx.lineTo(p1.sx, p1.sy); ctx.lineTo(p2.sx, p2.sy); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  st.textContent = mesh.positions.length + " verts \u00b7 " + mesh.cells.length + " tris \u00b7 extruded from a sprite";
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
