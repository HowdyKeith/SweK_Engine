<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Voxel Ray Marcher (v2782)</title>
<style>
  html, body { margin: 0; background: #0a0e0c; color: #cfe9d8; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  #wrap { display: flex; gap: 16px; padding: 14px; flex-wrap: wrap; }
  canvas { image-rendering: pixelated; width: 512px; height: 352px; border: 1px solid #24382e; background: #000; }
  /* v2873 -- the action fills the page. This canvas is a DRAWING, so it scales with aspect held and WITHOUT pixelated, which on a curve is just jagged. */
  canvas { width: 100%; max-width: 900px; height: auto; display: block; }
  #side { min-width: 220px; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  .row { margin: 8px 0; }
  input[type=range] { width: 160px; vertical-align: middle; }
  button { font: inherit; background: #16211b; color: #cfe9d8; border: 1px solid #2c463a; padding: 3px 8px; }
  .note { color: #6f8a7c; margin-top: 10px; max-width: 240px; }
</style>
</head>
<body>
<div id="wrap">
  <div>
    <canvas id="c" width="256" height="176"></canvas>
    <div class="note">Pure JS + 2D canvas -- each pixel casts a ray through the voxel grid with the DDA core
      (voxel/voxelDDA.js). No WebGL, so it renders even while the GPU path is down. Face normals come straight
      out of the traversal (shading + parallax depth for free).</div>
  </div>
  <div id="side">
    <h1>Voxel Ray Marcher</h1>
    <div class="row">yaw <input id="yaw" type="range" min="0" max="360" value="45"></div>
    <div class="row">pitch <input id="pitch" type="range" min="-45" max="20" value="-18"></div>
    <div class="row">height <input id="cam" type="range" min="14" max="48" value="30"></div>
    <div class="row"><button id="hi">render hi-res</button> <span id="ms"></span></div>
    <div class="note" id="stats"></div>
  </div>
</div>
<script type="module">
import { traverseDDA } from "/voxel/voxelDDA.js";

const c = document.getElementById("c"), ctx = c.getContext("2d");
const $ = (id) => document.getElementById(id);

// --- voxel scene: a heightmap world + a couple of floating blocks ------------------------------------
const SX = 64, SZ = 64, SY = 56;
function height(x, z) {
    return Math.floor(10 + 6 * Math.sin(x * 0.18) * Math.cos(z * 0.15) + 4 * Math.sin((x + z) * 0.09) + 3 * Math.cos(x * 0.31));
}
function voxelType(x, y, z) {
    if (x < 0 || z < 0 || x >= SX || z >= SZ || y < 0 || y >= SY) return 0;
    // floating block
    if (x >= 26 && x < 34 && z >= 26 && z < 34 && y >= 30 && y < 36) return 5;
    const h = height(x, z);
    if (y >= h) return 0;
    if (y === h - 1) return h > 16 ? 3 : (h < 9 ? 2 : 1);   // snow / sand / grass top
    if (y >= h - 3) return 4;                                // dirt
    return 6;                                                // stone
}
const isSolid = (x, y, z) => voxelType(x, y, z) !== 0;
const COLORS = { 1: [0.42, 0.72, 0.34], 2: [0.85, 0.78, 0.52], 3: [0.82, 0.85, 0.88], 4: [0.60, 0.50, 0.30], 5: [0.70, 0.45, 0.80], 6: [0.55, 0.55, 0.60] };
const LIGHT = (() => { const l = [0.5, 0.8, 0.35], m = Math.hypot(...l); return [l[0] / m, l[1] / m, l[2] / m]; })();
const SKY = [0.05, 0.07, 0.09];

function render(w, h) {
    const t0 = performance.now();
    c.width = w; c.height = h;
    const yaw = $("yaw").value * Math.PI / 180, pitch = $("pitch").value * Math.PI / 180;
    const cy = parseFloat($("cam").value);
    // camera orbits the world centre
    const R = 60, cx0 = SX / 2, cz0 = SZ / 2;
    const eye = [cx0 + R * Math.cos(yaw), cy, cz0 + R * Math.sin(yaw)];
    const fwd = [cx0 - eye[0], (12 + Math.tan(pitch) * R) - eye[1], cz0 - eye[2]];
    const fl = Math.hypot(...fwd); fwd[0] /= fl; fwd[1] /= fl; fwd[2] /= fl;
    const right = [fwd[2], 0, -fwd[0]]; const rl = Math.hypot(...right) || 1; right[0] /= rl; right[2] /= rl;
    const up = [right[1] * fwd[2] - right[2] * fwd[1], right[2] * fwd[0] - right[0] * fwd[2], right[0] * fwd[1] - right[1] * fwd[0]];
    const tanF = Math.tan(0.5 * 60 * Math.PI / 180), aspect = w / h;
    const img = ctx.createImageData(w, h);
    let hits = 0;
    for (let py = 0; py < h; py++) {
        const ndcY = (1 - 2 * (py + 0.5) / h) * tanF;
        for (let px = 0; px < w; px++) {
            const ndcX = (2 * (px + 0.5) / w - 1) * tanF * aspect;
            const dx = fwd[0] + ndcX * right[0] + ndcY * up[0];
            const dy = fwd[1] + ndcX * right[1] + ndcY * up[1];
            const dz = fwd[2] + ndcX * right[2] + ndcY * up[2];
            const r = traverseDDA(eye[0], eye[1], eye[2], dx, dy, dz, isSolid, 220);
            let cr, cg, cb;
            if (r.hit) {
                hits++;
                const col = COLORS[voxelType(r.vx, r.vy, r.vz)] || [0.8, 0.8, 0.8];
                const lam = 0.35 + 0.65 * Math.max(0, r.nx * LIGHT[0] + r.ny * LIGHT[1] + r.nz * LIGHT[2]);
                const fog = Math.max(0, 1 - r.t / 200);
                cr = col[0] * lam * fog + SKY[0] * (1 - fog);
                cg = col[1] * lam * fog + SKY[1] * (1 - fog);
                cb = col[2] * lam * fog + SKY[2] * (1 - fog);
            } else { cr = SKY[0]; cg = SKY[1]; cb = SKY[2]; }
            const o = (py * w + px) * 4;
            img.data[o] = cr * 255; img.data[o + 1] = cg * 255; img.data[o + 2] = cb * 255; img.data[o + 3] = 255;
        }
    }
    ctx.putImageData(img, 0, 0);
    const ms = (performance.now() - t0).toFixed(0);
    $("ms").textContent = ms + " ms";
    $("stats").textContent = `${w}x${h} = ${w * h} rays, ${(100 * hits / (w * h)).toFixed(0)}% hit`;
}

const draw = () => render(256, 176);
$("yaw").oninput = $("pitch").oninput = $("cam").oninput = draw;
$("hi").onclick = () => render(512, 352);
draw();
</script>
</body>
</html>
