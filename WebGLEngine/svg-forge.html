<!DOCTYPE html>
<!-- svg-forge.html — v3831 — SVG -> 3D medal / badge / insignia forge (after CatsJuice/medal-forge, MIT).
     Paste or edit an SVG; its paths are parsed (render/svgExtrudeCore.js, gated) and bevel-extruded into a metal
     medal (render/svgExtrude.js). The vector counterpart to the sprite-loft: real outlines, so holes and inner
     points survive. Good for faction insignia, achievement medals, and 3D UI ornaments. Fresh implementation of
     a standard technique (SVG path -> THREE.Shape -> ExtrudeGeometry); nothing copied from the reference. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="demo:desc" content="Paste an SVG and forge it into a 3D metal medal/badge: its paths are parsed and bevel-extruded, holes and inner points preserved (the vector counterpart to the raster sprite-loft). Controls for thickness, bevel, color and metalness; orbit to inspect. Parsing is pinned by svgExtrudeCore-selfcheck. For faction insignia, achievement medals, and 3D UI ornaments.">
<title>SweK &middot; SVG forge</title>
<style>
  html,body { margin:0; height:100%; background:#0a0d12; color:#cfe0f5; font:12px ui-monospace,Menlo,monospace; overflow:hidden; }
  #app { display:flex; height:100vh; }
  #side { width:330px; padding:12px; box-sizing:border-box; border-right:1px solid #1b2740; display:flex; flex-direction:column; gap:8px; overflow:auto; }
  #side h1 { font-size:14px; color:#e8c45a; margin:0 0 2px; } #side .sub { color:#5f7590; margin-bottom:4px; }
  textarea { width:100%; height:150px; background:#0b1424; color:#bfe0d0; border:1px solid #2f486c; border-radius:6px; font:11px ui-monospace,monospace; padding:6px; resize:vertical; box-sizing:border-box; }
  .row { display:flex; align-items:center; gap:8px; } .row label { width:80px; color:#9fb8d6; }
  input[type=range] { flex:1; } input[type=color] { width:44px; height:22px; background:none; border:1px solid #2f486c; border-radius:4px; }
  button { background:#152136; color:#cfe6ff; border:1px solid #2f486c; border-radius:6px; cursor:pointer; font:inherit; padding:5px 10px; }
  button.primary { background:#1d3a2a; color:#9fe6c0; border-color:#2a6a4a; }
  .presets button { padding:2px 8px; }
  #err { color:#ff8a8a; min-height:14px; }
  #view { flex:1; position:relative; } canvas { display:block; }
  #hint { position:absolute; bottom:8px; left:10px; color:#5f7590; }
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <h1>&#9874; SVG forge</h1>
    <div class="sub">paste an SVG &rarr; a bevel-extruded 3D medal. Holes and inner points survive.</div>
    <div class="presets row" style="flex-wrap:wrap;gap:4px;">
      <button data-preset="star">star</button><button data-preset="shield">shield</button>
      <button data-preset="ring">ring</button><button data-preset="chevron">chevron</button>
    </div>
    <textarea id="svg" spellcheck="false"></textarea>
    <div id="err"></div>
    <div class="row"><label>thickness</label><input id="thick" type="range" min="0.05" max="1" step="0.01" value="0.35"></div>
    <div class="row"><label>bevel</label><input id="bevel" type="range" min="0" max="0.9" step="0.01" value="0.4"></div>
    <div class="row"><label>metal</label><input id="metal" type="range" min="0" max="1" step="0.01" value="0.85"></div>
    <div class="row"><label>rough</label><input id="rough" type="range" min="0" max="1" step="0.01" value="0.35"></div>
    <div class="row"><label>color</label><input id="color" type="color" value="#d9b45a"></div>
    <div class="row"><label>foil</label><input id="foil" type="checkbox"></div>
    <div class="row"><label>film nm</label><input id="filmnm" type="range" min="150" max="700" step="5" value="380"></div>
    <div class="row"><label>flakes</label><input id="flakes" type="range" min="0" max="1" step="0.01" value="0.35"></div>
    <div class="row" style="gap:6px;"><button class="primary" id="forge">Forge</button><button id="spin">spin: on</button></div>
    <div class="sub" style="margin-top:auto;">Parses M/L/H/V/C/S/Q/T/Z + A. Transforms/CSS are ignored &mdash; flatten them first. Gates: svgExtrudeCore-selfcheck, holoFoil-selfcheck (the foil).</div>
  </div>
  <div id="view"><canvas id="c"></canvas><div id="hint">drag to orbit &middot; scroll to zoom</div></div>
</div>

<script type="importmap">
{ "imports": { "three": "/vendor/three/three.module.js" } }
</script>
<script type="module">
import * as THREE from "/vendor/three/three.module.js";
import { OrbitControls } from "/vendor/three/jsm/controls/OrbitControls.js";
import { forgeFromSvg } from "/render/svgExtrude.js";
// v4169 -- the holofoil, wired to the geometry it was written for. holoFoilShader.js is a three.js
// onBeforeCompile patch, so it MUST be applied to a material before that material first compiles, which is
// why this happens inside forge() on the freshly-built medal rather than once at startup.
import { applyHoloFoil } from "/render/holoFoilShader.js";

const PRESETS = {
  star: '<svg viewBox="0 0 100 100"><path d="M50 5 L61 39 L97 39 L68 61 L79 95 L50 74 L21 95 L32 61 L3 39 L39 39 Z"/></svg>',
  shield: '<svg viewBox="0 0 100 120"><path d="M50 4 C70 16 86 16 96 12 C96 60 88 96 50 116 C12 96 4 60 4 12 C14 16 30 16 50 4 Z"/><path d="M50 30 L62 54 L50 90 L38 54 Z"/></svg>',
  ring: '<svg viewBox="0 0 100 100"><path d="M50 4 A46 46 0 1 1 49.9 4 Z"/><path d="M50 26 A24 24 0 1 0 50.1 26 Z"/></svg>',
  chevron: '<svg viewBox="0 0 120 80"><path d="M10 10 L60 10 L110 40 L60 70 L10 70 L60 40 Z"/><path d="M30 30 L50 30 L64 40 L50 50 L30 50 L44 40 Z"/></svg>',
};

const cvs = document.getElementById("c"), view = document.getElementById("view"), errEl = document.getElementById("err");
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0a0d12);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100); camera.position.set(0, 0.6, 5);
const renderer = new THREE.WebGLRenderer({ canvas: cvs, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
if ("outputColorSpace" in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace;
const controls = new OrbitControls(camera, cvs); controls.enableDamping = true; controls.minDistance = 2; controls.maxDistance = 14;
scene.add(new THREE.HemisphereLight(0xcfe4ff, 0x101418, 1.0));
const key = new THREE.DirectionalLight(0xffffff, 2.0); key.position.set(3, 4, 5); scene.add(key);
const rim = new THREE.DirectionalLight(0x88aaff, 0.7); rim.position.set(-4, 1, -3); scene.add(rim);
scene.add(new THREE.AmbientLight(0x223349, 0.5));

let medal = null, spin = true;
function opts() { return { size: 2.4, thickness: +thick.value, bevel: +bevel.value, metalness: +metal.value, roughness: +rough.value, color: parseInt(color.value.slice(1), 16) }; }
function forge() {
  errEl.textContent = "";
  try {
    if (medal) { scene.remove(medal); medal.traverse((n) => { if (n.geometry) n.geometry.dispose(); if (n.material) n.material.dispose(); }); }
    medal = forgeFromSvg(svg.value, opts());
    if (!medal.children.length) errEl.textContent = "No <path>/<polygon> found (transforms are ignored).";
    // THE FOIL GOES ON HERE, ON MATERIALS THAT HAVE NEVER COMPILED. onBeforeCompile is consulted once, at
    // first compile; setting it on an already-drawn material does nothing until something forces a rebuild,
    // and "nothing happened" would read as a broken shader rather than a missed hook.
    if (foil.checked) {
      medal.traverse((n) => {
        if (!n.material) return;
        for (const m of (Array.isArray(n.material) ? n.material : [n.material])) {
          // THE KEYS ARE THE UNIFORM NAMES, and getting that wrong is silent: applyHoloFoil spreads
          // { ...DEFAULTS, ...opts }, so `thicknessNm` would add a key nothing reads and leave uThicknessNm
          // at its default -- two live-looking sliders that move nothing. holoFoil-selfcheck asserts this.
          applyHoloFoil(m, { uThicknessNm: +filmnm.value, uFlakeStrength: +flakes.value });
        }
      });
    }
    scene.add(medal);
  } catch (e) { errEl.textContent = "Forge error: " + (e.message || e); }
}
function resize() { const w = view.clientWidth, h = view.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener("resize", resize);
for (const b of document.querySelectorAll(".presets button")) b.onclick = () => { svg.value = PRESETS[b.dataset.preset]; forge(); };
document.getElementById("forge").onclick = forge;
for (const id of ["thick", "bevel", "metal", "rough", "color", "filmnm", "flakes"]) document.getElementById(id).oninput = forge;
// the foil is a COMPILE-TIME patch, so toggling it re-forges rather than flipping a uniform
document.getElementById("foil").onchange = forge;
document.getElementById("spin").onclick = (e) => { spin = !spin; e.target.textContent = "spin: " + (spin ? "on" : "off"); };
const thick = document.getElementById("thick"), bevel = document.getElementById("bevel"), metal = document.getElementById("metal"), rough = document.getElementById("rough"), color = document.getElementById("color"), svg = document.getElementById("svg"),
      foil = document.getElementById("foil"), filmnm = document.getElementById("filmnm"), flakes = document.getElementById("flakes");

svg.value = PRESETS.star; resize(); forge();
(function loop() { if (spin && medal) medal.rotation.y += 0.01; controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop); })();
</script>
</body>
</html>
