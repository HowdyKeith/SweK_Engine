<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SweK MD Lab</title>
<style>
:root{ --bg:#000; --panel:#0c0906; --edge:#1c140c; --amber:#ff9c3f; --salmon:#ff9a6a; --pink:#ff9aa2; --good:#8aff9e; --dim:#6b5a44; --purple:#c99ad6; --ink:#0a0704; --text:#ffd9b0; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Antonio',ui-monospace,'Segoe UI',monospace;font-weight:500}
body{padding:14px;display:grid;grid-template-columns:1fr 260px;gap:12px;min-height:100vh;align-content:start}
@media (max-width:680px){body{grid-template-columns:1fr}}
h1{grid-column:1/-1;margin:0 0 4px;font-size:26px;letter-spacing:.2em;color:var(--amber);text-transform:uppercase}
h1 small{color:var(--purple);font-size:13px;letter-spacing:.14em;margin-left:12px}
.stage{border:1px solid var(--edge);border-radius:12px;background:var(--panel);overflow:hidden;position:relative}
canvas{display:block;width:100%;height:auto;background:radial-gradient(circle at 50% 40%,#140f09,#050403)}
.side{display:flex;flex-direction:column;gap:10px}
.card{border:1px solid var(--edge);border-left:5px solid var(--salmon);border-radius:0 10px 10px 0;background:var(--panel);padding:10px 12px}
.card h2{margin:0 0 6px;font-size:13px;letter-spacing:.14em;color:var(--salmon);text-transform:uppercase}
.row{display:flex;justify-content:space-between;font-size:14px;letter-spacing:.05em;margin:2px 0}
.row b{color:var(--good)}
.energy{height:16px;border-radius:6px;background:var(--edge);overflow:hidden;display:flex;margin-top:6px}
.energy i{display:block;height:100%} .energy .ke{background:var(--amber)} .energy .pe{background:var(--purple)}
button{font-family:inherit;font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:12px;color:var(--ink);background:var(--salmon);border:0;border-radius:10px;padding:8px 10px;cursor:pointer}
button.amber{background:var(--amber)} button.pink{background:var(--pink)} button.ghost{background:var(--edge);color:var(--salmon)}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.note{color:var(--dim);font-size:12px;letter-spacing:.06em;line-height:1.5}
.drift{color:var(--good)} .drift.bad{color:var(--pink)}
</style>
</head>
<body>
  <h1>SweK MD Lab <small id="mol">loading force field&hellip;</small></h1>
  <div class="stage"><canvas id="c" width="900" height="560"></canvas></div>
  <div class="side">
    <div class="card">
      <h2>Energy</h2>
      <div class="row">Kinetic <b id="ke">--</b></div>
      <div class="row">Potential <b id="pe">--</b></div>
      <div class="row">Total <b id="tot">--</b></div>
      <div class="energy"><i class="ke" id="bke"></i><i class="pe" id="bpe"></i></div>
      <div class="row" style="margin-top:6px">Drift <b class="drift" id="drift">--</b></div>
      <div class="note">Total energy should stay flat -- that is velocity Verlet conserving it.</div>
    </div>
    <div class="card" style="border-left-color:var(--amber)">
      <h2>Temperature</h2>
      <div class="row">Now <b id="temp">--</b></div>
      <div class="row">Target <b id="tgt">off</b></div>
      <div class="btns" style="margin-top:6px">
        <button class="amber" id="heat">Heat +</button>
        <button class="ghost" id="cool">Cool -</button>
        <button class="ghost" id="thermo">Thermostat</button>
      </div>
    </div>
    <div class="card" style="border-left-color:var(--pink)">
      <h2>Run</h2>
      <div class="btns"><button id="play">Pause</button><button class="pink" id="reset">Reset</button></div>
      <div class="note" id="ff">force field: --</div>
    </div>
  </div>
<script type="module">
import { ljCoeff, ljPotential, computeForces, kinetic, velocityVerlet } from "./physics/md/md.js";
import { bondForces, combine } from "./physics/md/bonds.js";
import { angleForces } from "./physics/md/angles.js";
import { temperature, removeCOMMotion, berendsenStep } from "./physics/md/thermostat.js";

const cvs = document.getElementById("c"), ctx = cvs.getContext("2d");
const $ = (id) => document.getElementById(id);
const EL = { 6: ["#8a8f98", 1.7], 1: ["#f4f4f4", 1.0], 8: ["#ff5a4d", 1.55], 7: ["#5aa9ff", 1.6] };  // color, radius

// a small chain molecule: 7 atoms, bonded, with angle terms -- it wiggles and holds its shape
function build() {
  const N = 7, pos = new Float64Array(3 * N), vel = new Float64Array(3 * N), masses = new Float64Array(N).fill(12);
  const elements = [];
  for (let i = 0; i < N; i++) { pos[3 * i] = (i - 3) * 1.5; pos[3 * i + 1] = Math.sin(i) * 0.4; pos[3 * i + 2] = Math.cos(i) * 0.3; elements.push(6); }
  for (let i = 0; i < 3 * N; i++) vel[i] += (Math.random() - 0.5) * 0.6;
  const bonds = []; for (let i = 0; i < N - 1; i++) bonds.push({ i, j: i + 1, k: 90, r0: 1.5 });
  const angles = []; for (let i = 1; i < N - 1; i++) angles.push({ i: i - 1, j: i, k: i + 1, kang: 30, cos0: Math.cos(112 * Math.PI / 180) });
  return { N, pos, vel, masses, elements, bonds, angles };
}
let m = build();
const forceFn = (p) => combine(
  (pp) => computeForces(pp, m.N, 0.2, 1.6, 0),
  (pp) => bondForces(pp, m.N, m.bonds),
  (pp) => angleForces(pp, m.N, m.angles)
)(p);
let forces = forceFn(m.pos).forces, E0 = null, running = true, thermoOn = false, Ttarget = 1.5, ang = 0;
const dof = 3 * m.N - 3;
$("mol").textContent = m.N + " atoms - bonds + angles + Lennard-Jones";
$("ff").textContent = "force field: LJ + bonds + angles";

function step() {
  const state = { pos: m.pos, vel: m.vel, forces, masses: m.masses, pe: 0 };
  for (let s = 0; s < 6; s++) { velocityVerlet(state, 0.004, forceFn); if (thermoOn) berendsenStep(state.vel, m.masses, Ttarget, dof, 0.004, 0.2); }
  forces = state.forces;
  const ke = kinetic(m.vel, m.masses), pe = state.pe, tot = ke + pe;
  if (E0 === null) E0 = tot;
  $("ke").textContent = ke.toFixed(2); $("pe").textContent = pe.toFixed(2); $("tot").textContent = tot.toFixed(2);
  const span = Math.max(1e-6, Math.abs(ke) + Math.abs(pe));
  $("bke").style.width = (100 * Math.abs(ke) / span) + "%"; $("bpe").style.width = (100 * Math.abs(pe) / span) + "%";
  const drift = Math.abs(tot - E0);
  const de = $("drift"); de.textContent = drift.toFixed(3); de.className = "drift" + (drift > 0.2 * Math.abs(E0) + 1 ? " bad" : "");
  $("temp").textContent = temperature(m.vel, m.masses, dof).toFixed(2);
}

function draw() {
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  ang += 0.004;
  const cx = cvs.width / 2, cy = cvs.height / 2, sc = 42, ca = Math.cos(ang), sa = Math.sin(ang);
  const P = (i) => { const x = m.pos[3 * i], y = m.pos[3 * i + 1], z = m.pos[3 * i + 2]; const xr = x * ca - z * sa; return [cx + xr * sc, cy - y * sc, z * sa + x * sa]; };
  ctx.lineWidth = 4; ctx.strokeStyle = "#3a2a14";
  for (const b of m.bonds) { const a = P(b.i), c = P(b.j); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(c[0], c[1]); ctx.stroke(); }
  for (let i = 0; i < m.N; i++) { const p = P(i), el = EL[m.elements[i]] || ["#8aff9e", 1.4]; ctx.fillStyle = el[0]; ctx.beginPath(); ctx.arc(p[0], p[1], el[1] * 9, 0, 7); ctx.fill(); }
}
function frame() { if (running) step(); draw(); requestAnimationFrame(frame); }
frame();

$("play").onclick = (e) => { running = !running; e.target.textContent = running ? "Pause" : "Play"; };
$("reset").onclick = () => { m = build(); forces = forceFn(m.pos).forces; E0 = null; };
$("heat").onclick = () => { for (let i = 0; i < m.vel.length; i++) m.vel[i] *= 1.25; E0 = null; };
$("cool").onclick = () => { for (let i = 0; i < m.vel.length; i++) m.vel[i] *= 0.8; E0 = null; };
$("thermo").onclick = (e) => { thermoOn = !thermoOn; $("tgt").textContent = thermoOn ? Ttarget.toFixed(1) : "off"; e.target.classList.toggle("amber", thermoOn); };
</script>
</body>
</html>
