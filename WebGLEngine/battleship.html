<!DOCTYPE html>
<!-- battleship.html -- UNNUMBERED (the version is chosen at ship time): A YAMATO-LIKE SPACE BATTLESHIP, ITS GUNNERS, AND THE FIGHTERS THAT ATTACK IT -- A WINDOW FOR EACH CRAFT DOWN THE RIGHT.

     The fight is brain/battleshipFight.mjs's: a capital ship (physics/mechanics/capitalShip.mjs -- 48 units long, 4,400 kg, thirteen gun seats each with a gunner, three engine pods, a fictional wave-motion cannon) against 1-12 of es-box3d-6dof.html's own fighters, stepped a tick at a time by
     brain/spaceArena.mjs (which brain/spaceArena-selfcheck.mjs holds to the same arithmetic the 6DOF page flies: rigid bodies, the PD autopilot, shipCollision6dof, flightGuns' swept rounds in vacuum). NEWTONIAN: no ground, no drag, no gravity, a round flies straight.

     THE WINDOWS (render/flightViews.mjs): one per craft, stacked down the right (the stack scrolls when the craft do not fit), and a CLICK on a window switches what it shows. A FIGHTER's goes plane, pilot, gunner (its fixed gun's sight: the pipper and the lead pip, drawn for VACUUM), brain.
     THE SHIP's goes plane, pilot (the bridge), then ONE VIEW PER GUN SEAT -- the three triple main turrets, then the ten point-defence mounts, port, starboard, belly and deck -- looking along the gun as it slews, with the sight drawn for the target that gunner has chosen, and then brain: the hull's own state
     and, under it, a row per seat of what its gunner wants the seat to do and what the seat is doing. A FIGHTER'S brain is its pilot's network live (the 6DOF pilot's twelve features, 34 hidden and five outputs) or, for the PD autopilot, its features and the five outputs it gives. THE HAND GUNNER AND THE HULL'S HELM HAVE NO NETWORK: those rows are
     the inputs and outputs of a rule, said so in the label; a gunner brain that is a network is a later round.

     THE GUNNERS' SKILL IS A SETTING I CHOSE (perfect, ace, regular, green -- brain/battleshipFight.mjs says what each is), not a measurement of any gunner. THE FIGHTERS' PILOTS are the 6DOF page's roster (the PD autopilot; the PD written into the network's weights; the pilot it ships; the league-trained one; the close-quarters one; or a mix in turn).
     NOTHING WAS TRAINED FOR A CAPITAL SHIP: the fighters fly a hand doctrine (approach a point to one side of the ship, strafe past) and the learned pilots answer the same call. EVERY NUMBER OF THE SHIP IS INVENTED and the wave-motion cannon is a fiction (capitalShip.mjs says so in full).

     WHAT IS NOT HERE: a fighter that tumbles when it is hit (a lost craft stops, dark, where it was), a crew that can be killed, an interlock that keeps a turret from firing into its own hull, friendly fire (rounds are tested against the other team only), a formation, a second ship, and a ship drawn like the real one -- it is a hull, a tower, turrets and pods
     drawn from the same numbers the fight runs on. The hit spheres can be shown (the box below): they are what a round has to reach. THE FIGHTERS ARE SMALL: 3.2 units against a ship of 48, so the big picture marks every craft with a dot. -->

<script type="module">
import * as THREE from "/vendor/three/three.module.js";
import { OrbitControls } from "/vendor/three/jsm/controls/OrbitControls.js";
import * as RB from "/physics/mechanics/rigidBody6dof.mjs";
import * as GS from "/physics/mechanics/gunSeats.mjs";
import * as CS from "/physics/mechanics/capitalShip.mjs";
import * as AP from "/brain/autopilot6dof.mjs";
import * as P6 from "/brain/pilot6dofPolicy.mjs";
import * as SA from "/brain/spaceArena.mjs";
import * as BS from "/brain/battleshipFight.mjs";
import * as PB from "/brain/peerBrain.mjs";
import * as V from "/render/flightViews.mjs";
import { weightsHash } from "/brain/drivePolicy.mjs";

const R2D = 180 / Math.PI, FIGHTER_COLORS = [0xff9a4f, 0xf6a623, 0xe8734a, 0xd4a017, 0xff8c42, 0xc97b2a], SHIP_COLOR = 0x6f8fa0;
const MAX_FIGHTERS = 12;

// ---- the pilots: a choice resolves to { id, label, list: [{ id, fn, weights, label }] } -- the list is dealt to the fighters in turn (a "mix" has several) ---------------------------------------------------------------------
const DESC = PB.describePolicy("pilot6dofPolicy", P6);
const CHOICES = [
  { id: "pd", label: "PD autopilot (the 6DOF page's)", policy: false },
  { id: "hand", label: "network, hand weights (the PD written into the net)", hand: () => P6.handWeights() },
  { id: "shipped", label: "6DOF pilot, shipped", file: "/brain/pilot6dofWeightsDefault.json" },
  { id: "league", label: "6DOF pilot, league-trained", file: "/brain/pilot6dofWeightsLeague.json" },
  { id: "close", label: "6DOF pilot, close-quarters", file: "/brain/pilot6dofWeightsClose.json" },
  { id: "mix", label: "a mix: PD, shipped, league, close in turn", mix: ["pd", "shipped", "league", "close"] },
];
const loaded = new Map(), errors = new Map();   // id -> { weights, meta } | reason
function loadChoice(c, url = c.file) {
  return fetch(url).then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }).then((blob) => {
    const r = PB.importBrain(DESC, blob);
    if (r.ok) { loaded.set(c.id, { weights: r.weights, meta: r.meta }); errors.delete(c.id); } else errors.set(c.id, r.reason);   // a refused LATER load keeps the pilot the page already holds, and says why
    return r.ok;
  }).catch((e) => { errors.set(c.id, "could not fetch it (" + (e && e.message) + ")"); return false; });
}
const available = (c) => c.mix ? true : !c.file || loaded.has(c.id);
const PD = (label) => ({ id: "pd", fn: undefined, weights: null, label });   // fn undefined: the arena's default pilot is the PD autopilot (autopilot6dof.decide)
function single(c) {
  if (!c || c.id === "pd") return PD(c ? c.label : "PD autopilot");
  const w = c.hand ? c.hand() : loaded.get(c.id) && loaded.get(c.id).weights;
  if (!w) return PD(`PD autopilot (${c.label}: ${errors.get(c.id) || "not loaded"})`);
  const meta = loaded.get(c.id) && loaded.get(c.id).meta;
  return { id: c.id, fn: P6.pilotFor(w), weights: w, label: c.label + (c.file ? ` ${weightsHash(w)}` : "") + (meta && meta.score != null ? ` (held-out ${meta.score})` : "") };
}
function resolvePilot(id) {
  const c = CHOICES.find((x) => x.id === id) || CHOICES[0];
  if (c.mix) { const list = c.mix.map((m) => CHOICES.find((x) => x.id === m)).filter((m) => m && available(m)).map(single); return { id: c.id, label: c.label, list: list.length ? list : [PD("PD autopilot")] }; }
  const one = single(c); return { id: c.id === one.id ? c.id : "pd", label: one.label, list: [one] };
}

// ---- Three.js scene, Z-UP like the physics (nose +X, up +Z): space -- a black sky, stars, a drifting dust to see motion against, light from one side ----------------------------------------------------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02040a);
const camera = new THREE.PerspectiveCamera(51.6, innerWidth / innerHeight, 0.3, 40000);   // 0.9 rad vertical, the overview's
camera.up.set(0, 0, 1); camera.position.set(-300, -400, 250);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
renderer.domElement.style.position = "fixed"; renderer.domElement.style.inset = "0";
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.enableDamping = true; orbit.dampingFactor = 0.08; orbit.enabled = false;
scene.add(new THREE.AmbientLight(0x8da4c4, 0.55));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.2); sun.position.set(500, -300, 400); scene.add(sun);
{
  let s = 9173; const rnd = () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
  const cloud = (n, spread, size, color, shell) => {
    const a = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      if (shell) { const z = 2 * rnd() - 1, th = 6.2832 * rnd(), r = Math.sqrt(1 - z * z); a[i * 3] = spread * r * Math.cos(th); a[i * 3 + 1] = spread * r * Math.sin(th); a[i * 3 + 2] = spread * z; }
      else { a[i * 3] = (rnd() - 0.5) * spread; a[i * 3 + 1] = (rnd() - 0.5) * spread; a[i * 3 + 2] = (rnd() - 0.5) * spread; }
    }
    const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(a, 3));
    const p = new THREE.Points(g, new THREE.PointsMaterial({ color, size, sizeAttenuation: false })); p.frustumCulled = false; scene.add(p);
  };
  cloud(2600, 20000, 1.6, 0xcfe0ff, true);     // the stars
  cloud(240, 3000, 1.5, 0x4f5f78, false);        // a little dust, to see the craft move against
}
const HULL_DEAD = new THREE.MeshStandardMaterial({ color: 0x3a1c1c, roughness: 0.95 }), PART_DEAD = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 1 });
const GLOW_ON = new THREE.MeshBasicMaterial({ color: 0xffb06a }), GLOW_OFF = new THREE.MeshBasicMaterial({ color: 0x151515 });
function makeFighter(i) {   // the 6DOF page's hull: nose +X, a cylinder, a cone, a wing, the engine glow
  const g = new THREE.Group(), mat = new THREE.MeshStandardMaterial({ color: FIGHTER_COLORS[i % FIGHTER_COLORS.length], metalness: 0.3, roughness: 0.5 });
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.5, 2.6, 14), mat); body.rotation.z = Math.PI / 2; g.add(body);
  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.32, 0.9, 14), mat); nose.rotation.z = -Math.PI / 2; nose.position.x = 1.6; g.add(nose);
  const wing = new THREE.Mesh(new THREE.BoxGeometry(0.06, 1.0, 1.9), mat); g.add(wing);
  const eng = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.18, 12), GLOW_ON); eng.rotation.z = Math.PI / 2; eng.position.x = -1.35; g.add(eng);
  g.userData = { hull: [body, nose, wing], eng, kind: "fighter", mat }; scene.add(g); return g;
}
// THE SHIP is drawn from the same numbers the fight is: a hull between its hull spheres, the bridge tower at the bridge sphere, a turret or a mount at each SEAT's mount with barrels that point where the seat points NOW, a pod and a glowing nozzle at each ENGINE sphere,
// and the wave-motion cannon's ring and charge at the bow. `showSpheres` adds the hit spheres themselves.
function makeShip(ship) {
  const g = new THREE.Group(), mat = new THREE.MeshStandardMaterial({ color: SHIP_COLOR, metalness: 0.4, roughness: 0.5 }), dark = new THREE.MeshStandardMaterial({ color: 0x4d6372, metalness: 0.4, roughness: 0.6 }), hull = [], P = ship.parts, byName = (n) => P.find((p) => p.name === n);
  const bow = byName("bow"), stern = byName("stern"), len = bow.center[0] - stern.center[0];
  const body = new THREE.Mesh(new THREE.CylinderGeometry(4.4, 4.4, len, 22), mat); body.rotation.z = Math.PI / 2; body.position.x = (bow.center[0] + stern.center[0]) / 2; body.scale.set(1, 1, 1); g.add(body); hull.push(body);
  const cap = new THREE.Mesh(new THREE.ConeGeometry(4.4, 8, 22), mat); cap.rotation.z = -Math.PI / 2; cap.position.x = bow.center[0] + 4 + 3.4; g.add(cap); hull.push(cap);
  const deck = new THREE.Mesh(new THREE.BoxGeometry(len * 0.9, 7.2, 0.7), dark); deck.position.set(bow.center[0] - len * 0.46 + 2, 0, 4.2); g.add(deck); hull.push(deck);
  const keel = new THREE.Mesh(new THREE.BoxGeometry(len * 0.7, 0.8, 3.2), dark); keel.position.set(-3, 0, -4.2); g.add(keel); hull.push(keel);
  const bridge = byName("bridge"), tower = new THREE.Mesh(new THREE.BoxGeometry(5, 3.4, 5.2), mat); tower.position.set(bridge.center[0], 0, bridge.center[2] + 0.3); g.add(tower); hull.push(tower);
  const top = new THREE.Mesh(new THREE.BoxGeometry(3, 2.4, 3), dark); top.position.set(bridge.center[0] + 0.3, 0, bridge.center[2] + 4.2); g.add(top); hull.push(top);
  const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 4, 6), dark); mast.position.set(bridge.center[0], 0, bridge.center[2] + 7.5); mast.rotation.x = Math.PI / 2; g.add(mast); hull.push(mast);
  const seatMesh = new Map(), turrets = ship.seats.map((seat, k) => {
    const main = seat.id.startsWith("main"), grp = new THREE.Group(), tm = new THREE.MeshStandardMaterial({ color: main ? 0x8aa3b3 : 0xcfe0f5, metalness: 0.3, roughness: 0.4 });
    grp.position.set(...seat.mount);
    const base = new THREE.Mesh(main ? new THREE.CylinderGeometry(2.2, 2.5, 1.4, 16) : new THREE.SphereGeometry(0.9, 12, 8), tm); if (main) base.rotation.x = Math.PI / 2; grp.add(base);
    const barrel = new THREE.Group(), n = main ? 3 : 2, rad = main ? 0.24 : 0.1, blen = main ? 6.5 : 1.9;
    for (let b = 0; b < n; b++) { const m = new THREE.Mesh(new THREE.CylinderGeometry(rad, rad, blen, 8), new THREE.MeshStandardMaterial({ color: 0x222a30 })); m.position.set((b - (n - 1) / 2) * (main ? 0.75 : 0.35), blen / 2, 0); barrel.add(m); }
    grp.add(barrel); g.add(grp); const entry = { grp, barrel, base, mats: [tm, ...barrel.children.map((m) => m.material)], dead: false }; seatMesh.set(k, entry); return entry;
  });
  const engines = ship.engines.map((id) => {
    const p = P[id], nac = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.8, 3, 14), mat); nac.rotation.z = Math.PI / 2; nac.position.set(p.center[0] + 0.4, p.center[1], p.center[2]); g.add(nac);
    const glow = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.4, 0.4, 14), new THREE.MeshBasicMaterial({ color: 0x8fd8ff })); glow.rotation.z = Math.PI / 2; glow.position.set(p.center[0] - 1.6, p.center[1], p.center[2]); g.add(glow);
    hull.push(nac); return { nac, glow, id, mat: nac.material };
  });
  const ring = new THREE.Mesh(new THREE.TorusGeometry(3, 0.45, 8, 28), dark); ring.rotation.y = Math.PI / 2; ring.position.x = ship.waveGun.muzzle[0] - 2; g.add(ring); hull.push(ring);
  const charge = new THREE.Mesh(new THREE.SphereGeometry(1, 14, 10), new THREE.MeshBasicMaterial({ color: 0x5ad6ff, transparent: true, opacity: 0.9 })); charge.position.x = ship.waveGun.muzzle[0] - 1; g.add(charge);
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(ship.waveGun.beamRadius, ship.waveGun.beamRadius, ship.waveGun.range, 20, 1, true), new THREE.MeshBasicMaterial({ color: 0x9fe8ff, transparent: true, opacity: 0.5, side: THREE.DoubleSide }));
  beam.rotation.z = Math.PI / 2; beam.position.x = ship.waveGun.muzzle[0] + ship.waveGun.range / 2; beam.visible = false; g.add(beam);
  const spheres = P.map((p) => { const m = new THREE.Mesh(new THREE.SphereGeometry(p.radius, 14, 10), new THREE.MeshBasicMaterial({ color: p.kind === "engine" ? 0xff6b6b : p.kind === "turret" ? 0xf6a623 : 0xf6e05a, wireframe: true, transparent: true, opacity: 0.55 })); m.position.set(...p.center); m.visible = false; g.add(m); return m; });
  g.userData = { hull, engines, turrets, charge, beam, spheres, kind: "ship", mat }; scene.add(g); return g;
}
function trailLine(color) {
  const geom = new THREE.BufferGeometry(); geom.setAttribute("position", new THREE.BufferAttribute(new Float32Array(240 * 3), 3)); geom.setDrawRange(0, 0);
  const line = new THREE.Line(geom, new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.55 })); line.frustumCulled = false; scene.add(line); return line;
}
// the rounds: a short streak behind each one (the ship's point defence in cyan, its main shells in red, the fighters' in yellow); the hits: a flash that grows and fades; the markers: a dot per craft, for the big picture, where a fighter is 3 units in 1,000
const MAX_ROUNDS = 1600;
function tracerSet(color) { const geom = new THREE.BufferGeometry(); geom.setAttribute("position", new THREE.BufferAttribute(new Float32Array(MAX_ROUNDS * 6), 3)); geom.setDrawRange(0, 0); const l = new THREE.LineSegments(geom, new THREE.LineBasicMaterial({ color })); l.frustumCulled = false; scene.add(l); return { geom, l }; }
const tracerP = tracerSet(0x7ff0ff), tracerM = tracerSet(0xff5a3c), tracerF = tracerSet(0xfff1a0);
const flashes = []; const FLASH_MAT = () => new THREE.MeshBasicMaterial({ color: 0xffb340, transparent: true, opacity: 1 });
function spawnFlash(p, big = 1) { const m = new THREE.Mesh(new THREE.SphereGeometry(big, 10, 8), FLASH_MAT()); m.position.set(p[0], p[1], p[2]); m.userData.age = 0; scene.add(m); flashes.push(m); }
let markers = null;
function makeMarkers(n) {
  const geom = new THREE.BufferGeometry(); geom.setAttribute("position", new THREE.BufferAttribute(new Float32Array(n * 3), 3)); geom.setAttribute("color", new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  const m = new THREE.Points(geom, new THREE.PointsMaterial({ size: 7, sizeAttenuation: false, vertexColors: true, depthTest: false })); m.frustumCulled = false; m.renderOrder = 10; scene.add(m); return m;
}

// ---- the fight ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
let fight = null, arena = null, pilots = null, meshes = [], trails = [], trailN = [], deadShown = [], log = [], paused = false, held = false, beamAge = 99, lastShipHitLog = -99;
const el = (id) => document.getElementById(id);
const nameOf = (c) => (c.kind === "capital" ? "battleship" : c.name);
const pilotOf = (fi) => pilots.list[fi % pilots.list.length];
const clearFight = () => {
  for (const m of meshes) { scene.remove(m); m.traverse((c) => { if (c.geometry) c.geometry.dispose(); }); }
  for (const t of trails) { scene.remove(t); t.geometry.dispose(); }
  for (const f of flashes) { scene.remove(f); f.geometry.dispose(); f.material.dispose(); }
  if (markers) { scene.remove(markers); markers.geometry.dispose(); markers = null; }
  flashes.length = 0; meshes = []; trails = [];
};

    fs.map((c, i) => `<div class="row">${c.status === "flying" ? "●" : "○"} ${c.name}  ${Math.max(0, Math.round(c.hp)).toString().padStart(3)} hp  ${c.status === "flying" ? c.mode : c.status}  fired ${c.gun.fired}  hits ${c.hits}</div>`).join("");
  el("stat").textContent = `${fight.scenario.kind} ${fight.scenario.seed} · t ${arena.t.toFixed(1)} s · ${t.killed + t.rammed} of ${fs.length} fighters down${arena.done ? ` · OVER (${t.winner === "none" ? "no winner" : t.winner + " win"})` : ""}`;
  el("log").textContent = log.join("\n"); el("log").style.display = log.length ? "block" : "none";
}

// ---- controls ----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
function fillSelect(sel) { const keep = sel.value; sel.textContent = ""; for (const c of CHOICES) { const o = document.createElement("option"); o.value = c.id; o.textContent = c.label + (available(c) ? "" : " — not available"); o.disabled = !available(c); sel.appendChild(o); } if (keep) sel.value = keep; }
function fillRosters() { fillSelect(el("pilotF")); }
el("newBtn").onclick = () => newFight();
for (const id of ["kind", "pilotF", "gunners", "nfight", "behaviour", "cruise", "seed"]) el(id).onchange = () => newFight();
el("pauseBtn").onclick = () => { paused = !paused; el("pauseBtn").textContent = paused ? "▶ Play" : "❚❚ Pause"; };
el("stepBtn").onclick = () => { paused = true; el("pauseBtn").textContent = "▶ Play"; if (!arena.done) tickOnce(); };
addEventListener("keydown", (e) => { if (e.code === "Space" && !/^(INPUT|SELECT|BUTTON)$/.test((e.target && e.target.tagName) || "")) { e.preventDefault(); el("pauseBtn").click(); } });
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); if (arena) buildWindows(); });

let last = performance.now(), acc = 0;
function renderFrame(dt = 0, snap = false) { syncScene(dt); updateCamera(snap); updateBoard(); renderer.setViewport(0, 0, innerWidth, innerHeight); renderer.render(scene, camera); renderWindows(); }
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (arena && !paused && !held) {
    acc += dt * Number(el("timeScale").value); let n = 0;
    while (acc >= SA.DT && n < 16 && !arena.done) { tickOnce(); acc -= SA.DT; n++; } if (acc > SA.DT * 16) acc = 0;
  }
  if (arena) renderFrame(dt);
  requestAnimationFrame(frame);
}

// ---- boot: the pilots' files first, then the fight ------------------------------------------------------------------------------------------------------------------------------------------------------
const params = new URLSearchParams(location.search);
const ready = Promise.allSettled(CHOICES.filter((c) => c.file).map((c) => loadChoice(c))).then(() => {
  fillRosters();
  const pick = (k, dflt) => { const v = params.get(k); return CHOICES.some((c) => c.id === v && available(c)) ? v : dflt; };
  newFight({ kind: BS.KINDS.includes(params.get("kind")) ? params.get("kind") : "beam", seed: Number(params.get("seed")) || 1, fighters: Number(params.get("fighters")) || BS.FIGHTERS, gunners: BS.GUNNERS[params.get("gunners")] ? params.get("gunners") : BS.DEFAULT_GUNNERS,
    f: pick("f", "pd"), behaviour: params.get("behaviour") === "hold" ? "hold" : "face", cruise: params.get("cruise") === null || params.get("cruise") === "" || !Number.isFinite(Number(params.get("cruise"))) ? 0.3 : Number(params.get("cruise")) });
  requestAnimationFrame(frame);
});

// a debug hook: exact numeric state, a clock the gate drives, the windows and what they show (tools/ship/battleshipPage-selfcheck.mjs)
const pixelStats = (i) => {
  wins[i].el.scrollIntoView({ block: "nearest" }); renderFrame(0); const gl = renderer.getContext(), w = wins[i], cr = renderer.domElement.getBoundingClientRect(), r = w.gl.getBoundingClientRect(), dpr = renderer.getPixelRatio();
  const x = Math.round((r.left - cr.left) * dpr), y = Math.round((cr.bottom - r.bottom) * dpr), W = Math.round(r.width * dpr), H = Math.round(r.height * dpr), buf = new Uint8Array(W * H * 4);
  gl.readPixels(x, y, W, H, gl.RGBA, gl.UNSIGNED_BYTE, buf);
  const seen = new Set(); let sum = [0, 0, 0];
  for (let k = 0; k < buf.length; k += 4) { seen.add(((buf[k] >> 4) << 8) | ((buf[k + 1] >> 4) << 4) | (buf[k + 2] >> 4)); sum[0] += buf[k]; sum[1] += buf[k + 1]; sum[2] += buf[k + 2]; }
  const grid = new Array(64).fill(0), cnt = new Array(64).fill(0);   // an 8 x 8 map of the picture's brightness: two pictures of the same mean can still be different pictures
  for (let yy = 0; yy < H; yy++) for (let xx = 0; xx < W; xx++) { const k = (yy * W + xx) * 4, gi = Math.min(7, Math.floor(yy * 8 / H)) * 8 + Math.min(7, Math.floor(xx * 8 / W)); grid[gi] += (buf[k] + buf[k + 1] + buf[k + 2]) / 3; cnt[gi]++; }
  const n = buf.length / 4; return { w: W, h: H, distinct: seen.size, mean: sum.map((v) => v / n), grid: grid.map((v, i) => v / cnt[i]) };
};
const inkColor = (i, rgb, tol = 30) => { const w = wins[i], d = w.ctx.getImageData(0, 0, w.ov.width, w.ov.height).data; let n = 0; for (let k = 0; k < d.length; k += 4) if (d[k + 3] > 100 && Math.abs(d[k] - rgb[0]) <= tol && Math.abs(d[k + 1] - rgb[1]) <= tol && Math.abs(d[k + 2] - rgb[2]) <= tol) n++; return n; };
const overlayInk = (i) => { const w = wins[i], d = w.ctx.getImageData(0, 0, w.ov.width, w.ov.height).data; let n = 0; for (let k = 3; k < d.length; k += 4) if (d[k] > 0) n++; return n; };
window.__battleship = {
  ready,
  state() { return { tick: arena.i, t: arena.t, done: arena.done, over: arena.over, scenario: { kind: fight.scenario.kind, seed: fight.scenario.seed }, rounds: arena.rounds.length,
    crafts: arena.crafts.map((c) => ({ id: c.id, team: c.team, name: c.name, kind: c.kind, status: c.status, pos: c.body.pos.slice(), vel: c.body.vel.slice(), q: c.body.q.slice(), w: c.body.w.slice(), hp: c.hp, hpMax: c.hpMax, hits: c.hits, mode: c.mode, enginesRunning: c.enginesRunning, charge: c.charge, waves: c.waves,
      fired: c.gun ? c.gun.fired : null, partsOut: [...c.partHp].filter(([, hp]) => hp <= 0).map(([id]) => c.ship.parts[id].name),
      seats: c.seats.map((s) => ({ id: s.seat.id, name: s.seat.name, yaw: s.state.yaw, pitch: s.state.pitch, fired: s.state.gun.fired, ammo: s.state.gun.ammo, works: SA.seatWorks(c, s), last: s.last && { fire: s.last.fire, target: s.last.target } })), last: c.last && { foe: c.last.foe, fire: c.last.fire, thrust: c.last.thrust, mode: c.last.mode } })),
    log: log.slice(), pilots: { id: pilots.id, label: pilots.label, list: pilots.list.map((p) => ({ id: p.id, label: p.label })) }, gunners: fight.gunners, gunnerOptions: fight.gunnerOptions, behaviour: arena.crafts[0].behaviour, cruise: arena.crafts[0].cruise }; },
  tally: () => BS.tally(arena),
  brainRows: (i) => brainRowsOf(arena.crafts[i]).map((r) => ({ label: r.label || `${r.who[0]} ${r.layer}`, layer: r.layer, n: r.values.length, values: r.values.slice() })),
  // a debug aid for the gate: n rounds dropped from OUTSIDE the named part of the ship along the way in (the flank mounts from their own side, the belly from below, the deck and the turrets from above, the pods from astern), owned by the first fighter
  shoot(partName, n = 1) {
    const c = arena.crafts[0], p = CS.partCentres(c.ship, c.body).find((q) => q.name === partName); if (!p) return 0;
    const side = /^port/.test(partName) ? [0, 1, 0] : /^starboard/.test(partName) ? [0, -1, 0] : /^ventral/.test(partName) ? [0, 0, -1] : /engine/.test(partName) ? [-1, 0, 0] : [0, 0, 1], out = RB.rotateByQuat(c.body.q, side), f = arena.crafts[1];
    for (let k = 0; k < n; k++) arena.rounds.push({ pos: [p.center[0] + out[0] * (12 + 4 * k), p.center[1] + out[1] * (12 + 4 * k), p.center[2] + out[2] * (12 + 4 * k)], vel: [c.body.vel[0] - out[0] * 300, c.body.vel[1] - out[1] * 300, c.body.vel[2] - out[2] * 300], age: 0, owner: f.id, team: f.team, dmg: SA.FIGHTER_GUN.damage, life: 5 });
    return n;
  },
  step(n = 1, render = true) { for (let i = 0; i < n && !arena.done; i++) tickOnce(); if (render) renderFrame(0); },   // render false: the gate's long searches do not draw nine windows a tick
  // a debug aid for the gate: fighter k is put at the centre of the ship's forward hull, so that the next tick is a ram
  ram(k = 1) { const c = arena.crafts[0], f = arena.crafts[k], p = CS.partCentres(c.ship, c.body).find((q) => q.name === "forward hull"); if (!f || !p) return false; f.body.pos = p.center.slice(); f.body.vel = c.body.vel.slice(); return true; },
  hold(on = true) { held = !!on; }, pause(on = true) { paused = !!on; },
  newFight,
  windows: () => wins.map((w) => ({ craft: w.i, view: w.view, seat: w.seat, label: w.label.textContent, bg: getComputedStyle(w.el).backgroundColor, rect: (({ x, y, width, height }) => ({ x, y, width, height }))(w.gl.getBoundingClientRect()) })),
  clickWindow(i) { wins[i].el.dispatchEvent(new MouseEvent("click", { bubbles: true })); renderFrame(0); return { view: wins[i].view, seat: wins[i].seat }; },
  setView(i, v, seat = 0) { wins[i].view = v; wins[i].seat = seat; setLabel(wins[i]); renderFrame(0); }, pixels: pixelStats, ink: overlayInk, inkColor,
  windowMarkers: () => windowMarkers.slice(),
  cameraOf: (i) => { const cam = cameraOf(wins[i], arena.crafts[i]); return cam && { eye: cam.eye.slice(), target: cam.target.slice(), up: cam.up.slice(), fov: cam.fov }; },
  tracers: () => ({ pd: tracerP.geom.drawRange.count / 2, main: tracerM.geom.drawRange.count / 2, fighter: tracerF.geom.drawRange.count / 2 }),
  sight: (i) => wins[i].sight, texts: (i) => wins[i].texts.slice(), scissors: () => scissors.map((s) => s && { ...s }), stackRect: () => (({ x, y, width, height }) => ({ x, y, width, height }))(stack.getBoundingClientRect()),
  turretAim: (k) => { const m = meshes[0].userData.turrets[k].barrel.quaternion; return [m.x, m.y, m.z, m.w]; },
  seatShown: () => meshes[0].userData.turrets.map((t) => ({ dead: t.dead })),
  engineShown: () => meshes[0].userData.engines.map((e) => ({ out: e.nac.material === PART_DEAD, glow: e.glow.material === GLOW_ON })),
  cannonShown: () => ({ charge: meshes[0].userData.charge.scale.x, beam: meshes[0].userData.beam.visible }),
  fighterGlow: () => meshes.slice(1).map((m) => m.userData.eng.material === GLOW_ON),
  spheresShown: () => meshes[0].userData.spheres.map((s) => s.visible),
  markers: () => ({ n: markers.geometry.attributes.position.count, visible: markers.visible, pos: Array.from(markers.geometry.attributes.position.array), color: Array.from(markers.geometry.attributes.color.array) }),
  mainCamera: () => ({ pos: camera.position.toArray(), look: camLook.toArray() }),
  settleCamera() { renderFrame(0, true); },
  mainView() { const v = new THREE.Vector3(); return arena.crafts.map((c) => { v.set(...c.body.pos).project(camera); return [v.x, v.y, v.z]; }); },
  get paused() { return paused; },
  roster: { forget(id) { loaded.delete(id); fillRosters(); }, get choices() { return [...el("pilotF").options].map((o) => ({ id: o.value, disabled: o.disabled })); }, get label() { return pilots.label; }, error: (id) => errors.get(id) || null, loaded: (id) => loaded.has(id), loadChoice: (id, url) => loadChoice(CHOICES.find((c) => c.id === id), url), refill: fillRosters },
};
</script>
