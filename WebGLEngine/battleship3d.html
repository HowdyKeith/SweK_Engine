<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>ABYSS — 3D Battleship</title>
<!-- v822 — universal viewer discovery meta -->

<meta name="demo:desc"   content="3D naval combat with deep-water atmosphere.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --abyss:#04080d; --panel:rgba(6,16,24,.82); --line:#0c2230;
    --sonar:#3fe0d0; --sonar-dim:#1c6b66; --amber:#ffb43f; --hit:#ff4d4d;
    --ink:#bfe9e6; --ghost:#5f8f8c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--abyss);
    font-family:'Share Tech Mono',monospace;color:var(--ink);cursor:crosshair}
  #c{position:fixed;inset:0;display:block}
  /* CRT atmosphere */
  #scan{position:fixed;inset:0;pointer-events:none;z-index:50;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);
    mix-blend-mode:multiply;opacity:.5}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:51;
    background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.72) 100%)}
  .hud{position:fixed;z-index:60;pointer-events:none}
  .panel{background:var(--panel);border:1px solid var(--line);
    box-shadow:0 0 0 1px rgba(63,224,208,.06) inset, 0 8px 30px rgba(0,0,0,.5);
    backdrop-filter:blur(2px)}
  /* title */
  #top{top:16px;left:50%;transform:translateX(-50%);text-align:center}
  #top h1{font-family:'Black Ops One',cursive;font-size:30px;letter-spacing:6px;
    color:var(--sonar);text-shadow:0 0 14px rgba(63,224,208,.55);line-height:1}
  #top .sub{font-size:11px;letter-spacing:5px;color:var(--ghost);margin-top:3px}
  /* turn banner */
  #turn{top:74px;left:50%;transform:translateX(-50%);padding:5px 18px;font-size:13px;
    letter-spacing:3px;border-radius:2px}
  #turn.you{color:var(--sonar);border-color:var(--sonar-dim)}
  #turn.foe{color:var(--amber);border-color:#5a431a}
  /* weapons */
  #arms{left:18px;bottom:18px;padding:12px 12px 10px;width:212px;pointer-events:auto}
  .lbl{font-size:10px;letter-spacing:3px;color:var(--ghost);margin-bottom:8px}
  .wbtn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;margin-bottom:7px;
    background:rgba(8,22,30,.7);border:1px solid var(--line);color:var(--ink);
    font-family:inherit;font-size:13px;letter-spacing:1px;cursor:pointer;text-align:left;
    transition:.15s}
  .wbtn:hover{border-color:var(--sonar-dim);background:rgba(12,34,44,.9)}
  .wbtn.sel{border-color:var(--sonar);color:var(--sonar);box-shadow:0 0 12px rgba(63,224,208,.25) inset}
  .wbtn .k{font-size:18px;width:22px;text-align:center}
  .wbtn .d{font-size:9px;color:var(--ghost);letter-spacing:1px}
  /* fleet status */
  #fleets{right:18px;top:96px;width:216px;padding:12px;pointer-events:none}
  .frow{display:flex;justify-content:space-between;align-items:center;margin:5px 0;font-size:12px}
  .pips{letter-spacing:2px}
  .foehdr{color:var(--hit)} .youhdr{color:var(--sonar)}
  .hr{height:1px;background:var(--line);margin:9px 0}
  /* log */
  #log{right:18px;bottom:18px;width:300px;height:118px;padding:10px 12px;overflow:hidden;
    font-size:11px;line-height:1.55;color:var(--ghost)}
  #log b{color:var(--sonar)} #log .h{color:var(--hit)} #log .a{color:var(--amber)}
  /* help */
  #help{left:50%;bottom:14px;transform:translateX(-50%);font-size:10px;letter-spacing:2px;
    color:var(--ghost);text-align:center}
  /* end overlay */
  #end{position:fixed;inset:0;z-index:80;display:none;place-items:center;
    background:radial-gradient(ellipse at center,rgba(4,8,13,.5),rgba(4,8,13,.94));pointer-events:auto}
  #end .card{text-align:center;padding:40px 56px}
  #end h2{font-family:'Black Ops One',cursive;font-size:52px;letter-spacing:6px;line-height:1.05}
  #end p{margin:14px 0 26px;color:var(--ghost);letter-spacing:2px}
  #again{font-family:'Black Ops One',cursive;letter-spacing:3px;font-size:15px;padding:13px 30px;
    background:transparent;border:1px solid var(--sonar);color:var(--sonar);cursor:pointer;transition:.15s}
  #again:hover{background:var(--sonar);color:#04080d;box-shadow:0 0 24px rgba(63,224,208,.5)}
  .win h2{color:var(--sonar);text-shadow:0 0 26px rgba(63,224,208,.6)}
  .lose h2{color:var(--hit);text-shadow:0 0 26px rgba(255,77,77,.5)}
  /* deployment (setup) */
  #setup{left:50%;bottom:46px;transform:translateX(-50%);padding:12px 14px 10px;width:340px;
    text-align:center;pointer-events:auto;display:none}
  .srow{display:flex;gap:8px;margin-bottom:8px}
  .sbtn{flex:1;font-family:inherit;font-size:12px;letter-spacing:2px;padding:9px 8px;
    background:rgba(8,22,30,.8);border:1px solid var(--line);color:var(--ink);cursor:pointer;transition:.15s}
  .sbtn:hover{border-color:var(--sonar-dim);background:rgba(12,34,44,.95)}
  .sbtn.deploy{width:100%;letter-spacing:3px;color:var(--ghost);border-color:#26414a}
  .sbtn.deploy.ready{color:var(--sonar);border-color:var(--sonar);box-shadow:0 0 16px rgba(63,224,208,.3) inset}
  .sbtn.deploy:disabled{opacity:.55;cursor:not-allowed}
  .shint{font-size:9px;letter-spacing:2px;color:var(--ghost);margin-top:8px}
</style>

<body>
<canvas id="c"></canvas>
<div id="scan"></div><div id="vig"></div>

<div class="hud" id="top"><h1>A B Y S S</h1><div class="sub">3D · NAVAL COMMAND</div></div>
<div class="hud panel" id="turn">— — —</div>

<div class="hud panel" id="arms">
  <div class="lbl">ARMAMENT</div>
  <button class="wbtn sel" data-w="cannon"><span class="k">◎</span><span><div>CANNON</div><div class="d">arcing shell · single cell</div></span></button>
  <button class="wbtn" data-w="torpedo"><span class="k">➤</span><span><div>TORPEDO</div><div class="d">runs the lane · first hull struck</div></span></button>
</div>

<div class="hud panel" id="fleets">
  <div class="frow"><span class="foehdr">◣ ENEMY FLEET</span><span class="pips" id="foePips"></span></div>
  <div id="foeList"></div>
  <div class="hr"></div>
  <div class="frow"><span class="youhdr">◤ YOUR FLEET</span><span class="pips" id="youPips"></span></div>
  <div id="youList"></div>
  <canvas id="fleetcanvas" width="208" height="168" style="width:100%;height:150px;margin-top:6px;display:block;border-top:1px solid var(--line)"></canvas>
  <div class="shint" style="text-align:center;margin-top:2px">live fleet · red = hit · tipped = sunk</div>
</div>

<div class="hud panel" id="log"></div>
<div class="hud" id="help">DRAG to orbit · SCROLL to zoom · CLICK enemy waters to fire</div>

<div class="hud panel" id="setup">
  <div class="lbl">DEPLOYMENT — POSITION YOUR FLEET</div>
  <div class="srow">
    <button class="sbtn" id="rotate">⟳ ROTATE (R)</button>
    <button class="sbtn" id="rand">⤨ RANDOMIZE</button>
  </div>
  <button class="sbtn deploy" id="deploy">⚓ DEPLOY FLEET</button>
  <div class="shint">drag a ship onto your grid · R rotates the last-touched ship</div>
</div>

<div id="end"><div class="card"><h2 id="endH">—</h2><p id="endP">—</p><button id="again">RE-ENGAGE</button></div></div>

<script type="module">
"use strict";
/* v1989 — offline-first: use the engine's vendored three (ESM) with a CDN fallback,
   instead of hard-depending on cdnjs (the game was unloadable on a LAN-only box).
   Guards below pin legacy lighting/color behavior so the look matches r128. */
let THREE;
try { THREE = await import("/vendor/three/three.module.js"); }
catch { THREE = await import("https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.min.js"); }
try { if (THREE.ColorManagement) THREE.ColorManagement.enabled = false; } catch {}

// v4205 -- real shell ballistics. This page is already a module, so the physics is a plain import rather
// than a window shim. See fireCannon() for what it replaced.
import * as BALLISTICS from "/physics/ballistics.mjs";
/* ============================================================
   ABYSS — a 3D remake of Battleship.
   Pure Three.js (r128). No external controls (custom orbit cam).
   Features: animated translucent ocean with sea life beneath,
   cannon shells + lane-running torpedoes, carrier plane strikes
   triggered on a hit, and directional sinking — a ship goes under
   from its most-recently-damaged end, or cracks in half amidships.
   ============================================================ */
const CFG = { N:8, CELL:3, SEA:160 };
const COL = {
  sonar:0x3fe0d0, foe:0xff5544, you:0x6fd6ff, hull:0x3a464d, deck:0x59686f,
  miss:0xeaf6f4, hit:0xff4d4d, water:0x0a3b46, deep:0x041820, sand:0x1d2a25,
};

let renderer, scene, camera, raycaster, pointer = new THREE.Vector2();
let water, waterPos, waterBase, seabed;
const fish = [];
const animators = [];           // {update(dt)=>boolean done}
const pegs = [];                // hit/miss markers, cleared on new game
let hoverMesh = null;

// board geometry: row(r)->Z, col(c)->X. Player near (-Z), enemy far (+Z).
const half = (CFG.N - 1) / 2 * CFG.CELL;
const BOARD = {
  enemy: { ox:-half, oz: 6,           color:COL.foe },
  you:   { ox:-half, oz: 6-(CFG.N+2)*CFG.CELL, color:COL.you },
};
function cellWorld(board, r, c){ return new THREE.Vector3(board.ox + c*CFG.CELL, 0, board.oz + r*CFG.CELL); }

// ---- fleet definitions (classic-ish) ----
const FLEET_DEF = [
  { name:"CARRIER",   len:4 },
  { name:"BATTLESHIP",len:3 },
  { name:"CRUISER",   len:3 },
  { name:"DESTROYER", len:2 },
];

const state = {
  phase:"setup",              // "setup" | "battle" | "over"
  turn:"player", weapon:"cannon", busy:false, over:false,
  playerShots:new Set(), enemyShots:new Set(),
  aiQueue:[],                 // hunt-mode target cells
};
let playerFleet = [], enemyFleet = [];
let dragShip = null, selectedShip = null;   // setup drag-to-place
let statusRenderer=null, statusScene=null, statusCam=null, statusMinis=[];   // fleet-status mini view

// ============================================================ init
function init(){
  const canvas = document.getElementById("c");
  renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  // v1989 — vendored three may be far newer than r128: keep the original lighting/color look.
  try { if ("useLegacyLights" in renderer) renderer.useLegacyLights = true; } catch {}
  try { if ("outputColorSpace" in renderer && THREE.LinearSRGBColorSpace) renderer.outputColorSpace = THREE.LinearSRGBColorSpace; } catch {}

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x05121a);
  scene.fog = new THREE.FogExp2(0x06161f, 0.011);

  camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 600);
  raycaster = new THREE.Raycaster();

  // lights
  const sun = new THREE.DirectionalLight(0xfff0d8, 1.05);
  sun.position.set(40, 70, 20); sun.castShadow = true;
  sun.shadow.mapSize.set(1024,1024); sun.shadow.camera.near=1; sun.shadow.camera.far=220;
  sun.shadow.camera.left=-70; sun.shadow.camera.right=70; sun.shadow.camera.top=70; sun.shadow.camera.bottom=-70;
  scene.add(sun);
  scene.add(new THREE.HemisphereLight(0x8fd6ff, 0x07202a, 0.55));
  scene.add(new THREE.AmbientLight(0x143844, 0.5));

  buildSeabed();
  buildOcean();
  buildSeaLife(22);
  buildBoardLines(BOARD.enemy);
  buildBoardLines(BOARD.you);

  hoverMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(CFG.CELL*0.92, CFG.CELL*0.92),
    new THREE.MeshBasicMaterial({ color:COL.sonar, transparent:true, opacity:0.32, side:THREE.DoubleSide })
  );
  hoverMesh.rotation.x = -Math.PI/2; hoverMesh.position.y = 0.12; hoverMesh.visible=false;
  scene.add(hoverMesh);

  initStatus();
  newGame();
  initOrbit();
  addEventListener("resize", onResize);
  canvas.addEventListener("pointermove", onHover);
  canvas.addEventListener("click", onClick);
  document.querySelectorAll(".wbtn").forEach(b=>b.addEventListener("click",()=>selectWeapon(b.dataset.w)));
  document.getElementById("again").addEventListener("click", newGame);
  document.getElementById("rotate").addEventListener("click", rotateSelected);
  document.getElementById("rand").addEventListener("click", randomizePlayer);
  document.getElementById("deploy").addEventListener("click", deploy);
  addEventListener("keydown", e=>{ if(e.key==="r"||e.key==="R") rotateSelected(); });
}

// ============================================================ ocean + seabed
function buildOcean(){
  const g = new THREE.PlaneGeometry(CFG.SEA, CFG.SEA, 48, 48);
  g.rotateX(-Math.PI/2);
  waterPos = g.attributes.position;
  waterBase = Float32Array.from(waterPos.array);
  const m = new THREE.MeshPhongMaterial({
    color:COL.water, transparent:true, opacity:0.64, shininess:90,
    specular:0x8ffcff, side:THREE.DoubleSide, depthWrite:false,
  });
  water = new THREE.Mesh(g, m); water.renderOrder = 2; scene.add(water);
}
function buildSeabed(){
  const g = new THREE.PlaneGeometry(CFG.SEA, CFG.SEA, 1, 1); g.rotateX(-Math.PI/2);
  seabed = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color:COL.sand, roughness:1 }));
  seabed.position.y = -9; seabed.receiveShadow = true; scene.add(seabed);
}
function buildSeaLife(n){
  const bodyG = new THREE.ConeGeometry(0.32, 1.5, 6); bodyG.rotateZ(-Math.PI/2);
  for(let i=0;i<n;i++){
    const hue = 0.5 + Math.random()*0.12;
    const m = new THREE.MeshStandardMaterial({ color:new THREE.Color().setHSL(hue,0.6,0.55),
      emissive:new THREE.Color().setHSL(hue,0.7,0.12), roughness:0.6 });
    const f = new THREE.Mesh(bodyG, m);
    const tail = new THREE.Mesh(new THREE.ConeGeometry(0.34,0.7,4),
      new THREE.MeshStandardMaterial({ color:m.color, roughness:0.6 }));
    tail.rotation.z = Math.PI/2; tail.position.x = -0.95; f.add(tail);
    f.userData = {
      c:new THREE.Vector3((Math.random()-0.5)*90, -2-Math.random()*5, (Math.random()-0.5)*90),
      rad:6+Math.random()*16, sp:0.25+Math.random()*0.5, ph:Math.random()*7, bob:Math.random()*6,
    };
    scene.add(f); fish.push(f);
  }
}
function updateOcean(t){
  const a = waterPos.array, b = waterBase;
  for(let i=0;i<a.length;i+=3){
    const x=b[i], z=b[i+2];
    a[i+1] = Math.sin(x*0.12 + t*1.1)*0.45 + Math.cos(z*0.15 + t*0.9)*0.4 + Math.sin((x+z)*0.07 + t*0.6)*0.3;
  }
  waterPos.needsUpdate = true; water.geometry.computeVertexNormals();
}
function updateFish(t,dt){
  for(const f of fish){
    const u=f.userData; const ang=t*u.sp + u.ph;
    const x=u.c.x+Math.cos(ang)*u.rad, z=u.c.z+Math.sin(ang)*u.rad;
    const y=u.c.y+Math.sin(t*0.8+u.bob)*0.6;
    f.position.set(x,y,z);
    f.lookAt(x-Math.sin(ang)*u.rad, y, z+Math.cos(ang)*u.rad);
    f.children[0].rotation.y = Math.sin(t*8+u.ph)*0.5; // tail wag
  }
}

// ============================================================ board grid lines
function buildBoardLines(board){
  const N=CFG.N, C=CFG.CELL, mat=new THREE.LineBasicMaterial({ color:board.color, transparent:true, opacity:0.30 });
  const pts=[]; const x0=board.ox-C/2, z0=board.oz-C/2, x1=board.ox+(N-0.5)*C, z1=board.oz+(N-0.5)*C;
  for(let i=0;i<=N;i++){ const x=x0+i*C; pts.push(new THREE.Vector3(x,0.05,z0),new THREE.Vector3(x,0.05,z1)); }
  for(let i=0;i<=N;i++){ const z=z0+i*C; pts.push(new THREE.Vector3(x0,0.05,z),new THREE.Vector3(x1,0.05,z)); }
  const g=new THREE.BufferGeometry().setFromPoints(pts);
  scene.add(new THREE.LineSegments(g,mat));
}

// ============================================================ ships
// ---- ship model kit (procedural, per-segment so sinking/cracking still works) ----
const SP = { steel:0x47565e, steelHi:0x5d6f77, deck:0x4a5a55, gun:0x2b3537, island:0x6c7e85, detail:0x82949b, funnel:0x3a4248, carrierDeck:0x2c3633, stripe:0xc9b23a };
function smat(color,o={}){ return new THREE.MeshStandardMaterial({ color, roughness:o.r??0.65, metalness:o.m??0.35 }); }
function sbox(w,h,d,color,o){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), smat(color,o)); m.castShadow=true; return m; }
function scyl(rt,rb,h,seg,color,o){ const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), smat(color,o)); m.castShadow=true; return m; }
function makeProw(len,width,height){
  const s=new THREE.Shape(); s.moveTo(-len,0); s.lineTo(0,width/2); s.lineTo(0,-width/2); s.closePath();
  const g=new THREE.ExtrudeGeometry(s,{depth:height,bevelEnabled:false}); g.rotateX(-Math.PI/2); return g;
}
function mkTurret(scale,barrels,face){
  const g=new THREE.Group();
  const base=scyl(0.30*scale,0.38*scale,0.2,12,SP.gun,{m:0.5}); base.position.y=0.1; g.add(base);
  const house=sbox(0.6*scale,0.36*scale,0.74*scale,0x37434a,{m:0.5}); house.position.y=0.34; g.add(house);
  for(let b=0;b<barrels;b++){ const bar=scyl(0.045,0.045,0.85*scale,8,SP.gun); bar.rotation.z=Math.PI/2;
    bar.position.set(face*0.5*scale,0.36,(b-(barrels-1)/2)*0.16*scale); g.add(bar); }
  return g;
}
function mkBridge(){
  // v4205 -- THESE THREE LINES CRASHED THE PAGE ON LOAD, AND HAD SINCE THEY WERE WRITTEN.
  // Object.assign(mesh,{position:...}) tries to REPLACE Object3D.position, which three.js has defined as a
  // read-only accessor since r15x -- so it threw "Cannot assign to read only property 'position'" inside
  // init() -> newGame() -> placeFleet() -> makeShipMesh() -> buildShipBody() -> decorateSegment() ->
  // mkBridge(), before a single frame was drawn. Measured: the main canvas held 0 lit pixels and exactly 1
  // distinct colour. Every other mesh in this file uses .position.set(), which is what these now do.
  const g=new THREE.Group();
  const isle1=sbox(0.78,0.5,0.95,SP.island); isle1.position.set(0,0.25,0); g.add(isle1);
  const isle2=sbox(0.55,0.42,0.66,SP.island); isle2.position.set(0,0.7,0); g.add(isle2);
  const isle3=sbox(0.34,0.32,0.42,SP.detail); isle3.position.set(0,1.07,0); g.add(isle3);
  const mast=scyl(0.035,0.035,0.9,6,SP.detail); mast.position.y=1.6; g.add(mast);
  return g;
}
function mkFunnel(){ const g=new THREE.Group();
  const f=scyl(0.17,0.21,0.62,10,SP.funnel,{m:0.4}); f.position.y=0.55; f.rotation.x=-0.08; g.add(f);
  const cap=scyl(0.19,0.19,0.05,10,0x20262a); cap.position.y=0.86; g.add(cap); return g; }
function mkMiniPlane(){ const g=new THREE.Group();
  g.add(sbox(0.5,0.07,0.1,0xb9c4c4)); g.add(sbox(0.12,0.04,0.46,0x9fb0b0));
  const t=sbox(0.1,0.04,0.22,0x9fb0b0); t.position.x=-0.2; g.add(t); return g; }

function decorateSegment(ship,i,seg,ctx){
  const {midIdx,last}=ctx, T=ship.name, sb=CFG.CELL*0.32;
  if(T==="CARRIER"){
    const fd=sbox(CFG.CELL*0.99,0.07,CFG.CELL*0.84,SP.carrierDeck,{r:0.95}); fd.position.y=0.72; seg.add(fd);
    const stripe=sbox(CFG.CELL*0.9,0.02,0.12,SP.stripe,{r:0.6}); stripe.position.y=0.76; seg.add(stripe);
    if(i===1){ const island=sbox(0.42,0.72,0.5,SP.island); island.position.set(0,1.05,sb); seg.add(island);
      const fn=mkFunnel(); fn.scale.setScalar(0.6); fn.position.set(-0.22,0.78,sb); seg.add(fn);
      const mast=scyl(0.03,0.03,0.7,6,SP.detail); mast.position.set(0.1,1.6,sb); seg.add(mast); }
    if(i===2||i===last){ const p=mkMiniPlane(); p.position.set(0.2,0.8,-0.4); p.rotation.y=0.35; seg.add(p); }
  } else if(T==="BATTLESHIP"){
    if(i===0){ const t=mkTurret(1.15,3,-1); t.position.y=0.66; seg.add(t); }
    if(i===midIdx){ const b=mkBridge(); b.position.y=0.66; seg.add(b);
      const f1=mkFunnel(); f1.position.set(0.42,0.5,0); seg.add(f1); const f2=mkFunnel(); f2.position.set(-0.18,0.5,0); seg.add(f2); }
    if(i===last){ const t=mkTurret(1.15,3,1); t.position.y=0.66; seg.add(t); }
  } else if(T==="CRUISER"){
    if(i===0){ const t=mkTurret(0.92,2,-1); t.position.y=0.66; seg.add(t); }
    if(i===midIdx){ const b=mkBridge(); b.scale.setScalar(0.85); b.position.y=0.66; seg.add(b);
      const f=mkFunnel(); f.position.set(0.1,0.5,0); seg.add(f); }
    if(i===last){ const t=mkTurret(0.92,2,1); t.position.y=0.66; seg.add(t); }
  } else { // DESTROYER
    if(i===0){ const t=mkTurret(0.8,1,-1); t.position.y=0.66; seg.add(t); }
    if(i===last){ const b=mkBridge(); b.scale.setScalar(0.7); b.position.set(-0.15,0.66,0); seg.add(b);
      const f=mkFunnel(); f.scale.setScalar(0.85); f.position.set(0.35,0.5,0); seg.add(f); }
  }
}

// builds the per-segment visual body (centered at local origin). Reused by the
// board ships AND the fleet-status mini view.
function buildShipBody(name, len){
  const grp=new THREE.Group(); const segMeshes=[];
  const W=CFG.CELL*0.58, L=CFG.CELL*0.98, last=len-1, midIdx=Math.floor(len/2);
  for(let i=0;i<len;i++){
    const localOff=(i-(len-1)/2)*CFG.CELL;
    const seg=new THREE.Group(); const isBow=(i===0), isStern=(i===last);
    const lower=sbox(L,0.5,W,SP.steel,{r:0.7,m:0.3}); lower.position.y=0; seg.add(lower);
    const upper=sbox(L*0.98,0.4,W*0.8,SP.steelHi,{r:0.7}); upper.position.y=0.42; seg.add(upper);
    const deck=sbox(L*0.95,0.06,W*0.74,SP.deck,{r:0.92}); deck.position.y=0.62; seg.add(deck);
    if(isBow){ const prow=new THREE.Mesh(makeProw(W*0.95,W,0.55), smat(SP.steel,{r:0.7,m:0.3}));
      prow.position.set(-L*0.5,-0.05,0); prow.castShadow=true; seg.add(prow);
      const fdeck=new THREE.Mesh(makeProw(W*0.9,W*0.74,0.06), smat(SP.deck,{r:0.92})); fdeck.position.set(-L*0.5,0.6,0); seg.add(fdeck); }
    if(isStern){ const tr=sbox(L*0.28,0.34,W*0.82,SP.steel,{r:0.7}); tr.position.set(L*0.52,0.05,0); seg.add(tr); }
    decorateSegment({name,len}, i, seg, {midIdx,last});
    seg.position.x=localOff; seg.userData.localOff=localOff;
    grp.add(seg); segMeshes.push(seg);
  }
  return { grp, segMeshes };
}

function makeShipMesh(board, ship){
  const { grp, segMeshes } = buildShipBody(ship.name, ship.len);
  ship.segMeshes = segMeshes; ship.group = grp;
  const c0 = cellWorld(board, ship.r, ship.c);
  const off = (ship.len-1)/2 * CFG.CELL; const center = c0.clone();
  if(ship.axis==="x") center.x += off; else center.z += off;
  grp.position.copy(center); grp.position.y = 0.30;
  if(ship.axis==="z") grp.rotation.y = Math.PI/2;
  ship.center = center.clone(); grp.userData.ship = ship;
  if(ship.side==="enemy") grp.visible = true, grp.traverse(o=>{ if(o.material){ o.material.transparent=true; o.material.opacity=0.0; } if(o.isMesh) o.castShadow=false; });   // v1989 — castShadow OFF while hidden: opacity-0 hulls still cast shadows onto the seabed, visible through the water — the whole enemy layout leaked
  scene.add(grp);
}

function placeFleet(side){
  const board = BOARD[side];
  const fleet=[]; const occupied=new Set();
  for(const def of FLEET_DEF){
    let placed=false, guard=0;
    while(!placed && guard++<400){
      const axis = Math.random()<0.5?"x":"z";
      const r = Math.floor(Math.random()*(axis==="z"?CFG.N-def.len+1:CFG.N));
      const c = Math.floor(Math.random()*(axis==="x"?CFG.N-def.len+1:CFG.N));
      const cells=[];
      for(let i=0;i<def.len;i++) cells.push(axis==="x"?`${r},${c+i}`:`${r+i},${c}`);
      if(cells.some(k=>occupied.has(k))) continue;
      cells.forEach(k=>occupied.add(k));
      const ship={ name:def.name, len:def.len, side, axis, r, c, cells,
        hits:new Array(def.len).fill(false), hp:def.len, lastHitSeg:-1, sunk:false };
      makeShipMesh(board, ship); fleet.push(ship); placed=true;
    }
  }
  return fleet;
}
function cellToSeg(ship, r, c){
  for(let i=0;i<ship.cells.length;i++){ const [rr,cc]=ship.cells[i].split(",").map(Number); if(rr===r&&cc===c) return i; }
  return -1;
}
function shipAt(fleet, r, c){ const key=`${r},${c}`; return fleet.find(s=>s.cells.includes(key)) || null; }

// ============================================================ pegs / fx
function dropPeg(board, r, c, hit){
  const p=cellWorld(board,r,c);
  const peg=new THREE.Mesh(new THREE.SphereGeometry(0.34,12,12),
    new THREE.MeshStandardMaterial({ color:hit?COL.hit:COL.miss, emissive:hit?0x661010:0x0,
      emissiveIntensity:0.6, roughness:0.4 }));
  peg.position.set(p.x, 0.3, p.z); peg.castShadow=true; scene.add(peg);
  const stick=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.6,6),
    new THREE.MeshStandardMaterial({color:0xdfe9e7})); stick.position.set(p.x,0,p.z); scene.add(stick);
  pegs.push(peg, stick);
}
function burst(pos, color, n, opts={}){
  const sp=opts.spread||3, up=opts.up||4, ttl=opts.ttl||0.9, size=opts.size||0.4;
  for(let i=0;i<n;i++){
    const m=new THREE.Mesh(new THREE.SphereGeometry(size*(0.5+Math.random()),6,6),
      new THREE.MeshBasicMaterial({color, transparent:true}));
    m.position.copy(pos); scene.add(m);
    const v=new THREE.Vector3((Math.random()-0.5)*sp, Math.random()*up, (Math.random()-0.5)*sp);
    let t=0; animators.push({update(dt){ t+=dt; v.y-=9*dt;
      m.position.addScaledVector(v,dt); m.material.opacity=Math.max(0,1-t/ttl);
      if(t>=ttl){ scene.remove(m); return true;} return false; }});
  }
}
function splash(pos){ burst(pos, 0xcfeefc, 16, {spread:2.4,up:5,ttl:0.8,size:0.35}); }
function explode(pos){ burst(pos, 0xffb43f, 22, {spread:3.4,up:6,ttl:1.0,size:0.5});
  burst(pos, 0xff4d4d, 14, {spread:2,up:4,ttl:0.8,size:0.4}); }

// ============================================================ weapons
// v4205 -- A REAL SHELL. This used to be `lerpVectors(from,target,u)` with `Math.sin(u*Math.PI)*peak`
// added on top: a straight line with a sine hump, `peak=14` and `dur=1.05` CONSTANT. The arc height and the
// time of flight were identical whether the target was one cell away or across the board, there was no
// launch angle, and therefore no lob-versus-flat choice -- which is the entire tactical content of a gun.
//
// Now physics/ballistics.mjs solves the elevation that puts the shell on the cell, and the shell FALLS.
// Consequences you can see: a far shot takes visibly longer than a near one, the apex scales with range,
// and LOB vs FLAT is a real choice -- the lob hangs and drops steeply onto the deck, the flat one gets
// there fast. GUN_V is the muzzle velocity, so raising it flattens every trajectory at once, the way it
// does on a real gun.
function fireCannon(board, r, c, onArrive, arc){
  const target=cellWorld(board,r,c); target.y=0.4;
  const from=new THREE.Vector3(target.x*0.2, 1.0, BOARD.you.oz - 6); // from your side
  const shell=new THREE.Mesh(new THREE.SphereGeometry(0.28,10,10),
    new THREE.MeshStandardMaterial({color:0x222,emissive:0x554422,emissiveIntensity:0.4}));
  scene.add(shell);

  // Solve in the vertical plane containing gun and target: horizontal range and the rise to the target.
  const dx=target.x-from.x, dz=target.z-from.z;
  const range=Math.hypot(dx,dz), rise=target.y-from.y;
  const dirx=range>1e-6?dx/range:0, dirz=range>1e-6?dz/range:1;
  const prefer=(arc||state.arc||"lob");
  const sol=BALLISTICS.launchAngles(range, rise, GUN_V, GUN_G);
  // Out of range at this muzzle velocity is a real answer, not a crash: fall back to the max-range
  // elevation so the shell still flies and visibly falls SHORT, which is the honest picture.
  const elev = sol ? (prefer==="flat"?sol.flat:sol.lob) : Math.PI/4;
  const vh=GUN_V*Math.cos(elev), vv=GUN_V*Math.sin(elev);

  let sh={x:from.x, y:from.y, z:from.z, vx:dirx*vh, vy:vv, vz:dirz*vh, t:0};
  animators.push({update(dt){
    // Fixed sub-steps so the flight does not depend on the frame rate -- the same discipline
    // render/liquefyModel.mjs uses for its decay.
    const H=1/240; let left=Math.min(dt,0.05);
    while(left>0){ const h=Math.min(H,left); sh=BALLISTICS.stepShell(sh,h,{gravity:GUN_G}); left-=h; }
    shell.position.set(sh.x,sh.y,sh.z);
    if(sh.y<=target.y && sh.vy<0){ scene.remove(shell); onArrive(); return true; }
    if(sh.t>12){ scene.remove(shell); onArrive(); return true; }   // safety net, never reached in practice
    return false;
  }});
}
// Muzzle velocity and gravity for the cannon, in board units. GUN_V is the one knob that changes the feel
// of every shot: raise it and every trajectory flattens, exactly as it would on a real gun.
const GUN_V=22, GUN_G=9.80665;

function fireTorpedo(board, r, c, onArrive){
  // runs the lane (constant heading toward the cell) just under the surface,
  // detonates on the FIRST occupied hull along the way, else the target cell.
  const target=cellWorld(board,r,c);
  const from=cellWorld(board, -1.4, c); // launch just outside the board, same column
  const tube=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.22,1.4,10),
    new THREE.MeshStandardMaterial({color:0x394b46,metalness:0.5,roughness:0.5}));
  tube.rotation.x=Math.PI/2; tube.position.copy(from); tube.position.y=-0.25; scene.add(tube);
  let t=0; const speed=22; const dist=from.distanceTo(target); const dur=Math.max(0.5,dist/speed);
  const fleet = board===BOARD.enemy ? enemyFleet : playerFleet;
  let hitRow=r;
  // v1989 — first INTACT hull segment in this column (was: first ship cell, INCLUDING
  // already-hit/sunk segments — resolveStrike's "already" branch then did nothing: no peg,
  // no log, no shot recorded, and every torpedo in a column with a wreck was wasted forever).
  // Torpedoes now run past destroyed hulls to the first live segment short of the target.
  for(let rr=0; rr<=r; rr++){ const s=shipAt(fleet,rr,c); if(s && !s.hits[cellToSeg(s,rr,c)]){ hitRow=rr; break; } }
  const realTarget=cellWorld(board,hitRow,c);
  animators.push({update(dt){ t+=dt; const u=Math.min(1,t/(Math.max(0.4,from.distanceTo(realTarget)/speed)));
    tube.position.lerpVectors(from,realTarget,u); tube.position.y=-0.25+Math.sin(t*18)*0.05;
    if(Math.random()<0.6) burst(new THREE.Vector3(tube.position.x,0.05,tube.position.z),0xdff4ff,1,{spread:0.4,up:0.6,ttl:0.5,size:0.18});
    if(u>=1){ scene.remove(tube); onArrive(hitRow); return true;} return false; }});
}

// ============================================================ carrier plane strike
function carrierAlive(fleet){ return fleet.some(s=>s.name==="CARRIER" && !s.sunk); }
function launchPlaneStrike(attackerSide, board, r, c){
  // a plane lifts from the attacker's carrier, sweeps over, drops a bomb on an
  // adjacent enemy cell for bonus damage, then climbs away.
  const plane=new THREE.Group();
  const body=new THREE.Mesh(new THREE.ConeGeometry(0.4,2.4,8),new THREE.MeshStandardMaterial({color:0xced8d8,metalness:0.4,roughness:0.5}));
  body.rotation.x=Math.PI/2; plane.add(body);
  const wing=new THREE.Mesh(new THREE.BoxGeometry(3.4,0.12,0.7),new THREE.MeshStandardMaterial({color:0x9fb0b0})); plane.add(wing);
  scene.add(plane);
  const tgt=cellWorld(board,r,c); tgt.y=10;
  const start=new THREE.Vector3(tgt.x-26, 18, tgt.z-22), end=new THREE.Vector3(tgt.x+26, 16, tgt.z+22);
  let t=0; const dur=2.2; let dropped=false;
  animators.push({update(dt){ t+=dt; const u=Math.min(1,t/dur);
    plane.position.lerpVectors(start,end,u); plane.position.y += Math.sin(u*Math.PI)* -4; // dip over target
    plane.lookAt(end.x,plane.position.y,end.z);
    if(!dropped && u>0.5){ dropped=true;
      // bonus bomb on a random adjacent enemy cell
      const fleet = board===BOARD.enemy?enemyFleet:playerFleet;
      const adj=[[r-1,c],[r+1,c],[r,c-1],[r,c+1]].filter(([rr,cc])=>rr>=0&&rr<CFG.N&&cc>=0&&cc<CFG.N);
      const pick=adj[Math.floor(Math.random()*adj.length)];
      if(pick){ const bp=cellWorld(board,pick[0],pick[1]); bp.y=0.4;
        const bomb=new THREE.Mesh(new THREE.SphereGeometry(0.25,8,8),new THREE.MeshStandardMaterial({color:0x111})); 
        bomb.position.set(plane.position.x,plane.position.y,plane.position.z); scene.add(bomb);
        const bs=bomb.position.clone(); let bt=0;
        animators.push({update(d2){ bt+=d2; const bu=Math.min(1,bt/0.7); bomb.position.lerpVectors(bs,bp,bu);
          if(bu>=1){ scene.remove(bomb); resolveStrike(board,pick[0],pick[1],attackerSide,true); return true;} return false; }});
      }
    }
    if(u>=1){ scene.remove(plane); return true;} return false; }});
  log(`<span class="a">✈ ${attackerSide==="player"?"Your":"Enemy"} carrier launches a strike!</span>`);
}

// ============================================================ resolve a shot
function resolveStrike(board, r, c, attackerSide, isBonus){
  const fleet = board===BOARD.enemy ? enemyFleet : playerFleet;
  const shotSet = board===BOARD.enemy ? state.playerShots : state.enemyShots;
  const key=`${r},${c}`;
  const pos=cellWorld(board,r,c); pos.y=0.3;
  const ship=shipAt(fleet,r,c);
  const seg = ship ? cellToSeg(ship,r,c) : -1;
  const already = ship && seg>=0 && ship.hits[seg];

  if(ship && seg>=0 && !already){
    ship.hits[seg]=true; ship.lastHitSeg=seg; ship.hp--;
    revealEnemySeg(ship, seg);
    explode(pos); dropPeg(board,r,c,true);
    shotSet.add(key);   // v1989 — bonus strikes count too: the peg drops either way, but the key was skipped for isBonus, so a later shot on this cell hit the "already" branch and was silently eaten
    log(`${attackerSide==="player"?"<b>HIT</b>":'<span class="h">HIT</span>'} ${ship.name} @ ${cellName(r,c)}${isBonus?' <span class="a">(air strike)</span>':""}`);
    if(ship.hp<=0){ sinkShip(ship, board); log(`${ship.name} <span class="h">SUNK</span>!`);
      if(board===BOARD.you) state.aiQueue.length=0;   // v1989 — AI stops hunting a ship that just died instead of poking around the wreck
    }
    // a strike begets a strike: carrier scrambles planes when a hull is hit
    if(!isBonus && carrierAlive(attackerSide==="player"?playerFleet:enemyFleet)){
      setTimeout(()=>launchPlaneStrike(attackerSide, board, r, c), 250);
    }
    refreshFleets(); checkWin();
    return true;            // hit
  } else if(!already){
    splash(pos); dropPeg(board,r,c,false);
    shotSet.add(key);   // v1989 — record bonus misses as well (see above)
    if(!isBonus) log(`${attackerSide==="player"?"miss":"enemy misses"} @ ${cellName(r,c)}`);
  } else if(attackerSide==="player"){
    log(`waters at ${cellName(r,c)} already struck — reposition, Commander`);   // v1989 — the old silent path
  }
  return false;             // miss
}
function revealEnemySeg(ship, seg){
  if(ship.side!=="enemy") return;
  ship.segMeshes[seg].traverse(o=>{ if(o.material){ o.material.opacity=1; o.material.color&&o.material.color.lerp(new THREE.Color(COL.foe),0.25); } if(o.isMesh) o.castShadow=true; });   // v1989 — shadow returns with the reveal
}

// ============================================================ DIRECTIONAL SINK
function sinkShip(ship, board){
  ship.sunk = true;
  // reveal the whole hull
  ship.group.traverse(o=>{ if(o.material) o.material.opacity=1; if(o.isMesh) o.castShadow=true; });
  const len=ship.len;
  const last = ship.lastHitSeg<0 ? len-1 : ship.lastHitSeg;
  const frac = len>1 ? last/(len-1) : 0;
  const amidships = len>=3 && frac>0.30 && frac<0.70;

  if(amidships){
    crackInHalf(ship);
  } else {
    // the end nearest the killing blow goes under first.
    // segment local offset sign tells us which end (local +/- along hull axis).
    const sign = ship.segMeshes[last].userData.localOff >= 0 ? 1 : -1;
    endSink(ship, sign);
  }
}
// tilt the whole hull so one end dips, then slide under and fade
function endSink(ship, sign){
  const grp=ship.group; let t=0; const dur=3.4;
  // because vertical ships are yawed 90°, tilting about local Z always dips along the hull length
  animators.push({update(dt){ t+=dt; const u=Math.min(1,t/dur); const e=u*u;
    grp.rotation.z = -sign * e * 0.95;          // pitch the hull end down
    grp.rotation.x += dt*0.10;                  // slow roll
    grp.position.y = 0.35 - e*7;                // settle beneath the surface
    grp.traverse(o=>{ if(o.material){ o.material.transparent=true; o.material.opacity=Math.max(0,1-e*1.1);} });
    if(u<0.18) splashFoamAround(ship);
    if(u>=1){ scene.remove(grp); return true;} return false; }});
}
// split at midship into two halves that rotate apart at the break and go down
function crackInHalf(ship){
  const breakIdx=Math.floor(ship.len/2);              // stern half starts here
  const grp=ship.group;
  const bow=new THREE.Group(), stern=new THREE.Group();
  grp.add(bow); grp.add(stern);
  // break point in local hull coords (midpoint between the two halves)
  const breakOff = (breakIdx-0.5-(ship.len-1)/2)*CFG.CELL;
  bow.position.set(0,0,0); stern.position.set(0,0,0);
  ship.segMeshes.forEach((seg,i)=>{
    const tgt = i<breakIdx ? bow : stern;
    tgt.add(seg); // keep local offset; we rotate the halves about the break via a pivot offset
  });
  // pivot trick: rotate each half around the break point
  let t=0; const dur=3.6;
  animators.push({update(dt){ t+=dt; const u=Math.min(1,t/dur); const e=u*u;
    rotateAround(bow,   breakOff, +e*0.9);
    rotateAround(stern, breakOff, -e*0.9);
    grp.position.y = 0.35 - e*7.5;
    grp.traverse(o=>{ if(o.material){ o.material.transparent=true; o.material.opacity=Math.max(0,1-e*1.05);} });
    if(u<0.2) splashFoamAround(ship);
    if(u>=1){ scene.remove(grp); return true;} return false; }});
  log(`<span class="h">${ship.name} breaks apart amidships!</span>`);
}
// rotate a half-group about a local hull-X pivot so its broken end dips down
function rotateAround(halfGrp, pivotX, ang){
  halfGrp.rotation.z = ang;
  // shift so the pivot (break point) stays put while the far end swings down
  halfGrp.position.x = pivotX - pivotX*Math.cos(ang);
  halfGrp.position.y = -pivotX*Math.sin(ang)* (pivotX>=0?1:1);
}
function splashFoamAround(ship){
  const p=ship.group.position.clone(); p.y=0.1;
  burst(p, 0xddf4ff, 4, {spread:CFG.CELL*ship.len*0.4, up:2.2, ttl:0.7, size:0.3});
}

// ============================================================ FLEET STATUS (mini 3D view)
function initStatus(){
  const cv=document.getElementById("fleetcanvas"); if(!cv) return;
  statusRenderer=new THREE.WebGLRenderer({ canvas:cv, alpha:true, antialias:true });
  statusRenderer.setPixelRatio(Math.min(devicePixelRatio,2));
  const w=cv.clientWidth||208, h=cv.clientHeight||150;
  statusRenderer.setSize(w,h,false);
  statusScene=new THREE.Scene();
  statusCam=new THREE.PerspectiveCamera(34, w/h, 0.1, 100);
  statusCam.position.set(0,12,13); statusCam.lookAt(0,0,0);
  statusScene.add(new THREE.HemisphereLight(0x9fd6ff,0x10202a,1.05));
  const d=new THREE.DirectionalLight(0xffffff,0.9); d.position.set(6,11,6); statusScene.add(d);
}
function buildStatusMinis(){
  if(!statusScene) return;
  for(const m of statusMinis) statusScene.remove(m.grp); statusMinis=[];
  const slots=[[-5,-2.8],[5,-2.8],[-5,2.8],[5,2.8]];   // 2×2 roster
  playerFleet.forEach((s,i)=>{
    const { grp, segMeshes }=buildShipBody(s.name,s.len);
    grp.scale.setScalar(0.3); const sl=slots[i]||[0,0]; grp.position.set(sl[0],0,sl[1]);
    statusScene.add(grp);
    statusMinis.push({ ship:s, grp, segMeshes, sunkApplied:false, tilt:0 });
  });
}
function updateStatus(dt){
  if(!statusMinis.length) return;
  for(const m of statusMinis){ const s=m.ship;
    m.segMeshes.forEach((seg,i)=>{ const hit=s.hits[i];
      seg.traverse(o=>{ if(o.isMesh&&o.material&&o.material.emissive) o.material.emissive.setHex(hit?0x6a1414:0x000000); }); });
    if(!s.sunk){ m.grp.rotation.y += dt*0.5; }
    else{
      if(!m.sunkApplied){ m.sunkApplied=true;
        const sign=(s.lastHitSeg>=0 && m.segMeshes[s.lastHitSeg].userData.localOff>=0)?1:-1; m.tilt=-sign*0.6; }
      m.grp.rotation.z += (m.tilt-m.grp.rotation.z)*0.1;
      m.grp.position.y += (-2.6-m.grp.position.y)*0.06;
      m.grp.traverse(o=>{ if(o.isMesh&&o.material){ o.material.transparent=true;
        o.material.opacity=Math.max(0.35,(o.material.opacity??1)-dt*0.35);
        if(o.material.color) o.material.color.lerp(new THREE.Color(0x33383b),0.02); } });
    }
  }
}

// ============================================================ SETUP / drag-to-place
function createPlayerFleet(){
  const fleet=[]; let row=0;
  for(const def of FLEET_DEF){
    const ship={ name:def.name, len:def.len, side:"you", axis:"x", r:row, c:0,
      cells:[], hits:new Array(def.len).fill(false), hp:def.len, lastHitSeg:-1, sunk:false };
    for(let i=0;i<def.len;i++) ship.cells.push(`${row},${i}`);
    makeShipMesh(BOARD.you, ship);
    fleet.push(ship); row+=2;
  }
  return fleet;
}
// reposition an existing ship's group + recompute its cells (no mesh rebuild)
function setShipPlacement(ship, r, c, axis){
  ship.r=r; ship.c=c; ship.axis=axis; ship.cells=[];
  for(let i=0;i<ship.len;i++) ship.cells.push(axis==="x"?`${r},${c+i}`:`${r+i},${c}`);
  const c0=cellWorld(BOARD.you, r, c); const off=(ship.len-1)/2*CFG.CELL; const center=c0.clone();
  if(axis==="x") center.x+=off; else center.z+=off;
  ship.group.position.set(center.x, 0.35, center.z);
  ship.group.rotation.set(0, axis==="z"?Math.PI/2:0, 0);
  ship.center=center.clone();
}
function placementValid(ship){
  for(const k of ship.cells){ const [r,c]=k.split(",").map(Number); if(r<0||r>=CFG.N||c<0||c>=CFG.N) return false; }
  for(const o of playerFleet){ if(o===ship) continue; if(ship.cells.some(k=>o.cells.includes(k))) return false; }
  return true;
}
function tintShip(ship, ok){ ship.group.traverse(o=>{ if(o.isMesh&&o.material&&o.material.emissive) o.material.emissive.setHex(ok?0x0a3a1e:0x4a1010); }); }
function clearTint(ship){ ship.group.traverse(o=>{ if(o.isMesh&&o.material&&o.material.emissive) o.material.emissive.setHex(0x000000); }); }
function refreshDeploy(){ const ok=playerFleet.every(placementValid);
  const b=document.getElementById("deploy"); b.disabled=!ok; b.classList.toggle("ready",ok); }

function setPointer(e){ pointer.x=(e.clientX/innerWidth)*2-1; pointer.y=-(e.clientY/innerHeight)*2+1; }
function pickBoardCell(board){
  raycaster.setFromCamera(pointer,camera);
  const plane=new THREE.Plane(new THREE.Vector3(0,1,0),0); const hit=new THREE.Vector3();
  if(!raycaster.ray.intersectPlane(plane,hit)) return null;
  return { r:Math.round((hit.z-board.oz)/CFG.CELL), c:Math.round((hit.x-board.ox)/CFG.CELL) };
}
function grabShip(){
  raycaster.setFromCamera(pointer,camera);
  const meshes=[]; playerFleet.forEach(s=>s.group.traverse(o=>{ if(o.isMesh) meshes.push(o); }));
  const hit=raycaster.intersectObjects(meshes,false)[0]; if(!hit) return false;
  let o=hit.object; while(o){ if(o.userData&&o.userData.ship){ dragShip=o.userData.ship; break; } o=o.parent; }
  if(!dragShip) return false; selectedShip=dragShip; return true;
}
function moveDraggedShip(){
  const cell=pickBoardCell(BOARD.you); if(!cell) return;
  let r=cell.r, c=cell.c;
  if(dragShip.axis==="x"){ c=clamp(c,0,CFG.N-dragShip.len); r=clamp(r,0,CFG.N-1); }
  else { r=clamp(r,0,CFG.N-dragShip.len); c=clamp(c,0,CFG.N-1); }
  setShipPlacement(dragShip,r,c,dragShip.axis); tintShip(dragShip,placementValid(dragShip));
}
function dropShip(){ if(!dragShip) return; tintShip(dragShip,placementValid(dragShip)); dragShip=null; refreshDeploy(); }
function rotateSelected(){
  if(state.phase!=="setup") return; const s=selectedShip||dragShip; if(!s) return;
  const axis = s.axis==="x"?"z":"x"; let r=s.r, c=s.c;
  if(axis==="x") c=clamp(c,0,CFG.N-s.len); else r=clamp(r,0,CFG.N-s.len);
  setShipPlacement(s, clamp(r,0,CFG.N-1), clamp(c,0,CFG.N-1), axis);
  tintShip(s,placementValid(s)); refreshDeploy();
}
function randomizePlayer(){
  const occ=new Set();
  for(const s of playerFleet){ let done=false,guard=0;
    while(!done && guard++<400){
      const axis=Math.random()<0.5?"x":"z";
      const r=Math.floor(Math.random()*(axis==="z"?CFG.N-s.len+1:CFG.N));
      const c=Math.floor(Math.random()*(axis==="x"?CFG.N-s.len+1:CFG.N));
      const cells=[]; for(let i=0;i<s.len;i++) cells.push(axis==="x"?`${r},${c+i}`:`${r+i},${c}`);
      if(cells.some(k=>occ.has(k))) continue;
      cells.forEach(k=>occ.add(k)); setShipPlacement(s,r,c,axis); tintShip(s,true); done=true;
    }
  }
  refreshDeploy();
}
function enterSetup(){
  state.phase="setup"; state.over=false; state.busy=false; dragShip=null; selectedShip=null;
  document.getElementById("setup").style.display="block";
  document.getElementById("end").style.display="none";
  const el=document.getElementById("turn"); el.className="hud panel you"; el.textContent="◤ DEPLOY YOUR FLEET";
  document.getElementById("help").textContent="DRAG your ships onto the grid · R to rotate · drag empty water to orbit";
  playerFleet.forEach(s=>tintShip(s,placementValid(s)));
  cam.tgt.set(0,0,BOARD.you.oz+6); cam.az=-0.15; cam.el=0.95; cam.dist=46;
  refreshDeploy();
}
function deploy(){
  if(state.phase!=="setup") return;
  if(!playerFleet.every(placementValid)){ log('<span class="h">ships overlap or sit off-grid — adjust placement</span>'); return; }
  playerFleet.forEach(clearTint);
  state.phase="battle"; document.getElementById("setup").style.display="none";
  document.getElementById("help").textContent="DRAG to orbit · SCROLL to zoom · CLICK enemy waters to fire";
  cam.tgt.set(0,0,(BOARD.enemy.oz+BOARD.you.oz)/2); cam.dist=62; cam.el=0.85; cam.az=-0.5;
  setTurn("you"); log("<b>Fleet deployed.</b> Enemy waters to the north — open fire.");
}
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

// ============================================================ turns / AI
function selectWeapon(w){ state.weapon=w;
  document.querySelectorAll(".wbtn").forEach(b=>b.classList.toggle("sel",b.dataset.w===w)); }

function onClick(){
  if(orbitMoved>6){ orbitMoved=0; return; }   // v1989 — that was an orbit drag, not a firing order (release used to shoot wherever the drag ended)
  if(state.phase!=="battle" || state.over || state.busy || state.turn!=="player") return;
  const cell=pickEnemyCell(); if(!cell) return;
  const key=`${cell.r},${cell.c}`; if(state.playerShots.has(key)) return;
  state.busy=true; hoverMesh.visible=false;
  const fireFn = state.weapon==="torpedo"?fireTorpedo:fireCannon;
  fireFn(BOARD.enemy, cell.r, cell.c, (hitRow)=>{
    const rr = (typeof hitRow==="number")?hitRow:cell.r;
    resolveStrike(BOARD.enemy, rr, cell.c, "player", false);
    setTimeout(()=>{ state.busy=false; if(!state.over) endPlayerTurn(); }, 700);
  });
}
function endPlayerTurn(){ if(state.over) return; setTurn("foe"); setTimeout(aiTurn, 850); }

function aiTurn(){
  if(state.over) return;
  let r,c,guard=0;
  // hunt mode: if we have queued neighbours from a previous hit, use them
  while(guard++<200){
    if(state.aiQueue.length){ const q=state.aiQueue.shift(); r=q.r; c=q.c; }
    else { r=Math.floor(Math.random()*CFG.N); c=Math.floor(Math.random()*CFG.N); }
    if(r>=0&&r<CFG.N&&c>=0&&c<CFG.N&&!state.enemyShots.has(`${r},${c}`)) break;
  }
  const useTorp = Math.random()<0.3;
  const fn = useTorp?fireTorpedo:fireCannon;
  fn(BOARD.you, r, c, (hitRow)=>{
    const rr=(typeof hitRow==="number")?hitRow:r;
    const hit=resolveStrike(BOARD.you, rr, c, "enemy", false);
    if(hit){ // queue neighbours (hunt)
      [[rr-1,c],[rr+1,c],[rr,c-1],[rr,c+1]].forEach(([qr,qc])=>{
        if(qr>=0&&qr<CFG.N&&qc>=0&&qc<CFG.N&&!state.enemyShots.has(`${qr},${qc}`)) state.aiQueue.push({r:qr,c:qc});
      });
    }
    setTimeout(()=>{ if(!state.over) setTurn("you"); }, 700);
  });
}
function setTurn(who){
  state.turn = who==="foe"?"enemy":"player";
  const el=document.getElementById("turn");
  if(who==="foe"){ el.className="hud panel foe"; el.textContent="◣ ENEMY FIRING…"; }
  else { el.className="hud panel you"; el.textContent="◤ YOUR ORDERS — FIRE AT WILL"; }
}

// ============================================================ status / win
function checkWin(){
  if(enemyFleet.every(s=>s.sunk)){ endGame(true); }
  else if(playerFleet.every(s=>s.sunk)){ endGame(false); }
}
function endGame(win){
  state.over=true; state.busy=true;
  const end=document.getElementById("end"); end.style.display="grid";
  end.querySelector(".card").parentElement.className = win?"win":"lose";
  document.getElementById("endH").textContent = win?"FLEET DESTROYED":"YOU ARE SUNK";
  document.getElementById("endP").textContent = win?"Enemy waters cleared, Commander.":"The abyss claims your fleet.";
  document.getElementById("end").className = win?"win":"lose";
}
function refreshFleets(){
  const pip=(fleet)=>fleet.map(s=>s.sunk?"·":"▮").join(" ");
  document.getElementById("foePips").textContent=pip(enemyFleet);
  document.getElementById("youPips").textContent=pip(playerFleet);
  const list=(fleet)=>fleet.map(s=>{
    const dmg=s.sunk?"SUNK":`${s.hp}/${s.len}`;
    const col=s.sunk?"var(--hit)":"var(--ghost)";
    return `<div class="frow"><span style="color:${col}">${s.name}</span><span style="color:${col}">${dmg}</span></div>`;
  }).join("");
  document.getElementById("foeList").innerHTML=list(enemyFleet);
  document.getElementById("youList").innerHTML=list(playerFleet);
}
function cellName(r,c){ return String.fromCharCode(65+c)+(r+1); }
function log(html){ const el=document.getElementById("log");
  el.innerHTML = `<div>${html}</div>` + el.innerHTML; }

// ============================================================ picking + orbit cam
function pickEnemyCell(){
  raycaster.setFromCamera(pointer, camera);
  const plane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
  const hit=new THREE.Vector3();
  if(!raycaster.ray.intersectPlane(plane,hit)) return null;
  const b=BOARD.enemy;
  const c=Math.round((hit.x-b.ox)/CFG.CELL), r=Math.round((hit.z-b.oz)/CFG.CELL);
  if(r<0||r>=CFG.N||c<0||c>=CFG.N) return null;
  return {r,c};
}
function onHover(ev){
  setPointer(ev);
  if(state.phase==="setup"){ if(dragShip) moveDraggedShip(); hoverMesh.visible=false; return; }
  if(state.over||state.turn!=="player"||state.busy){ hoverMesh.visible=false; return; }
  const cell=pickEnemyCell();
  if(cell && !state.playerShots.has(`${cell.r},${cell.c}`)){
    const p=cellWorld(BOARD.enemy,cell.r,cell.c);
    // v1989 — torpedo lane preview: the torpedo runs the whole column and may detonate short
    // of the clicked cell, so show the lane it will travel instead of a single square.
    if(state.weapon==="torpedo"){
      hoverMesh.scale.set(1, cell.r+1, 1);
      hoverMesh.position.set(p.x, 0.12, BOARD.enemy.oz + (cell.r*CFG.CELL)/2);
    } else {
      hoverMesh.scale.set(1,1,1);
      hoverMesh.position.set(p.x,0.12,p.z);
    }
    hoverMesh.visible=true;
  } else hoverMesh.visible=false;
}
// custom orbit (no OrbitControls dependency)
const cam={ az:-0.5, el:0.85, dist:62, tgt:new THREE.Vector3(0,0,(BOARD.enemy.oz+BOARD.you.oz)/2) };
let orbitMoved=0;   // v1989 — px of drag since pointerdown; a "click" after a real drag must NOT fire a shot
function applyCam(){
  const x=cam.tgt.x+cam.dist*Math.cos(cam.el)*Math.sin(cam.az);
  const y=cam.tgt.y+cam.dist*Math.sin(cam.el);
  const z=cam.tgt.z+cam.dist*Math.cos(cam.el)*Math.cos(cam.az);
  camera.position.set(x,y,z); camera.lookAt(cam.tgt);
}
function initOrbit(){
  let drag=false,px=0,py=0;
  const cv=document.getElementById("c");
  cv.addEventListener("pointerdown",e=>{
    orbitMoved=0;
    if(state.phase==="setup"){ setPointer(e); if(grabShip()) return; }   // grabbed a ship → no orbit
    drag=true;px=e.clientX;py=e.clientY;
  });
  addEventListener("pointerup",()=>{ drag=false; if(dragShip) dropShip(); });
  addEventListener("pointermove",e=>{ if(!drag || dragShip) return;
    orbitMoved+=Math.abs(e.clientX-px)+Math.abs(e.clientY-py);
    cam.az-=(e.clientX-px)*0.005; cam.el+=(e.clientY-py)*0.005;
    cam.el=Math.max(0.18,Math.min(1.45,cam.el)); px=e.clientX;py=e.clientY; });
  cv.addEventListener("wheel",e=>{ e.preventDefault();
    cam.dist=Math.max(30,Math.min(120,cam.dist+e.deltaY*0.05)); },{passive:false});
  applyCam();
}

// ============================================================ new game / loop
function clearFleet(fleet){ fleet.forEach(s=>{ if(s.group) scene.remove(s.group); }); }
function newGame(){
  // remove pegs/old ships by rebuilding scene fleets
  clearFleet(playerFleet); clearFleet(enemyFleet);
  for(const m of pegs) scene.remove(m); pegs.length=0;   // wipe old hit/miss markers
  // wipe stray pegs/projectiles: easiest is to remove meshes tagged — instead, reload scene children that are pegs
  // (pegs are lightweight; for a clean slate we just clear shot sets + fleets)
  state.playerShots.clear(); state.enemyShots.clear(); state.aiQueue.length=0;
  state.over=false; state.busy=false; state.weapon="cannon"; selectWeapon("cannon");
  document.getElementById("end").style.display="none";
  document.getElementById("log").innerHTML="";
  enemyFleet=placeFleet("enemy"); playerFleet=createPlayerFleet();
  buildStatusMinis();
  refreshFleets(); enterSetup();
  log("Drag your ships onto the grid. <b>R</b> rotates · <b>RANDOMIZE</b> for a quick layout · <b>DEPLOY</b> when ready.");
}
let last=performance.now();
function animate(){
  requestAnimationFrame(animate);
  const now=performance.now(); const dt=Math.min(0.05,(now-last)/1000); last=now;
  const t=now/1000;
  updateOcean(t); updateFish(t,dt);
  for(let i=animators.length-1;i>=0;i--){ if(animators[i].update(dt)) animators.splice(i,1); }
  applyCam();
  renderer.render(scene,camera);
  updateStatus(dt);
  if(statusRenderer) statusRenderer.render(statusScene,statusCam);
}
function onResize(){ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); }

init(); animate();


// ─── v822 — Universal viewer protocol ────────────────────
// Demos opt-in via meta tags + postMessage. Viewer at
// universal-viewer.html iframes this page + exchanges:
//   demo:params  (demo → viewer)   announce tunable schema
//   demo:set     (viewer → demo)   apply parameter change
//   demo:thumb   (demo → viewer)   snapshot of canvas
//   demo:request-thumb/params      pulled by viewer
(function demoProtocol() {
    const params = [
        // No tunable parameters exposed.
    ];
    function getCanvas() {
        return document.querySelector("canvas");
    }
    function announce() {
        try {
            window.parent?.postMessage({
                type: "demo:params",
                params: params.map(({ set, ...p }) => p),
            }, "*");
        } catch (e) {}
    }
    window.addEventListener("message", (e) => {
        const d = e.data;
        if (!d || typeof d !== "object") return;
        if (d.type === "demo:set") {
            const p = params.find(x => x.name === d.name);
            if (p && typeof d.value === "number") {
                try { p.set(d.value); } catch (err) {}
            }
        } else if (d.type === "demo:request-thumb") {
            try {
                const c = getCanvas();
                if (!c) return;
                window.parent?.postMessage({
                    type: "demo:thumb",
                    dataUrl: c.toDataURL("image/jpeg", 0.6),
                }, "*");
            } catch (err) {}
        } else if (d.type === "demo:request-params") {
            announce();
        }
    });
    setTimeout(announce, 200);
})();
