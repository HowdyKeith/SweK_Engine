<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="demo:title" content="Duct">
<meta name="demo:desc" content="The lattice in three dimensions, which is where this engine actually lives -- every fluid before this one was flat. D3Q19 drives a duct past a sphere: nineteen velocities per cell, no viscosity ever set, and a wake that forms because the equations say it must. The shell is an isosurface of speed, marched fresh out of the live field; the sparks are tracers riding the actual velocity, not a scripted animation. A note on the colour: this lattice is isothermal by construction and has no temperature at all, so the blackbody ramp is reading SPEED here, not heat -- said plainly, because a ramp that looks like fire and means nothing would be a paint job. The same solver was verified against Hagen-Poiseuille to half a percent.">
<meta name="demo:category" content="simulation">
<title>Duct</title>
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js" } }</script>
<style>
  html,body { margin:0; height:100%; background:#03050c; overflow:hidden; color:#9fb2d4; font:12px ui-monospace,Menlo,monospace; }
  #hud { position:fixed; left:14px; top:12px; z-index:3; max-width:380px; pointer-events:none; }
  #cap { color:#f6a623; letter-spacing:.14em; text-transform:uppercase; font-size:13px; }
  #stat { color:#7fe3c4; margin-top:5px; line-height:1.65; }
  #note { color:#6f86ab; margin-top:7px; line-height:1.45; font-size:11.5px; }
  #ctl { position:fixed; right:14px; top:12px; z-index:3; display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
  button { background:rgba(16,22,36,.92); color:#c9b6ff; border:1px solid #3a3060; border-radius:18px; padding:8px 13px; font:600 11px ui-monospace,monospace; cursor:pointer; }
  button.on { color:#7fe3c4; border-color:#2a6a5a; }
</style>
</head>
<body>
<div id="hud"><div id="cap">&#9670; D3Q19 &mdash; the lattice in three dimensions</div><div id="stat"></div><div id="note"></div></div>
<div id="ctl"><button id="tShell" class="on">speed shell</button><button id="tSparks" class="on">tracers</button><button id="reset">reset</button></div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "./vendor/three/jsm/controls/OrbitControls.js";
import { makeLBM3D } from "./simulation/lbm/lbm3d.js";
import { marchScalarField } from "./simulation/MarchingCubes.js";
import { blackbodyRamp } from "./fx/voxelize/fireRamp.js";

const NX = 20, NY = 20, NZ = 56, R = 4.0, cx = (NX-1)/2, cy = (NY-1)/2, cz = 16, TAU = 0.6, FZ = 4e-5;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x03050c);
const cam = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 500);
cam.position.set(34, 22, 62);
const ctr = new OrbitControls(cam, renderer.domElement); ctr.target.set(0, 0, 0); ctr.enableDamping = true;
addEventListener("resize", () => { cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
scene.add(new THREE.AmbientLight(0x334466, 1.4));
const key = new THREE.DirectionalLight(0xffd9a0, 1.5); key.position.set(20, 30, 20); scene.add(key);
const rim = new THREE.DirectionalLight(0x66aaff, 0.8); rim.position.set(-20, -10, -25); scene.add(rim);
const off = new THREE.Vector3(-(NX-1)/2, -(NY-1)/2, -(NZ-1)/2);

// the duct and the obstacle, drawn as what they are
const duct = new THREE.Mesh(new THREE.BoxGeometry(NX-2, NY-2, NZ),
  new THREE.MeshBasicMaterial({ color: 0x1d3350, wireframe: true, transparent: true, opacity: 0.35 }));
scene.add(duct);
const ball = new THREE.Mesh(new THREE.SphereGeometry(R, 32, 24),
  new THREE.MeshStandardMaterial({ color: 0x1a2740, roughness: 0.55, metalness: 0.35 }));
ball.position.set(cx + off.x, cy + off.y, cz + off.z); scene.add(ball);

let lbm = null, shell = null, sparks = null, sparkPos = null, sparkCol = null, steps = 0, msEwma = 0, tris = 0;
const NSPARK = 2400;
function build() {
  lbm = makeLBM3D({ nx: NX, ny: NY, nz: NZ, tau: TAU, force: [0, 0, FZ],
    solidAt: (x, y, z) => (x === 0 || x === NX-1 || y === 0 || y === NY-1) || Math.hypot(x-cx, y-cy, z-cz) <= R });
  steps = 0;
  if (sparks) scene.remove(sparks);
  sparkPos = new Float32Array(NSPARK * 3); sparkCol = new Float32Array(NSPARK * 3);
  for (let i = 0; i < NSPARK; i++) reseed(i, Math.random() * NZ);
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(sparkPos, 3));
  g.setAttribute("color", new THREE.BufferAttribute(sparkCol, 3));
  sparks = new THREE.Points(g, new THREE.PointsMaterial({ size: 0.6, vertexColors: true, transparent: true, opacity: 0.95 }));
  scene.add(sparks);
}
function reseed(i, z) {
  let x, y;
  do { x = 1 + Math.random() * (NX - 2); y = 1 + Math.random() * (NY - 2); }
  while (Math.hypot(x-cx, y-cy, z-cz) <= R + 0.5);
  sparkPos[i*3] = x; sparkPos[i*3+1] = y; sparkPos[i*3+2] = z;
}
build();
const speedAt = (x, y, z) => { const k = lbm.idx(x, y, z); return lbm.solid[k] ? 0 : Math.hypot(lbm.ux[k], lbm.uy[k], lbm.uz[k]); };
function sampleU(x, y, z) {
  const xi = Math.max(0, Math.min(NX-1, Math.round(x))), yi = Math.max(0, Math.min(NY-1, Math.round(y))), zi = ((Math.round(z) % NZ) + NZ) % NZ;
  const k = lbm.idx(xi, yi, zi);
  return lbm.solid[k] ? [0, 0, 0] : [lbm.ux[k], lbm.uy[k], lbm.uz[k]];
}
const field = new Float32Array(NX*NY*NZ);
function remesh() {
  let vmax = 0;
  for (let z=0;z<NZ;z++) for (let y=0;y<NY;y++) for (let x=0;x<NX;x++) { const v = speedAt(x,y,z); field[z*NX*NY + y*NX + x] = v; if (v > vmax) vmax = v; }
  if (vmax <= 0) return;
  const iso = marchScalarField(field, NX, NY, NZ, vmax * 0.55, { cellSize: 1 });
  tris = iso.positions.length / 9;
  if (shell) { scene.remove(shell); shell.geometry.dispose(); }
  if (!tris) { shell = null; return; }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(iso.positions), 3));
  g.setAttribute("normal", new THREE.BufferAttribute(new Float32Array(iso.normals), 3));
  shell = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0x2fd0b0, transparent: true, opacity: 0.24,
    roughness: 0.4, side: THREE.DoubleSide, depthWrite: false }));
  shell.position.copy(off);
  shell.visible = document.getElementById("tShell").classList.contains("on");
  scene.add(shell);
}
const btnShell = document.getElementById("tShell"), btnSpark = document.getElementById("tSparks");
btnShell.onclick = () => { btnShell.classList.toggle("on"); if (shell) shell.visible = btnShell.classList.contains("on"); };
btnSpark.onclick = () => { btnSpark.classList.toggle("on"); sparks.visible = btnSpark.classList.contains("on"); };
document.getElementById("reset").onclick = () => { build(); remesh(); };

let frames = 0;
function frame() {
  try {
    const t0 = performance.now();
    lbm.step(); steps++;
    msEwma = msEwma ? msEwma * 0.9 + (performance.now() - t0) * 0.1 : performance.now() - t0;
    // tracers ride the real velocity field -- no scripted motion anywhere
    let vmax = 1e-9;
    for (let i = 0; i < NSPARK; i++) { const s = Math.hypot(...sampleU(sparkPos[i*3], sparkPos[i*3+1], sparkPos[i*3+2])); if (s > vmax) vmax = s; }
    for (let i = 0; i < NSPARK; i++) {
      const [ux, uy, uz] = sampleU(sparkPos[i*3], sparkPos[i*3+1], sparkPos[i*3+2]);
      const DT = 260;
      sparkPos[i*3] += ux * DT; sparkPos[i*3+1] += uy * DT; sparkPos[i*3+2] += uz * DT;
      if (sparkPos[i*3+2] > NZ - 1) reseed(i, 1);
      const c = blackbodyRamp(Math.min(1, Math.hypot(ux, uy, uz) / vmax));
      sparkCol[i*3] = c[0]; sparkCol[i*3+1] = c[1]; sparkCol[i*3+2] = c[2];
    }
    sparks.geometry.attributes.position.needsUpdate = true;
    sparks.geometry.attributes.color.needsUpdate = true;
    sparks.position.copy(off);
    if (frames % 8 === 0) remesh();
    frames++;
    const nu = (TAU - 0.5) / 3, Re = (2 * R) * vmax / nu;
    document.getElementById("stat").innerHTML =
      NX + "&times;" + NY + "&times;" + NZ + " &nbsp;&middot;&nbsp; " + (NX*NY*NZ*19).toLocaleString() + " populations &nbsp;&middot;&nbsp; " + msEwma.toFixed(1) + " ms/step" +
      "<br>" + steps.toLocaleString() + " steps &nbsp;&middot;&nbsp; Reynolds &asymp; " + Re.toFixed(0) + " &nbsp;&middot;&nbsp; shell: " + tris.toLocaleString() + " triangles" +
      "<br>viscosity " + nu.toFixed(4) + " &mdash; never set, it emerges from tau";
    document.getElementById("note").innerHTML =
      "The shell is an isosurface of speed, marched fresh from the live field. The sparks ride the actual velocity &mdash; nothing here is animated. " +
      "<b>The ramp is reading speed, not heat:</b> this lattice is isothermal by construction, so there is no temperature in it to colour.";
  } catch (e) { console.error("[swek] lbm3d frame fault:", e); }
  ctr.update(); renderer.render(scene, cam);
  requestAnimationFrame(frame);
}
remesh(); frame();
</script>
</body>
</html>
