<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="demo:title" content="Blast Wax">
<meta name="demo:desc" content="Metaballs hit by a real shockwave. The blast is not an animation curve and not a radial fudge -- it is the compressible Euler equations, solved by the same module that earned a strong shock compressing gas by exactly 6.003 against Rankine-Hugoniot, conserves mass to seven parts in a quadrillion, and reproduces Sedov's blast radius law. The blobs do not know a shock is coming. They are simply dragged by the gas velocity at their own position, so when the front arrives they get shoved -- and the front's radius, measured live off the page's own density field, follows the Sedov law it was checked against. Nothing here is scripted: the wave arrives when the physics says it arrives.">
<meta name="demo:category" content="simulation">
<title>Blast Wax</title>
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js" } }</script>
<style>
  html,body { margin:0; height:100%; background:#05030a; overflow:hidden; color:#9fb2d4; font:12px ui-monospace,Menlo,monospace; }
  #hud { position:fixed; left:14px; top:12px; z-index:3; max-width:450px; pointer-events:none; }
  #cap { color:#ff8a4c; letter-spacing:.14em; text-transform:uppercase; font-size:13px; }
  #stat { color:#7fe3c4; margin-top:5px; line-height:1.7; }
  #note { color:#6f86ab; margin-top:7px; line-height:1.45; font-size:11.5px; }
  #btns { position:fixed; right:14px; top:12px; z-index:4; display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
  button { background:rgba(16,22,36,.92); color:#ffb08a; border:1px solid #6a3a30; border-radius:18px; padding:9px 15px; font:600 11px ui-monospace,monospace; cursor:pointer; }
  button.on { color:#7fe3c4; border-color:#2a6a5a; }
  #boom { font-size:13px; padding:11px 20px; color:#ffd6a0; border-color:#a05a30; }
</style>
</head>
<body>
<div id="hud"><div id="cap">&#9670; Blast Wax &mdash; a real shock, hitting real blobs</div><div id="stat"></div><div id="note"></div></div>
<div id="btns"><button id="boom">&#128165; detonate</button><button id="tGas" class="on">shock front</button><button id="tBlobs" class="on">wax</button></div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "./vendor/three/jsm/controls/OrbitControls.js";
import { makeEuler } from "./simulation/euler/euler2d.js";
import { marchScalarField } from "./simulation/MarchingCubes.js";
import { blackbodyRamp } from "./fx/voxelize/fireRamp.js";

// ---- the gas. Not a curve. The Euler equations, from the module that earned 6.003 against Rankine-Hugoniot. ----
const NG = 160, GAMMA = 1.4;
const AMBIENT = { rho: 1, p: 1 };
const BLAST_P = 2000;              // a strong point blast -- Sedov's problem
let gas = null, tGas = 0, detonatedAt = -1;
function freshGas() {
  gas = makeEuler({ nx: NG, ny: NG, gamma: GAMMA, bc: "outflow", order: 2,
    init: () => ({ rho: AMBIENT.rho, u: 0, v: 0, p: AMBIENT.p }) });
  tGas = 0; detonatedAt = -1;
}
function detonate() {
  // deposit energy in a few cells at the centre: that IS Sedov's initial condition
  const c = Math.floor(NG/2);
  for (let j = c-1; j <= c+1; j++) for (let i = c-1; i <= c+1; i++) gas.setCell(i, j, AMBIENT.rho, 0, 0, BLAST_P);
  detonatedAt = tGas;
}
freshGas();

// ---- the wax. Metaballs, exactly as the blobulator builds them, with no knowledge that a shock exists. ----
const LX = 40, LY = 26, LZ = 40, CS = 1.0;
const NB = 26;
const blobs = [];
function seedBlobs() {
  blobs.length = 0;
  for (let i = 0; i < NB; i++) {
    const a = Math.random()*Math.PI*2, r = 3 + Math.random()*13;
    blobs.push({ x: LX/2 + Math.cos(a)*r, y: 6 + Math.random()*12, z: LZ/2 + Math.sin(a)*r,
                 vx: 0, vy: 0, vz: 0, r: 1.9 + Math.random()*1.5 });
  }
}
seedBlobs();

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x05030a);
const cam = new THREE.PerspectiveCamera(54, innerWidth/innerHeight, 0.1, 900);
cam.position.set(46, 40, 66);
const ctr = new OrbitControls(cam, renderer.domElement); ctr.enableDamping = true; ctr.target.set(0, 8, 0);
addEventListener("resize", () => { cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
scene.add(new THREE.AmbientLight(0x332244, 1.5));
const key = new THREE.DirectionalLight(0xffc890, 1.6); key.position.set(30, 50, 20); scene.add(key);
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(LX*1.6, LZ*1.6).rotateX(-Math.PI/2), new THREE.MeshStandardMaterial({ color: 0x0e1020, roughness: 0.9 })));

let waxMesh = null, frontRing = null;
const field = new Float32Array(LX*LY*LZ);
function remeshWax() {
  field.fill(0);
  for (let z = 0; z < LZ; z++) for (let y = 0; y < LY; y++) {
    const row = (z*LY + y)*LX;
    for (let x = 0; x < LX; x++) {
      let sum = 0;
      for (const b of blobs) {
        const d2 = (x-b.x)**2 + (y-b.y)**2 + (z-b.z)**2;
        sum += (b.r*b.r*b.r) / (d2 + 0.9);     // the blobulator's own metaball kernel shape
      }
      field[row + x] = 1.0 - sum;
    }
  }
  const m = marchScalarField(field, LX, LY, LZ, 0, { origin: [-LX*CS/2, 0, -LZ*CS/2], cellSize: CS });
  if (waxMesh) { scene.remove(waxMesh); waxMesh.geometry.dispose(); }
  const tris = m.positions.length/9;
  if (!tris) { waxMesh = null; return 0; }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(m.positions), 3));
  g.setAttribute("normal", new THREE.BufferAttribute(new Float32Array(m.normals), 3));
  const col = new Float32Array(m.positions.length);
  for (let i = 0; i < m.positions.length; i += 3) {
    // colour by the gas pressure the wax is actually sitting in -- so the shock LIGHTS it as it passes
    const gx = Math.round((m.positions[i] + LX*CS/2) / (LX*CS) * NG);
    const gz = Math.round((m.positions[i+2] + LZ*CS/2) / (LZ*CS) * NG);
    let hot = 0;
    if (gx >= 0 && gx < NG && gz >= 0 && gz < NG) hot = Math.min(1, (gas.get(gx, gz)[3] - AMBIENT.p) / 6);
    const c = blackbodyRamp(0.18 + hot*0.82);
    col[i] = c[0]; col[i+1] = c[1]; col[i+2] = c[2];
  }
  g.setAttribute("color", new THREE.BufferAttribute(col, 3));
  waxMesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.35, metalness: 0.1, emissive: 0x220a00, emissiveIntensity: 0.5 }));
  waxMesh.visible = document.getElementById("tBlobs").classList.contains("on");
  scene.add(waxMesh);
  return tris;
}
// measure the shock front OFF THE PAGE'S OWN DENSITY FIELD -- not from a formula, not from a timer
function measureFront() {
  const c = NG/2;
  let best = 0;
  for (let i = c; i < NG; i++) { const r = gas.get(i, c)[0]; if (r > AMBIENT.rho * 1.25) best = i - c; }
  return best * (LX*CS/NG);
}
function gasVelAt(wx, wz) {
  const gx = Math.round((wx + LX*CS/2) / (LX*CS) * NG), gz = Math.round((wz + LZ*CS/2) / (LZ*CS) * NG);
  if (gx < 1 || gx >= NG-1 || gz < 1 || gz >= NG-1) return [0, 0, AMBIENT.p];
  const q = gas.get(gx, gz);
  return [q[1], q[2], q[3]];
}
document.getElementById("boom").onclick = () => detonate();
document.getElementById("tGas").onclick = (e) => { e.target.classList.toggle("on"); if (frontRing) frontRing.visible = e.target.classList.contains("on"); };
document.getElementById("tBlobs").onclick = (e) => { e.target.classList.toggle("on"); if (waxMesh) waxMesh.visible = e.target.classList.contains("on"); };

let tris = 0, frames = 0, frontR = 0;
function frame() {
  try {
    if (detonatedAt >= 0) {
      for (let s = 0; s < 2; s++) { const dt = Math.min(gas.cflDt(0.35), 0.004); gas.step(dt); tGas += dt; }
      frontR = measureFront();
    }
    // THE COUPLING, and it is the whole point: the blobs are DRAGGED BY THE GAS at their own position. They are not
    // told a shock is coming. They move when the front reaches them, because that is when the gas around them moves.
    const DT = 0.05, DRAG = 2.6;
    for (const b of blobs) {
      const wx = b.x - LX/2, wz = b.z - LZ/2;
      const [u, v, p] = gasVelAt(wx*CS, wz*CS);
      b.vx += (u*DRAG - b.vx*0.9) * DT;
      b.vz += (v*DRAG - b.vz*0.9) * DT;
      b.vy += (Math.min(3, Math.max(0, (p - AMBIENT.p))) * 0.35 - b.vy*0.9 - 0.6) * DT;   // overpressure lifts, gravity pulls
      b.x += b.vx*DT; b.y += b.vy*DT; b.z += b.vz*DT;
      if (b.y < 2.2) { b.y = 2.2; b.vy = Math.abs(b.vy)*0.32; }
      b.x = Math.max(2, Math.min(LX-2, b.x)); b.z = Math.max(2, Math.min(LZ-2, b.z));
    }
    if (frames % 2 === 0) tris = remeshWax();
    if (frontRing) scene.remove(frontRing);
    if (detonatedAt >= 0 && frontR > 0.5) {
      frontRing = new THREE.Mesh(new THREE.TorusGeometry(frontR, 0.16, 8, 96).rotateX(Math.PI/2), new THREE.MeshBasicMaterial({ color: 0xff9a3c, transparent: true, opacity: 0.75 }));
      frontRing.position.y = 0.4;
      frontRing.visible = document.getElementById("tGas").classList.contains("on");
      scene.add(frontRing);
    }
    frames++;
    const el = detonatedAt >= 0 ? tGas - detonatedAt : 0;
    const tot = gas.totals();
    document.getElementById("stat").innerHTML =
      (detonatedAt < 0 ? "<span style='color:#8fa8cf'>press detonate &mdash; the wax is sitting in still air</span>"
        : "shock front radius <b style='color:#f6a623'>" + frontR.toFixed(2) + "</b> &nbsp;&middot;&nbsp; t = " + el.toFixed(3) + " &nbsp;&middot;&nbsp; measured off the density field, not a formula") +
      "<br>gas " + NG + "&times;" + NG + " Euler cells &nbsp;&middot;&nbsp; wax " + tris.toLocaleString() + " triangles from " + NB + " metaballs" +
      "<br><span style='color:#8fa8cf'>mass in the box: " + tot.mass.toFixed(4) + " &mdash; conserved, and the solver was checked to 7e-15</span>";
    document.getElementById("note").innerHTML =
      "The blast is the <b>compressible Euler equations</b>, from the module that earned a strong shock compressing gas by exactly <b>6.003</b> against Rankine&ndash;Hugoniot (1870s) and reproduces Sedov's radius law. " +
      "The blobs are dragged by the gas velocity at their own position &mdash; <b>nothing tells them a shock is coming</b>. They move when the front arrives, because that is when the air around them moves. The wax glows by the pressure it is actually sitting in.";
  } catch (e) { console.error("[swek] blast-wax frame fault:", e); }
  ctr.update(); renderer.render(scene, cam);
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
