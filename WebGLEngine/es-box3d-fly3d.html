<meta name="demo:desc" content="Long Silence Round B: the box3d Endless-Sky fight now FLIES in 3D. Ships gain a pitch axis and an altitude and dogfight in three dimensions under a 3D pursuit AI, banking into turns, rendered with Three.js under a free camera. The 3D flight model is a strict superset of the 2D one -- at pitch 0 it reduces exactly to the old game -- and esBox3d runs in opt-in fly3d mode, so the 2D game and Round A are unchanged. ship-ship collision is now a 3D SLAB (v3832): box3d's own footprint is dormant and an altitude-band collider is the authority, so two ships ram only when their footprints AND altitudes overlap -- vertically clear ships pass freely, and box3d's altitude-blind planar push is gone. The response rides box3d's velocity for x-z and the flight model's altitude for the vertical; full volumetric box3d contact-filtering is still a WASM round. Ships wear Slug outline-text nameplates (class + live hull%, sized by distance from one atlas with no re-bake) on an overlay surface -- the first adoption of the v3823 Slug renderer in a real scene. The backdrop is now a baked nebula/star SKYBOX (v3833): a seedable gradient+noise generator bakes a six-face cubemap whose colour is a pure function of direction, so the faces are seamless by construction; the old flat fill and 700-point starfield are gone and the stars are baked in. Ships trail SWEPT-SPINE ENGINE TRAILS (v3834): one static mesh whose every vertex is placed in the vertex shader from a per-ship spine data texture (a ship's recent path resampled at fixed arc length with a rotation-minimizing frame), so a long trail and a short one cost the same buffer -- technique reimplemented from Noniv/snowflow_demo's surf wake, nothing vendored. A PROCEDURAL STAR (v3835) hangs at the key-light direction, its photosphere baked from the SAME gradient+noise generator as the skybox (granulation + a temperature colour) with limb darkening and a corona applied in the shader. THE PLANET'S SURFACE IS CUBE-BAKED (v3842): the same seeded terrain is baked into a cubemap rather than an equirectangular texture -- so it spends its texels evenly instead of ~80x more densely on the poles than the equator, and the faces meet seamlessly by construction -- and the bake now carries a normal map derived from the height field's own tangent-plane gradient, a roughness mask (smooth seas, rough land) and the height itself, read back on the CPU to displace the sphere so the silhouette carries the terrain too (the Relief button toggles both halves). THE SCENE IS POPULATED (v3843, the Structures button): an ASTEROID BELT whose rocks are icospheres displaced by the planet's own fbm3 and placed by rejection so no two interpenetrate, and a GREEBLED STATION -- hull modules along a spine wearing plates from a recursive panel split that PARTITIONS each face exactly (areas sum, nothing overlaps, nothing escapes), drawn as one instanced mesh for ~900 plates. SHIPS THROW DEBRIS WHEN HIT (v3844, the Hit FX button), ported from cockpit.html's VFX: the burst is chosen from the shield state AFTER absorption, so shields up throws a small cyan spark shower, shields gone throws a bigger red one, and a kill adds a third amber burst ON TOP of the second -- cockpit's own rule, graded against a transcription of its hit() over 3600 shield/armour/damage combinations. Unlike the source it uses no Math.random and decays per SECOND rather than per frame, so the spray does not travel further on a faster machine. A FOLD/WARP JUMP TUNNEL (v3836, the Jump button) sweeps the spine tube down a curving fold path viewed from inside, its ring pattern scrolling toward the camera via a stateless fract wrap (the endless-loop trick, not a persistent buffer) and ramped in and out by a jump envelope. Answer-key gates: flightModel3d-selfcheck, esShipLabels-selfcheck, esSlabCollide-selfcheck, nebulaSkybox-selfcheck, sweptSpine-selfcheck, proceduralStar-selfcheck, foldTunnel-selfcheck, planetSurface-selfcheck, greeble-selfcheck, spaceStructures-selfcheck, hitBurst-selfcheck.">

<script type="module">
import * as THREE from "/vendor/three/three.module.js";
import { OrbitControls } from "/vendor/three/jsm/controls/OrbitControls.js";
import { spawnEnemies, applyDamage } from "/ev/combat.js";
import { DEFAULT_W, decide as tacticsDecide, applyBrainWeights } from "/ev/esTactics.js";
import { createESBox3D } from "/physics/esBox3d.js";
import { box3d } from "/physics/box3d/box3dLoader.js";
import { planarFallbackWorld } from "/physics/planarFallbackWorld.js";
import { forward3d, stepAI3d } from "/ev/flightModel3d.js";
import { bakeNebulaCubemap } from "/render/nebulaSkybox.js";   // v3833 -- baked nebula/star backdrop
import { resampleByArcLength, rotationMinimizingFrames, profileRing, buildRingIndex, packStrand, placeVertex } from "/render/sweptSpine.js";   // v3834 -- swept-spine engine trails
import { bakeStarCubemap } from "/render/proceduralStar.js";   // v3835 -- procedural star from the skybox generator
import { scroll as foldScroll, ringPattern as foldRing, jumpEnvelope, jumpDuration, foldSpine } from "/render/foldTunnel.js";   // v3836 -- fold/warp jump tunnel
import { sceneScale } from "/ev/esFlight3dMath.js";
import { mountShipModels } from "/ev/esShipModels.js";   // v3827 -- user-assignable .glb ships per class
import { makeAutoExposure } from "/render/autoExposure.js";   // v3829 -- sqrt-mean auto-exposure
import { planetSpec } from "/world/procPlanet.js";   // v3830 -- procedural planet backdrop
import { bakeSurfaceCubemap, sampleCubeScalar, surfaceRadiusAt } from "/world/planetSurface.js";   // v3842 -- cube-baked relief; v4053 -- surfaceRadiusAt shared with the descent camera
import { sampleShot, sampleSequence, chainLegs, sequenceDuration, toClip, norm3 as cnorm3 } from "/rig/cinematicShot.js";   // v4053 descent; v4054 sequence; v4057 clip export
import { buildPuffsShell } from "/render/cloudField.js";   // v4055 -- the engine's own cloud types, on a shell
import { buildMossShell } from "/render/mossField.js";   // v4076 -- ground cover on the SAME displaced surface
import { asteroidMesh, asteroidField, stationSpec } from "/world/spaceStructures.js";   // v3843 -- asteroids and greebled stations
import { burstsFor, spawnBurst, stepBurst, packPoints } from "/render/hitBurst.js";   // v3844 -- the cockpit's hit VFX
import { makeShipLabels } from "/ev/esShipLabels.js";   // v3831 -- Slug outline-text nameplates on a real surface

const CLASSES = [
  { id: 1, name: "Raider",   shield: 80,  armor: 60, speed: 340, accel: 240, maneuver: 11, dps: 12 },
  { id: 2, name: "Marauder", shield: 120, armor: 90, speed: 300, accel: 200, maneuver: 8,  dps: 18 },
  { id: 3, name: "Corsair",  shield: 60,  armor: 40, speed: 400, accel: 280, maneuver: 14, dps: 8  },
];
const SHOT = { speed: 1050, life: 1.7, dmgShield: 14, dmgArmor: 12, cooldownMs: 360 };
const HIT_RADIUS = 90, ALT_SPREAD = 700;
const W_A = applyBrainWeights({ wWeak: 0, wFocus: 0, wThreat: 0, wPlayer: 0, wClose: 1 }, DEFAULT_W);
const W_B = { ...DEFAULT_W };
const WORLD_HALF = 1900, S = sceneScale(WORLD_HALF, 30);

function makeRng(seed) { let s = (seed >>> 0) || 1; return () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; }; }
function makeFleet(team, center, count, rng) {
  return spawnEnemies(CLASSES, {}, center, { count, team, minR: 150, spread: 500, rnd: rng }).map((e, i) => ({
    ...e, id: team + "#" + i, team, vx: 0, vy: 0, valt: 0,
    alt: (rng() - 0.5) * ALT_SPREAD, pitch: 0,          // Round B: spread them out of the plane at spawn
    dps: (e.cls && e.cls.dps) || e.dps || 10, _cool: 0, _tgtId: null, _fleeing: false, _turn: 0, _bank: 0,
  }));
}
// snapshot carries ALTITUDE so the 3D AI can aim pitch and measure 3D range.
function snapshot(fleet) { const o = []; for (const e of fleet) if (!e.dead) o.push({ id: e.id, x: e.x, y: e.y, alt: e.alt || 0, team: e.team, shield: e.shield, armor: e.armor, maxShield: e.maxShield, maxArmor: e.maxArmor, dps: e.dps, dead: false }); return o; }

function sideDriveShots(mine, foes, weights, esbx, dt, nowMs) {
  const shots = [];
  for (const e of mine) {
    if (e.dead) continue;
    const d = tacticsDecide(e, foes, weights, { lastTargetId: e._tgtId, wasFleeing: e._fleeing, range: 1400 });
    e._fleeing = !!d.fleeing; e._tgtId = (d.target && !d.target._flee) ? d.target.id : null;
    if (!d.target) continue;
    const ai = stepAI3d(e, d.target, { range: 1400, standoff: d.fleeing ? 0 : 160 });   // 3D steering
    e._turn = ai.turn;
    esbx.driveShip(e._bx, { turn: ai.turn, pitch: ai.pitch, thrust: ai.thrust }, dt);
    if (ai.firing && d.engaging && nowMs >= (e._cool || 0)) {
      e._cool = nowMs + SHOT.cooldownMs; const f = forward3d(e.heading, e.pitch);
      shots.push({ team: e.team, x: e.x, y: e.y, alt: e.alt || 0, vx: f.x * SHOT.speed, vy: f.y * SHOT.speed, valt: f.alt * SHOT.speed, life: SHOT.life });
    }
  }
  return shots;
}
// v3844 -- HIT DEBRIS. The pool and the seed live here; the RULE (which bursts a hit throws, and that a kill
// throws two) is render/hitBurst.js's, ported from cockpit.html and gated against cockpit's own hit(). The burst
// is spawned at the SHOT's position -- the impact point, not the ship's centre -- and carries a share of the
// victim's velocity so the debris trails the ship instead of hanging in the air.
const hitParts = []; let burstSeed = 1, hitFxOn = true;
function advanceShots(shots, ships, dt) {
  const rr = HIT_RADIUS * HIT_RADIUS, alive = [];
  for (const sh of shots) {
    sh.x += sh.vx * dt; sh.y += sh.vy * dt; sh.alt += (sh.valt || 0) * dt; sh.life -= dt;
    if (sh.life <= 0) continue;
    let hit = false;
    for (const e of ships) {
      if (e.dead || e.team === sh.team) continue;
      const dx = e.x - sh.x, dy = e.y - sh.y, da = (e.alt || 0) - sh.alt;
      if (dx * dx + dy * dy + da * da <= rr) {
        const tiers = burstsFor(e.shield || 0, e.armor || 0, SHOT.dmgShield + SHOT.dmgArmor);   // read BEFORE the damage lands
        if (applyDamage(e, SHOT.dmgShield, SHOT.dmgArmor)) e.dead = true;
        if (hitFxOn) {
          const at = [sh.x * S, (sh.alt || 0) * S, sh.y * S];
          const vel = [(e.vx || 0) * S, (e.valt || 0) * S, (e.vy || 0) * S];
          for (const tier of tiers) spawnBurst(hitParts, at, vel, tier, burstSeed++);
        }
        hit = true; break;
      }
    }
    if (!hit) alive.push(sh);
  }
  return alive;
}

// ---- Three.js scene ----
const scene = new THREE.Scene();
// v3833 -- baked nebula/star skybox from a pure seedable generator (gated in render/nebulaSkybox-selfcheck.mjs).
// Build 6 face canvases from the raw RGB and hand them to a CubeTexture. Flat fill stays as the fallback and the
// toggle-off state. CubeTexture face order is [+X,-X,+Y,-Y,+Z,-Z], which matches the generator's face order.
const FLAT_BG = new THREE.Color(0x03060d);
function buildNebulaSky(seed) {
  const { size, faces } = bakeNebulaCubemap({ seed, size: 256 });
  const canvases = faces.map((rgb) => {
    const cv = document.createElement("canvas"); cv.width = cv.height = size;
    const ctx = cv.getContext("2d"), img = ctx.createImageData(size, size), d = img.data;
    for (let k = 0, p = 0; k < rgb.length; k += 3, p += 4) { d[p] = rgb[k]; d[p + 1] = rgb[k + 1]; d[p + 2] = rgb[k + 2]; d[p + 3] = 255; }
    ctx.putImageData(img, 0, 0); return cv;
  });
  const tex = new THREE.CubeTexture(canvases);
  if ("colorSpace" in tex) tex.colorSpace = THREE.SRGBColorSpace;
  tex.needsUpdate = true; return tex;
}
let nebulaTex = null, nebulaOn = true;
try { nebulaTex = buildNebulaSky(0xBEEF); } catch (e) { nebulaTex = null; }
scene.background = nebulaTex || FLAT_BG;
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 5000);
camera.position.set(0, 40, 66);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
if ("outputColorSpace" in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.target.set(0, 0, 0);
controls.minDistance = 8; controls.maxDistance = 300;

scene.add(new THREE.HemisphereLight(0xafe6ff, 0x0a1420, 1.0));
const key = new THREE.DirectionalLight(0xffffff, 1.5); key.position.set(30, 60, 40); scene.add(key);
// v3835 -- a PROCEDURAL STAR at the key light's direction, baked from the SAME generator as the nebula skybox
// (render/proceduralStar.js reuses its fbm). A cubemap of the photosphere on a sphere; the shader applies the
// gated limb-darkening law per fragment and a corona rim. The look is Keith's; the surface math is gated.
let starMesh = null, starOn = true;
(function buildStar() {
  let starTex = null;
  try {
    const { size, faces } = bakeStarCubemap({ seed: 909, kelvin: 6200, size: 256 });
    const canvases = faces.map((rgb) => {
      const cv = document.createElement("canvas"); cv.width = cv.height = size;
      const ctx = cv.getContext("2d"), img = ctx.createImageData(size, size), d = img.data;
      for (let k = 0, p = 0; k < rgb.length; k += 3, p += 4) { d[p] = rgb[k]; d[p + 1] = rgb[k + 1]; d[p + 2] = rgb[k + 2]; d[p + 3] = 255; }
      ctx.putImageData(img, 0, 0); return cv;
    });
    starTex = new THREE.CubeTexture(canvases);
    if ("colorSpace" in starTex) starTex.colorSpace = THREE.SRGBColorSpace;
    starTex.needsUpdate = true;
  } catch (e) { return; }
  const mat = new THREE.ShaderMaterial({
    uniforms: { uStar: { value: starTex }, uLimb: { value: 0.6 }, uCorona: { value: new THREE.Color(0x3a2a10) } },
    vertexShader: `
      varying vec3 vN; varying vec3 vView;
      void main(){ vN = normalize(position); vec4 wp = modelMatrix * vec4(position,1.0); vView = normalize(cameraPosition - wp.xyz); gl_Position = projectionMatrix * viewMatrix * wp; }`,
    fragmentShader: `
      precision highp float; uniform samplerCube uStar; uniform float uLimb; uniform vec3 uCorona;
      varying vec3 vN; varying vec3 vView;
      void main(){
        vec3 base = textureCube(uStar, vN).rgb;
        float mu = clamp(dot(vN, vView), 0.0, 1.0);
        float limb = 1.0 - uLimb*(1.0-mu);   // mirrors proceduralStar.limbDarkening
        float rim = pow(1.0-mu, 3.0);
        gl_FragColor = vec4(base*limb + uCorona*rim, 1.0);
      }`,
  });
  const dir = new THREE.Vector3(30, 60, 40).normalize();
  starMesh = new THREE.Mesh(new THREE.SphereGeometry(130, 48, 32), mat);
  starMesh.position.copy(dir.multiplyScalar(1400)); starMesh.frustumCulled = false; scene.add(starMesh);
})();
scene.add(new THREE.DirectionalLight(0x6fb8ff, 0.4).translateX(-40).translateY(12).translateZ(-30));
scene.add(new THREE.AmbientLight(0x223a55, 0.5));
const grid = new THREE.GridHelper(60, 24, 0x1b3350, 0x0e1c30); scene.add(grid);   // alt = 0 reference plane
// v3833 -- the plain 700-point starfield is gone; stars are now baked into the nebula skybox (see buildNebulaSky).

// v3830/v3842 -- THE PLANET, AND ITS SURFACE. The seed still picks the type, palette, terrain and atmosphere
// (world/procPlanet.js, gated). What changed in v3842 is the BAKE: instead of one equirectangular texture -- which
// spends ~80x more texels on the poles than on the equator you fly past, and needs wrapS to hide a seam -- the
// surface is baked into a CUBEMAP the way the skybox and the star already are, where every texel is a pure
// function of direction so the faces meet seamlessly by construction. The bake also carries a NORMAL (the height
// field's own tangent-plane gradient), a ROUGHNESS mask (sea smooth, land not) and the HEIGHT itself, which is
// read back on the CPU to push the sphere's vertices out so the silhouette carries the terrain too. All of that
// arithmetic is pinned in world/planetSurface-selfcheck.mjs; only this GL plumbing is unverifiable here.
// v4053 -- the relief amplitude as a FRACTION of the radius. Named once here because the mesh displacement
// and the descent camera's ground clearance must both use it; a second literal is a camera flying into a
// mountain the renderer drew.
const PLANET_AMP_FRAC = 0.035;
// v4053 -- the in-flight descent, or null. One object, driven entirely by sampleShot(t) in the frame loop.
let descent = null;
let arrival = null;   // v4054 -- the two-leg warp-in + descent, or null

  geo.setAttribute("iSize", new THREE.InstancedBufferAttribute(iSize, 2));
  geo.setAttribute("iTop", new THREE.InstancedBufferAttribute(iTop, 3));
  geo.setAttribute("iBot", new THREE.InstancedBufferAttribute(iBot, 3));
  geo.setAttribute("iDen", new THREE.InstancedBufferAttribute(iDen, 1));
  geo.instanceCount = N;

  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    uniforms: { uSun: { value: 0.9 } },
    vertexShader: `
      attribute vec2 aCorner; attribute vec3 iPos; attribute vec2 iSize;
      attribute vec3 iTop; attribute vec3 iBot; attribute float iDen;
      varying vec2 vUv; varying vec3 vTop; varying vec3 vBot; varying float vDen;
      void main(){
        // camera-facing basis pulled out of the view matrix -- cloudLayer takes uRight/uUp from the engine
        // camera; in Three the same two vectors are the first two ROWS of the view matrix.
        vec3 right = vec3(viewMatrix[0][0], viewMatrix[1][0], viewMatrix[2][0]);
        vec3 up    = vec3(viewMatrix[0][1], viewMatrix[1][1], viewMatrix[2][1]);
        vec3 world = iPos + aCorner.x * iSize.x * right + aCorner.y * iSize.y * up;
        vUv = aCorner; vTop = iTop; vBot = iBot; vDen = iDen;
        gl_Position = projectionMatrix * viewMatrix * vec4(world, 1.0);
      }`,
    fragmentShader: `
      precision highp float;
      varying vec2 vUv; varying vec3 vTop; varying vec3 vBot; varying float vDen;
      uniform float uSun;
      void main(){
        float r = length(vUv);
        float a = smoothstep(1.0, 0.18, r) * vDen;      // cloudLayer's own falloff
        if (a < 0.01) discard;
        vec3 col = mix(vBot, vTop, clamp(vUv.y * 0.5 + 0.5, 0.0, 1.0));
        col *= (0.86 + 0.14 * clamp(uSun, 0.0, 1.0));   // ...and its own sun tint
        gl_FragColor = vec4(col, a);
      }`,
  });
  cloudDeck = new THREE.Mesh(geo, mat);
  cloudDeck.frustumCulled = false;
  scene.add(cloudDeck);
  return { puffs: N, type: typeName };
}

// the button cycles the six types and then OFF, so the deck can always be taken away -- which is both a real
// control and the only way to tell what the clouds are actually responsible for on screen.
function clearCloudDeck() {
  if (!cloudDeck) return;
  scene.remove(cloudDeck); cloudDeck.geometry.dispose(); cloudDeck.material.dispose(); cloudDeck = null;
}
const cloudsBtn = document.getElementById("cloudsBtn");
cloudsBtn.addEventListener("click", () => {
  cloudTypeIdx = (cloudTypeIdx + 1) % (CLOUD_ORDER.length + 1);
  if (cloudTypeIdx === CLOUD_ORDER.length) { clearCloudDeck(); cloudsBtn.textContent = "\u2601 Clouds"; cloudsBtn.style.opacity = "0.5"; return; }
  const r = buildCloudDeck(CLOUD_ORDER[cloudTypeIdx]);
  cloudsBtn.style.opacity = r ? "1" : "0.5";
  cloudsBtn.textContent = r ? "\u2601 " + r.type : "\u2601 Clouds";
});
window.swekClouds = (t) => {
  if (t === false || t === "off") { clearCloudDeck(); cloudTypeIdx = CLOUD_ORDER.length; return null; }
  if (t) cloudTypeIdx = Math.max(0, CLOUD_ORDER.indexOf(t));
  return buildCloudDeck(CLOUD_ORDER[cloudTypeIdx % CLOUD_ORDER.length]);
};
window.swekCloudProbe = () => {
  if (!cloudDeck || !planetMesh) return { deck: false };
  const c = planetMesh.position, p = cloudDeck.geometry.getAttribute("iPos");
  let minR = Infinity, maxR = -Infinity;
  for (let i = 0; i < p.count; i++) {
    const r = Math.hypot(p.getX(i) - c.x, p.getY(i) - c.y, p.getZ(i) - c.z);
    minR = Math.min(minR, r); maxR = Math.max(maxR, r);
  }
  const camR = Math.hypot(camera.position.x - c.x, camera.position.y - c.y, camera.position.z - c.z);
  return { deck: true, puffs: p.count, minR, maxR, camR, inside: camR < maxR && camR > minR, below: camR < minR };
};

// v4076 -- MOSS ON THE PLANET, GROWN FROM THE SAME render/mossField.js THE VOXEL TERRAIN USES (render/mossPatches.js).
// *** WHY THIS IS A CHILD OF planetMesh AND THE CLOUD DECK IS NOT. *** planetMesh carries a static tilt
// (rotation.z = spec.tilt, set once) AND a continuous spin (rotation.y += planetSpin*dt, every frame, line
// ~699). The cloud deck is built in WORLD space and added to `scene` directly -- fine for weather, which is
// not attached to the ground and can drift from a spinning planet without anyone noticing. Moss is GROUND
// COVER: if it were built the same way it would visibly detach from the terrain within seconds of watching the
// planet spin. Parenting the InstancedMesh under planetMesh means Three's own scene graph carries tilt AND
// spin for free, forever, with no per-frame code here at all -- and building the tufts in the mesh's LOCAL
// (pre-rotation) frame is exactly the frame the vertex displacement loop above already computed heights in, so
// nothing about the arithmetic changes, only whose transform is applied to the result.
let mossDeck = null;
function buildMossDeck(dir) {
  if (mossDeck) { planetMesh.remove(mossDeck); mossDeck.geometry.dispose(); mossDeck.material.dispose(); mossDeck = null; }
  if (!planetMesh || !planetSpec_) return null;
  const tufts = buildMossShell({ spec: planetSpec_, groundRadius: planetR, ampFrac: PLANET_AMP_FRAC,
                                  dir, coverage: 0.55, sizeScale: 0.06, seed: planetSpec_.seed, maxSlope: 4.5 });
  if (!tufts.length) return null;

  // A squashed low-poly hummock -- one shared geometry, matching the "rocks" InstancedMesh recipe already
  // proven in this file (icosphere-like clump, MeshStandardMaterial, per-instance Matrix4.compose).
  const clumpGeo = new THREE.IcosahedronGeometry(1, 0);
  const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95, metalness: 0.0, flatShading: true });
  const inst = new THREE.InstancedMesh(clumpGeo, mat, tufts.length);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), spinQ = new THREE.Quaternion(), v = new THREE.Vector3(), s = new THREE.Vector3();
  const up = new THREE.Vector3(0, 1, 0), col = new THREE.Color();
  tufts.forEach((t, i) => {
    // orientation: align the hummock's local +Y to the terrain's own normal here, then spin it around that
    // normal by the tuft's own random angle -- the same setFromUnitVectors + axis-angle compose the rocks use,
    // aimed at a surface normal instead of an arbitrary spin axis.
    q.setFromUnitVectors(up, new THREE.Vector3(t.normal[0], t.normal[1], t.normal[2]));
    spinQ.setFromAxisAngle(new THREE.Vector3(t.normal[0], t.normal[1], t.normal[2]), t.spin);
    q.premultiply(spinQ);
    v.set(t.x, t.y, t.z);
    s.set(t.scale, t.scale * 0.35, t.scale);   // flattened -- a clump, not a boulder
    inst.setMatrixAt(i, m.compose(v, q, s));
    // dark mossy green .. lighter yellow-green, MOSS_CHAR's own tint range, read back rather than re-typed
    col.setRGB(0.08 + t.tint * 0.10, 0.22 + t.tint * 0.22, 0.08 + t.tint * 0.10);
    inst.setColorAt(i, col);
  });
  inst.instanceMatrix.needsUpdate = true;
  if (inst.instanceColor) inst.instanceColor.needsUpdate = true;
  inst.frustumCulled = false;
  planetMesh.add(inst);   // LOCAL frame: tilt + spin inherited from the parent, not re-derived here
  mossDeck = inst;
  return { type: "moss", count: tufts.length };
}
window.swekMoss = (on) => {
  if (on === false || on === "off") {
    if (mossDeck) { planetMesh.remove(mossDeck); mossDeck.geometry.dispose(); mossDeck.material.dispose(); mossDeck = null; }
    return null;
  }
  if (!planetMesh) return null;
  // the SAME local-frame direction buildMossDeck used at init -- see there for why this is not a world-space dir.
  const q = planetMesh.quaternion.clone().invert();
  const worldDir = cnorm3([camera.position.x - planetMesh.position.x, camera.position.y - planetMesh.position.y, camera.position.z - planetMesh.position.z]);
  const localDir = new THREE.Vector3(worldDir[0], worldDir[1], worldDir[2]).applyQuaternion(q).normalize();
  return buildMossDeck([localDir.x, localDir.y, localDir.z]);
};
window.swekMossProbe = () => {
  if (!mossDeck || !planetMesh) return { deck: false };
  const p = mossDeck.instanceMatrix, m = new THREE.Matrix4(), v = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3();
  let minR = Infinity, maxR = -Infinity;
  for (let i = 0; i < mossDeck.count; i++) {
    m.fromArray(p.array, i * 16); m.decompose(v, q, s);
    minR = Math.min(minR, v.length()); maxR = Math.max(maxR, v.length());
  }
  return { deck: true, count: mossDeck.count, minR, maxR };
};

window.swekArrivalProbe = () => {
  if (!arrival) return { flying: false };
  const f = sampleSequence(arrival.legs, arrival.t);
  return { flying: true, t: arrival.t, leg: f.leg, distance: f.distance, fov: f.fov,
           tunnel: !!(foldTunnel && foldTunnel.active), total: sequenceDuration(arrival.legs) };
};

// v4053 -- a PROBE of the real flight, not a mirror of the shot's own numbers: it reads the LIVE Three camera
// back and measures it against the same displaced ground surfaceRadiusAt() gave the mesh. A gate asserting the
// shot's own return value would only prove sampleShot agrees with itself; this proves the camera Three is
// actually rendering from cleared the terrain.
window.swekDescentProbe = () => {
  if (!planetMesh || !planetSpec_) return null;
  const c = planetMesh.position;
  const v = [camera.position.x - c.x, camera.position.y - c.y, camera.position.z - c.z];
  const radius = Math.hypot(v[0], v[1], v[2]);
  const ground = surfaceRadiusAt(planetSpec_, cnorm3(v), { radius: planetR, ampFrac: PLANET_AMP_FRAC });
  return { radius, ground, clearance: radius - ground, flying: !!descent, t: descent ? descent.t : 1,
           fov: camera.fov, controlsEnabled: controls.enabled };
};

  newBattle();
  try { buildCloudDeck(CLOUD_ORDER[0]); cloudsBtn.textContent = "\u2601 " + CLOUD_ORDER[0]; } catch (e) {}   // v4055 -- a deck to arrive through
  try { window.swekMoss(); } catch (e) {}   // v4076 -- ground cover on the same arrival face
  requestAnimationFrame(frame);
})();
</script>
