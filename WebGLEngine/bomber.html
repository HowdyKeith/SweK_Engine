<!DOCTYPE html>
<!-- bomber.html -- UNNUMBERED (the version is chosen at ship time): A B-29-STYLE BOMBER, ITS GUNNERS, AND THE FIGHTERS THAT ATTACK IT -- A WINDOW FOR EACH CRAFT DOWN THE RIGHT.

     The fight is brain/bomberFight.mjs's: a bomber (physics/mechanics/bomber.mjs -- the trainer's flight enlarged by dynamic similarity, four engines, a hull of seventeen spheres, FIVE GUN SEATS each with a gunner) against 1-5 trainer-class fighters,
     stepped a tick at a time by brain/dogfightArena.mjs (which brain/dogfightArena-selfcheck.mjs holds to dogfightTask.duel() to the bit for a fight of two, and to its own arithmetic for the bomber, its hull, its engines and the friendly-fire rule).

     THE WINDOWS (render/flightViews.mjs): one per craft, stacked down the right, and a CLICK on a window switches what it shows. A FIGHTER's goes plane, pilot, gunner (its fixed gun's sight: the pipper and the lead pip), brain. THE BOMBER's goes
     plane, pilot, then ONE VIEW PER GUN SEAT -- the forward upper turret, the forward lower, the aft upper, the aft lower, the tail -- looking along the turret as it slews, with the sight drawn for the target that gunner has chosen, and then brain: the
     pilot's network (or the PD autopilot's features and outputs) and, under it, a row per seat of what its gunner wants the seat to do and what the seat is doing. THE HAND GUNNER HAS NO NETWORK: those rows are the inputs and outputs of its rule.

     THE GUNNERS' SKILL IS A SETTING I CHOSE (perfect, ace, regular, green -- brain/bomberFight.mjs says what each is), not a measurement of any gunner. THE FIGHTERS' PILOTS are the same roster as dogfight.html's (the PD autopilot, the fruit fly's network, the GPU Brain's network on its
     CPU twin; hand, trained to fly, trained to fight) -- and so can be the BOMBER'S: the pilots we have fly it through froudeScale.scalePilot(), shown the trainer's world. WHAT THE DOGFIGHT PILOTS WERE GRADED AGAINST, SAID PLAINLY: only the PD autopilot, in fights of two.
     Against this bomber the trained fighters hit it where the PD ones never do (the gate for brain/bomberFight.mjs pins that) -- and nothing was trained for a bomber.

     WHAT IS NOT HERE: wind, a falling wreck (a lost craft goes dark where it was), a crew that can be killed, an interlock that keeps a turret from firing into its own bomber's tail, a formation of bombers, an escort, the fighters breaking away,
     and a gunner brain that is a network (a later round). The hit spheres can be shown (the box below): they are what a round has to reach, and a hit on an engine's puts it out after eight. -->

  { id: "gpuHand", label: "GPU Brain network, hand weights (CPU twin)", policy: MF, policyId: "pilotFlightMlp", hand: () => MF.handWeights() },

  { id: "gpuDogfight", label: "GPU Brain trained to FIGHT (CPU twin)", policy: MF, policyId: "pilotFlightMlp", file: "/brain/pilotDogfightMlpWeightsDefault.json" },

}
const available = (c) => !c.file || loaded.has(c.id);

  if (!c.policy) return { id: "pd", fn: (s, t, w) => AF.pilot(s, t, w), label: c.label, policy: null, weights: null };

  return { id: c.id, fn: c.policy.pilotFor(w), label: c.label + (c.file ? ` ${weightsHash(w)}` : "") + (meta && meta.score != null ? ` (held-out ${meta.score})` : ""), policy: c.policy, weights: w };
}

// ---- Three.js scene, Z-UP like the physics (nose +X, up +Z) ---------------------------------------------------------------------------------------------------------------------------------------------------
const scene = new THREE.Scene();

renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);

scene.add(new THREE.HemisphereLight(0xdcecff, 0x5a6b4a, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(500, -300, 900); scene.add(sun);
{
  scene.add(new THREE.Mesh(new THREE.PlaneGeometry(60000, 60000), new THREE.MeshStandardMaterial({ color: 0x5f7a45, roughness: 1 })));
  const grid = new THREE.GridHelper(30000, 150, 0x7c9a5a, 0x6c8a4c); grid.rotation.x = Math.PI / 2; grid.position.z = 0.2; scene.add(grid);
  let s = 4242; const rnd = () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
  const pylons = new THREE.InstancedMesh(new THREE.BoxGeometry(6, 6, 1), new THREE.MeshStandardMaterial({ color: 0xd9d2c0 }), 260), m = new THREE.Matrix4();
  for (let i = 0; i < 260; i++) { const h = 20 + rnd() * 90; m.compose(new THREE.Vector3((rnd() - 0.5) * 9000, (rnd() - 0.5) * 9000, h / 2), new THREE.Quaternion(), new THREE.Vector3(1, 1, h)); pylons.setMatrixAt(i, m); }
  scene.add(pylons);
}
const HULL_DEAD = new THREE.MeshStandardMaterial({ color: 0x4a2020, roughness: 0.9 });
const ENGINE_DEAD = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 1 });
function makeFighter(i) {

  const fus = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.8, 6.4, 12), mat); fus.rotation.z = Math.PI / 2; fus.position.x = -0.6; g.add(fus);
  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.55, 1.6, 12), mat); nose.rotation.z = -Math.PI / 2; nose.position.x = 3.4; g.add(nose);
  const wing = new THREE.Mesh(new THREE.BoxGeometry(1.7, 10.6, 0.16), mat); wing.position.set(0.2, 0, 0.5); g.add(wing);
  const tailplane = new THREE.Mesh(new THREE.BoxGeometry(1.1, 3.6, 0.1), mat); tailplane.position.set(-4.2, 0, 0.2); g.add(tailplane);
  const fin = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.1, 1.5), mat); fin.position.set(-4.2, 0, 0.9); g.add(fin);
  const prop = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.1, 0.04, 20), new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.25 })); prop.rotation.z = Math.PI / 2; prop.position.x = 4.3; g.add(prop);

// THE BOMBER is drawn from the same numbers the fight is: the fuselage between its hull spheres, the wings from tip to tip, a nacelle and a disc at each ENGINE sphere, the fin at the fin sphere, and a dome and a pair of barrels at each SEAT's mount
// (the barrels point where the seat points NOW). `showSpheres` adds the hit spheres themselves.
function makeBomber(bomber) {
  const g = new THREE.Group(), mat = new THREE.MeshStandardMaterial({ color: BOMBER_COLOR, metalness: 0.35, roughness: 0.45 }), k = bomber.k, hull = [], P = bomber.parts;
  const part = (name) => P.find((p) => p.name === name), fusParts = P.filter((p) => ["nose", "cockpit", "forward fuselage", "waist", "aft fuselage", "tail cone"].includes(p.name)).sort((a, b) => a.center[0] - b.center[0]);
  for (let i = 0; i + 1 < fusParts.length; i++) {
    const a = fusParts[i], b = fusParts[i + 1], len = b.center[0] - a.center[0], seg = new THREE.Mesh(new THREE.CylinderGeometry(b.radius * 0.8, a.radius * 0.8, len, 14), mat);
    seg.rotation.z = -Math.PI / 2; seg.position.set((a.center[0] + b.center[0]) / 2, 0, (a.center[2] + b.center[2]) / 2); g.add(seg); hull.push(seg);
  }
  const nose = fusParts[fusParts.length - 1], cap = new THREE.Mesh(new THREE.ConeGeometry(nose.radius * 0.8, 3 * k, 14), mat); cap.rotation.z = -Math.PI / 2; cap.position.set(nose.center[0] + 1.5 * k, 0, nose.center[2]); g.add(cap); hull.push(cap);
  const tip = part("left wing tip"), root = part("left wing root"), wing = new THREE.Mesh(new THREE.BoxGeometry(7 * k, 2 * (tip.center[1] + tip.radius * 0.6), 0.45 * k), mat); wing.position.set(root.center[0], 0, root.center[2] + 0.2 * k); g.add(wing); hull.push(wing);
  const tailC = part("tail cone"), tp = new THREE.Mesh(new THREE.BoxGeometry(3.2 * k, 14 * k, 0.25 * k), mat); tp.position.set(tailC.center[0] + 1.2 * k, 0, tailC.center[2] + 0.5 * k); g.add(tp); hull.push(tp);
  const fin = part("fin"), finM = new THREE.Mesh(new THREE.BoxGeometry(4 * k, 0.3 * k, 6 * k), mat); finM.position.set(fin.center[0] + 0.5 * k, 0, fin.center[2] + 0.5 * k); g.add(finM); hull.push(finM);
  const engines = bomber.engines.map((id) => {
    const p = P[id], nac = new THREE.Mesh(new THREE.CylinderGeometry(p.radius * 0.55, p.radius * 0.5, 5 * k, 12), mat); nac.rotation.z = -Math.PI / 2; nac.position.set(p.center[0] + 0.5 * k, p.center[1], p.center[2]); g.add(nac);
    const disc = new THREE.Mesh(new THREE.CylinderGeometry(3 * k, 3 * k, 0.05 * k, 24), new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.22 })); disc.rotation.z = Math.PI / 2; disc.position.set(p.center[0] + 3.1 * k, p.center[1], p.center[2]); g.add(disc);

    const barrel = new THREE.Group(); for (const dy of [-0.18, 0.18]) { const b = new THREE.Mesh(new THREE.CylinderGeometry(0.07 * k, 0.07 * k, 1.8 * k, 6), new THREE.MeshStandardMaterial({ color: 0x222222 })); b.position.set(dy * k, 0.9 * k, 0); barrel.add(b); } grp.add(barrel);

  g.userData = { hull, engines, turrets, spheres, kind: "bomber" }; scene.add(g); return g;
}
function trailLine(color) {

}
// the rounds: a short streak behind each one (the bomber's turrets in cyan, the fighters' in yellow); the hits: a flash that grows and fades
const MAX_ROUNDS = 1200;
function tracerSet(color) { const geom = new THREE.BufferGeometry(); geom.setAttribute("position", new THREE.BufferAttribute(new Float32Array(MAX_ROUNDS * 6), 3)); geom.setDrawRange(0, 0); const l = new THREE.LineSegments(geom, new THREE.LineBasicMaterial({ color })); l.frustumCulled = false; scene.add(l); return { geom, l }; }
const tracerB = tracerSet(0x7ff0ff), tracerF = tracerSet(0xfff1a0);

function spawnFlash(p, big = 1) { const m = new THREE.Mesh(new THREE.SphereGeometry(big, 10, 8), FLASH_MAT()); m.position.set(p[0], p[1], p[2]); m.userData.age = 0; scene.add(m); flashes.push(m); }

// ---- the fight ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
let fight = null, arena = null, bomberCfg = null, pilots = { f: null, b: null }, meshes = [], trails = [], trailN = [], deadShown = [], enginesShown = [], log = [], paused = false, held = false;
const el = (id) => document.getElementById(id);
const nameOf = (c) => (c.bomber ? "bomber" : c.name.split(" · ")[0]);
function clearFight() { for (const m of meshes) { scene.remove(m); m.traverse((c) => { if (c.geometry) c.geometry.dispose(); }); } for (const t of trails) { scene.remove(t); t.geometry.dispose(); } for (const f of flashes) { scene.remove(f); f.geometry.dispose(); f.material.dispose(); } flashes.length = 0; meshes = []; trails = []; }
function newFight({ kind = el("kind").value, seed = Number(el("seed").value) || 1, fighters = Number(el("nfight").value) || 3, gunners = el("gunners").value, f = el("pilotF").value, b = el("pilotB").value, hold = el("hold").checked } = {}) {
  clearFight();
  fighters = Math.max(1, Math.min(5, Math.round(fighters))); seed = Math.max(1, Math.round(seed));
  pilots = { f: resolvePilot(f), b: resolvePilot(b) };
  fight = BF.build(seed, kind, { fighters, gunners, pilot: pilots.f.fn, bomberPilot: pilots.b.fn, holdFire: hold });
  arena = fight.arena; bomberCfg = fight.bomber;
  arena.crafts[0].name = `bomber · ${pilots.b.label}`; arena.crafts.slice(1).forEach((c) => { c.name = `${c.name} · ${pilots.f.label}`; });
  meshes = arena.crafts.map((c, i) => (c.bomber ? makeBomber(c.bomber) : makeFighter(i - 1))); trails = arena.crafts.map((c, i) => trailLine(c.bomber ? BOMBER_COLOR : FIGHTER_COLORS[(i - 1) % FIGHTER_COLORS.length])); trailN = arena.crafts.map(() => 0); deadShown = arena.crafts.map(() => false); enginesShown = [4];
  log = []; el("kind").value = kind; el("seed").value = String(fight.scenario.seed); el("nfight").value = String(fighters); el("gunners").value = typeof gunners === "string" ? gunners : "regular"; el("pilotF").value = pilots.f.id; el("pilotB").value = pilots.b.id; el("hold").checked = !!hold;
  buildWindows(); camPos.set(...arena.crafts[0].state.pos).add(new THREE.Vector3(-200, -150, 100)); camLook.set(...arena.crafts[0].state.pos);
  renderNote(); renderFrame(0, true);
}
function tickOnce() {
  A.stepArena(arena);
  const nm = (id) => nameOf(arena.crafts.find((c) => c.id === id));
  for (const e of arena.events) {
    if (e.type === "hit") {
      const v = arena.crafts.find((c) => c.id === e.victim); spawnFlash(e.point, v.bomber ? 0.8 : 1);
      if (v.bomber || e.friendly || arena.i % 6 === 0 || v.taken >= v.hp) log.push(`${e.t.toFixed(1)} s  ${nm(e.shooter)} hit ${nm(e.victim)}${e.friendly ? " (FRIENDLY FIRE)" : ""}${e.part !== undefined ? ` — ${v.bomber.parts[e.part].name}` : ""}  (${Math.max(0, v.hp - v.taken)} hit points left)`);
    }
    else if (e.type === "engine") log.push(`${e.t.toFixed(1)} s  ${e.name} OUT — ${e.running} engine${e.running === 1 ? "" : "s"} running`);

  clickWindow(i) { wins[i].el.dispatchEvent(new MouseEvent("click", { bubbles: true })); renderFrame(0); return { view: wins[i].view, seat: wins[i].seat }; },
  setView(i, v, seat = 0) { wins[i].view = v; wins[i].seat = seat; setLabel(wins[i]); renderFrame(0); }, pixels: pixelStats, ink: overlayInk, inkColor,
  sight: (i) => wins[i].sight, texts: (i) => wins[i].texts.slice(),
  turretAim: (k) => { const m = meshes[0].userData.turrets[k].barrel.quaternion; return [m.x, m.y, m.z, m.w]; },
  engineShown: () => meshes[0].userData.engines.map((e) => ({ out: e.nac.material === ENGINE_DEAD, disc: e.disc.visible })),
  spheresShown: () => meshes[0].userData.spheres.map((s) => s.visible),
  mainCamera: () => ({ pos: camera.position.toArray(), look: camLook.toArray() }),
  settleCamera() { renderFrame(0, true); },
  mainView() { const v = new THREE.Vector3(); return arena.crafts.map((c) => { v.set(...c.state.pos).project(camera); return [v.x, v.y, v.z]; }); },
  get paused() { return paused; },
  roster: { forget(id) { loaded.delete(id); fillRosters(); }, get choices() { return [...el("pilotF").options].map((o) => ({ id: o.value, disabled: o.disabled })); }, get labels() { return [pilots.f.label, pilots.b.label]; }, error: (id) => errors.get(id) || null, loaded: (id) => loaded.has(id), loadChoice: (id, url) => loadChoice(CHOICES.find((c) => c.id === id), url), refill: fillRosters },
};
</script>
</body>
</html>
