<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="demo:title" content="Building Lab (a seeded building grammar as instanced boxes)">
<meta name="demo:desc" content="world/buildingGrammar.mjs drawn on gfx/device.js: one instanced box per cell through render/gpuDriven.mjs's records and the lit pipeline, tinted by kind (corner, wall, party-wall blank, stairs, roof cap, interior), for a seed, cell counts, party-wall sides, a stairs side and accessory percentages. After VladimirKobranov/configurator-unreal-building (Apache-2.0), read and hand-written. Held to the placement list by tools/ship/buildingLab-selfcheck.mjs.">
<meta name="demo:category" content="world">
<title>Building Lab</title>
<style>
  html,body { margin:0; height:100%; background:#050805; color:#9fb2d4; font:12px ui-monospace,Menlo,monospace; }
  #c { display:block; width:100%; }
  #hud { padding:10px 14px; }
  #cap { color:#f6a623; letter-spacing:.14em; text-transform:uppercase; }
  #be { color:#59d1ff; font-size:14px; margin-top:4px; }
  #sub { color:#5f7aa0; font-size:11px; margin-top:2px; line-height:1.7; }
  .bad { color:#ff9a9a; }
  a { color:#59d1ff; }
  input[type=number] { width:44px; background:#0c140f; color:#9fb2d4; border:1px solid #2a3a30; font:inherit; }
  select { background:#0c140f; color:#9fb2d4; border:1px solid #2a3a30; font:inherit; }
  .sw { display:inline-block; width:10px; height:10px; vertical-align:middle; margin-right:3px; }
</style>
</head>
<body>
<div id="hud">
  <div id="cap">Building lab: the grammar's cells as lit boxes, a seed and its party walls live</div>
  <div id="be">requesting a device&hellip;</div>
  <div id="sub">seed <input id="seed" type="number" value="7"> &middot; cells x <input id="nx" type="number" value="5" min="1" max="24"> y <input id="ny" type="number" value="4" min="1" max="24"> floors <input id="nz" type="number" value="4" min="1" max="24">
    &middot; party wall <label><input type="checkbox" id="pf"> front</label> <label><input type="checkbox" id="pb"> back</label> <label><input type="checkbox" id="pl"> left</label> <label><input type="checkbox" id="pr"> right</label>
    &middot; stairs <select id="stairs"><option>front</option><option>back</option><option>left</option><option>right</option></select>
    &middot; accessories first <input id="a1" type="number" value="40" min="0" max="100"> wall <input id="a2" type="number" value="25" min="0" max="100"> roof <input id="a3" type="number" value="30" min="0" max="100">
    &middot; <a href="?webgl=1">force WebGL2</a><br>
    <span id="legend"></span> &middot; <span id="tick"></span> &middot; drag to orbit</div>
</div>
<canvas id="c"></canvas>
<script type="module" src="/ui/originNotice.js"></script>
<script type="module">
import { requestDevice } from "./gfx/device.js";
import * as G from "./render/gpuDriven.mjs";
import * as L from "./render/litSphere.mjs";
import { KINDS, KIND_TINTS, boxMesh, labBuilding } from "./render/buildingLab.mjs";

const cvs = document.getElementById("c"), beEl = document.getElementById("be");
const fail = (m) => { beEl.innerHTML = '<span class="bad">' + m + "</span>"; };
let device, scene = null, building = null, yaw = 0.6, pitch = 0.35, dragging = null, frames = 0, dirty = true;
const $ = (id) => document.getElementById(id);
const legend = KINDS.map((k, i) => `<span class="sw" style="background:rgb(${KIND_TINTS[i].map((v) => Math.round(v * 255)).join(",")})"></span>${k}`).join(" ");
document.getElementById("legend").innerHTML = legend;

function knobs() {
  return { nx: +$("nx").value || 1, ny: +$("ny").value || 1, nz: +$("nz").value || 1, brandmauer: { front: $("pf").checked, back: $("pb").checked, left: $("pl").checked, right: $("pr").checked }, stairs: { side: $("stairs").value, column: "random" }, accessories: { firstFloor: +$("a1").value, wall: +$("a2").value, roof: +$("a3").value } };
}
function rebuild() {
  building = labBuilding((+$("seed").value) >>> 0, knobs());
  if (scene && scene.destroy) scene.destroy();
  scene = G.makeGpuDrivenScene(device, { lods: [{ name: "only", mesh: boxMesh([1, 1, 1, 1]) }], thresholds: [], records: building.records, layout: G.LAYOUTS.lit, pipeline: L.litPipelineDesc({ tints: KIND_TINTS }), bind: L.litBind([6, 9, 8, 0.3]), headings: building.extras });
  const c = building.grammar.counts;
  $("tick").textContent = `hash ${building.grammar.hash} · ${c.cells} cells: ${c.corner} corners, ${c.wall} walls, ${c.blank} blank, ${c.stairs} stairs at column ${building.grammar.stairsColumn}, ${c.roofCap} roof caps, ${c.interior} interior, ${c.accessories} accessories`;
  dirty = false;
}
async function init() {
  const forceGl = new URLSearchParams(location.search).get("webgl") === "1";
  try { device = await requestDevice(cvs, forceGl ? { backend: "webgl2" } : { prefer: "webgpu" }); }
  catch (e) { return fail("requestDevice threw: " + e.message); }
  if (!device || device.backend === "null") return fail("no GPU backend here (WebGPU needs a secure origin: localhost or https).");
  try { rebuild(); } catch (e) { return fail("scene: " + e.message); }
  beEl.textContent = "backend: " + device.backend + " · " + scene.path + " · one instanced box per cell through gpuDriven's records and the lit pipeline";
  for (const id of ["seed", "nx", "ny", "nz", "pf", "pb", "pl", "pr", "stairs", "a1", "a2", "a3"]) $(id).addEventListener("change", () => { dirty = true; });
  cvs.addEventListener("pointerdown", (e) => { dragging = [e.clientX, e.clientY]; });
  addEventListener("pointerup", () => { dragging = null; });
  addEventListener("pointermove", (e) => { if (!dragging) return; yaw += (e.clientX - dragging[0]) * 0.006; pitch = Math.max(-1.2, Math.min(1.2, pitch + (e.clientY - dragging[1]) * 0.006)); dragging = [e.clientX, e.clientY]; });
  requestAnimationFrame(frame);
}
function dpr() { return Math.min(2, devicePixelRatio || 1); }
function frame() {
  const d = dpr(), w = Math.round((cvs.clientWidth || 1200) * d), h = Math.round(w * 0.55);
  if (cvs.width !== w || cvs.height !== h) { cvs.width = w; cvs.height = h; }
  if (dirty) { try { rebuild(); } catch (e) { fail("scene: " + e.message); return; } }
  if (!dragging) yaw += 0.003;
  const span = Math.max(...building.halfSpan) * 2.6 + 3, eye = [Math.sin(yaw) * Math.cos(pitch) * span, Math.sin(pitch) * span, Math.cos(yaw) * Math.cos(pitch) * span];
  const cam = { viewProj: G.multiply(G.perspective(0.8, w / h, 0.1, 200), G.lookAt(eye, [0, 0, 0])), eye };
  scene.frame({ ...cam, clear: [0.02, 0.031, 0.024, 1] });
  frames++;
  requestAnimationFrame(frame);
}
init();
</script>
</body>
</html>
