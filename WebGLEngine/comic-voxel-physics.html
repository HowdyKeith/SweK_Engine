<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="demo:title" content="Comic Voxel Physics">
<meta name="demo:desc" content="Round four of content->voxels->filters, and the generalization: the comic page is a slab of rigid voxels. Punch it and it shatters, gravity drops the pieces, and a floor catches them so they pile up. Click to strike anywhere. Portable CPU rigid-body-lite; routes through the Jolt backend for real collisions.">
<meta name="demo:category" content="fx">
<title>Comic Voxel Physics</title>
<style>
  :root { --amber:#f6a623; --cyan:#59d1ff; }
  html,body { margin:0; height:100%; background:#05060a; overflow:hidden; color:#dbe7ff; font:13px ui-monospace,Menlo,monospace; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #cap { position:fixed; left:14px; top:12px; color:var(--amber); letter-spacing:.15em; text-transform:uppercase; z-index:3; }
  #st { position:fixed; right:14px; top:12px; color:#7c93b8; font-size:11px; z-index:3; }
  #bar { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:3; display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  button { background:rgba(14,14,22,.78); color:var(--cyan); border:1px solid #22304a; border-radius:8px; padding:9px 16px; font:600 12px ui-monospace,monospace; letter-spacing:.06em; text-transform:uppercase; cursor:pointer; }
  button:hover { border-color:var(--cyan); }
  #hint { position:fixed; left:50%; bottom:62px; transform:translateX(-50%); color:#7c93b8; font-size:11px; z-index:3; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cap">&#9670; Comic Voxel Physics</div>
<div id="st"></div>
<div id="hint">click the page to strike it &middot; shift-drag to orbit</div>
<div id="bar"><button id="backend">Physics: cpu</button><button id="blast">&#128165; Blast center</button><button id="res">Resolution: med</button><button id="page">Next page</button><button id="reform">Reform</button></div>
<script type="module">
import { voxelizePage } from "./fx/voxelize/pageVoxels.js";
import { makeVoxelPhysics } from "./fx/voxelize/voxelPhysicsBackends.js";
import { box3d } from "/physics/box3d/box3dLoader.js";
import { createJoltBackend } from "/physics/jolt/joltLoader.js";

const cv = document.getElementById("c"), st = document.getElementById("st");
let W = 0, H = 0, DPR = Math.min(2, devicePixelRatio || 1);
function resize() { W = Math.floor(innerWidth * DPR); H = Math.floor(innerHeight * DPR); cv.width = W; cv.height = H; cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px"; }
addEventListener("resize", resize); resize();

function makePage(kind) {
  const PW = 480, PH = 620, s = document.createElement("canvas"); s.width = PW; s.height = PH; const g = s.getContext("2d");
  g.fillStyle = "#f4efe3"; g.fillRect(0, 0, PW, PH);
  const panels = kind === 0 ? [[20, 20, 440, 180], [20, 220, 210, 180], [250, 220, 210, 180], [20, 420, 440, 180]] : [[20, 20, 440, 285], [20, 325, 440, 275]];
  const sky = ["#8ec5e8", "#e8b04a", "#c86a8e", "#7fb08a"];
  panels.forEach((p, i) => {
    g.fillStyle = sky[(i + kind) % 4]; g.fillRect(p[0], p[1], p[2], p[3]);
    g.fillStyle = ["#e5544b", "#4b8de5", "#5cb85c", "#b05ce5"][(i * 2 + kind) % 4]; const fx = p[0] + p[2] * 0.3, fy = p[1] + p[3] * 0.72;
    g.beginPath(); g.moveTo(fx - 16, fy); g.lineTo(fx + 16, fy); g.lineTo(fx + 10, fy - 46); g.lineTo(fx - 10, fy - 46); g.closePath(); g.fill();
    g.fillStyle = "#f2c69a"; g.beginPath(); g.arc(fx, fy - 56, 12, 0, 6.28); g.fill();
    g.strokeStyle = "#111"; g.lineWidth = 4; g.strokeRect(p[0], p[1], p[2], p[3]);
  });
  return s;
}

const RES = { low: 12, med: 7, high: 4 }, resNames = ["low", "med", "high"], backends = ["cpu", "box3d", "jolt"];
let resI = 1, kind = 0, bI = 0, vg = null, phys = null, ry = 0, rx = -0.12, note = "";
async function rebuild() {
  const pg = makePage(kind), d = pg.getContext("2d").getImageData(0, 0, pg.width, pg.height).data;
  vg = voxelizePage(d, pg.width, pg.height, { cell: RES[resNames[resI]] });
  phys = await makeVoxelPhysics(vg, backends[bI], { g: 2.4, floor: 0.85, box3d, joltFactory: createJoltBackend });
  note = phys.fellBack ? " (fell back: " + phys.fellBack + ")" : "";
  document.getElementById("backend").textContent = "Physics: " + phys.name;
}
document.getElementById("blast").addEventListener("click", () => { if (phys) phys.impact({ x: 0, y: 0, z: 0 }, 1.8); });
document.getElementById("res").addEventListener("click", (e) => { resI = (resI + 1) % 3; e.target.textContent = "Resolution: " + resNames[resI]; rebuild(); });
document.getElementById("page").addEventListener("click", () => { kind = (kind + 1) % 2; rebuild(); });
document.getElementById("reform").addEventListener("click", () => { rebuild(); });
document.getElementById("backend").addEventListener("click", () => { bI = (bI + 1) % backends.length; rebuild(); });

let drag = false, lx = 0, ly = 0;
cv.addEventListener("pointerdown", e => { if (e.shiftKey) { drag = true; lx = e.clientX; ly = e.clientY; return; } if (phys) { const mx = (e.clientX / innerWidth - 0.5) * 2.0, my = (e.clientY / innerHeight - 0.5) * 2.0; phys.impact({ x: mx * 0.8, y: my * 0.8, z: 0 }, 1.7); } });
addEventListener("pointerup", () => drag = false);
addEventListener("pointermove", e => { if (!drag) return; ry += (e.clientX - lx) * 0.008; rx += (e.clientY - ly) * 0.008; lx = e.clientX; ly = e.clientY; });

let R = null, tier = "Canvas2D";
function frame() {
  if (phys) phys.step(1 / 60);
  try { R.draw(); } catch (e) { st.textContent = "render error"; }
  st.textContent = tier + " \u00b7 " + (vg ? vg.voxels.length : 0) + " voxels \u00b7 " + (phys ? phys.name : "-") + note;
  requestAnimationFrame(frame);
}
(async () => {
  await rebuild();
  const m = await import("./fx/voxelize/voxelRender.js");
  try { R = m.initVoxelGL(cv, () => vg, () => ({ W, H, ry, rx, dist: 3.0 })); if (R) tier = "WebGL2"; } catch (e) { R = null; }
  if (!R) R = m.initVoxelCanvas(cv, () => vg, () => ({ W, H, ry, rx, dist: 3.0 }));
  frame();
})();
</script>
</body>
</html>
