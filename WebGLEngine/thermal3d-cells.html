<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="demo:title" content="Plumes">
<meta name="demo:desc" content="Rayleigh-Benard convection in three dimensions: a layer heated from below organising itself into plumes, hot columns rising and cold sheets falling. Nothing tells it to. The surfaces are isosurfaces of temperature, marched fresh from the live field, and here the blackbody ramp is honestly reading heat -- unlike the duct, where it reads speed and says so. The Mach gauge matters: this engine measured its own lattice's Galilean error and wrote down a rule -- trust it below Mach 0.1. Push the Rayleigh slider hard enough and the page will tell you when you have broken the engine's own rule, because a demo that quietly runs outside its verified range is a lie with nice colours.">
<meta name="demo:category" content="simulation">
<title>Plumes</title>
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js" } }</script>
<style>
  html,body { margin:0; height:100%; background:#03050c; overflow:hidden; color:#9fb2d4; font:12px ui-monospace,Menlo,monospace; }
  #hud { position:fixed; left:14px; top:12px; z-index:3; max-width:400px; pointer-events:none; }
  #cap { color:#f6a623; letter-spacing:.14em; text-transform:uppercase; font-size:13px; }
  #stat { color:#7fe3c4; margin-top:5px; line-height:1.65; }
  #mach { margin-top:6px; font-size:12px; line-height:1.5; }
  #note { color:#6f86ab; margin-top:6px; line-height:1.45; font-size:11.5px; }
  #ctl { position:fixed; right:14px; top:12px; z-index:3; display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
  button { background:rgba(16,22,36,.92); color:#c9b6ff; border:1px solid #3a3060; border-radius:18px; padding:8px 13px; font:600 11px ui-monospace,monospace; cursor:pointer; }
  button.on { color:#7fe3c4; border-color:#2a6a5a; }
  #raWrap { background:rgba(16,22,36,.92); border:1px solid #3a3060; border-radius:10px; padding:8px 11px; }
  input[type=range] { width:170px; accent-color:#f6a623; }
</style>
</head>
<body>
<div id="hud"><div id="cap">&#9670; Plumes &mdash; convection in 3D</div><div id="stat"></div><div id="mach"></div><div id="note"></div></div>
<div id="ctl">
  <div id="raWrap"><div style="font-size:10px;color:#5f7aa0;margin-bottom:4px;">Rayleigh number &mdash; onset is 1708</div><input id="ra" type="range" min="3.3" max="4.6" step="0.01" value="4.08"></div>
  <button id="tHot" class="on">hot plumes</button>
  <button id="tCold" class="on">cold plumes</button>
  <button id="reset">reset</button>
</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "./vendor/three/jsm/controls/OrbitControls.js";
import { makeThermal3D } from "./simulation/lbm/thermal3d.js";
import { marchScalarField } from "./simulation/MarchingCubes.js";
import { blackbodyRamp } from "./fx/voxelize/fireRamp.js";

const H = 14, NZ = H + 2, NX = 28, NY = 28, TAU = 0.55;
const CS = Math.sqrt(1 / 3), RA_C = 1707.76;      // display only -- the physics never reads it
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x03050c);
const cam = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 400);
cam.position.set(30, 26, 34);
const ctr = new OrbitControls(cam, renderer.domElement); ctr.enableDamping = true;
addEventListener("resize", () => { cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
scene.add(new THREE.AmbientLight(0x3a4a66, 1.5));
const k1 = new THREE.DirectionalLight(0xffd9a0, 1.4); k1.position.set(20, 30, 18); scene.add(k1);
const k2 = new THREE.DirectionalLight(0x5599ff, 0.7); k2.position.set(-18, -14, -20); scene.add(k2);
const off = new THREE.Vector3(-(NX-1)/2, -(NZ-1)/2, -(NY-1)/2);

// the plates, drawn as what they are: one hot, one cold
const plate = (z, col) => { const p = new THREE.Mesh(new THREE.BoxGeometry(NX, 0.35, NY),
  new THREE.MeshStandardMaterial({ color: col, roughness: 0.6, emissive: col, emissiveIntensity: 0.25 }));
  p.position.set(0, z + off.y, 0); scene.add(p); return p; };
plate(0, 0x8a2a12); plate(NZ - 1, 0x14203c);

let m = null, hotMesh = null, coldMesh = null, steps = 0, msEwma = 0;
const raOf = () => Math.pow(10, parseFloat(document.getElementById("ra").value));
function build() {
  const nu = (TAU - 0.5) / 3, alpha = nu;
  const gbeta = raOf() * nu * alpha / (1.0 * H * H * H);
  m = makeThermal3D({ nx: NX, ny: NY, nz: NZ, tau: TAU, tauG: TAU, gravity: -1, beta: -gbeta, Thot: 0.5, Tcold: -0.5,
    init: (x, y, z) => ({ T: 0.5 - (z - 0.5) / H + 0.02 * (Math.random() - 0.5) }) });
  steps = 0;
}
build();
document.getElementById("ra").oninput = build;
document.getElementById("reset").onclick = build;
const btnHot = document.getElementById("tHot"), btnCold = document.getElementById("tCold");
btnHot.onclick = () => { btnHot.classList.toggle("on"); if (hotMesh) hotMesh.visible = btnHot.classList.contains("on"); };
btnCold.onclick = () => { btnCold.classList.toggle("on"); if (coldMesh) coldMesh.visible = btnCold.classList.contains("on"); };

const field = new Float32Array(NX*NY*NZ);
function isoMesh(prev, iso, ramp, opacity) {
  const s = marchScalarField(field, NX, NY, NZ, iso, { cellSize: 1 });
  if (prev) { scene.remove(prev); prev.geometry.dispose(); }
  if (!s.positions.length) return null;
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(s.positions), 3));
  g.setAttribute("normal", new THREE.BufferAttribute(new Float32Array(s.normals), 3));
  const c = blackbodyRamp(ramp);
  const mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: new THREE.Color(c[0], c[1], c[2]),
    transparent: true, opacity, roughness: 0.45, side: THREE.DoubleSide, depthWrite: false }));
  // the lattice is x,y,z with z up; three is x,y up,z -- so the field is placed with z mapped to height
  mesh.position.copy(off);
  scene.add(mesh); return mesh;
}
function remesh() {
  for (let z=0;z<NZ;z++) for (let y=0;y<NY;y++) for (let x=0;x<NX;x++) {
    const k = m.idx(x,y,z);
    // marching cubes indexes (x, y, z) with y as the second axis -- feed it x, z(height), y so the plumes stand up
    field[(y*NZ + z)*NX + x] = m.solid[k] ? 0 : m.T[k];
  }
  hotMesh = isoMesh(hotMesh, 0.16, 0.85, 0.5); if (hotMesh) hotMesh.visible = btnHot.classList.contains("on");
  coldMesh = isoMesh(coldMesh, -0.16, 0.12, 0.42); if (coldMesh) coldMesh.visible = btnCold.classList.contains("on");
}
let frames = 0;
function frame() {
  try {
    const t0 = performance.now();
    m.step(); steps++;
    msEwma = msEwma ? msEwma*0.9 + (performance.now()-t0)*0.1 : performance.now()-t0;
    if (frames % 6 === 0) remesh();
    frames++;
    let peak = 0;
    for (let k = 0; k < NX*NY*NZ; k++) { if (m.solid[k]) continue; const s = Math.hypot(m.ux[k], m.uy[k], m.uz[k]); if (s > peak) peak = s; }
    const Ma = peak / CS, Ra = m.Ra;
    document.getElementById("stat").innerHTML =
      "Rayleigh <b style='color:#f6a623'>" + Math.round(Ra).toLocaleString() + "</b> &nbsp;&middot;&nbsp; onset 1,708 &nbsp;&middot;&nbsp; " + NX + "&times;" + NY + "&times;" + NZ +
      "<br>" + steps.toLocaleString() + " steps &nbsp;&middot;&nbsp; " + msEwma.toFixed(1) + " ms/step &nbsp;&middot;&nbsp; peak speed " + peak.toExponential(1);
    document.getElementById("mach").innerHTML = Ma < 0.1
      ? "<span style='color:#7fe3c4'>Mach " + Ma.toFixed(3) + " &mdash; inside this engine's own verified range.</span>"
      : "<span style='color:#ff9a9a'>Mach " + Ma.toFixed(3) + " &mdash; PAST the Mach 0.1 rule this engine measured for itself. The lattice's Galilean error is material here: it was 2.5% at Mach 0.12 and 22.6% at Mach 0.29.</span>";
    document.getElementById("note").innerHTML = Ra < RA_C
      ? "Below 1,708 &mdash; it just conducts. Nothing in this page uses that number to decide; the fluid finds it."
      : "Hot columns rise, cold sheets fall. Nothing tells them to &mdash; the surfaces are isosurfaces of temperature, marched fresh from the live field. <b>Here the ramp really is reading heat.</b>";
  } catch (e) { console.error("[swek] plumes frame fault:", e); }
  ctr.update(); renderer.render(scene, cam);
  requestAnimationFrame(frame);
}
remesh(); frame();
</script>
</body>
</html>
