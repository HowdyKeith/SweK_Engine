<style>

    margin: 0; padding: 0;
    width: 100%; height: 100%;

    font-family: monospace;

  }
  #robot-canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #status {
    position: fixed;
    top: 10px; left: 10px;
    font-size: 11px;
    padding: 6px 10px;

    border: 1px solid rgba(255, 153, 0, 0.35);

     positioned over the robot's face area. Hidden by default; opens/
     closes during kpop:speak via robotFaceAvatar.js. RobotExpressive

<script>
  // If opened directly (not embedded), restore the diagnostic chrome
  // so the standalone page is still useful.
  if (!new URLSearchParams(location.search).get("voice")) {
      for (const id of ["status", "emotion", "hint"]) {
          const el = document.getElementById(id);
          if (el) el.style.display = "";
      }
  }

  // v857 — Favorite-button wiring. Resolves the current model
  // identifier (?glb=URL or ?asset=NAME), then mirrors the favorited
  // state on the ☆ glyph. Click toggles. Subscribes to onChange so
  // multi-tab updates stay visible.
  (function bindFavoriteBtn(){
    const params = new URLSearchParams(location.search);
    const glb    = params.get("glb");
    const asset  = params.get("asset");
    const url    = glb || asset || "RobotExpressive";
    const label  = (glb)
      ? (glb.split("/").pop() || "Custom Avatar").replace(/\.(glb|gltf)$/i, "")
      : (asset || "Robot Man");
    const btn = document.getElementById("favBtn");
    if (!btn) return;
    function paint() {
      const fav = window.kpopFavorites;
      if (!fav) { btn.textContent = "☆"; return; }
      const is = fav.has(url);
      btn.textContent = is ? "★" : "☆";
      btn.style.color = is ? "#ffd560" : "#888";
      btn.style.borderColor = is ? "rgba(255,213,96,0.6)" : "rgba(120,200,255,0.35)";
      btn.title = is ? "Remove from favorites" : "Add to KPop avatar favorites";
    }
    btn.addEventListener("click", function(){
      const fav = window.kpopFavorites;
      if (!fav) return;
      fav.toggle(url, label);
      paint();
    });
    // Subscribe so cross-tab/cross-frame changes stay in sync. The
    // store reads from localStorage; multi-window scenarios will need
    // an explicit storage event listener — added below.
    function init() {
      const fav = window.kpopFavorites;
      if (!fav) { setTimeout(init, 80); return; }
      paint();
      fav.onChange(paint);
    }
    init();
    // localStorage changes from OTHER tabs/windows fire a 'storage'
    // event that the singleton in this window doesn't otherwise know
    // about. Re-read on storage events so multi-window editing stays
    // consistent.
    window.addEventListener("storage", function(e){
      if (e.key === "voxelEngine.kpopFavorites" && window.kpopFavorites?._load) {
        window.kpopFavorites._load();
        paint();
      }
    });
  })();

  // v862 — Costume picker wiring. Resolves current avatar identity
  // (same as favorite button does), tracks costume per avatar via
  // window.avatarCostumes, click cycles. Updates glyph + tooltip on
  // change. Costume application to the WebGL render happens in
  // robotFaceAvatar.js (it reads _costume.tint per frame).
  (function bindCostumeBtn(){
    const params = new URLSearchParams(location.search);
    const url = params.get("glb") || params.get("asset") || "RobotExpressive";
    const btn = document.getElementById("costumeBtn");
    if (!btn) return;
    function paint() {
      const store = window.avatarCostumes;
      if (!store) { btn.textContent = "⚪"; return; }
      const c = store.get(url);
      btn.textContent = c.emoji || "⚪";
      btn.title = "Costume: " + c.label + " — click to cycle (" + (store.list().length) + " palettes)";
    }
    btn.addEventListener("click", function(){
      const store = window.avatarCostumes;
      if (!store) return;
      store.cycle(url);
      paint();
    });
    // Wait for module to install singleton
    function init() {
      const store = window.avatarCostumes;
      if (!store) { setTimeout(init, 80); return; }
      paint();
      store.onChange(function(change){
        if (change?.avatarUrl === url) paint();
      });
    }
    init();
    window.addEventListener("storage", function(e){
      if (e.key === "voxelEngine.avatarCostumes" && window.avatarCostumes?._load) {
        window.avatarCostumes._load();
        paint();
      }
    });
  })();

  // v864 — Accessory picker wiring. Three buttons (hat / eyewear /
  // cape), each cycling its slot via window.avatarAccessories.
  (function bindAccessoryBtns(){
    const params = new URLSearchParams(location.search);
    const url = params.get("glb") || params.get("asset") || "RobotExpressive";
    const slotConfig = [
      { btnId: "hatBtn",      slotKey: "hat",      label: "Hat",      emptyEmoji: "👒" },
      { btnId: "eyewearBtn",  slotKey: "eyewear",  label: "Eyewear",  emptyEmoji: "🕶" },
      { btnId: "capeBtn",     slotKey: "cape",     label: "Cape",     emptyEmoji: "🦸" },
      { btnId: "streamerBtn", slotKey: "streamer", label: "Streamer", emptyEmoji: "🎀" },
    ];
    function emojiFor(slotKey, variantKey) {
      const slots = window.ACCESSORY_SLOTS;
      if (!slots) return "❌";
      const slot = slots.find(s => s.key === slotKey);
      if (!slot) return "❌";
      const v = slot.variants.find(v => v.key === variantKey);
      return v ? v.emoji : "❌";
    }
    function paint() {
      const store = window.avatarAccessories;
      for (const cfg of slotConfig) {
        const btn = document.getElementById(cfg.btnId);
        if (!btn) continue;
        if (!store) { btn.textContent = "❌"; continue; }
        const cur = store.getSlot(url, cfg.slotKey);
        btn.textContent = (cur === "none") ? cfg.emptyEmoji : emojiFor(cfg.slotKey, cur);
        btn.style.opacity = (cur === "none") ? "0.55" : "1.0";
        btn.title = cfg.label + ": " + (cur === "none" ? "none" : cur) + " — click to cycle";
      }
    }
    for (const cfg of slotConfig) {
      const btn = document.getElementById(cfg.btnId);
      if (!btn) continue;
      btn.addEventListener("click", function(){
        const store = window.avatarAccessories;
        if (!store) return;
        store.cycleSlot(url, cfg.slotKey);
        paint();
      });
    }
    function init() {
      const store = window.avatarAccessories;
      if (!store) { setTimeout(init, 80); return; }
      paint();
      store.onChange(function(change){
        if (change?.avatarUrl === url) paint();
      });
    }
    init();
    window.addEventListener("storage", function(e){
      if (e.key === "voxelEngine.avatarAccessories" && window.avatarAccessories?._load) {
        window.avatarAccessories._load();
        paint();
      }
    });
  })();

  // ─── v853: error capture pipeline ───────────────────────────────
  //
  // Inside-iframe console + error capture that postMessages out to the
  // parent window (PipAvatar listens, forwards as engine:iframe-error,
  // HeartbeatAvatar logs + flips to dead-eye). This is the primary
  // debugging path for the Android TV Device glb avatar not showing — failures
  // inside RobotExpressive.html now surface up to the engine page's error
  // log instead of being trapped silently inside the iframe.
  //
  // Also installs a /shield/error-report POST fallback for Shield
  // (Android TV) where the iframe parent may be a different page that
  // doesn't have the engine:iframe-error listener. Best-effort; logs
  // to console if both paths fail.
  (function installErrorCapture() {
    function postOut(payload) {
      // Try parent postMessage first (works when embedded in PipAvatar)
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, "*");
          return;
        }
      } catch {}
      // Fallback: POST to bridge endpoint (for standalone Shield use)
      // The bridge relays to debug:push for the /debug.html viewer.
      try {
        fetch("/debug/push", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            type: "kpavatar:error",
            ts: Date.now(),
            ua: navigator.userAgent,
            ...payload,
          }),
          keepalive: true,
        }).catch(() => {});
      } catch {}
    }

    // Surface uncaught errors
    window.addEventListener("error", (ev) => {
      postOut({
        type: "kpavatar:error",
        message: String(ev?.message || "uncaught error"),
        stack: ev?.error?.stack || null,
        url: location.href,
        filename: ev?.filename || null,
        line: ev?.lineno || null,
        col: ev?.colno || null,
      });
    });
    // Surface unhandled promise rejections (common path for fetch/glb fails)
    window.addEventListener("unhandledrejection", (ev) => {
      const reason = ev?.reason;
      postOut({
        type: "kpavatar:error",
        message: "Unhandled promise rejection: " +
                 (reason?.message || String(reason)).slice(0, 300),
        stack: reason?.stack || null,
        url: location.href,
      });
    });
    // Wrap console.error so deliberate error logs (incl. our own
    // explicit "glb load failed" lines) also bubble out. Wraps only
    // .error/.warn — not .log — to avoid the parent drowning in chatter.
    const origError = console.error.bind(console);
    const origWarn  = console.warn.bind(console);
    console.error = function(...args) {
      origError(...args);
      try {
        postOut({
          type: "kpavatar:error",
          message: args.map(a => {
            if (a instanceof Error) return a.message;
            if (typeof a === "object") { try { return JSON.stringify(a); } catch { return String(a); } }
            return String(a);
          }).join(" ").slice(0, 500),
          source: "console.error",
        });
      } catch {}
    };
    console.warn = function(...args) {
      origWarn(...args);
      try {
        postOut({
          type: "kpavatar:warn",
          message: args.map(a => {
            if (a instanceof Error) return a.message;
            if (typeof a === "object") { try { return JSON.stringify(a); } catch { return String(a); } }
            return String(a);
          }).join(" ").slice(0, 500),
          source: "console.warn",
        });
      } catch {}
    };
    // Heartbeat ping every 10s so debug.html can show "iframe alive"
    // alongside "Shield glb still missing". One-way; no reply expected.
    setInterval(() => {
      postOut({ type: "kpavatar:ping", ts: Date.now() });
    }, 10000);
    // First ping on load
    postOut({ type: "kpavatar:ping", ts: Date.now(), loaded: true });
  })();
</script>
<script type="module" src="./face/robotFaceAvatar.js">

// ─── v822 — Universal viewer protocol ────────────────────
// Demos opt-in via meta tags + postMessage. Viewer at
// universal-viewer.html iframes this page + exchanges:
//   demo:params  (demo → viewer)   announce tunable schema
//   demo:set     (viewer → demo)   apply parameter change
//   demo:thumb   (demo → viewer)   snapshot of canvas
//   demo:request-thumb/params      pulled by viewer
(function demoProtocol() {
    const params = [
        // No tunable parameters exposed.
    ];
    function getCanvas() {
        return document.querySelector("canvas");
    }
    function announce() {
        try {
            window.parent?.postMessage({
                type: "demo:params",
                params: params.map(({ set, ...p }) => p),
            }, "*");
        } catch (e) {}
    }
    window.addEventListener("message", (e) => {
        const d = e.data;
        if (!d || typeof d !== "object") return;
        if (d.type === "demo:set") {
            const p = params.find(x => x.name === d.name);
            if (p && typeof d.value === "number") {
                try { p.set(d.value); } catch (err) {}
            }
        } else if (d.type === "demo:request-thumb") {
            try {
                const c = getCanvas();
                if (!c) return;
                window.parent?.postMessage({
                    type: "demo:thumb",
                    dataUrl: c.toDataURL("image/jpeg", 0.6),
                }, "*");
            } catch (err) {}
        } else if (d.type === "demo:request-params") {
            announce();
        }
    });
    setTimeout(announce, 200);
})();
</script>

<!-- v884 — orientation toolbar wiring. Talks to window.robotAvatar (installed
     by robotFaceAvatar.js) which routes through the avatarOrientation store. -->
<script>
(function bindOrientPanel(){
  function ready(){ return window.robotAvatar && typeof window.robotAvatar.rotate === "function"; }
  function keyLabel(){
    var k = (window.robotAvatar && window.robotAvatar.key && window.robotAvatar.key()) || "";
    return (k.split("/").pop() || k).replace(/\.(glb|gltf)$/i, "") || "Avatar";
  }
  function refreshReadout(){
    var el = document.getElementById("oReadout");
    if (!el || !window.robotAvatar) return;
    var m = window.robotAvatar.metrics ? window.robotAvatar.metrics() : {};
    var head = window.robotAvatar.measureHead ? window.robotAvatar.measureHead() : null;
    var o = window.robotAvatar.getOrientation ? window.robotAvatar.getOrientation() : {yaw:0,pitch:0,roll:0};
    var lines = [];
    if (m && m.modelHeight) lines.push("height " + m.modelHeight.toFixed(2) + "u");
    if (m && m.scaleRatio)  lines.push("scale " + m.scaleRatio.toFixed(2) + "×");
    if (head) lines.push("head " + head.width.toFixed(2) + "w×" + head.height.toFixed(2) + "h");
    else      lines.push("head: bone not found");
    // v3786 -- SAY WHY THE SKINNED FIT DID NOT HAPPEN. "height 0.03u / scale 0.01x" is the RAW box, and it
    // prints identically whether the skinned measurement was skipped, refused or never reached. The module
    // now names the branch it took; showing it here turns an unfalsifiable "it does not work" into a cause.
    var why = window.robotAvatar.skinnedFitReason ? window.robotAvatar.skinnedFitReason() : null;
    if (why && why !== "ok" && why.indexOf("ok (") !== 0) lines.push("fit: " + why);
    lines.push("rot " + (o.yaw|0) + "/" + (o.pitch|0) + "/" + (o.roll|0) + "°");
    el.innerHTML = lines.join("<br>");
  }
  function syncYawSlider(){
    var s = document.getElementById("oYaw"), lbl = document.getElementById("oYawVal");
    if (!s || !window.robotAvatar) return;
    var o = window.robotAvatar.getOrientation();
    s.value = String(o.yaw | 0);
    if (lbl) lbl.textContent = (o.yaw|0) + "°";
  }

  function wire(){
    document.querySelectorAll("#orientPanel .oBtn").forEach(function(b){
      b.addEventListener("click", function(){
        var axis = b.getAttribute("data-axis");
        var deg  = parseFloat(b.getAttribute("data-deg")) || 0;
        window.robotAvatar.rotate(axis, deg);
        syncYawSlider(); refreshReadout();
      });
    });
    // v931 — collapse/expand the orient panel. It used to be permanently shown,
    // covering the avatar (especially on the phone). Now: a ✕ hides it to a small
    // ⊹ launcher icon; tapping ⊹ reopens it. Default collapsed when embedded.
    var _oPanel = document.getElementById("orientPanel");
    var _oTog   = document.getElementById("orientToggle");
    var _oClose = document.getElementById("orientClose");
    function _setOrientOpen(open){
      if (_oPanel) _oPanel.style.display = open ? "" : "none";
      if (_oTog)   _oTog.style.display   = open ? "none" : "";
    }
    if (_oTog)   _oTog.addEventListener("click", function(){ _setOrientOpen(true); });
    if (_oClose) _oClose.addEventListener("click", function(){ _setOrientOpen(false); });
    var _embedded = !!new URLSearchParams(location.search).get("voice");
    _setOrientOpen(!_embedded);   // embedded (phone) → start collapsed to the ⊹ icon
    var s = document.getElementById("oYaw"), lbl = document.getElementById("oYawVal");
    if (s) s.addEventListener("input", function(){
      if (lbl) lbl.textContent = s.value + "°";
      window.robotAvatar.setYaw(parseInt(s.value, 10) || 0);
      refreshReadout();
    });
    var reset = document.getElementById("oReset");
    if (reset) reset.addEventListener("click", function(){
      window.robotAvatar.resetOrientation(); syncYawSlider(); refreshReadout();
    });
    var fav = document.getElementById("oFav");
    if (fav) fav.addEventListener("click", function(){
      try {
        var k = window.robotAvatar.key();
        if (window.kpopFavorites && k) window.kpopFavorites.add(k, keyLabel());
        // reflect in the existing ☆ button if present
        var fb = document.getElementById("favBtn");
        if (fb) { fb.textContent = "★"; fb.style.color = "#f6a821"; }
        fav.textContent = "★ saved";
        setTimeout(function(){ fav.textContent = "★ fav"; }, 1200);
      } catch(e){}
    });
    syncYawSlider();
    refreshReadout();
    setInterval(refreshReadout, 700);   // head metrics settle after first frames

    // v888 — color-as-indicator swatches. Picks set the per-favorite default
    // color (a resting wash); "test" flashes a live override; "clear" removes
    // both. Reads the avatar key from window.robotAvatar.key().
    bindColorSwatches();
  }

  function bindColorSwatches(){
    var host = document.getElementById("colSwatches");
    if (!host) return;
    var SWATCHES = [
      ["red",    [0.85,0.20,0.22]], ["amber", [0.95,0.62,0.16]],
      ["green",  [0.30,0.80,0.42]], ["cyan",  [0.30,0.78,1.00]],
      ["violet", [0.66,0.42,1.00]], ["white", [0.90,0.92,0.98]],
    ];
    function key(){ return (window.robotAvatar && window.robotAvatar.key && window.robotAvatar.key()) || ""; }
    SWATCHES.forEach(function(s){
      var b = document.createElement("button");
      b.title = s[0];
      b.style.cssText = "width:20px;height:20px;border-radius:50%;border:1px solid rgba(255,255,255,0.3);cursor:pointer;padding:0;background:rgb("+
        Math.round(s[1][0]*255)+","+Math.round(s[1][1]*255)+","+Math.round(s[1][2]*255)+");";
      b.addEventListener("click", function(){
        try { window.avatarColor && window.avatarColor.setFavoriteDefault(key(), s[1]); } catch(e){}
      });
      host.appendChild(b);
    });
    var test = document.getElementById("colTest");
    if (test) test.addEventListener("click", function(){
      try {
        var def = window.avatarColor && window.avatarColor.getFavoriteDefault(key());
        var c = def || [0.95,0.62,0.16];
        window.avatarColor.setOverride(c[0], c[1], c[2], 0.7);
        setTimeout(function(){ try { window.avatarColor.clearOverride(); } catch(e){} }, 2200);
      } catch(e){}
    });
    var clr = document.getElementById("colClear");
    if (clr) clr.addEventListener("click", function(){
      try { window.avatarColor.setFavoriteDefault(key(), null); window.avatarColor.clearOverride(); } catch(e){}
    });
  }

  var tries = 0;
  (function waitReady(){
    if (ready()) { wire(); return; }
    if (tries++ > 100) { wire(); return; }   // wire anyway; buttons guard internally
    setTimeout(waitReady, 100);
  })();
})();
</script>
