<!doctype html>
<!--
  WebGLEngine/splat-gpu.html -- UNNUMBERED (the version is chosen at ship time)

  GAUSSIAN SPLATS SORTED AND DRAWN ON THE GRAPHICS CARD. Keith: "4" -- a page that uses the WebGPU splat renderer. With WebGPU the cloud lives on the card:
  render/splatSortGPU.mjs makes each splat's depth key and sorts (PlayCanvas's radix sort, MIT), and render/splatRendererGPU.mjs draws straight from that
  sorted list -- nothing comes back to the CPU. Without WebGPU (or with ?backend=webgl2) it draws the same cloud with engine/SplatRenderer.js, which sorts
  on the CPU and re-uploads, so the two can be compared on one machine.

  ?n=200000      how many splats in the generated cloud (default 50000)
  ?gen=nebula    sphereCloud | ribbon | nebula (engine/splatGenerator.js)
  ?backend=webgl2  force the CPU-sorted WebGL2 renderer
  ?lod=1&budget=300000   LEVEL OF DETAIL (render/splatLod.mjs): the cloud becomes an octree and each frame draws at most `budget` splats, far parts as
                 merged stand-ins, near parts as real splats; re-cut when the camera moves (WebGPU only)
  ?swlod=/path/scene.swlod  STREAM a packed level-of-detail file: the root first, then the nodes the camera wants, by HTTP Range requests
  The status line shows what the GRAPHICS CARD spent on each pass (keys, sort, draw), by WebGPU timestamp queries (render/gpuTimer.mjs), when the
  adapter offers them; on the WebGL2 renderer, the re-upload and the draw by EXT_disjoint_timer_query_webgl2 (render/gpuTimerGL.mjs) where the browser offers
  it; ?gputimer=0 turns either off.
  ?aa=smaa       SMAA 1x on the WebGPU renderer (render/smaaPassGPU.mjs); ?aa=t2x adds the two-frame temporal resolve (jittered frames averaged while the camera
                 is still; when it moves, the history reprojected by the plane through the orbit target, or dropped with &reproject=0)
  ?gizmo=1       move, turn and scale the cloud about its centre with render/gizmo.mjs's gizmo (1 move, 2 turn, 3 scale, X world or local; the scale is uniform), and a
                 view cube (top right) to look from a face, an edge or a corner. Held by tools/ship/splatGizmo-selfcheck.mjs
  ?spin=0.003    turn the orbit by this many radians each frame (to see the temporal resolve on a moving camera; the gate drives it)
  ?still=5       draw five frames and stop (for a screenshot: a software renderer cannot present 60 a second, and a screenshot waits behind the queue)
  ?ply=/path/scene.ply   open a .ply or .splat by URL. A .ply with f_rest_* draws its colour from where the camera stands (spherical harmonics,
                 render/splatSH.mjs, on either renderer; the status line says to what degree); ?sh=0 draws band 0 only
  Drop a .ply or .splat file on the page to view it instead (engine/splatParser.js).
  THE CAMERA (render/cameraControls.mjs, 2026-11-22): drag to orbit, right-drag or shift-drag to pan, wheel or pinch to zoom, W A S D and Q E to fly (shift:
  faster), F to frame the cloud, C to switch orbit and fly (in fly, the drag looks about the eye); the camera eases to where you put it (?ease=0 for none).
  window.__splatGpu reports { ready, backend, count, frames, frameMs, error }, and __splatGpu.capture() draws one frame and
  returns its pixels sampled on a grid, for tools/ship/splatGpuPage-selfcheck.mjs (a headless browser here composites no WebGPU canvas, so a screenshot
  cannot see this page: the pixels are read back from the frame itself).
-->

<title>Splats on the GPU</title>
<style>

  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }

<body>
<canvas id="c"></canvas>
<div id="hud">loading...</div>
<div id="drop">drop a .ply or .splat file</div>
<script type="module">
import { createSplatRendererGPU } from "./render/splatRendererGPU.mjs";

import { buildLod, selectLod, gatherSplats, openLodStream, httpRange } from "./render/splatLod.mjs";

import { createCameraControls, bindCameraControls } from "./render/cameraControls.mjs";

import { mat4Multiply, mat4Invert, transform4 } from "./render/motionVectors.mjs";

const Q = new URLSearchParams(location.search), canvas = document.getElementById("c"), hud = document.getElementById("hud");

let focusSphere = null;   // the cloud's bounding sphere, for F
/** Aim the camera at a sphere at once (a newly opened cloud), keeping the view's direction. */
const frameOn = (center, radius, scale) => { controls.goal.target = center.slice(); controls.goal.distance = Math.max(0.5, scale); controls.snap(); focusSphere = { center: center.slice(), radius }; Object.assign(cloudXf, { pivot: center.slice(), position: center.slice(), rotation: [0, 0, 0, 1], scale: [1, 1, 1] }); if (gizmoOv) gizmoOv.transform = { position: cloudXf.position.slice(), rotation: cloudXf.rotation.slice(), scale: cloudXf.scale.slice() }; };

function lookAt(eye, at, up = [0, 1, 0]) {

// ---- ?gizmo=1 (2026-11-22): the cloud MOVED, TURNED and SCALED by render/gizmo.mjs's gizmo, about its own centre. M = T(position) R(rotation) S(s) T(-centre); the renderer draws
// with view x M and is handed the eye in the cloud's own frame (M^-1 eye), so its depth sort and its view-dependent colour stay the cloud's. THE SCALE IS UNIFORM (s, the cube root

let gizmoOv = null;   // set below, once the camera's listeners are bound

    ctx.configure({ device, format, alphaMode: "premultiplied", usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });

    const aaMode = ["smaa", "t2x"].includes(Q.get("aa")) ? Q.get("aa") : null, aa = aaMode ? createSmaaGPU(device, { width: canvas.width, height: canvas.height, outputFormat: format, temporal: aaMode === "t2x" }) : null;

    state.shDegree = r.shDegree;   // a .ply with f_rest: colour from where the camera stands (render/splatSH.mjs); ?sh=0 draws band 0 only
    const info = adapter.info || {};

    state.format = format;

        if (LOD.on) recut(eye, r);
        const enc = device.createCommandEncoder(), tex = ctx.getCurrentTexture();

            aa.resize(canvas.width, canvas.height);

            // 2026-11-22 REPROJECTION (T2x): splats write no depth, so the history is carried across a camera move as if the scene were the plane through the orbit
            // target, facing the camera (its NDC depth); the resolve's 3 x 3 clamp holds what that gets wrong off the plane. ?reproject=0 drops the history on a move instead.

        } else

async function showLod(lodOrStream) {

const drop = document.getElementById("drop");
addEventListener("dragover", (e) => { e.preventDefault(); drop.style.display = "flex"; });
addEventListener("dragleave", () => { drop.style.display = "none"; });
addEventListener("drop", async (e) => { e.preventDefault(); drop.style.display = "none"; const f = e.dataTransfer.files[0]; if (!f) return;
    try { const s = parseSplatFile(await f.arrayBuffer(), f.name); location.hash = ""; await show(s); } catch (err) { state.error = "could not read " + f.name + ": " + (err.message || err); } });

/** Draw one frame now and return its pixels sampled on a cols x rows grid (pixel centres), RGB 0-255, plus how much of the frame is not background. */
state.capture = async (cols = 32, rows = 20) => {
    const eye = eyeOf(), view = lookAt(eye, camTarget()), proj = perspective(0.9, canvas.width / canvas.height, 0.01, 200), [cv, ce] = cloudView(view, eye), tex = (state.drawEye = ce, draw(cv, proj, ce)), { w, h, px } = await draw.read(tex);   // drawEye: the eye the renderer was handed (the cloud's frame), for the gate
    const grid = []; let lit = 0;
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) { const x = Math.floor(((i + 0.5) / cols) * w), y = Math.floor(((j + 0.5) / rows) * h), o = (y * w + x) * 4; grid.push(px[o], px[o + 1], px[o + 2]); }
    for (let o = 0; o < px.length; o += 4) if (Math.abs(px[o] - 7) + Math.abs(px[o + 1] - 10) + Math.abs(px[o + 2] - 16) > 24) lit++;
    return { w, h, cols, rows, grid, lit: lit / (w * h) };
};

resize();
(Q.get("swlod") ? openLodStream(httpRange(Q.get("swlod"))).then(showLod) : Q.get("ply") ? fetch(Q.get("ply")).then((r) => { if (!r.ok) throw new Error(`${Q.get("ply")}: HTTP ${r.status}`); return r.arrayBuffer(); }).then((b) => show(parseSplatFile(b, Q.get("ply")))) : show(cloud())).then(() => requestAnimationFrame(frame), (e) => { state.error = String(e.message || e); hud.textContent = state.error; });
</script>
