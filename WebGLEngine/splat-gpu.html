<!doctype html>
<!--
  WebGLEngine/splat-gpu.html -- UNNUMBERED (the version is chosen at ship time)

  GAUSSIAN SPLATS SORTED AND DRAWN ON THE GRAPHICS CARD. Keith: "4" -- a page that uses the WebGPU splat renderer. With WebGPU the cloud lives on the card:
  render/splatSortGPU.mjs makes each splat's depth key and sorts (PlayCanvas's radix sort, MIT), and render/splatRendererGPU.mjs draws straight from that
  sorted list -- nothing comes back to the CPU. Without WebGPU (or with ?backend=webgl2) it draws the same cloud with engine/SplatRenderer.js, which sorts
  on the CPU and re-uploads, so the two can be compared on one machine.

  ?n=200000      how many splats in the generated cloud (default 50000)
  ?gen=nebula    sphereCloud | ribbon | nebula (engine/splatGenerator.js)
  ?backend=webgl2  force the CPU-sorted WebGL2 renderer
  ?still=5       draw five frames and stop (for a screenshot: a software renderer cannot present 60 a second, and a screenshot waits behind the queue)
  Drop a .ply or .splat file on the page to view it instead (engine/splatParser.js).
  Drag to orbit, wheel to zoom. window.__splatGpu reports { ready, backend, count, frames, frameMs, error }, and __splatGpu.capture() draws one frame and
  returns its pixels sampled on a grid, for tools/ship/splatGpuPage-selfcheck.mjs (a headless browser here composites no WebGPU canvas, so a screenshot
  cannot see this page: the pixels are read back from the frame itself).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splats on the GPU</title>
<style>
  :root { --bg: #070a10; --fg: #e8eefc; --dim: #8c98ad; --panel: rgba(10, 14, 22, 0.82); --edge: #24304a; --accent: #5ac8ff; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #hud { position: fixed; top: 12px; left: 12px; background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; padding: 8px 12px; max-width: calc(100vw - 48px); }
  #hud b { color: var(--accent); }
  #hud .dim { color: var(--dim); }
  #drop { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; font-size: 20px; background: rgba(0, 0, 0, 0.6); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">loading...</div>
<div id="drop">drop a .ply or .splat file</div>
<script type="module">
import { createSplatRendererGPU } from "./render/splatRendererGPU.mjs";
import { SplatRenderer } from "./engine/SplatRenderer.js";
import { SPLAT_GENERATORS } from "./engine/splatGenerator.js";
import { parseSplatFile } from "./engine/splatParser.js";

const Q = new URLSearchParams(location.search), canvas = document.getElementById("c"), hud = document.getElementById("hud");
const state = window.__splatGpu = { ready: false, backend: null, count: 0, frames: 0, frameMs: null, error: null };
const STILL = Number(Q.get("still")) || 0;
const cam = { yaw: 0.6, pitch: 0.25, dist: 3.2, target: [0, 0, 0] };

function lookAt(eye, at, up = [0, 1, 0]) {
    const sub = (a, b) => a.map((v, i) => v - b[i]), norm = (a) => { const l = Math.hypot(...a) || 1; return a.map((v) => v / l); };
    const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]], dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    const f = norm(sub(at, eye)), s = norm(cross(f, up)), u = cross(s, f);
    return new Float32Array([s[0], u[0], -f[0], 0, s[1], u[1], -f[1], 0, s[2], u[2], -f[2], 0, -dot(s, eye), -dot(u, eye), dot(f, eye), 1]);
}
function perspective(fovy, aspect, near, far) { const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far); return new Float32Array([f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) * nf, -1, 0, 0, 2 * far * near * nf, 0]); }
function eyeOf() { const c = Math.cos(cam.pitch); return [cam.target[0] + cam.dist * c * Math.sin(cam.yaw), cam.target[1] + cam.dist * Math.sin(cam.pitch), cam.target[2] + cam.dist * c * Math.cos(cam.yaw)]; }

function cloud() {
    const gen = SPLAT_GENERATORS[Q.get("gen")] || SPLAT_GENERATORS.nebula, n = Math.max(1, Math.min(4000000, Number(Q.get("n")) || 50000));
    return gen({ count: n });
}

let draw = null, drawCount = 0;
async function useWebGPU(splat) {
    if (!navigator.gpu) throw new Error("this browser has no WebGPU");
    const adapter = await navigator.gpu.requestAdapter(); if (!adapter) throw new Error("no WebGPU adapter");
    const device = await adapter.requestDevice(), ctx = canvas.getContext("webgpu"), format = navigator.gpu.getPreferredCanvasFormat();
    ctx.configure({ device, format, alphaMode: "premultiplied", usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
    device.lost.then((i) => { state.error = "the GPU device was lost: " + i.message; });
    const r = createSplatRendererGPU(device, splat, { format });
    const info = adapter.info || {};
    state.adapter = [info.vendor, info.architecture, info.description].filter(Boolean).join(" ") || "unknown adapter";
    state.format = format;
    const d = (view, proj, eye) => {
        const enc = device.createCommandEncoder(), tex = ctx.getCurrentTexture();
        r.draw(enc, { view, proj, camera: eye, target: tex.createView(), width: canvas.width, height: canvas.height, clear: [0.027, 0.039, 0.063, 1] });
        device.queue.submit([enc.finish()]); return tex;
    };
    // the frame's own pixels, read back (RGBA, whatever order the canvas format stores them in)
    d.read = async (tex) => {
        const w = tex.width, h = tex.height, row = 256 * Math.ceil((w * 4) / 256), buf = device.createBuffer({ size: row * h, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
        const enc = device.createCommandEncoder(); enc.copyTextureToBuffer({ texture: tex }, { buffer: buf, bytesPerRow: row }, [w, h]); device.queue.submit([enc.finish()]);
        await buf.mapAsync(GPUMapMode.READ); const raw = new Uint8Array(buf.getMappedRange().slice(0)); buf.unmap(); buf.destroy();
        const bgra = /^bgra/.test(format), px = new Uint8Array(w * h * 4);
        for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const s = y * row + x * 4, o = (y * w + x) * 4; px[o] = raw[s + (bgra ? 2 : 0)]; px[o + 1] = raw[s + 1]; px[o + 2] = raw[s + (bgra ? 0 : 2)]; px[o + 3] = raw[s + 3]; }
        return { w, h, px };
    };
    return d;
}
function useWebGL2(splat) {
    const gl = canvas.getContext("webgl2", { premultipliedAlpha: true }); if (!gl) throw new Error("this browser has neither WebGPU nor WebGL2");
    const r = new SplatRenderer(gl, splat);
    const d = (view, proj, eye) => { gl.viewport(0, 0, canvas.width, canvas.height); gl.clearColor(0.027, 0.039, 0.063, 1); gl.clear(gl.COLOR_BUFFER_BIT); r.draw(view, proj, eye); return null; };
    // read in the same task as the draw, before the browser presents (and may clear) the drawing buffer; rows flipped to top-first
    d.read = async () => { const w = gl.drawingBufferWidth, h = gl.drawingBufferHeight, raw = new Uint8Array(w * h * 4), px = new Uint8Array(w * h * 4); gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, raw);
        for (let y = 0; y < h; y++) px.set(raw.subarray((h - 1 - y) * w * 4, (h - y) * w * 4), y * w * 4); return { w, h, px }; };
    return d;
}

function resize() { const d = Math.min(2, window.devicePixelRatio || 1); canvas.width = Math.max(1, Math.round(canvas.clientWidth * d)); canvas.height = Math.max(1, Math.round(canvas.clientHeight * d)); }
let last = performance.now(), avg = null;
function paintHud() {
    hud.innerHTML = `<b>${state.backend === "webgpu" ? "WebGPU" : "WebGL2"}</b> · ${state.count.toLocaleString()} splats · ${avg == null ? "-" : avg.toFixed(1)} ms a frame<br><span class="dim">${state.backend === "webgpu" ? "sorted and drawn on the card (" + state.adapter + ")" : "sorted on the CPU, re-uploaded each move" + (state.fallback ? " -- no WebGPU here: " + state.fallback : "")} · drag to orbit, wheel to zoom, drop a .ply or .splat</span>${state.error ? "<br>" + state.error : ""}`;
}
function frame() {
    if (canvas.width !== Math.round(canvas.clientWidth * Math.min(2, window.devicePixelRatio || 1))) resize();
    const eye = eyeOf(), view = lookAt(eye, cam.target), proj = perspective(0.9, canvas.width / canvas.height, 0.01, 200);
    try { draw(view, proj, eye); } catch (e) { state.error = String(e.message || e); }
    const now = performance.now(), dt = now - last; last = now; avg = avg == null ? dt : avg * 0.9 + dt * 0.1;
    state.frames++; state.frameMs = avg; if (state.frames >= 3) state.ready = true;
    if (state.frames % 15 === 0 || state.frames === 1) paintHud();
    if (!(STILL > 0 && state.frames >= STILL)) requestAnimationFrame(frame); else { state.stopped = true; paintHud(); }
}

async function show(splat) {
    state.count = splat.count;
    if (splat.bbox && splat.bbox.center) { cam.target = splat.bbox.center.slice(); cam.dist = Math.max(0.5, 1.6 * Math.max(...splat.bbox.size)); }
    const want = Q.get("backend") === "webgl2" ? "webgl2" : "webgpu";
    if (want === "webgpu") { try { draw = await useWebGPU(splat); state.backend = "webgpu"; return; } catch (e) { state.fallback = String(e.message || e); } }
    draw = useWebGL2(splat); state.backend = "webgl2";
}

canvas.addEventListener("pointerdown", (e) => { canvas.setPointerCapture(e.pointerId); const x0 = e.clientX, y0 = e.clientY, a = cam.yaw, b = cam.pitch;
    const move = (m) => { cam.yaw = a - (m.clientX - x0) * 0.008; cam.pitch = Math.max(-1.5, Math.min(1.5, b + (m.clientY - y0) * 0.008)); };
    canvas.addEventListener("pointermove", move); canvas.addEventListener("pointerup", () => canvas.removeEventListener("pointermove", move), { once: true }); });
canvas.addEventListener("wheel", (e) => { e.preventDefault(); cam.dist = Math.max(0.05, cam.dist * Math.exp(e.deltaY * 0.001)); }, { passive: false });
const drop = document.getElementById("drop");
addEventListener("dragover", (e) => { e.preventDefault(); drop.style.display = "flex"; });
addEventListener("dragleave", () => { drop.style.display = "none"; });
addEventListener("drop", async (e) => { e.preventDefault(); drop.style.display = "none"; const f = e.dataTransfer.files[0]; if (!f) return;
    try { const s = parseSplatFile(await f.arrayBuffer(), f.name); location.hash = ""; await show(s); } catch (err) { state.error = "could not read " + f.name + ": " + (err.message || err); } });

/** Draw one frame now and return its pixels sampled on a cols x rows grid (pixel centres), RGB 0-255, plus how much of the frame is not background. */
state.capture = async (cols = 32, rows = 20) => {
    const eye = eyeOf(), view = lookAt(eye, cam.target), proj = perspective(0.9, canvas.width / canvas.height, 0.01, 200), tex = draw(view, proj, eye), { w, h, px } = await draw.read(tex);
    const grid = []; let lit = 0;
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) { const x = Math.floor(((i + 0.5) / cols) * w), y = Math.floor(((j + 0.5) / rows) * h), o = (y * w + x) * 4; grid.push(px[o], px[o + 1], px[o + 2]); }
    for (let o = 0; o < px.length; o += 4) if (Math.abs(px[o] - 7) + Math.abs(px[o + 1] - 10) + Math.abs(px[o + 2] - 16) > 24) lit++;
    return { w, h, cols, rows, grid, lit: lit / (w * h) };
};

resize();
show(cloud()).then(() => requestAnimationFrame(frame), (e) => { state.error = String(e.message || e); hud.textContent = state.error; });
</script>
</body>
</html>
