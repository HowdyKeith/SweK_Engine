<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="demo:title" content="Render Review">
<meta name="demo:desc" content="Swipe through the headless render batch (GET /export/renders) like the asset viewer: each autonomous take plays as a video card, swipe right to keep or left to discard (arrow keys too, buttons on desktop). Kept clips list at the end with one-tap Upload to YouTube via the export pipeline -- so only the take you chose ever gets posted. Closes the render -> review -> publish loop.">
<meta name="demo:category" content="tools">
<title>Render Review</title>
<style>
  :root { --amber:#f6a623; --cyan:#59d1ff; --line:#22304a; }
  html,body { margin:0; min-height:100%; background:#04060d; color:#9fb2d4; font:13px ui-monospace,Menlo,monospace; }
  #cap { color:var(--amber); letter-spacing:.14em; text-transform:uppercase; padding:14px 16px 4px; }
  #hint { color:#5f7aa0; font-size:11px; padding:0 16px 10px; }
  #deck { position:relative; height:56vh; margin:0 16px; }
  .card { position:absolute; inset:0; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#02040a; display:flex; flex-direction:column; }
  .card video { width:100%; height:100%; object-fit:contain; background:#000; }
  .meta { position:absolute; left:0; right:0; bottom:0; padding:8px 12px; background:linear-gradient(transparent,rgba(2,4,10,.9)); }
  .meta b { color:var(--cyan); } .tag { color:var(--amber); font-size:11px; }
  #row { display:flex; gap:10px; justify-content:center; padding:14px; }
  button { background:rgba(14,20,32,.9); color:var(--cyan); border:1px solid var(--line); border-radius:9px; padding:10px 18px; font:600 13px ui-monospace,monospace; cursor:pointer; }
  button.keep { color:#9be15d; } button.toss { color:#ff6a6a; }
  #kept { margin:0 16px 24px; } #kept h3 { color:var(--amber); font-size:12px; letter-spacing:.1em; }
  .krow { display:flex; align-items:center; gap:10px; border-top:1px solid var(--line); padding:8px 0; }
  .krow video { width:120px; height:68px; object-fit:cover; border-radius:6px; background:#000; }
  select { background:rgba(14,20,32,.9); color:var(--cyan); border:1px solid var(--line); border-radius:7px; padding:6px 10px; }
  #empty { color:#5f7aa0; padding:16px; }
</style>
</head>
<body>
<div id="cap">&#9670; Render Review</div>
<div id="hint">swipe / &larr;&rarr; &middot; keep &rarr; &middot; discard &larr; &middot; kept clips upload below</div>
<div id="deck"></div>
<div id="row"><button class="toss" id="btnToss">&larr; discard</button><button class="keep" id="btnKeep">keep &rarr;</button></div>
<div id="kept"></div>
<div id="empty" style="display:none">No renders yet. Run a batch: <code>POST /export/batch?runs=3</code>, then refresh.</div>
<script type="module">
import { attachGestures } from "./ui/touchGestures.js";
const deck = document.getElementById("deck"), keptEl = document.getElementById("kept");
let items = [], idx = 0, kept = [];

async function load() {
  try { const r = await fetch("/export/renders").then(r => r.json()); items = (r && r.items) || []; } catch (e) { items = []; }
  if (!items.length) { document.getElementById("empty").style.display = "block"; }
  render();
}
function labelOf(f) { const m = /^([a-z-]+)-[a-z0-9]+-r(\d+)\.mp4$/i.exec(f) || []; return { name: (m[1] || f).replace(/-/g, " "), run: m[2] != null ? ("take " + (+m[2] + 1)) : "" }; }
function render() {
  deck.innerHTML = "";
  const it = items[idx];
  if (!it) { document.getElementById("row").style.display = "none"; renderKept(); return; }
  const lab = labelOf(it.file);
  const card = document.createElement("div"); card.className = "card";
  card.innerHTML = '<video src="' + it.url + '" autoplay loop muted playsinline></video><div class="meta"><span class="tag">' + lab.name + " &middot; " + lab.run + '</span> &nbsp; <b>' + (idx + 1) + "/" + items.length + "</b></div>";
  deck.appendChild(card);
  card._x = 0;
}
function decide(keepIt) {
  const it = items[idx]; if (!it) return;
  const card = deck.querySelector(".card");
  if (card) { card.style.transition = "transform .25s, opacity .25s"; card.style.transform = "translateX(" + (keepIt ? 120 : -120) + "%) rotate(" + (keepIt ? 8 : -8) + "deg)"; card.style.opacity = "0"; }
  if (keepIt) kept.push(it);
  setTimeout(() => { idx++; render(); }, 220);
}
function renderKept() {
  if (!kept.length) { keptEl.innerHTML = items.length ? "<h3>ALL REVIEWED &middot; nothing kept</h3>" : ""; return; }
  keptEl.innerHTML = "<h3>KEPT &middot; " + kept.length + " &middot; upload the ones you want</h3>";
  for (const it of kept) {
    const lab = labelOf(it.file); const row = document.createElement("div"); row.className = "krow";
    row.innerHTML = '<video src="' + it.url + '" muted loop autoplay playsinline></video><span style="flex:1">' + lab.name + " &middot; " + lab.run + '</span><select><option value="unlisted">Unlisted</option><option value="private">Private</option><option value="public">Public</option></select><button class="keep up">&#9654; Upload</button><span class="st" style="color:#5f7aa0;font-size:11px"></span>';
    const btn = row.querySelector(".up"), sel = row.querySelector("select"), st = row.querySelector(".st");
    btn.onclick = async () => { btn.disabled = true; st.textContent = "uploading\u2026"; try {
        const meta = { mp4: it.path, title: "SweK Engine \u2014 " + lab.name, description: lab.name + " (" + lab.run + "), rendered live with SweK Engine.", tags: ["swek", "gamedev", "webgl"], privacyStatus: sel.value };
        const j = await fetch("/export/youtube", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(meta) }).then(r => r.json());
        st.innerHTML = j.ok ? "\u2713 <a href='" + j.watch + "' target='_blank' style='color:#9be15d'>" + j.watch + "</a>" : ("failed: " + j.error); if (!j.ok) btn.disabled = false;
      } catch (e) { st.textContent = "error: " + e.message; btn.disabled = false; } };
    keptEl.appendChild(row);
  }
}
document.getElementById("btnKeep").onclick = () => decide(true);
document.getElementById("btnToss").onclick = () => decide(false);
addEventListener("keydown", e => { if (e.key === "ArrowRight") decide(true); if (e.key === "ArrowLeft") decide(false); });
// touch swipe: drag the top card, release past threshold = keep/discard
let dx = 0;
attachGestures(deck, { onPan: (p, f) => { if (f !== 1) return; dx += p.dx; const card = deck.querySelector(".card"); if (card) card.style.transform = "translateX(" + dx + "px) rotate(" + (dx * 0.04) + "deg)"; }, onTap: () => { dx = 0; } });
deck.addEventListener("touchend", () => { if (Math.abs(dx) > 80) decide(dx > 0); else { const card = deck.querySelector(".card"); if (card) card.style.transform = ""; } dx = 0; });
load();
</script>
</body>
</html>
