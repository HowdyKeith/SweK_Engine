<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="demo:title" content="RTX viewer">
<meta name="demo:desc" content="RTX round 3: the present path. physics/render/rtPipeline.mjs's BVH-accelerated, barycentric-shaded compute kernel (rounds 1-2) traces one path-traced sample of a Kenney pavement tile per frame; render/rtViewer.mjs's accumulate kernel folds it into a running mean (a camera move restarts it at frame 1, which overwrites rather than resets to zero); a fullscreen-triangle present kernel reads that mean directly out of the storage buffer a prior compute pass wrote, with no texture and no copy. Drag to orbit, wheel to dolly -- either resets the accumulation, and it sharpens back up over the next second or two. WebGPU only: the kernel is compute, and WebGL2 has no compute stage to fall back to.">
<meta name="demo:category" content="physics">
<meta name="demo:swatch" content="&#9651;">
<title>RTX viewer</title>
<style>
  html, body { margin:0; height:100%; background:#05060a; color:#9fb2d4; font:12px ui-monospace,Menlo,monospace; overflow:hidden; }
  #c { display:block; width:100%; height:100%; image-rendering:pixelated; cursor:grab; }
  #c:active { cursor:grabbing; }
  #hud { position:absolute; top:0; left:0; right:0; padding:10px 14px; pointer-events:none; }
  #cap { color:#f6a623; letter-spacing:.14em; text-transform:uppercase; }
  #be { color:#59d1ff; font-size:11px; margin-top:4px; }
  #sub { color:#5f7aa0; font-size:11px; margin-top:2px; line-height:1.6; max-width:640px; }
  .bad { color:#ff9a9a; }
  a { color:#59d1ff; pointer-events:auto; }
</style>
</head>
<body>
<canvas id="c" width="400" height="300"></canvas>
<div id="hud">
  <div id="cap">RTX viewer</div>
  <div id="be">requesting a WebGPU device&hellip;</div>
  <div id="sub">drag to orbit &middot; wheel to dolly &middot; <a href="/server.html">&larr; back</a></div>
</div>
<script type="module" src="/ui/originNotice.js"></script>
<script type="module">
import { requestDevice } from "/gfx/device.js";
import { loadMeshBvh, makeRtSession, orbitEye } from "/render/rtViewer.mjs";

const cvs = document.getElementById("c"), beEl = document.getElementById("be"), subEl = document.getElementById("sub");
const fail = (m) => { beEl.innerHTML = '<span class="bad">' + m + "</span>"; };

let session = null, mesh = null, device = null;
let yaw = 0.7, pitch = 0.45, dist = 3, dragging = null, dirty = true;

function view() {
    const w = cvs.width, h = cvs.height;
    return { w, h, ...orbitEye({ yaw, pitch, dist, center: mesh.bounds.center }), fovDeg: 45 };
}

function loop() {
    requestAnimationFrame(loop);
    if (!session) return;
    if (dirty) { session.reset(); dirty = false; }
    session.renderFrame(view());
    beEl.textContent = `device: ${device.backend} -- ${mesh.triangleCount} triangles, ${mesh.vertexCount} vertices -- frame ${session.frameCount()}`;
}

async function main() {
    if (!navigator.gpu) {
        return fail("navigator.gpu is not available in this browser -- the ray-tracing kernel is a compute " +
            "shader, and WebGL2 (this tree's other backend) has no compute stage to fall back to.");
    }
    try { device = await requestDevice(cvs, { backend: "webgpu" }); }
    catch (e) { return fail("requestDevice threw: " + e.message); }
    if (!device || device.backend !== "webgpu") return fail("no WebGPU device on this box -- got " + (device ? device.backend : "nothing"));

    try {
        const res = await fetch("/vendor/kenney-city/models/pavement.glb");
        if (!res.ok) throw new Error("HTTP " + res.status);
        mesh = await loadMeshBvh(await res.arrayBuffer());
    } catch (e) { return fail("loading the mesh threw: " + e.message); }

    dist = mesh.bounds.radius * 3.2 + 0.5;
    session = makeRtSession(device, { mesh, w: cvs.width, h: cvs.height, spp: 1 });
    subEl.textContent += ` -- ${mesh.triangleCount} triangles, ${mesh.vertexCount} vertices`;

    cvs.addEventListener("pointerdown", (e) => { dragging = [e.clientX, e.clientY]; cvs.setPointerCapture(e.pointerId); });
    addEventListener("pointerup", () => { dragging = null; });
    addEventListener("pointermove", (e) => {
        if (!dragging) return;
        yaw += (e.clientX - dragging[0]) * 0.006;
        pitch = Math.max(0.05, Math.min(1.5, pitch + (e.clientY - dragging[1]) * 0.006));
        dragging = [e.clientX, e.clientY];
        dirty = true;
    });
    cvs.addEventListener("wheel", (e) => {
        e.preventDefault();
        dist = Math.max(mesh.bounds.radius * 1.2, Math.min(mesh.bounds.radius * 20, dist * Math.exp(e.deltaY * 0.001)));
        dirty = true;
    }, { passive: false });

    requestAnimationFrame(loop);
}
main();

// ─── v822 — Universal viewer protocol ────────────────────
// Demos opt-in via meta tags + postMessage. Viewer at
// universal-viewer.html iframes this page + exchanges:
//   demo:params  (demo → viewer)   announce tunable schema
//   demo:set     (viewer → demo)   apply parameter change
//   demo:thumb   (demo → viewer)   snapshot of canvas
//   demo:request-thumb/params      pulled by viewer
(function demoProtocol() {
    const params = [
        // No tunable parameters exposed -- orbit is pointer/wheel only.
    ];
    function announce() {
        try {
            window.parent?.postMessage({ type: "demo:params", params }, "*");
        } catch (e) {}
    }
    window.addEventListener("message", (e) => {
        if (e.origin !== window.location.origin) return;
        const d = e.data;
        if (!d || typeof d !== "object") return;
        if (d.type === "demo:request-thumb") {
            try {
                window.parent?.postMessage({ type: "demo:thumb", dataUrl: cvs.toDataURL("image/jpeg", 0.6) }, "*");
            } catch (err) {}
        } else if (d.type === "demo:request-params") {
            announce();
        }
    });
    setTimeout(announce, 200);
})();
</script>
<!-- v883 demo chrome (self-mount; idempotent) -->
<script type="module" src="/ui/demoChrome.js"></script>
</body>
</html>
