<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="demo:title" content="Ship Blueprint">
<meta name="demo:desc" content="A sprite becomes a mesh becomes a clean LCARS vector blueprint: silhouette + crease edges only, with hidden lines removed by occlusion (or dashed, if you want the ghosted construction look). Rotate it -- the line art re-solves each frame. The occlusion-aware vectorization idea, game-scale.">
<meta name="demo:category" content="fx">
<title>Ship Blueprint</title>
<style>
  :root { --amber:#f6a623; --cyan:#59d1ff; }
  html,body { margin:0; height:100%; background:#04060d; overflow:hidden; color:#dbe7ff; font:13px ui-monospace,Menlo,monospace; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #cap { position:fixed; left:14px; top:12px; color:var(--amber); letter-spacing:.15em; text-transform:uppercase; z-index:3; }
  #st { position:fixed; right:14px; top:12px; color:#7c93b8; font-size:11px; z-index:3; }
  #bar { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:3; display:flex; gap:10px; }
  button { background:rgba(8,14,26,.7); color:var(--cyan); border:1px solid #1c2942; border-radius:8px; padding:9px 18px; font:600 12px ui-monospace,monospace; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; }
  button:hover { border-color:var(--cyan); }
  #hint { position:fixed; left:50%; bottom:64px; transform:translateX(-50%); color:#7c93b8; font-size:11px; z-index:3; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cap">&#9670; Ship Blueprint</div>
<div id="st"></div>
<div id="hint">drag to rotate &middot; occlusion-correct line art</div>
<div id="bar"><button id="next">Next ship</button><button id="ghost">Toggle hidden lines</button></div>
<script type="module">
import { spriteToMesh } from "./fx/spritemesh/spriteMesh.js";
import { blueprint } from "./fx/spritemesh/blueprint.js";

const cv = document.getElementById("c"), ctx = cv.getContext("2d"), st = document.getElementById("st");
let W = 0, H = 0;
function resize() { W = innerWidth; H = innerHeight; cv.width = W; cv.height = H; }
addEventListener("resize", resize); resize();

function makeShip(kind) {
  const S = 96, s = document.createElement("canvas"); s.width = S; s.height = S; const g = s.getContext("2d"); g.translate(S / 2, S / 2); g.fillStyle = "#8fa8c8";
  if (kind === 0) { g.beginPath(); g.moveTo(0, -40); g.lineTo(12, 16); g.lineTo(30, 30); g.lineTo(8, 26); g.lineTo(0, 36); g.lineTo(-8, 26); g.lineTo(-30, 30); g.lineTo(-12, 16); g.closePath(); g.fill(); }
  else if (kind === 1) { g.fillRect(-16, -34, 32, 68); g.beginPath(); g.moveTo(-16, -34); g.lineTo(0, -44); g.lineTo(16, -34); g.closePath(); g.fill(); }
  else { g.beginPath(); g.moveTo(0, -42); g.lineTo(6, 0); g.lineTo(34, 22); g.lineTo(4, 16); g.lineTo(0, 34); g.lineTo(-4, 16); g.lineTo(-34, 22); g.lineTo(-6, 0); g.closePath(); g.fill(); }
  return s;
}

let kind = 0, mesh = spriteToMesh(makeShip(0), { segments: 48, depth: 0.45 }), showHidden = false, ry = 0.6, rx = -0.35, drag = false, lx = 0, ly = 0;
document.getElementById("next").addEventListener("click", () => { kind = (kind + 1) % 3; mesh = spriteToMesh(makeShip(kind), { segments: 48, depth: 0.45 }); });
document.getElementById("ghost").addEventListener("click", () => { showHidden = !showHidden; });
cv.addEventListener("pointerdown", e => { drag = true; lx = e.clientX; ly = e.clientY; });
addEventListener("pointerup", () => drag = false);
addEventListener("pointermove", e => { if (!drag) return; ry += (e.clientX - lx) * 0.01; rx += (e.clientY - ly) * 0.01; lx = e.clientX; ly = e.clientY; });

function frame() {
  if (!drag) ry += 0.006;
  ctx.fillStyle = "#04060d"; ctx.fillRect(0, 0, W, H);
  // faint grid
  ctx.strokeStyle = "#0c1626"; ctx.lineWidth = 1; for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); } for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  const segs = blueprint(mesh, ry, rx, { creaseDeg: 38 });
  const sc = Math.min(W, H) * 0.34, cx = W / 2, cy = H / 2; let vis = 0;
  // hidden (dashed) first, then solid on top
  if (showHidden) { ctx.setLineDash([4, 4]); ctx.strokeStyle = "#2a3a56"; ctx.lineWidth = 0.7; for (const g of segs) { if (!g.hidden) continue; ctx.beginPath(); ctx.moveTo(cx + g.x0 * sc, cy + g.y0 * sc); ctx.lineTo(cx + g.x1 * sc, cy + g.y1 * sc); ctx.stroke(); } ctx.setLineDash([]); }
  ctx.strokeStyle = "#f6a623"; ctx.lineWidth = 1.5; ctx.shadowColor = "#f6a623"; ctx.shadowBlur = 4;
  for (const g of segs) { if (g.hidden) continue; vis++; ctx.beginPath(); ctx.moveTo(cx + g.x0 * sc, cy + g.y0 * sc); ctx.lineTo(cx + g.x1 * sc, cy + g.y1 * sc); ctx.stroke(); }
  ctx.shadowBlur = 0;
  st.textContent = vis + " visible edges \u00b7 " + (segs.length - vis) + " occluded \u00b7 vectorized from a sprite";
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
