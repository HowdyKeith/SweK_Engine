<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Remote Hosting</title>
<style>
  :root { --bg:#06090f; --panel:#0a1422; --panel2:#0c1a2c; --edge:#2f628f; --blue:#9ac8ff; --amber:#ffb454; --dim:#7fa8d8; --text:#cfe6ff; --bad:#ff7b7b; --good:#7fe0a0; }
  * { box-sizing:border-box; }
  body { margin:0; background:radial-gradient(circle at 50% -10%, #0c1626, #06090f 70%); color:var(--text); font-family:ui-monospace,Menlo,monospace; padding:16px; max-width:760px; margin:0 auto; }
  h1 { font-size:17px; color:var(--amber); letter-spacing:.08em; margin:0 0 2px; }
  .sub { font-size:11px; color:var(--dim); margin:0 0 16px; }
  a { color:var(--blue); }
  .banner { border-radius:10px; padding:11px 13px; font-size:12px; margin-bottom:16px; line-height:1.5; border:1px solid var(--edge); }
  .banner.warn { background:#2a1606; border-color:#7a4a12; color:var(--amber); }
  .banner.ok { background:#06220f; border-color:#1f6a3a; color:var(--good); }
  .card { background:var(--panel); border:1px solid var(--edge); border-radius:14px; padding:16px; margin-bottom:14px; }
  .card h2 { font-size:14px; color:var(--blue); margin:0 0 2px; display:flex; align-items:center; gap:8px; }
  .badge { font-size:10px; padding:2px 8px; border-radius:10px; border:1px solid var(--edge); color:var(--dim); }
  .badge.on { color:var(--good); border-color:#1f6a3a; background:#06220f; }
  .badge.off { color:var(--dim); }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; align-items:center; }
  .btn { background:#173656; color:var(--blue); border:1px solid var(--edge); border-radius:8px; padding:9px 13px; font:12px ui-monospace,monospace; cursor:pointer; }
  .btn:active { background:#1d4a78; }
  .btn.go { background:#0f3a22; color:var(--good); border-color:#1f6a3a; }
  .btn.stop { background:#3a1212; color:var(--bad); border-color:#7a2a2a; }
  .btn:disabled { opacity:.4; cursor:default; }
  .steps { font-size:11.5px; color:var(--dim); line-height:1.65; margin:8px 0 0; padding-left:18px; }
  .steps code, code.inline { background:#04070d; border:1px solid #14304a; border-radius:5px; padding:1px 6px; color:var(--text); font-size:11px; }
  .url { background:#04070d; border:1px solid var(--edge); border-radius:8px; padding:10px; font-size:12px; word-break:break-all; margin-top:10px; display:none; }
  .url a { color:var(--good); }
  .log { background:#04070d; border:1px solid #14304a; border-radius:8px; padding:9px; font-size:10.5px; color:var(--dim); white-space:pre-wrap; max-height:150px; overflow:auto; margin-top:10px; display:none; }
  .muted { font-size:10.5px; color:#5f86b0; }
</style>
</head>
<body>
  <h1>📡 Remote Hosting</h1>
  <!-- v4019 -- the "← control" link that used to sit here is GONE, not renamed. Keith: "that control page is
       actually the Phone view page ... and that link should not be there." It pointed at the phone UI from a
       page about tunnels and hosting, which is not a back-link to anywhere this page came from -- it was a
       cross-link to an unrelated subject wearing the word "control", and the word was wrong about its own
       target. Renaming it to "phone" would have kept a link nobody wants; the fix is that hosting.html does
       not advertise the phone view at all. -->
  <p class="sub">Expose this bridge to the internet — securely.</p>

  <div class="banner" id="authBanner">Checking auth…</div>

  <!-- v4022 -- THE FOUR CARDS AND THEIR ~140 LINES OF WIRING MOVED TO ui/hostingControls.js, WHICH
       server.html'S TUNNELS DRAWER NOW MOUNTS TOO. Keith: "lets get all the settings on one panel." The
       obvious wrong implementation was to paste these cards into that drawer, which would have made two
       copies of every control -- and v3527's rule ("the second copy is never the one that gets updated") has
       bitten five times in this repository this week. One implementation, two mount points. This page mounts
       ALL FOUR sections; server.html mounts the three it lacked, because its own Public-tunnel block already
       carries rotation, the email-me-the-link toggle and the tunnel registry, which this page never had. -->
  <div id="hostingControls"></div>

  <script type="module">
    import { mountHostingControls } from "/ui/hostingControls.js";
    mountHostingControls(document.getElementById("hostingControls"),
        { sections: ["cloudflare", "permanent", "tailscale", "netbird"] });
  </script>

  <script>
    // The auth banner stays HERE and is not part of the shared module: it is this page's own front-and-centre
    // warning, sized for a full page. server.html carries its own remote-access-password control in the same
    // drawer, so mounting a second copy of this warning there would be the duplication this round removed.
    (function () {
      fetch("/auth/status").then(r => r.json()).then(s => {
        const b = document.getElementById("authBanner");
        if (s.enabled) { b.className = "banner ok"; b.innerHTML = "\u2713 Auth is active \u2014 a password is set, so it's safe to expose. Sessions gate both HTTP and WebSocket."; }
        else { b.className = "banner warn"; b.innerHTML = "\u26a0 No password set yet. <b>Set one before starting any tunnel</b> \u2014 open <a href='/login.html'>login.html</a> on this machine and use the setup box. A tunnel makes outside traffic look local, so an open bridge would be wide open."; }
      }).catch(() => { document.getElementById("authBanner").textContent = "Could not reach the bridge."; });
    })();
  </script>

<!-- v1759 page gauges + avatar dock (non-render pages) -->
<script type="module">try{const{mountPageGauges}=await import("/ui/pageGauges.js");mountPageGauges();}catch(e){}</script>
</body>
</html>
