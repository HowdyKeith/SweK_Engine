<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<link rel="stylesheet" href="/theme.css" />
<title>SweK Engine — AC</title>
<style>
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body { margin:0; min-height:100%; background:var(--bg); color:var(--ink); font:15px/1.4 ui-rounded,system-ui,sans-serif; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
  .title { font-weight:700; } .title .g { color:var(--cool); }
  main { max-width:560px; margin:0 auto; padding:16px; }
  select#ent { width:100%; padding:9px; background:#10151d; color:var(--ink); border:1px solid var(--line); border-radius:9px; font:inherit; margin-bottom:14px; }
  .dial { text-align:center; background:#0e141b; border:1px solid var(--line); border-radius:20px; padding:20px; }
  .cur { color:var(--dim); font-size:14px; }
  .target { font-size:64px; font-weight:800; line-height:1; margin:6px 0; }
  .action { font-size:13px; letter-spacing:.05em; text-transform:uppercase; color:var(--dim); }
  .action.cooling { color:var(--cool); } .action.heating { color:var(--heat); }
  .pm { display:flex; gap:14px; justify-content:center; margin-top:14px; }
  .pm button { width:64px; height:64px; border-radius:50%; font-size:30px; background:#121a22; color:var(--ink); border:1px solid var(--line); cursor:pointer; }
  .pm button:active { transform:scale(.95); }
  h4 { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.08em; margin:18px 0 7px; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chips button { background:#10161c; color:var(--dim); border:1px solid var(--line); border-radius:999px; padding:8px 15px; font:inherit; font-size:13px; cursor:pointer; text-transform:capitalize; }
  .chips button.sel { color:#06121a; background:var(--cool); border-color:var(--cool); font-weight:700; }
  #msg { color:var(--dim); font-size:12px; margin-top:12px; }
</style>
</head>
<body>
  <header><span class="title"><span class="g">❄️</span> Climate / AC</span></header>
  <main>
    <select id="ent"><option value="">— loading climate entities —</option></select>
    <div id="panel" style="display:none;">
      <div class="dial">
        <div class="cur" id="cur">—</div>
        <div class="target" id="target">—</div>
        <div class="action" id="action"></div>
        <div class="pm"><button id="minus">–</button><button id="plus">+</button></div>
      </div>
      <div id="modesWrap"><h4>Mode</h4><div class="chips" id="modes"></div></div>
      <div id="fanWrap"><h4>Fan</h4><div class="chips" id="fan"></div></div>
      <div id="presetWrap"><h4>Preset</h4><div class="chips" id="preset"></div></div>
      <div id="swingWrap"><h4>Swing</h4><div class="chips" id="swing"></div></div>
    </div>
    <div id="msg"></div>
  </main>
<script>
  const $ = (id) => document.getElementById(id);
  const LS = "swek.ac.entity";
  let e = null, eid = localStorage.getItem(LS) || "";

  async function fetchClimate(){ try { const r = await fetch("/ha/states?domain=climate", { cache:"no-store" }); const j = await r.json(); return Array.isArray(j) ? j : []; } catch { return []; } }
  function call(service, data, quiet){ fetch("/ha/call", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ domain:"climate", service, data: Object.assign({ entity_id: eid }, data) }) }).catch(()=>{}); if (!quiet) setTimeout(load, 600); }

  function chips(host, items, current, service, key){
    if (!items || !items.length) { host.parentElement.style.display = "none"; return; }
    host.parentElement.style.display = "block";
    host.innerHTML = items.map(m => '<button data-v="' + m + '" class="' + (m === current ? "sel" : "") + '">' + m.replace(/_/g," ") + '</button>').join("");
    host.querySelectorAll("button").forEach(b => b.onclick = () => { const d = {}; d[key] = b.getAttribute("data-v"); call(service, d); });
  }

  async function load(){
    const list = await fetchClimate();
    if (!list.length) { $("ent").innerHTML = '<option value="">— no climate entities —</option>'; $("msg").textContent = "Add the Midea AC (midea_ac_lan) in Home Assistant first."; return; }
    if (!eid || !list.find(x => x.entity_id === eid)) eid = list[0].entity_id;
    $("ent").innerHTML = list.map(c => '<option value="' + c.entity_id + '"' + (c.entity_id===eid?" selected":"") + '>' + (c.name || c.entity_id) + '</option>').join("");
    e = list.find(x => x.entity_id === eid); render();
  }

  function render(){
    if (!e) return; $("panel").style.display = "block";
    const cur = e.current_temperature != null ? e.current_temperature + "°" : "—";
    const hum = e.current_humidity != null ? "  ·  " + e.current_humidity + "% RH" : "";
    $("cur").textContent = "now " + cur + hum;
    $("target").textContent = e.temperature != null ? e.temperature + "°" : "—";
    const act = (e.hvac_action || e.state || "").toLowerCase();
    $("action").textContent = act; $("action").className = "action " + (act.includes("cool")?"cooling":(act.includes("heat")?"heating":""));
    chips($("modes"), e.hvac_modes, e.state, "set_hvac_mode", "hvac_mode");
    chips($("fan"), e.fan_modes, e.fan_mode, "set_fan_mode", "fan_mode");
    chips($("preset"), e.preset_modes, e.preset_mode, "set_preset_mode", "preset_mode");
    chips($("swing"), e.swing_modes, e.swing_mode, "set_swing_mode", "swing_mode");
  }

  $("ent").onchange = () => { eid = $("ent").value; localStorage.setItem(LS, eid); load(); };
  $("plus").onclick = () => { const step = e.target_temp_step || 1, t = (e.temperature != null ? e.temperature : 20) + step; e.temperature = t; render(); call("set_temperature", { temperature: t }, true); };
  $("minus").onclick = () => { const step = e.target_temp_step || 1, t = (e.temperature != null ? e.temperature : 20) - step; e.temperature = t; render(); call("set_temperature", { temperature: t }, true); };

  load(); setInterval(load, 8000);
</script>
<!-- v1759 page gauges + avatar dock (non-render pages) -->
<script type="module">try{const{mountPageGauges}=await import("/ui/pageGauges.js");mountPageGauges();}catch(e){}</script>
</body>
</html>
