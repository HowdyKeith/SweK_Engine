<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="demo:title" content="Comic Parallax">
<meta name="demo:desc" content="The 3D-parallax comic-character filter: take a flat comic panel character, run it through the sprite->mesh path for depth, and stack it through that depth so it pops off the page and parallaxes as you move -- a 2.5D pop-up from a plain 2D sprite. Move the mouse (or tilt) to shift the view.">
<meta name="demo:category" content="fx">
<title>Comic Parallax</title>
<style>
  :root { --amber:#f6a623; --cyan:#59d1ff; }
  html,body { margin:0; height:100%; background:#0d0a12; overflow:hidden; color:#dbe7ff; font:13px ui-monospace,Menlo,monospace; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #cap { position:fixed; left:14px; top:12px; color:var(--amber); letter-spacing:.15em; text-transform:uppercase; z-index:3; }
  #st { position:fixed; right:14px; top:12px; color:#7c93b8; font-size:11px; z-index:3; }
  #bar { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:3; display:flex; gap:10px; }
  button { background:rgba(20,14,26,.7); color:var(--cyan); border:1px solid #2a1c3a; border-radius:8px; padding:9px 18px; font:600 12px ui-monospace,monospace; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; }
  button:hover { border-color:var(--cyan); }
  #hint { position:fixed; left:50%; bottom:64px; transform:translateX(-50%); color:#7c93b8; font-size:11px; z-index:3; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cap">&#9670; Comic Parallax</div>
<div id="st"></div>
<div id="hint">move the mouse &middot; the flat character pops into 2.5D</div>
<div id="bar"><button id="next">Next character</button><button id="depth">More depth</button></div>
<script type="module">
import { spriteToMesh, bounds } from "./fx/spritemesh/spriteMesh.js";

const cv = document.getElementById("c"), ctx = cv.getContext("2d"), st = document.getElementById("st");
let W = 0, H = 0;
function resize() { W = innerWidth; H = innerHeight; cv.width = W; cv.height = H; }
addEventListener("resize", resize); resize();

// a procedural "comic panel character" (alpha-cut), bold-outlined like inked art
function makeChar(kind) {
  const S = 140, sc = document.createElement("canvas"); sc.width = S; sc.height = S; const g = sc.getContext("2d"); g.translate(S / 2, S / 2);
  const body = ["#e5544b", "#4b8de5", "#5cb85c"][kind], skin = "#f2c69a";
  g.lineJoin = "round"; g.lineWidth = 4; g.strokeStyle = "#141018";
  // head
  g.fillStyle = skin; g.beginPath(); g.arc(0, -40, 16, 0, 6.28); g.fill(); g.stroke();
  // torso
  g.fillStyle = body; g.beginPath(); g.moveTo(-18, -22); g.lineTo(18, -22); g.lineTo(14, 34); g.lineTo(-14, 34); g.closePath(); g.fill(); g.stroke();
  // arms
  g.lineWidth = 10; g.strokeStyle = body; g.beginPath(); g.moveTo(-16, -16); g.lineTo(-30, 12 + (kind === 1 ? -24 : 0)); g.moveTo(16, -16); g.lineTo(32, 10); g.stroke();
  g.lineWidth = 8; g.strokeStyle = body; g.beginPath(); g.moveTo(-10, 32); g.lineTo(-12, 58); g.moveTo(10, 32); g.lineTo(12, 58); g.stroke();
  g.fillStyle = skin; for (const [x, y] of [[-30, 12 + (kind === 1 ? -24 : 0)], [32, 10]]) { g.beginPath(); g.arc(x, y, 5, 0, 6.28); g.fill(); }
  // face marks
  g.fillStyle = "#141018"; g.beginPath(); g.arc(-6, -42, 2, 0, 6.28); g.arc(6, -42, 2, 0, 6.28); g.fill();
  return sc;
}

let kind = 0, char = makeChar(0), mesh = spriteToMesh(char, { segments: 40, depth: 0.5 }), depthMul = 1;
const dz = () => (bounds(mesh).max[2] - bounds(mesh).min[2]) * depthMul;
document.getElementById("next").addEventListener("click", () => { kind = (kind + 1) % 3; char = makeChar(kind); mesh = spriteToMesh(char, { segments: 40, depth: 0.5 }); });
document.getElementById("depth").addEventListener("click", () => { depthMul = depthMul >= 3 ? 1 : depthMul + 0.6; });
let mx = 0, my = 0; addEventListener("pointermove", e => { mx = (e.clientX / innerWidth - 0.5) * 2; my = (e.clientY / innerHeight - 0.5) * 2; });

function frame() {
  ctx.fillStyle = "#0d0a12"; ctx.fillRect(0, 0, W, H);
  // faint comic halftone
  ctx.fillStyle = "#151020"; for (let y = 0; y < H; y += 14) for (let x = 0; x < W; x += 14) { ctx.beginPath(); ctx.arc(x, y, 1.2, 0, 6.28); ctx.fill(); }
  const cx = W / 2, cy = H / 2, sc = Math.min(W, H) / 240 * 1.6, cw = char.width * sc, ch = char.height * sc;
  // parallax: stack the sprite through the mesh depth, each slice shifted by view angle -> 2.5D pop-up
  const LAYERS = 16, spanX = mx * 34 * dz(), spanY = my * 34 * dz();
  for (let i = 0; i < LAYERS; i++) {
    const t = i / (LAYERS - 1), ox = (t - 0.5) * spanX, oy = (t - 0.5) * spanY, shade = 0.35 + 0.65 * t;
    ctx.globalAlpha = i === LAYERS - 1 ? 1 : 0.55; ctx.filter = i === LAYERS - 1 ? "none" : "brightness(" + shade + ")";
    ctx.drawImage(char, cx - cw / 2 + ox, cy - ch / 2 + oy, cw, ch);
  }
  ctx.globalAlpha = 1; ctx.filter = "none";
  st.textContent = "sprite->mesh depth " + dz().toFixed(2) + " \u00b7 " + mesh.positions.length + " verts \u00b7 2.5D pop-up";
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
