<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="demo:title" content="Voxels to Mesh">
<meta name="demo:desc" content="The cap on SweK's voxelize path: a voxel volume becomes a watertight triangle mesh you can spin, and export as OBJ. Interior faces are culled so the surface is closed; drag to orbit, pinch/wheel to zoom (the shared gesture controls); Download OBJ saves a real 3D asset. Pick a shape or crank the resolution -- the same voxelsToMesh() runs on the filter-series page voxels too, so content -> voxels -> mesh -> asset.">
<meta name="demo:category" content="fx">
<title>Voxels to Mesh</title>
<style>
  html,body { margin:0; height:100%; background:#04060d; overflow:hidden; color:#9fb2d4; font:12px ui-monospace,Menlo,monospace; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #hud { position:fixed; left:14px; top:12px; z-index:3; }
  #cap { color:#f6a623; letter-spacing:.14em; text-transform:uppercase; } #info { color:#59d1ff; margin-top:4px; }
  #ctl { position:fixed; right:14px; top:12px; z-index:3; display:flex; gap:8px; flex-wrap:wrap; }
  select,button { background:rgba(14,20,32,.9); color:#59d1ff; border:1px solid #22304a; border-radius:7px; padding:7px 11px; font:600 12px ui-monospace,monospace; cursor:pointer; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div id="cap">&#9670; Voxels &rarr; Mesh</div><div id="info"></div></div>
<div id="ctl">
  <select id="shape"><option value="sphere">sphere</option><option value="torus">torus</option><option value="cube">hollow cube</option></select>
  <select id="res"><option value="10">res 10</option><option value="16" selected>res 16</option><option value="24">res 24</option></select>
  <button id="skin">skin: plain</button><button id="dl">&#128190; Download OBJ</button>
</div>
<script type="module">
import { voxelsToMesh, toOBJ } from "./fx/voxelize/voxelMesh.js";
import { makeOrbitControls, attachOrbit } from "./ui/touchCamera.js";
import { SKIN_NAMES, SKINS, shadeTri } from "./fx/avatar/skins.js";
const cv = document.getElementById("c"), ctx = cv.getContext("2d"), info = document.getElementById("info");
function resize() { cv.width = innerWidth; cv.height = innerHeight; } addEventListener("resize", resize); resize();
const orbit = makeOrbitControls({ az: 0.6, el: 0.4, dist: 2.4, minDist: 1.2, maxDist: 6 }); attachOrbit(cv, orbit);

function buildOcc(shape, n) {
  const occ = new Uint8Array(n * n * n), c = (n - 1) / 2, R = c * 0.92;
  for (let z = 0; z < n; z++) for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const dx = x - c, dy = y - c, dz = z - c; let on = 0;
    if (shape === "sphere") on = (dx * dx + dy * dy + dz * dz) <= R * R;
    else if (shape === "cube") { const m = Math.max(Math.abs(dx), Math.abs(dy), Math.abs(dz)); on = m <= R && m >= R - 1.6; }
    else { const q = Math.sqrt(dx * dx + dy * dy) - R * 0.62; on = (q * q + dz * dz) <= (R * 0.32) * (R * 0.32); }   // torus
    if (on) occ[(z * n + y) * n + x] = 1;
  }
  return occ;
}
let mesh = null, N = 16, shape = "sphere";
function rebuild() { const occ = buildOcc(shape, N); mesh = voxelsToMesh(occ, N, N, N, 1 / N); info.textContent = shape + " @ res " + N + " \u2014 " + mesh.verts + " verts, " + mesh.tris + " tris (watertight)"; }
rebuild();

function frame() {
  orbit.autospin(0.016, 0.12);
  const W = cv.width, H = cv.height, S = Math.min(W, H) * 0.42;
  ctx.clearRect(0, 0, W, H);
  const az = orbit.st.az, el = orbit.st.el, d = orbit.st.dist;
  const ca = Math.cos(az), sa = Math.sin(az), ce = Math.cos(el), se = Math.sin(el);
  const P = mesh.positions, half = 0.5, tris = [];
  const proj = (x, y, z) => { x -= half; y -= half; z -= half; let X = x * ca + z * sa, Z = -x * sa + z * ca; let Y = y * ce - Z * se, Zc = y * se + Z * ce; const persp = 2.4 / (d - Zc); return [W / 2 + X * S * persp, H / 2 - Y * S * persp, Zc]; };
  const L = [0.4, 0.7, 0.55];
  for (let i = 0; i < mesh.indices.length; i += 3) {
    const a = mesh.indices[i], b = mesh.indices[i + 1], cc = mesh.indices[i + 2];
    const pa = proj(P[a * 3], P[a * 3 + 1], P[a * 3 + 2]), pb = proj(P[b * 3], P[b * 3 + 1], P[b * 3 + 2]), pc = proj(P[cc * 3], P[cc * 3 + 1], P[cc * 3 + 2]);
    const ux = P[b * 3] - P[a * 3], uy = P[b * 3 + 1] - P[a * 3 + 1], uz = P[b * 3 + 2] - P[a * 3 + 2];
    const vx = P[cc * 3] - P[a * 3], vy = P[cc * 3 + 1] - P[a * 3 + 1], vz = P[cc * 3 + 2] - P[a * 3 + 2];
    let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx; const ml = Math.hypot(nx, ny, nz) || 1; nx /= ml; ny /= ml; nz /= ml;
    const lit = Math.max(0.12, nx * L[0] + ny * L[1] + nz * L[2]);
    const cx3 = (P[a * 3] + P[b * 3] + P[cc * 3]) / 3, cy3 = (P[a * 3 + 1] + P[b * 3 + 1] + P[cc * 3 + 1]) / 3, cz3 = (P[a * 3 + 2] + P[b * 3 + 2] + P[cc * 3 + 2]) / 3;
    tris.push({ z: (pa[2] + pb[2] + pc[2]) / 3, pa, pb, pc, lit, n: [nx, ny, nz], pos: [cx3 * 6, cy3 * 6, cz3 * 6], thickness: Math.max(0, Math.min(1, 1 - Math.hypot(cx3 - 0.5, cy3 - 0.5, cz3 - 0.5) * 2.2)) });
  }
  tris.sort((p, q) => p.z - q.z);
  const skin = SKIN_CYCLE[skinIdx], nowT = performance.now() / 1000;
  if (skin !== "plain" && SKINS[skin].blend === "additive") ctx.globalCompositeOperation = "lighter";
  for (const t of tris) {
    if (skin === "plain") { const g = Math.round(60 + t.lit * 150); ctx.fillStyle = "rgb(" + Math.round(g * 0.5) + "," + Math.round(g * 0.8) + "," + g + ")"; ctx.strokeStyle = "rgba(10,16,26,0.5)"; }
    else { const c = shadeTri(skin, { lit: t.lit, normal: t.n, thickness: t.thickness, pos: t.pos, t: nowT });
      ctx.fillStyle = "rgba(" + Math.round(c[0] * 255) + "," + Math.round(c[1] * 255) + "," + Math.round(c[2] * 255) + "," + c[3].toFixed(3) + ")"; ctx.strokeStyle = "rgba(10,16,26,0.28)"; }
    ctx.beginPath(); ctx.moveTo(t.pa[0], t.pa[1]); ctx.lineTo(t.pb[0], t.pb[1]); ctx.lineTo(t.pc[0], t.pc[1]); ctx.closePath(); ctx.fill(); if (skin === "plain") ctx.stroke();
  }
  ctx.globalCompositeOperation = "source-over";
  requestAnimationFrame(frame);
}
const SKIN_CYCLE = ["plain"].concat(SKIN_NAMES); let skinIdx = 0;

frame();
const skinBtn = document.getElementById("skin");
skinBtn.onclick = () => { skinIdx = (skinIdx + 1) % SKIN_CYCLE.length; skinBtn.textContent = "skin: " + SKIN_CYCLE[skinIdx]; };
document.getElementById("shape").onchange = e => { shape = e.target.value; rebuild(); };
document.getElementById("res").onchange = e => { N = +e.target.value; rebuild(); };
document.getElementById("dl").onclick = () => { const blob = new Blob([toOBJ(mesh, shape + "_" + N)], { type: "text/plain" }); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "swek_" + shape + "_" + N + ".obj"; a.click(); };
</script>
</body>
</html>
