<!DOCTYPE html>
<!--
  physics-lab.html -- 3D physics showcase. RIG-ONLY (runs from the engine root so its ES imports of ./physics/xpbd/*
  resolve; will not preview in a standalone sandbox, like couple.html / server.html / fingerprint.html).

  A single bench that runs the engine's deterministic physics modules live and draws them in 3D. Each scene imports the
  same gated code the fingerprint proves bit-identical -- the inflating balloon is volume.js, the bulging muscle is
  muscleVolume.js composing volume with contraction, the flapping flag is windCloth.js sampling a wind field. Pick a
  scene, drive its slider, and watch the verified solver run. This page holds no physics; it only renders.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SweK -- Physics Lab</title>
<style>
  :root { --bg:#000; --amber:#ff9f00; --orange:#ff7700; --cyan:#33ccff; --panel:#12100a; --text:#ffcc66; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Antonio","Arial Narrow",sans-serif; letter-spacing:.03em; }
  #wrap { display:flex; gap:14px; padding:14px; min-height:100vh; }
  #stageCol { flex:1 1 auto; display:flex; flex-direction:column; gap:10px; }
  #panel { flex:0 0 300px; display:flex; flex-direction:column; gap:10px; }
  .bar { background:var(--amber); color:#000; border-radius:0 22px 0 0; padding:8px 16px; font-size:20px; font-weight:700; text-transform:uppercase; }
  .block { background:var(--panel); border-left:6px solid var(--orange); border-radius:0 0 0 18px; padding:12px 14px; }
  .block h3 { margin:0 0 8px; font-size:13px; letter-spacing:.14em; color:var(--amber); text-transform:uppercase; }
  canvas { background:#05070d; border:2px solid var(--orange); border-radius:14px; width:100%; display:block; }
  select, button { font-family:inherit; font-size:14px; background:#241a08; color:var(--text); border:1px solid var(--orange); border-radius:8px; padding:7px 10px; cursor:pointer; }
  button.lcars { background:var(--orange); color:#000; font-weight:700; text-transform:uppercase; }
  button.lcars.on { background:var(--cyan); }
  button:hover { filter:brightness(1.15); }
  label.row { display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:12px; margin:8px 0; text-transform:uppercase; letter-spacing:.06em; }
  input[type=range] { width:150px; accent-color:var(--orange); }
  .val { color:var(--cyan); min-width:44px; text-align:right; font-variant-numeric:tabular-nums; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; }
  .hint { font-size:11px; color:#b8935a; line-height:1.5; text-transform:none; letter-spacing:normal; }
  #status { font-size:12px; color:var(--cyan); font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stageCol">
    <div class="bar">SweK &middot; Physics Lab</div>
    <canvas id="stage" width="900" height="640"></canvas>
    <div class="block"><div id="status">initialising&hellip;</div><div class="hint" id="sceneHint"></div></div>
  </div>
  <div id="panel">
    <div class="bar" style="border-radius:22px 0 0 0">Scene</div>
    <div class="block">
      <select id="presetSel" style="width:100%;margin-bottom:8px"><option value="">\u2014 start from a preset \u2014</option></select>
      <div style="display:flex;gap:6px;margin-bottom:8px"><input id="presetName" placeholder="name this scene" style="flex:1;min-width:0;background:#06140c;border:1px solid #1e4a30;color:#9fe6c0;border-radius:6px;padding:4px 7px;font-size:12px"><button id="savePresetBtn" title="Pin the current scene to your shelf (saved in this browser)">Save</button><button id="delPresetBtn" title="Delete the selected saved preset">Del</button></div>
      <select id="sceneSel" style="width:100%"></select>
      <div class="hint" id="sceneDesc" style="margin-top:8px"></div>
    </div>
    <div class="block"><h3>Drive</h3><div id="params"></div></div>
    <div class="block"><h3>Coupling</h3><div id="formula" style="font-family:ui-monospace,monospace;font-size:12px;color:#7fe6b0;line-height:1.5;margin-bottom:10px;word-break:break-word"></div><div id="chain" style="display:flex;flex-wrap:wrap;align-items:center;gap:4px"></div></div>
    <!-- v3587 -- CAN THE ROUNDHOUSE WORK ON THIS SCENE? The drill-down, where you would look for it.
         v3595 -- *** THE BUTTON NOW RUNS. *** v3587 shipped it disabled with the reason in its tooltip,
         because the intersection between the registered proposers and these twelve scenes was ZERO. That
         stopped being true when gyro-spin (v3591) and pile-friction (v3593) registered, and paintRoundhouse
         DID enable the button for pile and gyroscope -- against a file with no click handler in it anywhere.
         AN ENABLED CONTROL THAT SWALLOWS A PRESS IS WORSE THAN THE DISABLED ONE IT REPLACED: the disabled
         version named what was missing, this one just looked broken. The handler is below; it PROPOSES and
         never applies, which is what tier 'propose' means and what the tooltip has always said. -->
    <div class="block"><h3>Roundhouse</h3>
      <div class="hint" style="margin-bottom:6px">Whether this scene could be handed to the physics AI, and what would adjudicate it.</div>
      <div id="rhVerdict" style="font-size:12px;margin-bottom:6px">&mdash;</div>
      <div id="rhKey" class="hint" style="margin-bottom:8px"></div>
      <div class="btns"><button id="initiateBtn" style="width:100%" disabled title="No proposer is registered for this scene. A proposer needs an adjudicator that can say both yes AND no; an invented one is a control that cannot fail.">Initiate AI workers</button></div>
      <div id="rhRun" style="margin-top:8px;font-size:11px;line-height:1.45"></div>
    </div>
    <div class="block"><h3>Contrast</h3><div class="hint" style="margin-bottom:6px">Flip A/B to see what one parameter changes.</div><select id="contrastSel" style="width:100%;margin-bottom:8px"><option value="">\u2014 pick a pair \u2014</option></select><div class="btns"><button id="flipBtn" style="width:100%" disabled>A / B</button></div></div>
    <div class="block">
      <h3>View</h3>
      <div class="btns"><button class="lcars" id="playBtn">Pause</button><button id="resetBtn">Reset</button><button id="spinBtn" class="on">Spin: on</button><button id="skinBtn">Skin: off</button></div>
      <div class="btns" style="margin-top:8px"><button id="linkBtn" style="width:100%">&#128279; Copy scene link</button></div>
      <label class="row">Yaw <input type="range" id="yaw" min="0" max="360" value="35" /><span class="val" id="yawv">35</span></label>
      <label class="row">Pitch <input type="range" id="pitch" min="-60" max="60" value="18" /><span class="val" id="pitchv">18</span></label>
    </div>
  </div>
</div>

<script type="module">
import { generateIcosphere, buildEdges, enclosedVolume, volumeSubstep } from "./physics/xpbd/volume.js";
import { buildMuscleBelly, contractMuscle, muscleVolumeSubstep, bellyShape } from "./physics/xpbd/muscleVolume.js";
import { buildClothConstraints } from "./physics/xpbd/clothMesh.js";
import { colorConstraints } from "./physics/xpbd/xpbd.js";
import { windClothSubstep, maxStrain } from "./physics/xpbd/windCloth.js";
import { buildVectorGrid, sampledFieldSubstep } from "./physics/xpbd/sampledField.js";
import { frictionalPileSubstep, pileShape } from "./physics/xpbd/frictionalContact.js";
import { buildAnisotropicCloth, anisotropicSubstep, extent } from "./physics/xpbd/anisotropy.js";
import { lcg } from "./physics/blobThermal.js";
import { strictJitterCentres } from "./physics/strictGaussian.js";
import { strictGaussian } from "./physics/strictGaussian.js";
import { warmthOfKelvin, SCENARIOS } from "./physics/blobKelvin.js";
import { measuredT } from "./physics/tempModulator.js";
import { planarFallbackWorld } from "./physics/planarFallbackWorld.js";
import { metaballField2d, ISO2D } from "./physics/metaball2d.js";
import { centrifugeStep, bandR } from "./physics/centrifuge.js";
import { makeGyro, gyroStep } from "./physics/gyroscope.js";
import { makePendulumWave, pendulumStep, angleSpread } from "./physics/pendulumWave.js";
import { keplerPair, orbitStep, totalEnergy, angularMomentum, separation } from "./physics/orbit.js";
import { makeChain, setMode, modeFreq, chainStep, energy as chainEnergy } from "./physics/vibrations.js";
import { makeFigureEight, orbitStep as orbitStepFig, FIG8_PERIOD } from "./physics/figureEight.js";
import { schwarzschildRadius as bhRs3, photonSphere as bhPh3, iscoRadius as bhIsco3, circularSpeed as bhVc3, makeParticle as bhMake3, step as bhStep3 } from "./physics/blackHole.js";
import { makeSolarSystem as makeSolarSys, ELEMENTS as SS_ELEM } from "./physics/solarSystem.js";
import { surfaceGeom as nsSurf3, makeOrbit as nsMake3, stepOrbit as nsStep3, compactness as nsC3, escapeFraction as nsEsc3 } from "./physics/neutronStar.js";
import { chandrasekharMass as wdMch, radiusSolar as wdRadius, radiusKm as wdRadiusKm } from "./physics/whiteDwarf.js";
import { makeParticle as plMake3, step as plStep3, speedSq as plSpeed3 } from "./physics/plasma.js";
import { makeApproach as imMake3, stepApproach as imStep3, criticalImpactParameter as imBcrit, impactSpeed as imVimp } from "./physics/impact.js";
import { STARS as CAT_STARS, position3D as catPos, colorFromTemp as catColor, absoluteMagnitude as catAbsMag, count as catCount } from "./ev/starCatalog.js";
import { renderWhole as rnWhole3, distributedRender as rnDist3, sliceRows as rnSlice3 } from "./tools/render/render.js";
import { planWork as rcPlan, honestTransport as rcHonest, faultyTransport as rcFaulty, renderCluster as rcCluster } from "./tools/render/renderCluster.js";
import { scanScreen as hoScan, twoSources as hoSources, fringeSpacing as hoSpacing, recoverSeparation as hoRecover } from "./physics/hologram.js";
import { PRESETS, CONTRASTS } from "./physics/labPresets.js";
import { encodeScene, decodeScene } from "./physics/presetCodec.js";

const cvs = document.getElementById("stage"), ctx = cvs.getContext("2d");
const off = document.createElement("canvas"), octx = off.getContext("2d");
let skinMode = false;

const SCENES = {
  balloon: {
    label: "Balloon  (volume / pressure)",
    desc: "A closed mesh under a single global volume constraint. Drive the pressure to inflate or deflate; at rest it conserves volume.",
    params: [{ name: "inflation", label: "Inflation", min: 0.4, max: 2.4, default: 1.6, step: 0.05 }],
    build() {
      const sph = generateIcosphere(2);
      const edges = buildEdges(sph.pos, sph.tris, 0.0004), batches = colorConstraints(edges);
      const restVol = enclosedVolume(sph.pos, sph.tris);
      const state = { pos: Float64Array.from(sph.pos), vel: new Float64Array(sph.n * 3), invMass: new Float64Array(sph.n).fill(1) };
      return { state, edges, tris: sph.tris, n: sph.n, batches, restVol };
    },
    step(s, p) { volumeSubstep(s.state, s.edges, s.batches, s.tris, s.restVol, { dt: 0.016, iterations: 8, inflation: p.inflation, gravity: [0, 0, 0] }); },
    status(s) { return "volume " + enclosedVolume(s.state.pos, s.tris).toFixed(2) + " / rest " + s.restVol.toFixed(2); },
  },
  muscle: {
    label: "Muscle  (volume + contractile fibres)",
    desc: "An elongated closed mesh whose axial fibres contract. Volume is conserved, so shortening forces the belly to bulge -- a biological actuator composed from two constraints.",
    params: [{ name: "activation", label: "Activation", min: 0, max: 1, default: 0.7, step: 0.05 }],
    build() {
      const belly = buildMuscleBelly(2, 2.2), batches = colorConstraints(belly.edges);
      const restVol = enclosedVolume(belly.pos, belly.tris);
      const state = { pos: Float64Array.from(belly.pos), vel: new Float64Array(belly.n * 3), invMass: new Float64Array(belly.n).fill(1) };
      return { state, edges: belly.edges, tris: belly.tris, n: belly.n, batches, restVol };
    },
    step(s, p) { contractMuscle(s.edges, p.activation, 0.35); muscleVolumeSubstep(s.state, s.edges, s.batches, s.tris, s.restVol, { dt: 0.016, iterations: 10, useVolume: true }); },
    status(s) { const sh = bellyShape(s.state.pos, s.n); return "length " + sh.length.toFixed(2) + "  girth " + sh.girth.toFixed(2) + "  vol " + enclosedVolume(s.state.pos, s.tris).toFixed(2); },
  },
  flag: {
    label: "Flag  (cloth in a sampled wind)",
    desc: "A cloth pinned at its pole in a sampled wind field. The wind and the edge constraints negotiate into a billow; the fabric flaps but holds together.",
    params: [{ name: "wind", label: "Wind", min: 0, max: 9, default: 5, step: 0.5 }],
    build() {
      const W = 14, H = 9, SP = 0.18, N = W * H;
      const { cons } = buildClothConstraints(W, H, SP, { structural: 0.0, shear: 0.0005, bending: 0.002 });
      const batches = colorConstraints(cons);
      const pos = new Float64Array(3 * N), vel = new Float64Array(3 * N), invMass = new Float64Array(N).fill(1);
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const i = y * W + x; pos[3 * i] = x * SP - 1.2; pos[3 * i + 1] = 0.8 - y * SP; pos[3 * i + 2] = 0; if (x === 0) invMass[i] = 0; }
      const g = { nx: 8, ny: 8, nz: 8, ox: -2, oy: -2, oz: -1.5, sp: 0.6 };
      const field = { grid: buildVectorGrid(g.nx, g.ny, g.nz, g.ox, g.oy, g.oz, g.sp, () => [0, 0, 1]), dims: g };
      const edges = cons.map((c) => [c.i, c.j]);
      return { state: { pos, vel, invMass }, edges, cons, n: N, batches, field };
    },
    step(s, p) { windClothSubstep(s.state, s.cons, s.batches, s.field, { dt: 0.016, iterations: 12, gravity: [0, -2, 0], windStrength: p.wind }); },
    status(s) { return "strain " + maxStrain(s.state.pos, s.cons).toFixed(3) + "  (fabric holding)"; },
  },
  pile: {
    label: "Pile  (granular friction / repose)",
    desc: "Grains dropped onto a floor, each a two-way frictional contact. Friction lets them stack into a heap with an angle of repose instead of spreading flat -- chaotic but bit-reproducible.",
    params: [{ name: "mu", label: "Friction", min: 0.05, max: 0.9, default: 0.5, step: 0.05 }],
    ground: true, pointR: 3.2,
    build() {
      const cols = 5, rows = 5, layers = 5, N = cols * rows * layers, R = 0.09;
      const pos = new Float64Array(3 * N), vel = new Float64Array(3 * N), invMass = new Float64Array(N).fill(1);
      let k = 0; for (let ly = 0; ly < layers; ly++) for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) { pos[3 * k] = (c - 2) * R * 2.05 + (ly % 2) * 0.01; pos[3 * k + 1] = 0.5 + ly * R * 2.1; pos[3 * k + 2] = (r - 2) * R * 2.05; k++; }
      return { state: { pos, vel, invMass }, edges: [], n: N, R };
    },
    step(s, p) { frictionalPileSubstep(s.state, [0, 1, 0], 0, p.mu, { dt: 0.016, iterations: 6, gravity: [0, -10, 0], radius: s.R }); },
    status(s) { const sh = pileShape(s.state.pos, s.n); return "height " + sh.height.toFixed(2) + "  radius " + sh.radius.toFixed(2) + "  aspect " + (sh.height / (sh.radius + 1e-6)).toFixed(2); },
  },
  stretch: {
    label: "Stretch  (anisotropic cloth)",
    desc: "A cloth hung from its top edge with a stiff warp and a soft weft. Under its own weight it sags far more along the compliant direction than the stiff one -- direction-dependent stiffness from a per-edge compliance.",
    params: [{ name: "weft", label: "Weft give", min: 0.00002, max: 0.003, default: 0.0015, step: 0.00002 }],
    build() {
      const W = 12, H = 12, SP = 0.16, N = W * H;
      const cons = buildAnisotropicCloth(W, H, SP, 0.00001, 0.0015), batches = colorConstraints(cons);
      const pos = new Float64Array(3 * N), vel = new Float64Array(3 * N), invMass = new Float64Array(N).fill(1);
      for (let z = 0; z < H; z++) for (let x = 0; x < W; x++) { const i = z * W + x; pos[3 * i] = (x - W / 2) * SP; pos[3 * i + 1] = 0; pos[3 * i + 2] = z * SP; if (z === 0) invMass[i] = 0; }
      const edges = cons.map((c) => [c.i, c.j]);
      return { state: { pos, vel, invMass }, edges, cons, batches, n: N, W, H };
    },
    step(s, p) { for (const c of s.cons) if (c.dir === "weft") c.compliance = p.weft; anisotropicSubstep(s.state, s.cons, s.batches, { dt: 0.016, iterations: 14, force: [0, 0, 3] }); },
    status(s) { return "warp " + extent(s.state.pos, s.n, 0).toFixed(2) + "  weft " + extent(s.state.pos, s.n, 2).toFixed(2) + "  (soft dir stretches more)"; },
  },
  swirl: {
    label: "Swirl  (sampled vector field)",
    desc: "Particles carried by an external volumetric field, sampled trilinearly at each point -- the OpenStorm coupling. Here the field is a rotation, so the particles circulate as if caught in an eddy.",
    params: [{ name: "strength", label: "Field", min: 0.3, max: 3, default: 1.4, step: 0.1 }],
    pointR: 2.6,
    build() {
      const g = { nx: 8, ny: 8, nz: 8, ox: -1.4, oy: -1.4, oz: -1.4, sp: 0.4 };
      const field = { grid: buildVectorGrid(g.nx, g.ny, g.nz, g.ox, g.oy, g.oz, g.sp, (x, y, z) => [-z, 0.12, x]), dims: g };
      const N = 90, pos = new Float64Array(3 * N), vel = new Float64Array(3 * N), invMass = new Float64Array(N).fill(1);
      for (let i = 0; i < N; i++) { const a = (i * 2.399963), rr = 0.25 + (i % 9) * 0.09; pos[3 * i] = Math.cos(a) * rr; pos[3 * i + 1] = -0.9 + (i % 7) * 0.25; pos[3 * i + 2] = Math.sin(a) * rr; }
      return { state: { pos, vel, invMass }, edges: [], field, n: N };
    },
    step(s, p) { sampledFieldSubstep(s.state, s.field, { dt: 0.016, strength: p.strength, damping: 0.008 }); },
    status(s) { let r = 0; for (let i = 0; i < s.n; i++) { const x = s.state.pos[3 * i], z = s.state.pos[3 * i + 2]; r += Math.sqrt(x * x + z * z); } return "mean radius " + (r / s.n).toFixed(2) + "  (circulating)"; },
  },
  diffusion: {
    label: "Diffusion  (thermal coupling: warmth drives Brownian motion)",
    desc: "The Blobarium's thermal coupling. A temperature sets a diffusion coefficient by Stokes-Einstein, which sets the Brownian kick on the blob centres; a temperature read back from their measured wander tracks the one you dialled in. The Brownian kick uses the strict-libm Gaussian (erfinv on the proven strict erf), so this coupling is now cross-architecture bit-identical -- fingerprint subsystem thermal-diffusion.",
    params: [{ name: "tempK", label: "Temp (K)", min: 250, max: 373, default: 300, step: 1 }],
    pointR: 4.5, blobs: true, blobR: 0.5,
    build() {
      const scen = SCENARIOS.bacterium, rnd = lcg(20260715), N = 7;
      const centres = []; for (let i = 0; i < N; i++) centres.push({ x: (i - 3) * 0.12, y: ((i % 3) - 1) * 0.12, z: ((i % 2) - 0.5) * 0.24 });
      return { state: { pos: new Float64Array(3 * N), vel: new Float64Array(3 * N), invMass: new Float64Array(N).fill(1) }, edges: [], n: N, centres, rnd, scen, ring: [], box: 1.4, commandedK: 300, measK: null, D: null };
    },
    step(s, p) {
      s.commandedK = p.tempK; const D = warmthOfKelvin(p.tempK, s.scen); s.D = D;
      strictJitterCentres(s.centres, { D, dt: 1 / 60, rnd: s.rnd });
      for (const b of s.centres) for (const k of ["x", "y", "z"]) { if (b[k] > s.box) b[k] = 2 * s.box - b[k]; else if (b[k] < -s.box) b[k] = -2 * s.box - b[k]; }
      for (let i = 0; i < s.n; i++) { s.state.pos[3 * i] = s.centres[i].x; s.state.pos[3 * i + 1] = s.centres[i].y; s.state.pos[3 * i + 2] = s.centres[i].z; }
      s.ring.push(s.centres.map((b) => [b.x, b.y, b.z])); const W = 120; if (s.ring.length > W) s.ring.shift();
      if (s.ring.length === W) { const old = s.ring[0], disp = []; for (let i = 0; i < s.n; i++) disp.push([s.centres[i].x - old[i][0], s.centres[i].y - old[i][1], s.centres[i].z - old[i][2]]); s.measK = measuredT(disp, W / 60, s.scen); }
    },
    status(s) { return "commanded " + s.commandedK.toFixed(0) + "K   measured " + (s.measK == null ? "\u2026" : s.measK.toFixed(0) + "K") + "   D " + (s.D == null ? "\u2026" : s.D.toExponential(2)); },
  },
  aquarium: {
    label: "Aquarium  (box3d collision + thermal drive)",
    desc: "The full Blobarium physics minus the blobby render: seven centres as colliding rigid bodies, warmth driving their Brownian jostle against a soft trap. Collisions keep them from overlapping. RUNS ON box3d WASM ON THE RIG; here (and anywhere the WASM is not built) it uses the planar-fallback world the lockstep gate proves deterministic, so bodies collide in the x-z plane.",
    params: [{ name: "tempK", label: "Temp (K)", min: 250, max: 373, default: 320, step: 1 }],
    pointR: 3, bodyRadius: 0.16, blobs: true, blobR: 0.34,
    build() {
      const w = planarFallbackWorld(), N = 7, rnd = lcg(20260715), scen = SCENARIOS.bacterium, half = 0.16;
      for (let i = 0; i < N; i++) { const a = i / N * 6.283185; w.addBox({ pos: [Math.cos(a) * 0.5, 0, Math.sin(a) * 0.5], half }); }
      return { state: { pos: new Float64Array(3 * N), vel: new Float64Array(3 * N), invMass: new Float64Array(N).fill(1) }, edges: [], n: N, world: w, rnd, scen, kTrap: 6, damp: 0.9, commandedK: 320 };
    },
    step(s, p) {
      s.commandedK = p.tempK; const D = warmthOfKelvin(p.tempK, s.scen), dt = 1 / 60, kick = Math.sqrt(2 * D * dt) * 7;
      const tr = s.world.readTransforms(), vel = s.world.readVelocities();
      for (let i = 0; i < s.n; i++) { const px = tr[i * 7], pz = tr[i * 7 + 2], vx = vel[i * 3], vz = vel[i * 3 + 2];
        s.world.impulse(i, [strictGaussian(s.rnd) * kick - s.kTrap * px * dt - s.damp * vx * dt, 0, strictGaussian(s.rnd) * kick - s.kTrap * pz * dt - s.damp * vz * dt]); }
      s.world.step(dt);
      const t2 = s.world.readTransforms(); for (let i = 0; i < s.n; i++) { s.state.pos[3 * i] = t2[i * 7]; s.state.pos[3 * i + 1] = t2[i * 7 + 1]; s.state.pos[3 * i + 2] = t2[i * 7 + 2]; }
    },
    status(s) { let mind = Infinity, sp = 0; const p = s.state.pos; for (let i = 0; i < s.n; i++) { sp += Math.sqrt(p[3 * i] ** 2 + p[3 * i + 2] ** 2); for (let j = i + 1; j < s.n; j++) { const dx = p[3 * i] - p[3 * j], dz = p[3 * i + 2] - p[3 * j + 2], d = Math.sqrt(dx * dx + dz * dz); if (d < mind) mind = d; } } return "commanded " + s.commandedK.toFixed(0) + "K   cloud " + (sp / s.n).toFixed(2) + "   nearest pair " + mind.toFixed(2) + " (>= 2*radius = collision holding)"; },
  },
  centrifuge: {

  gyroscope: {
    label: "Gyroscope  (precession)",
    desc: "A spinning flywheel pivoted at one end. Gravity should tip it over, but its angular momentum turns the pull sideways: the axis sweeps a cone around the vertical instead of falling -- precession. Raise the spin and the precession SLOWS (rate = mg\u2113/|L|), the gyroscope's counterintuitive signature. Pure angular-momentum mechanics, cross-architecture bit-identical.",
    params: [{ name: "omega", label: "Spin \u03c9", min: 20, max: 90, default: 40, step: 1 }],
    build() {
      const g = makeGyro({ omega: 40, I: 1, axis: [0.48, 0.88, 0] }), ringN = 18, N = 2 + ringN;
      const edges = [[0, 1]]; for (let i = 0; i < ringN; i++) edges.push([2 + i, 2 + (i + 1) % ringN]); for (let i = 0; i < ringN; i += 3) edges.push([1, 2 + i]);
      return { state: { pos: new Float64Array(3 * N), vel: new Float64Array(3 * N), invMass: new Float64Array(N).fill(1) }, edges, n: N, gyro: g, ringN, phase: 0, len: 1.15, discR: 0.42 };
    },
    step(s, p) {
      const g = s.gyro, cur = Math.sqrt(g.L[0] ** 2 + g.L[1] ** 2 + g.L[2] ** 2), k = p.omega / cur;
      g.L[0] *= k; g.L[1] *= k; g.L[2] *= k;                 // set |L| = I*omega live (I = 1) so the slider changes the rate
      gyroStep(g, { tipTorque: 12, dt: 1 / 60 }); s.phase += p.omega * 0.015;
      const mag = Math.sqrt(g.L[0] ** 2 + g.L[1] ** 2 + g.L[2] ** 2), ax = [g.L[0] / mag, g.L[1] / mag, g.L[2] / mag];
      const cr = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
      let u = cr(ax, [0, 1, 0]); let un = Math.sqrt(u[0] ** 2 + u[1] ** 2 + u[2] ** 2); if (un < 1e-6) { u = cr(ax, [1, 0, 0]); un = Math.sqrt(u[0] ** 2 + u[1] ** 2 + u[2] ** 2); } u = [u[0] / un, u[1] / un, u[2] / un];
      const v = cr(ax, u), P = s.state.pos;
      P[0] = 0; P[1] = 0; P[2] = 0; const tip = [ax[0] * s.len, ax[1] * s.len, ax[2] * s.len]; P[3] = tip[0]; P[4] = tip[1]; P[5] = tip[2];
      for (let i = 0; i < s.ringN; i++) { const a = s.phase + i / s.ringN * 6.283185, c = Math.cos(a), sn = Math.sin(a), o = 3 * (2 + i); P[o] = tip[0] + s.discR * (c * u[0] + sn * v[0]); P[o + 1] = tip[1] + s.discR * (c * u[1] + sn * v[1]); P[o + 2] = tip[2] + s.discR * (c * u[2] + sn * v[2]); }
    },
    status(s) { const g = s.gyro, mag = Math.sqrt(g.L[0] ** 2 + g.L[1] ** 2 + g.L[2] ** 2); return "spin |L| " + mag.toFixed(0) + "   axis tilt cos " + (g.L[1] / mag).toFixed(2) + " (held)   \u2014 faster spin precesses slower"; },
  },
  "pendulum-wave": {
    label: "Pendulum wave",
    desc: "Fifteen pendulums whose lengths are tuned so the longest does k swings each cycle, the next k+1, and so on. Released together they start in step, fan into a travelling wave, fold into two groups and finer patterns, then -- because every one completes a whole number of swings at once -- snap back into step and repeat. Each is an exact harmonic oscillator (strict-trig rotation), so the re-sync is perfect and cross-architecture bit-identical.",

  orbit: {

  gyroscope: { formula: "dL/dt = \u03c4 = \u2212mg\u2113(\u00e2 \u00d7 \u1e91),   \u03a9 = mg\u2113/|L|", chain: ["spin |L|", "gravity torque", "dL/dt \u22a5 axis", "precession"] },
  "pendulum-wave": { formula: "T_n = cycle/(k+n),   \u03b8_n\u2033 = \u2212\u03c9_n\u00b2\u03b8_n  (exact rotation)", chain: ["tuned lengths", "staggered periods", "travelling wave", "re-sync each cycle"] },
  orbit:     { formula: "a = \u2212G\u00b7M\u00b7r/|r|\u00b3,  velocity-Verlet;   T\u00b2 \u221d a\u00b3", chain: ["gravity 1/r\u00b2", "symplectic step", "closed ellipse", "conserved E, L"] },
  vibrations:{ formula: "m\u00b7x\u2099\u2033 = k(x\u2099\u208b\u2081 \u2212 2x\u2099 + x\u2099\u208a\u2081),   \u03c9_j = 2\u221a(k/m)\u00b7sin(j\u03c0/2(N+1))", chain: ["springs couple", "normal modes", "standing wave", "\u03c9 climbs with j"] },
  "figure-eight": { formula: "three equal masses, a = \u2212G\u00b7\u03a3 m\u00b7r/|r|\u00b3,  one shared curve", chain: ["exact push", "N-body gravity", "periodic orbit", "choreography"] },
};

function project(x, y, z, f) {
  const yaw = (parseFloat(document.getElementById("yaw").value) + spinAngle) * Math.PI / 180, pit = parseFloat(document.getElementById("pitch").value) * Math.PI / 180;
  const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pit), sp = Math.sin(pit);
  const x1 = cy * x + sy * z, z1 = -sy * x + cy * z;
  const y2 = cp * y - sp * z1, z2 = sp * y + cp * z1;
  const d = 6, s = f.scale * d / (d + z2);
  return [f.cx + x1 * s, f.cy - y2 * s, z2];
}
function bounds(s) { let m = 0; for (let i = 0; i < s.n; i++) { const x = s.state.pos[3 * i], y = s.state.pos[3 * i + 1], z = s.state.pos[3 * i + 2]; const r = Math.sqrt(x * x + y * y + z * z); if (r > m) m = r; } return m; }

function renderSkin(f) {
  // screen-space metaball: project the centres, evaluate the same cubic kernel in 2D on a quarter-res buffer, threshold
  const scale = 0.25, ow = Math.max(2, Math.round(cvs.width * scale)), oh = Math.max(2, Math.round(cvs.height * scale));
  off.width = ow; off.height = oh;
  const p = scene.state.pos, R = (scene.blobR || 0.4) * f.scale * scale;
  const b2 = []; for (let i = 0; i < scene.n; i++) { const a = project(p[3 * i], p[3 * i + 1], p[3 * i + 2], f); b2.push({ x: a[0] * scale, y: a[1] * scale, r: R, a: 2, depth: a[2] }); }
  const img = octx.createImageData(ow, oh), d = img.data;
  for (let py = 0; py < oh; py++) for (let px = 0; px < ow; px++) {
    const v = metaballField2d(b2, px, py), o = (py * ow + px) * 4;
    if (v >= ISO2D) { const t = Math.min(1, (v - ISO2D) / 2.5); d[o] = 40 + t * 180; d[o + 1] = 150 + t * 90; d[o + 2] = 200 + t * 55; d[o + 3] = 235; }
    else { d[o + 3] = 0; }
  }
  octx.putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = true; ctx.drawImage(off, 0, 0, cvs.width, cvs.height);
}

function render() {
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  const r = Math.max(bounds(scene), 0.5), f = { cx: cvs.width / 2, cy: cvs.height / 2, scale: Math.min(cvs.width, cvs.height) * 0.34 / r };
  if (skinMode && scene.blobs) { renderSkin(f); return; }
  const p = scene.state.pos;
  if (scene.ground) {
    ctx.strokeStyle = "rgba(80,120,160,0.35)"; ctx.lineWidth = 1;
    const g = 1.1; for (let t = -3; t <= 3; t++) {
      const a = project(t * g / 3, 0, -g, f), b = project(t * g / 3, 0, g, f), c = project(-g, 0, t * g / 3, f), d = project(g, 0, t * g / 3, f);
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.moveTo(c[0], c[1]); ctx.lineTo(d[0], d[1]); ctx.stroke();
    }
  }
  for (const e of scene.edges) {
    const i = e[0] ?? e.i, j = e[1] ?? e.j;
    const a = project(p[3 * i], p[3 * i + 1], p[3 * i + 2], f), b = project(p[3 * j], p[3 * j + 1], p[3 * j + 2], f);
    const depth = (a[2] + b[2]) / 2, shade = Math.max(0.15, Math.min(1, 0.6 + depth * 0.18));
    ctx.strokeStyle = e.muscle ? `rgba(120,220,255,${shade})` : `rgba(255,150,40,${shade})`;
    ctx.lineWidth = e.muscle ? 1.6 : 1;
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  }
  const pr = scene.pointR ?? 2;
  if (scene.bodyRadius) {
    const rad = scene.bodyRadius * f.scale;
    for (let i = 0; i < scene.n; i++) { const a = project(p[3 * i], p[3 * i + 1], p[3 * i + 2], f); ctx.strokeStyle = "rgba(120,220,255,0.7)"; ctx.fillStyle = "rgba(60,120,180,0.25)"; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(a[0], a[1], rad, 0, 7); ctx.fill(); ctx.stroke(); ctx.fillStyle = "#ffcc66"; ctx.beginPath(); ctx.arc(a[0], a[1], 2, 0, 7); ctx.fill(); }
    return;
  }
  for (let i = 0; i < scene.n; i++) { const a = project(p[3 * i], p[3 * i + 1], p[3 * i + 2], f); const pinned = scene.state.invMass[i] === 0; ctx.fillStyle = scene.colors ? scene.colors[i] : (pinned ? "#ff3322" : "#ffcc66"); ctx.beginPath(); ctx.arc(a[0], a[1], pinned ? 3.5 : pr, 0, 7); ctx.fill(); }
}

const sel = document.getElementById("sceneSel");
for (const id of Object.keys(SCENES)) { const o = document.createElement("option"); o.value = id; o.textContent = SCENES[id].label; sel.appendChild(o); }
const presetSel = document.getElementById("presetSel");
function applyPreset(p) {
  if (!p || !SCENES[p.scene]) return;
  sel.value = p.scene; selectScene(p.scene);
  document.querySelectorAll("#params input").forEach((inp, i) => { const pr = sceneDef.params[i]; if (pr && p.params && p.params[pr.name] !== undefined) { inp.value = p.params[pr.name]; inp.dispatchEvent(new Event("input")); } });
  if (p.yaw !== undefined) { document.getElementById("yaw").value = p.yaw; document.getElementById("yawv").textContent = p.yaw; }
  if (p.pitch !== undefined) { document.getElementById("pitch").value = p.pitch; document.getElementById("pitchv").textContent = p.pitch; }
  const wantSkin = !!p.skin && !!sceneDef.blobs;
  if (wantSkin !== skinMode) { skinMode = wantSkin; skinBtn.classList.toggle("on", skinMode); skinBtn.textContent = skinMode ? "Skin: on" : "Skin: off"; }
  if (p.spin !== undefined && p.spin !== spin) { spin = p.spin; spinBtn.classList.toggle("on", spin); spinBtn.textContent = spin ? "Spin: on" : "Spin: off"; }
}
// user preset shelf -- saved in this browser, restored through the same path as the curated ones
const USER_KEY = "swek-lab-userpresets";
function loadUser() { try { return JSON.parse(localStorage.getItem(USER_KEY) || "[]"); } catch { return []; } }
function storeUser(list) { try { localStorage.setItem(USER_KEY, JSON.stringify(list)); } catch { /* storage off: shelf is session-only */ } }
function refreshPresets() {
  presetSel.innerHTML = "<option value=''>\u2014 start from a preset \u2014</option>";
  const gc = document.createElement("optgroup"); gc.label = "Starters";
  PRESETS.forEach((p, i) => { const o = document.createElement("option"); o.value = "c:" + i; o.textContent = p.name; gc.appendChild(o); });
  presetSel.appendChild(gc);
  const user = loadUser();
  if (user.length) { const gu = document.createElement("optgroup"); gu.label = "Your presets"; user.forEach((u, i) => { const o = document.createElement("option"); o.value = "u:" + i; o.textContent = u.name; gu.appendChild(o); }); presetSel.appendChild(gu); }
}
presetSel.onchange = () => {
  const v = presetSel.value; if (!v) return;
  if (v.startsWith("c:")) applyPreset(PRESETS[+v.slice(2)]);
  else if (v.startsWith("u:")) { const u = loadUser()[+v.slice(2)]; if (u) applyPreset(decodeScene(u.enc)); }
};
document.getElementById("savePresetBtn").onclick = () => {
  const nameInput = document.getElementById("presetName"); const name = (nameInput.value || "").trim() || (sel.value + " " + new Date().toLocaleTimeString());
  const list = loadUser(); list.push({ name, enc: serializeState() }); storeUser(list); nameInput.value = ""; refreshPresets();
  presetSel.value = "u:" + (list.length - 1);
};
document.getElementById("delPresetBtn").onclick = () => {
  const v = presetSel.value; if (!v.startsWith("u:")) return; const list = loadUser(); list.splice(+v.slice(2), 1); storeUser(list); refreshPresets();
};
// contrast pairs: pick a pair, then flip A/B to re-run the scene on the other side
const contrastSel = document.getElementById("contrastSel"), flipBtn = document.getElementById("flipBtn");
CONTRASTS.forEach((c, i) => { const o = document.createElement("option"); o.value = String(i); o.textContent = c.name; contrastSel.appendChild(o); });
let activeContrast = null, activeSide = 0;
function applyContrastSide() {
  const c = activeContrast; if (!c) return;
  applyPreset({ scene: c.scene, params: c.sides[activeSide].params, yaw: c.yaw, pitch: c.pitch, skin: c.skin });
  flipBtn.textContent = "Showing " + (activeSide === 0 ? "A" : "B") + ": " + c.sides[activeSide].label + "  \u2014 flip to " + (activeSide === 0 ? "B" : "A");
}
contrastSel.onchange = () => { const v = contrastSel.value; if (v === "") { activeContrast = null; flipBtn.disabled = true; flipBtn.textContent = "A / B"; return; } activeContrast = CONTRASTS[+v]; activeSide = 0; flipBtn.disabled = false; applyContrastSide(); };
flipBtn.onclick = () => { if (!activeContrast) return; activeSide = 1 - activeSide; applyContrastSide(); };
function selectScene(id) {
  sceneDef = SCENES[id]; scene = sceneDef.build(); params = {}; for (const pr of sceneDef.params) params[pr.name] = pr.default;
  const box = document.getElementById("params"); box.innerHTML = "";
  for (const pr of sceneDef.params) {
    const row = document.createElement("label"); row.className = "row";
    const val = document.createElement("span"); val.className = "val"; val.textContent = pr.default.toFixed(2);
    const inp = document.createElement("input"); inp.type = "range"; inp.min = pr.min; inp.max = pr.max; inp.step = pr.step; inp.value = pr.default;
    inp.oninput = () => { params[pr.name] = parseFloat(inp.value); val.textContent = params[pr.name].toFixed(2); };
    row.append(pr.label + " ", inp, val); box.appendChild(row);
  }
  document.getElementById("sceneDesc").textContent = sceneDef.desc;
  updateCoupling(id);
  render();
}
function updateCoupling(id) {
  const fx = FORMULAS[id] || { formula: "", chain: [] };
  document.getElementById("formula").textContent = fx.formula;
  const box = document.getElementById("chain"); box.innerHTML = "";
  fx.chain.forEach((stage, i) => {
    const pill = document.createElement("span");
    pill.textContent = stage;
    pill.style.cssText = "padding:3px 8px;border:1px solid #1e4a30;border-radius:10px;background:#06140c;color:#9fe6c0;font-size:11px;white-space:nowrap";
    box.appendChild(pill);
    if (i < fx.chain.length - 1) { const arr = document.createElement("span"); arr.textContent = "\u2192"; arr.style.cssText = "color:#ff9f00;font-weight:700"; box.appendChild(arr); }
  });
}
// v3587 -- the Roundhouse drill-down. Reads the triage and the LIVE proposer registry, and refuses to imply
// more than either supports.
let RH = null;
fetch("/roundhouse/lab-scenes", { cache: "no-store" }).then((r) => (r.ok ? r.json() : null))
  .then((j) => { if (j && j.ok) { RH = j; paintRoundhouse(sel.value); } })
  .catch(() => { /* absent bridge leaves the panel at its default dash rather than claiming a verdict */ });

function paintRoundhouse(id) {
  const v = document.getElementById("rhVerdict"), k = document.getElementById("rhKey"),
        b = document.getElementById("initiateBtn");
  if (!RH) { v.textContent = "bridge not reachable"; return; }
  const row = (RH.scenes || []).find((r) => r.scene === id);
  if (!row) { v.textContent = "no triage row for this scene"; k.textContent = ""; b.disabled = true; return; }
  if (row.registered) {
    v.innerHTML = "<b style='color:var(--good,#6fe39b)'>registered</b> &mdash; knob <code>" + row.knob + "</code>";
    b.disabled = false;
    b.title = "Runs the proposer's propose() and shows the candidate. It does NOT adopt: that needs the adopt tier.";
  } else if (row.eligible === "candidate") {
    // *** CANDIDATE IS NOT REGISTERED, AND THE BUTTON STAYS DISABLED. *** Enabling it here would imply an
    // adjudicator exists, and the whole point of the triage is that nobody has written one yet.
    v.innerHTML = "<b style='color:#ffcc66'>candidate</b> &mdash; knob <code>" + row.knob +
                  "</code>, no proposer registered";
    b.disabled = true;
    b.title = "An independent key exists for this scene but no adjudicator has been written. registerProposer " +
              "requires one that can say both yes AND no.";
  } else {
    v.innerHTML = "<b style='color:#7f9c8c'>refused</b> &mdash; knob <code>" + row.knob + "</code>";
    b.disabled = true;
    b.title = "This scene has no independent measurable a knob search could be right or wrong about.";
  }
  k.textContent = row.key || row.reason || "";
}

sel.addEventListener("change", () => paintRoundhouse(sel.value));

// v3595 -- THE HANDLER THE BUTTON NEVER HAD. It calls the route, and it renders BOTH halves of the answer:
// what the score wanted, and what the adjudicator would stand behind. Showing only the second would hide the
// refusal that is the whole point of the loop; showing only the first is what v3594 found runProposer doing,
// where the only possible output was "refused" on all eight proposers.
const rhRun = document.getElementById("rhRun");
const esc = (v) => String(v).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const num = (v) => (typeof v === "number" ? (Math.abs(v) >= 1e-3 && Math.abs(v) < 1e6 ? v.toPrecision(5) : v.toExponential(3)) : esc(JSON.stringify(v)));
document.getElementById("initiateBtn").onclick = async () => {
  const btn = document.getElementById("initiateBtn"), scene = sel.value;
  btn.disabled = true; rhRun.innerHTML = "<span class='hint'>running the proposer...</span>";
  try {
    const res = await fetch("/roundhouse/lab-scene-run?scene=" + encodeURIComponent(scene), { cache: "no-store" });
    const j = await res.json();
    // A refusal from the route is RENDERED, not swallowed: the two error codes mean different things and a
    // bare "failed" would make an unwritten adjudicator look like a broken server.
    if (!j || !j.ok) {
      rhRun.innerHTML = "<b style='color:#ffcc66'>" + esc((j && j.error) || "request failed") + "</b>" +
                        (j && j.message ? "<div class='hint'>" + esc(j.message) + "</div>" : "");
      return;
    }
    const out = [];
    for (const r of j.runs) {
      const gv = r.greedyVerdict || {}, av = r.acceptedVerdict || null;
      out.push("<div style='border:1px solid #1e4a30;border-radius:6px;padding:6px 7px;margin-bottom:6px'>");
      out.push("<div><b>" + esc(r.id) + "</b> <span class='hint'>tier " + esc(r.tier) + " &middot; " +
               r.tried + " candidates &middot; " + r.adjudicated + " adjudicated &middot; " + r.ms + " ms</span></div>");
      // THE GREEDY PICK AND ITS VERDICT. It is expected to be refused -- the search maximises a preference and
      // the key is the independent thing that says no -- so a refusal here is the loop working, not failing.
      out.push("<div style='margin-top:4px'>search wanted <code>" + esc(r.knobs.join(",")) + " = " + num(r.greedy) +
               "</code> &rarr; <b style='color:" + (gv.pass ? "#6fe39b" : "#ffcc66") + "'>" +
               (gv.pass ? "accepted" : "refused") + "</b></div>");
      if (!gv.pass && gv.evidence && gv.evidence.reason)
        out.push("<div class='hint'>" + esc(gv.evidence.reason) + "</div>");
      if (r.accepted === null || r.accepted === undefined)
        out.push("<div style='margin-top:4px'><b style='color:#ffcc66'>no candidate survived adjudication</b>" +
                 "<div class='hint'>a real answer: the proposer offered nothing this instrument's key will stand behind</div></div>");
      else
        out.push("<div style='margin-top:4px'><b style='color:var(--good,#6fe39b)'>adjudicated: " +
                 esc(r.knobs.join(",")) + " = " + num(r.accepted) + "</b> <span class='hint'>(rank " +
                 r.acceptedRank + " of " + r.tried + ")</span></div>" +
                 (av && av.evidence && av.evidence.law ? "<div class='hint'>" + esc(av.evidence.law) + "</div>" : ""));
      out.push("<div class='hint' style='margin-top:4px'>" + r.scored.map((s) =>
                 num(s.candidate) + (s.pass === true ? " ok" : s.pass === false ? " x" : " -")).join(" &middot; ") +
               "</div>");
      out.push("</div>");
    }
    // *** THE PAGE SAYS WHAT IT DID NOT DO. *** The route cannot apply a value and the tier forbids it; a
    // reader who assumed the scene had been retuned would be wrong in the direction that matters.
    out.push("<div class='hint'>PROPOSED, NOT APPLIED -- tier 'propose' means a person or a gate sets the value. " +
             "The scene above is unchanged.</div>");
    rhRun.innerHTML = out.join("");
  } catch (e) {
    rhRun.innerHTML = "<b style='color:#ffcc66'>" + esc(e && e.message ? e.message : e) + "</b>";
  } finally { btn.disabled = false; paintRoundhouse(sel.value); }
};
sel.onchange = () => selectScene(sel.value);
document.getElementById("resetBtn").onclick = () => selectScene(sel.value);
const playBtn = document.getElementById("playBtn");
playBtn.onclick = () => { playing = !playing; playBtn.classList.toggle("on", !playing); playBtn.textContent = playing ? "Pause" : "Play"; };
const spinBtn = document.getElementById("spinBtn");
spinBtn.onclick = () => { spin = !spin; spinBtn.classList.toggle("on", spin); spinBtn.textContent = spin ? "Spin: on" : "Spin: off"; };
const skinBtn = document.getElementById("skinBtn");
skinBtn.onclick = () => { skinMode = !skinMode; skinBtn.classList.toggle("on", skinMode); skinBtn.textContent = skinMode ? "Skin: on" : "Skin: off"; };
document.getElementById("yaw").oninput = (e) => document.getElementById("yawv").textContent = e.target.value;
document.getElementById("pitch").oninput = (e) => document.getElementById("pitchv").textContent = e.target.value;

let frame = 0;
function loop() {
  if (playing) { for (let k = 0; k < 2; k++) sceneDef.step(scene, params); frame++; }
  if (spin) spinAngle = (spinAngle + 0.3) % 360;
  render();
  document.getElementById("status").textContent = `${sel.value}  |  frame ${frame}  |  ${sceneDef.status(scene)}`;
  requestAnimationFrame(loop);
}

// ---- save / load: the scene state lives in the URL, so a saved scene is a link (same encoding as the shelf) ----
function currentState() {
  return { scene: sel.value, params: { ...params }, yaw: +document.getElementById("yaw").value, pitch: +document.getElementById("pitch").value, skin: skinMode, spin };
}
function serializeState() { return encodeScene(currentState()); }
function restoreFromHash() {
  const st = decodeScene(location.hash); if (!st || !SCENES[st.scene]) return false;
  applyPreset(st); return true;
}
document.getElementById("linkBtn").onclick = () => {
  const url = location.origin + location.pathname + "#" + serializeState();
  history.replaceState(null, "", url);
  const btn = document.getElementById("linkBtn");
  const done = () => { btn.textContent = "\u2713 Link copied"; setTimeout(() => (btn.textContent = "\uD83D\uDD17 Copy scene link"), 1400); };
  if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, done); else done();
};

refreshPresets();
if (!restoreFromHash()) selectScene(Object.keys(SCENES)[0]);
loop();
</script>
