<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Bridge · Dashboard</title>
<style>
  :root{color-scheme:dark}
  html,body{margin:0;height:100%;background:#0a0c12;color:#dfe3ee;font:13px/1.5 system-ui,Segoe UI,sans-serif}
  .wrap{display:flex;height:100%}
  canvas#c{flex:1;display:block}
  aside{width:300px;border-left:1px solid #1d2433;padding:14px}
  h1{font-size:15px;margin:0 0 4px} .sub{color:#7c879c;margin:0 0 12px}
  .pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;background:#172033}
  .ok{color:#7ee0a6}.bad{color:#ff8a8a}
  .kv{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #141a27}
  .kv b{color:#cfd6e6}
  canvas#spark{width:100%;height:46px;margin-top:10px;background:#0e1422;border:1px solid #1d2433}
  .hint{color:#7c879c;margin-top:10px;font-size:12px}
</style></head>
<body>
<div class="wrap">
  <canvas id="c"></canvas>
  <aside>
    <h1>Engine Dashboard <button id="popBtn" style="float:right;font:inherit;background:#1b2742;color:#9fc4ff;border:1px solid #2c3f6b;border-radius:6px;padding:2px 8px;cursor:pointer">⧉ Pop out</button></h1>
    <p class="sub">Read-only minimap + telemetry, bidirectional: click an entity
      to push a highlight directive into the engine.</p>
    <div>Link: <span id="status" class="pill bad">offline</span></div>
    <div class="kv"><span>Tick</span><b id="tick">–</b></div>
    <div class="kv"><span>Entities</span><b id="ents">0</b></div>
    <div class="kv"><span>Alive</span><b id="alive">0</b></div>
    <div class="kv"><span>Tick rate</span><b id="rate">– /s</b></div>
    <canvas id="spark"></canvas>
    <div class="hint">Click a red dot to highlight it in the OpenGL view.</div>
  </aside>
</div>
<script src="./bridgeClient.js"></script>
<script>
(function(){
  const c=document.getElementById("c"), g=c.getContext("2d");
  const aside=document.querySelector("aside");
  const sp=aside.querySelector("#spark"), sg=sp.getContext("2d");
  const $=id=>aside.querySelector("#"+id);   // scoped to the panel, so lookups survive a pop-out into a PiP window
  let state=null, hist=[], lastTick=null, lastT=0, view=null;
  function resize(){c.width=c.clientWidth*devicePixelRatio;c.height=c.clientHeight*devicePixelRatio;
    sp.width=sp.clientWidth*devicePixelRatio;sp.height=sp.clientHeight*devicePixelRatio;}
  addEventListener("resize",resize); resize();

  const client=new BridgeClient();
  client.onStatus=(ok,via)=>{const s=$("status");s.textContent=ok?via:"offline";s.className="pill "+(ok?"ok":"bad");};
  client.onState=(st)=>{
    state=st; const ents=BridgeClient.entities(st);
    $("tick").textContent=st.tick!=null?st.tick:"–";
    $("ents").textContent=ents.length;
    $("alive").textContent=ents.filter(e=>e.alive).length;
    const now=performance.now();
    if(lastTick!=null && st.tick!=null && now>lastT){
      const r=(st.tick-lastTick)/((now-lastT)/1000);
      if(isFinite(r)&&r>=0){ $("rate").textContent=r.toFixed(1)+" /s";
        hist.push(r); if(hist.length>120)hist.shift(); }
    }
    lastTick=st.tick; lastT=now;
  };
  client.start();

  c.addEventListener("click",(ev)=>{
    if(!view) return;
    const mx=ev.offsetX*devicePixelRatio, my=ev.offsetY*devicePixelRatio;
    const ents=BridgeClient.entities(state); let best=null,bd=1e9;
    ents.forEach(e=>{const x=view.cx+e.x*view.s,y=view.cy+e.z*view.s;
      const d=(x-mx)*(x-mx)+(y-my)*(y-my); if(d<bd){bd=d;best=e;}});
    if(best && bd<(14*devicePixelRatio)**2){ client.send({cmd:"highlight",id:best.id}); }
  });

  function drawSpark(){
    const w=sp.width,h=sp.height; sg.clearRect(0,0,w,h);
    if(hist.length<2)return; const mx=Math.max.apply(null,hist)||1;
    sg.strokeStyle="#5bd0ff"; sg.beginPath();
    hist.forEach((v,i)=>{const x=i/(hist.length-1)*w, y=h-(v/mx)*(h-4)-2;
      i?sg.lineTo(x,y):sg.moveTo(x,y);}); sg.stroke();
  }
  function draw(){
    const w=c.width,h=c.height; g.fillStyle="#0a0c12"; g.fillRect(0,0,w,h);
    const ents=BridgeClient.entities(state);
    const cx=w/2,cy=h/2,s=Math.min(w,h)/(260*devicePixelRatio); view={cx,cy,s};
    g.strokeStyle="#16203a";
    for(let r=40;r<=120;r+=40){g.beginPath();g.arc(cx,cy,r*s,0,7);g.stroke();}
    ents.forEach(e=>{const x=cx+e.x*s,y=cy+e.z*s;
      g.fillStyle=e.alive?"#ff7a7a":"#46506a"; g.beginPath(); g.arc(x,y,4*devicePixelRatio,0,7); g.fill();});
    drawSpark(); requestAnimationFrame(draw);
  }
  draw();
})();
</script>
<script type="module">
import { popOut, pipSupported } from "../ui/pipWindow.js";
const aside = document.querySelector("aside");
const btn = document.getElementById("popBtn");
let handle = null;
btn.addEventListener("click", async () => {
  if (handle) { handle.close(); handle = null; return; }
  handle = await popOut(aside, {
    title: "Engine Dashboard", width: 320, height: 470,
    onClose: () => { handle = null; btn.textContent = "⧉ Pop out"; },
  });
  if (handle) btn.textContent = "⤢ Return"; else btn.textContent = "⧉ Pop out (blocked?)";
});
if (!pipSupported()) btn.title = "Document Picture-in-Picture unavailable here — opens a popup window instead";
</script>
</body></html>
