<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="demo:title" content="Splat Probes (an SH irradiance volume, a specular row, and a live-captured reflection, from inside a splat shell)">
<meta name="demo:desc" content="render/splatProbes.mjs baked over a two-tone shell of splats (render/probeFit.mjs fits the grid to occupancy and skips probes inside splats), drawn on gfx/device.js through render/probeLit.mjs: every probe a small sphere lit by its own coefficients, a mesh in the middle taking the volume's light, the splats as tone markers, the camera inside the shell. A row of four spheres shows the specular half (physics/render/specularProbeLit.mjs) at roughness 0..1, baked analytically from the same shell; one more sphere carries the SAME material fed a REAL captured environment instead (render/liveCubeCapture.mjs renders six faces of the actual scene through a real camera and packs the readback), so the analytic and live-captured techniques sit side by side rather than one replacing the other. Spacing and face size live, the bake time, probe count and box in the HUD, both backends. From the technique of isaac-mason/three-spark-light-probes, which has no licence file; nothing ported.">
<meta name="demo:category" content="fx">
<title>Splat Probes</title>
<style>
  html,body { margin:0; height:100%; background:#050805; color:#9fb2d4; font:12px ui-monospace,Menlo,monospace; }
  #c { display:block; width:100%; }
  #hud { padding:10px 14px; }
  #cap { color:#f6a623; letter-spacing:.14em; text-transform:uppercase; }
  #be { color:#59d1ff; font-size:14px; margin-top:4px; }
  #sub { color:#5f7aa0; font-size:11px; margin-top:2px; line-height:1.7; }
  .bad { color:#ff9a9a; }
  a { color:#59d1ff; }
  input[type=number] { width:48px; background:#0c140f; color:#9fb2d4; border:1px solid #2a3a30; font:inherit; }
  select { background:#0c140f; color:#9fb2d4; border:1px solid #2a3a30; font:inherit; }
</style>
</head>
<body>
<div id="hud">
  <div id="cap">Splat probes: an irradiance volume baked from a splat shell, seen from inside it</div>
  <div id="be">requesting a device&hellip;</div>
  <div id="sub">spacing <input id="spacing" type="number" value="0.5" min="0.25" max="1.5" step="0.05"> &middot; face size <select id="face"><option>4</option><option selected>8</option><option>16</option></select>
    &middot; splats <input id="n" type="number" value="300" min="20" max="2000" step="10"> &middot; <a href="?webgl=1">force WebGL2</a><br>
    <span id="tick">baking&hellip;</span> &middot; drag to look around</div>
</div>
<canvas id="c"></canvas>
<script type="module" src="/ui/originNotice.js"></script>
<script type="module">
import { requestDevice } from "./gfx/device.js";
import * as G from "./render/gpuDriven.mjs";
import { probeLab, labFleets, addLiveSpecSphere, labHud, LAB, SPEC_ROW } from "./render/probeLab.mjs";

const cvs = document.getElementById("c"), beEl = document.getElementById("be");
const fail = (m) => { beEl.innerHTML = '<span class="bad">' + m + "</span>"; };
// v4582 -- ONE MORE SPHERE, PAST THE ANALYTIC ROW, CARRYING A LIVE-CAPTURED ENVIRONMENT INSTEAD OF ONE SHARED
// SPLATRADIANCE BAKE: render/liveCubeCapture.mjs renders the shell's OWN six-face view from this sphere's own
// position through a real camera, so the reflection actually seen here is the shell as this point in space
// sees it, not the analytic stand-in the row's four spheres share.
// v4583 -- ROUGHNESS 2/3, NOT THE DEFAULT 0, SO THIS SPHERE VISIBLY SHOWS WHAT CHANGED: addLiveSpecSphere used
// to pack a single raw mip, so any roughness rendered the same mirror-sharp reflection -- render/probeLab.mjs's
// header and tools/ship/liveCubeCapture-selfcheck.mjs's section 4 now measure a real, roughness-dependent blur
// on this exact sphere. 2/3 is the row's own third step (roughnesses 0, 1/3, 2/3, 1 for SPEC_ROW.count=4), so
// this sphere sits directly comparable to the row's own third analytic sphere -- same nominal roughness, two
// sources, side by side -- rather than picking a value the row itself does not also show.
const LIVE_SPHERE_POS = [0, SPEC_ROW.y, 0.6], LIVE_SPHERE_RADIUS = 0.14, LIVE_SPHERE_ROUGHNESS = 2 / 3;
let device, scene = null, lab = null, yaw = 0.4, pitch = 0.15, dragging = null, dirty = true, rebuilding = false, liveNote = "";
const $ = (id) => document.getElementById(id);

function knobs() { return { spacing: Math.max(0.25, +$("spacing").value || LAB.spacing), faceSize: +$("face").value || LAB.faceSize, n: Math.max(20, +$("n").value || LAB.n) }; }
async function rebuild() {
  lab = probeLab(knobs());
  const old = scene;
  // labFleets' `eye` takes a FUNCTION of the draw ctx (specularBind's own convention) so the row's reflections
  // track the actual orbiting camera every frame -- a fixed value here would bake in whatever eye rebuild()
  // happened to run at, which is wrong the instant the camera moves.
  const { fleets } = labFleets(device, lab, { eye: (ctx) => ctx.eye });
  let allFleets = fleets, records = lab.records, extras = lab.extras, fleetOf = lab.fleetOf;
  // THIS TRY/CATCH IS NOT PARANOIA -- IT WAS MEASURED NECESSARY. Loading this page repeatedly in a headless
  // Chromium (no real compositor) and changing a knob a second time hit gfx/device.js's own documented WebGPU
  // quirk on that backend only ("A valid external Instance reference no longer exists" -- see that file's
  // Level-11 offscreen note): WebGL2 rebuilt three times running with no issue in the same test, WebGPU did not
  // on the second. A real browser has the compositor that note says makes the difference, but the fallback
  // costs nothing and keeps the page working (the analytic row alone) rather than betting on an environment
  // this page cannot know it is running in.
  try {
    const live = await addLiveSpecSphere(device, lab, LIVE_SPHERE_POS, { radius: LIVE_SPHERE_RADIUS, roughness: LIVE_SPHERE_ROUGHNESS });
    allFleets = [...fleets, live.fleet]; records = live.records; extras = live.extras; fleetOf = live.fleetOf;
    liveNote = "a live-captured sphere past the row";
  } catch (e) { console.warn("[splat-probes] live-captured sphere skipped: " + e.message); liveNote = "the live-captured sphere failed (" + e.message.slice(0, 80) + ") -- the analytic row still drew"; }
  if (old && old.destroy) old.destroy();
  scene = G.makeGpuDrivenScene(device, { fleets: allFleets, fleetOf, thresholds: [], records, headings: extras });
  $("tick").textContent = labHud(lab) + " -- " + liveNote;
  dirty = false;
}
async function init() {
  const forceGl = new URLSearchParams(location.search).get("webgl") === "1";
  try { device = await requestDevice(cvs, forceGl ? { backend: "webgl2" } : { prefer: "webgpu" }); }
  catch (e) { return fail("requestDevice threw: " + e.message); }
  if (!device || device.backend === "null") return fail("no GPU backend here (WebGPU needs a secure origin: localhost or https).");
  try { await rebuild(); } catch (e) { return fail("scene: " + e.message); }
  beEl.textContent = "backend: " + device.backend + " · " + scene.path + " · splats as tone markers, the probes and mesh through the probe-lit pipeline, a specular row (roughness 0..1) and one live-captured sphere";
  for (const id of ["spacing", "face", "n"]) $(id).addEventListener("change", () => { dirty = true; $("tick").textContent = "baking…"; });
  cvs.addEventListener("pointerdown", (e) => { dragging = [e.clientX, e.clientY]; });
  addEventListener("pointerup", () => { dragging = null; });
  addEventListener("pointermove", (e) => { if (!dragging) return; yaw += (e.clientX - dragging[0]) * 0.006; pitch = Math.max(-1.2, Math.min(1.2, pitch + (e.clientY - dragging[1]) * 0.006)); dragging = [e.clientX, e.clientY]; });
  requestAnimationFrame(frame);
}
function dpr() { return Math.min(2, devicePixelRatio || 1); }
function frame() {
  const d = dpr(), w = Math.round((cvs.clientWidth || 1200) * d), h = Math.round(w * 0.55);
  if (cvs.width !== w || cvs.height !== h) { cvs.width = w; cvs.height = h; }
  // rebuild() is async (the live capture awaits real GPU readbacks): triggered here without blocking the loop,
  // so the OLD scene keeps drawing until the new one is ready rather than the page freezing on every knob change.
  if (dirty && !rebuilding) { rebuilding = true; dirty = false; rebuild().catch((e) => fail("scene: " + e.message)).finally(() => { rebuilding = false; }); }
  if (!scene) { requestAnimationFrame(frame); return; }
  if (!dragging) yaw += 0.002;
  const R = LAB.eyeDist, eye = [Math.sin(yaw) * Math.cos(pitch) * R, Math.sin(pitch) * R, Math.cos(yaw) * Math.cos(pitch) * R];
  const cam = { viewProj: G.multiply(G.perspective(1.0, w / h, 0.05, 50), G.lookAt(eye, [0, 0, 0])), eye };
  scene.frame({ ...cam, clear: [0.02, 0.031, 0.024, 1] });
  requestAnimationFrame(frame);
}
init();
</script>
</body>
</html>
