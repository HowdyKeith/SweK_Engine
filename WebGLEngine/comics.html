<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#06080c">
<title>Comics</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #06080c; color: #cde; font: 15px system-ui, sans-serif; overflow: hidden; }
  #bar { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-bottom: 1px solid #1d2736; }
  #bar b { color: #9fd; letter-spacing: .5px; }
  #bar input { flex: 1; min-width: 60px; padding: 9px 10px; background: #0c0f14; color: #e8eef8; border: 1px solid #2a3340; border-radius: 8px; font: 13px ui-monospace, monospace; }
  #bar button { padding: 9px 14px; background: #2a4d3a; color: #cfe; border: 1px solid #4a7d5a; border-radius: 8px; font-size: 14px; }
  #msg { font-size: 12px; color: #8b97a8; padding: 0 12px; }
  /* gallery */
  #gallery { position: absolute; top: 54px; bottom: 0; left: 0; right: 0; overflow-y: auto; padding: 12px;
             display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; align-content: start; -webkit-overflow-scrolling: touch; }
  .card { cursor: pointer; display: flex; flex-direction: column; gap: 5px; border-radius: 8px; outline: none; }
  .card:focus { box-shadow: 0 0 0 3px #4fd1c5; }
  .cover { aspect-ratio: 2/3; background: #0c1018; border: 1px solid #1c2531; border-radius: 7px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .cover img { width: 100%; height: 100%; object-fit: cover; }
  .ctitle { font-size: 11.5px; color: #bcd; line-height: 1.3; max-height: 30px; overflow: hidden; }
  /* reader */
  #reader { position: absolute; inset: 0; background: #04050a; display: none; flex-direction: column; }
  #stage { flex: 1; overflow: auto; display: flex; align-items: flex-start; justify-content: center; -webkit-overflow-scrolling: touch; }
  #stage img { max-width: 100%; height: auto; display: block; }
  #tapL, #tapR { position: absolute; top: 0; bottom: 64px; width: 33%; z-index: 5; }
  #tapL { left: 0; } #tapR { right: 0; }
  #rctrl { flex: 0 0 auto; display: flex; gap: 8px; align-items: center; justify-content: center; padding: 10px; border-top: 1px solid #1d2736; background: #0a0d12; }
  #rctrl button { padding: 10px 16px; background: #1a2230; color: #cde; border: 1px solid #2a3340; border-radius: 8px; font-size: 15px; }
  #counter { font: 13px ui-monospace, monospace; color: #9bb; min-width: 78px; text-align: center; }
  #fit { padding: 9px 10px; background: #0c0f14; color: #cde; border: 1px solid #2a3340; border-radius: 8px; font-size: 13px; }
  /* v3173 -- the magnifier. pointer-events:none so it never eats the tap zones underneath. */
  #lens { position:absolute; display:none; width:180px; height:180px; border-radius:50%;
          border:2px solid rgba(255,255,255,.55); box-shadow:0 2px 12px rgba(0,0,0,.55);
          background-repeat:no-repeat; pointer-events:none; z-index:5;
          image-rendering:auto; }
  #stage { position:relative; }
  #lensBtn[disabled] { opacity:.45; cursor:not-allowed; }
</style>
</head>
<body>
  <div id="bar">
    <b>&#128214; COMICS</b>
    <input id="dir" placeholder="comics folder path" autocomplete="off">
    <button id="browse">&#128193; Browse</button>
    <button id="scan">Scan</button>
    <button id="modesBtn" title="Boot modes: Server / Avatar / Full / Comics" style="margin-left:auto;">&#128421; Modes</button>
  </div>
  <div id="msg"></div>
  <div id="gallery"></div>

  <div id="reader">
    <div id="stage"><img id="pageImg" alt=""><div id="lens" aria-hidden="true"></div></div>
    <div id="tapL"></div><div id="tapR"></div>
    <div id="rctrl">
      <button id="back">\u2190 Library</button>
      <button id="lensBtn" title="Magnifier -- reveals detail the fit-to-screen view is hiding. Disabled when the scan has no extra detail to show.">\ud83d\udd0d lens</button>
      <button id="prev">\u2039</button>
      <span id="counter"></span>
      <button id="next">\u203A</button>
      <select id="fit"><option value="width">Fit width</option><option value="height">Fit height</option><option value="full">Actual</option></select>
      <select id="vq" title="Render quality for PDF pages (higher = sharper when zoomed, larger)"><option value="150">View: Normal</option><option value="220">View: Sharp</option><option value="300">View: Max</option></select>
      <label style="display:flex;align-items:center;gap:4px;font:11px ui-monospace,monospace;color:#9bb;">crop<input id="crop" type="range" min="0" max="20" value="0" style="width:64px;"></label>
      <label style="display:flex;align-items:center;gap:3px;font:11px ui-monospace,monospace;color:#9bb;cursor:pointer;" title="Trim the white scan border (server-side, smart)"><input id="autocrop" type="checkbox">&#9986; trim</label>
      <label style="display:flex;align-items:center;gap:3px;font:11px ui-monospace,monospace;color:#9bb;cursor:pointer;" title="Shrink pages for phone/tablet (WebP, ~1MB, no visible quality loss)"><input id="phoneopt" type="checkbox">&#128241; phone</label>
      <button id="scrollDn" title="Scroll down (advances at the bottom)">&#9660;</button>
      <button id="voiceBtn" title="Voice: down / up / next / previous / top / bottom / close">&#127908;</button>
      <button id="pagefx" title="Voxel FX: burn / ripple / melt / shatter this page">&#10022; FX</button>
      <button id="shatterturn" title="Shatter into the next page">&#128165;&#8594;</button>
      <button id="physreel" title="Record a physics comparison: SweK CPU vs box3d vs Jolt">&#9878; Physics reel</button>
      <select id="expFmt" style="display:none;" title="Export format / quality"><option value="png">Export: PNG 100%</option><option value="jpg">Export: JPG</option><option value="webp">Export: WebP</option><option value="embedded">Export: original embedded</option></select>
      <input id="expQ" type="number" min="1" max="100" value="100" style="display:none;width:52px;" title="JPG/WebP quality (1-100)">
      <button id="exportImgs" style="display:none;" title="Export each page as an image named <pdf>_pNNN">&#128247; Export</button>
      <button id="deleteBook" title="Delete this file (asks first)">&#128465; Delete</button>
      <button id="narrate" style="display:none;" title="Read this page aloud (text layer)">&#128266; Narrate</button>
    </div>
  </div>

<script src="/serverPathPicker.js"></script>
<script>
const api = (op) => fetch("/comics/" + op).then(r => r.json()).catch(e => ({ ok: false, error: e.message }));
const $ = (id) => document.getElementById(id);
// v1285 — comics is a boot mode of its own now (its own window via START_COMICS.bat
// or the Server/Avatar/Full/Comics switch). Mark it + offer a way back to the family.
try { localStorage.setItem("voxelengine.bootMode", "comics"); } catch (e) {}
(function(){ var b = document.getElementById("modesBtn"); if (b) b.onclick = function(){ location.href = "/avatar-server.html"; };   var pr=document.getElementById("physreel"); if(pr) pr.addEventListener("click", function(){ var im=document.getElementById("pageImg"); if(im && im.getAttribute("src") && window.swekPhysicsMontage) window.swekPhysicsMontage(im, { record:true }); });
})();
let optCrop = false, optPhone = false, optMax = 1600, optKB = 900, viewDpi = 0;
const pageUrl = (id, i) => {
  let u = "/comics/page?id=" + encodeURIComponent(id) + "&i=" + i;
  if (optCrop) u += "&crop=1";
  if (optPhone) u += "&opt=1&max=" + optMax + "&kb=" + optKB;
  if (curIsPdf && viewDpi) u += "&dpi=" + viewDpi;
  return u;
};
let cur = null, idx = 0, total = 0, comics = [], focusIdx = 0, curIsPdf = false;

function applyFit() {
  const m = $("fit").value, im = $("pageImg"), st = $("stage");
  im.style.maxWidth = m === "width" ? "100%" : "none";
  im.style.maxHeight = m === "height" ? (st.clientHeight - 4) + "px" : "none";
  im.style.width = m === "full" ? "auto" : (m === "width" ? "100%" : "auto");
  // crop borders: clip an inset off each edge, then scale the kept area back up
  // to fill — trims scan margins without distorting. Transform doesn't change
  // layout, so stage scrolling stays correct.
  const c = (parseFloat($("crop").value) || 0) / 100;
  if (c > 0) { const S = 1 / (1 - 2 * c); im.style.clipPath = "inset(" + (c * 100).toFixed(2) + "%)"; im.style.transform = "scale(" + S.toFixed(4) + ")"; im.style.transformOrigin = "center center"; }
  else { im.style.clipPath = ""; im.style.transform = ""; }
  st.style.overflowX = "hidden"; st.style.overflowY = "auto";
}
// Scroll the page; return true if it actually moved (false = already at edge).
function scrollPage(dy) { const st = $("stage"); const max = st.scrollHeight - st.clientHeight; const before = st.scrollTop; st.scrollTop = Math.max(0, Math.min(max, st.scrollTop + dy)); return st.scrollTop !== before; }
// Down/up: scroll a chunk; when the page can't scroll further, flip the page.
function nudge(dir) { const st = $("stage"); const moved = scrollPage(Math.round(st.clientHeight * 0.85) * (dir > 0 ? 1 : -1)); if (!moved) step(dir); }

const RDR_LS = "voxelengine.comicsReader";
try { const s = JSON.parse(localStorage.getItem(RDR_LS) || "{}"); if (s.fit) $("fit").value = s.fit; if (s.crop != null) $("crop").value = s.crop; } catch (e) {}
function saveReaderCfg() { try { localStorage.setItem(RDR_LS, JSON.stringify({ fit: $("fit").value, crop: $("crop").value })); } catch (e) {} }
function showPage() {
  if (cur == null) return;
  $("counter").textContent = (idx + 1) + " / " + total;
  const im = $("pageImg"); const u = pageUrl(cur, idx);
  im.style.display = "";
  im.onerror = async () => {
    // The image tag can't show the server's JSON error, so fetch it and
    // surface the real reason (unsupported compression, corrupt archive…)
    // instead of a silent broken-image icon.
    im.style.display = "none";
    let why = "couldn't load this page";
    try { const r = await fetch(u); if (!r.ok) { const j = await r.json().catch(() => null); if (j && j.error) why = j.error; } } catch (e) {}
    $("msg").innerHTML = '<span style="color:#e08a6e;">\u26a0 page ' + (idx + 1) + ': ' + String(why).replace(/[<>&]/g, "") + '</span>';
  };
  im.onload = () => { im.style.display = ""; $("msg").textContent = ""; };
  im.src = u;
  applyFit(); $("stage").scrollTop = 0;
}
// ---- v3173 -- THE MAGNIFIER, AND THE ONE THING IT REFUSES TO DO --------------------------------------------
//
// A CBZ scan is typically 1500-3000px wide and the reader shows it FIT TO SCREEN, so there are usually two or
// three times as many pixels in the decoded image as reach the glass. A lens reveals them: same URL as a
// background, scaled up, positioned to track the cursor. No library -- shuding/image-magnifier is an
// ANNOTATION tool that bakes a lens into a still, which is a different job wearing the same noun.
//
// *** AND IT REFUSES TO MAGNIFY WHAT IT CANNOT. *** A magnifier only reveals detail IF THE DETAIL EXISTS. When
// naturalWidth is no larger than the displayed width -- a small scan, or a page already shown at 1:1 -- there
// is nothing behind the glass and zooming produces BLUR THAT LOOKS LIKE A BROKEN FEATURE. So the button
// DISABLES ITSELF and says why, per page, because the answer changes with every page and every window resize.
//
// That is v3120's law in a reader: UNSUPPORTED and FAILED must stay apart. "This scan has no more detail" and
// "the lens is broken" look identical through a blurry circle.
const LENS_MIN_GAIN = 1.25;        // below this the lens shows interpolation, not information
let lensOn = false;

function lensGain() {
  const im = $("pageImg");
  if (!im || !im.naturalWidth || !im.clientWidth) return 0;
  return im.naturalWidth / im.clientWidth;
}

/** Per page and per resize: is there anything to magnify? The button carries the answer. */
function refreshLens() {
  const b = $("lensBtn"), g = lensGain();
  if (!b) return;
  const usable = g >= LENS_MIN_GAIN;
  b.disabled = !usable;
  // THE REASON TRAVELS WITH THE CONTROL. A disabled button with no explanation is a control that has become
  // scenery -- v3112's lesson, where a checkbox that could not read its state showed a plausible one anyway.
  b.title = usable
    ? ("Magnifier -- this scan holds " + g.toFixed(1) + "x the detail on screen")
    : (g ? ("No magnifier: this page is shown at " + g.toFixed(2) + "x, so there is no hidden detail to reveal")
         : "No magnifier: no page loaded");
  if (!usable && lensOn) setLens(false);
}

function setLens(on) {
  lensOn = !!on;
  const l = $("lens"), b = $("lensBtn");
  if (l) l.style.display = lensOn ? "block" : "none";
  if (b) b.style.background = lensOn ? "#1e4a5a" : "";
}

(function lensWiring() {
  const st = $("stage"), l = $("lens"), b = $("lensBtn"), im = $("pageImg");
  if (!st || !l || !b || !im) return;
  b.addEventListener("click", () => setLens(!lensOn));
  st.addEventListener("mousemove", (e) => {
    if (!lensOn) return;
    const r = im.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    // OUTSIDE THE PAGE IS NOT A POSITION. Clamping would park the lens on an edge and keep showing a magnified
    // corner as though the cursor were still on it.
    if (x < 0 || y < 0 || x > r.width || y > r.height) { l.style.display = "none"; return; }
    l.style.display = "block";
    const size = l.offsetWidth || 180, gain = Math.max(2, Math.min(4, lensGain()));
    l.style.left = (x - size / 2) + "px";
    l.style.top = (y - size / 2) + "px";
    l.style.backgroundImage = "url(" + JSON.stringify(im.currentSrc || im.src).slice(1, -1) + ")";
    l.style.backgroundSize = (r.width * gain) + "px " + (r.height * gain) + "px";
    l.style.backgroundPosition = (-(x * gain - size / 2)) + "px " + (-(y * gain - size / 2)) + "px";
  });
  st.addEventListener("mouseleave", () => { l.style.display = "none"; });
  im.addEventListener("load", refreshLens);
  window.addEventListener("resize", refreshLens);
  refreshLens();
})();

function step(d) { idx = Math.max(0, Math.min(total - 1, idx + d)); stopNarrate(); showPage(); }

// ---- narration (browser SpeechSynthesis — works standalone on PC/phone/TV) ----
let narrating = false;
function stopNarrate() { try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {} narrating = false; const b = $("narrate"); if (b) b.textContent = "\uD83D\uDD0A Narrate"; }
async function toggleNarrate() {
  if (narrating) { stopNarrate(); return; }
  if (cur == null) return;
  if (!window.speechSynthesis) { $("msg").textContent = "this browser has no speech synthesis"; return; }
  const b = $("narrate"); b.textContent = "\u2026 fetching text";
  let r; try { r = await api("page-text?id=" + encodeURIComponent(cur) + "&i=" + idx); } catch (e) { r = { ok: false, error: e.message }; }
  if (!r.ok || !r.text) { $("msg").textContent = "\u2717 " + (r.error || "no text on this page") + (r.need ? " (pip install " + r.need + ")" : ""); b.textContent = "\uD83D\uDD0A Narrate"; return; }
  const u = new SpeechSynthesisUtterance(r.text);
  u.onend = () => { narrating = false; b.textContent = "\uD83D\uDD0A Narrate"; };
  u.onerror = () => { narrating = false; b.textContent = "\uD83D\uDD0A Narrate"; };
  narrating = true; b.textContent = "\u23F9 Stop";
  try { window.speechSynthesis.cancel(); window.speechSynthesis.speak(u); } catch (e) { stopNarrate(); }
}

async function needPyMuPDF(prefix) {
  const m = $("msg"); m.innerHTML = "";
  // First ask the Auto-Install system: if the user turned auto-install on (globally
  // or for PyMuPDF), it kicks off the install itself and we just poll + reopen.
  let e = null; try { e = await fetch("/autoinstall/ensure", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: "pymupdf" }) }).then(x => x.json()); } catch (er) {}
  if (e && e.installed) { return; }
  if (e && e.installing) {
    m.textContent = "\u2026 auto-installing PyMuPDF (~30s) \u2014 reopen the PDF when it finishes";
    const t = setInterval(async () => { try { const l = await fetch("/autoinstall/list").then(x => x.json()); const it = l && l.items && l.items.find(x => x.id === "pymupdf"); if (it && it.installed) { clearInterval(t); m.textContent = "\u2713 PyMuPDF installed \u2014 reopen the PDF"; } else if (it && it.lastErr) { clearInterval(t); m.textContent = "\u2717 install failed: " + it.lastErr; } } catch (er) {} }, 1800);
    return;
  }
  // Not auto: offer the manual button (which routes through the registry so the
  // installed state shows in the Auto-Install panel too).
  const span = document.createElement("span"); span.textContent = (prefix || "PDF support needs PyMuPDF.") + " ";
  const btn = document.createElement("button"); btn.textContent = "Install PyMuPDF"; btn.style.cssText = "padding:4px 10px;background:#16361f;color:#bfffd9;border:1px solid #1aa257;border-radius:6px;cursor:pointer;font-size:12px;";
  btn.onclick = async () => {
    btn.disabled = true; btn.textContent = "installing\u2026 (~30s)";
    try { await fetch("/autoinstall/run", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: "pymupdf" }) }); } catch (er) {}
    const t = setInterval(async () => { try { const l = await fetch("/autoinstall/list").then(x => x.json()); const it = l && l.items && l.items.find(x => x.id === "pymupdf"); if (it && it.installed) { clearInterval(t); m.textContent = "\u2713 PyMuPDF installed \u2014 reopen the PDF"; } else if (it && it.lastErr) { clearInterval(t); m.textContent = "\u2717 install failed: " + it.lastErr; } } catch (er) {} }, 1800);
  };
  m.append(span, btn);
}
async function open(id, name) {
  const p = await api("pages?id=" + encodeURIComponent(id));
  if (!p.ok) { if (p.need === "PyMuPDF") needPyMuPDF(); else $("msg").textContent = "\u2717 " + (p.error || "can't read this one"); return; }
  cur = id; total = p.count; idx = 0; curIsPdf = (p.kind === "pdf");
  $("exportImgs").style.display = curIsPdf ? "" : "none";
  $("expFmt").style.display = curIsPdf ? "" : "none";
  $("expQ").style.display = (curIsPdf && $("expFmt").value !== "png" && $("expFmt").value !== "embedded") ? "" : "none";
  $("narrate").style.display = curIsPdf ? "" : "none";
  stopNarrate();
  $("reader").style.display = "flex"; showPage();
}
$("narrate").onclick = toggleNarrate;
function closeReader() { stopNarrate(); stopVoice(); $("reader").style.display = "none"; cur = null; const c = document.querySelectorAll(".card")[focusIdx]; if (c) c.focus(); }

async function loadGallery() {
  const j = await api("list");
  const g = $("gallery"); g.innerHTML = "";
  if (!j.ok) { $("msg").textContent = j.error || "set a comics folder above"; return; }
  $("msg").textContent = j.count + " comic" + (j.count === 1 ? "" : "s") + " \u00b7 " + j.dir;
  comics = j.comics || [];
  comics.forEach((c, i) => {
    const card = document.createElement("div"); card.className = "card"; card.tabIndex = 0;
    const cov = document.createElement("div"); cov.className = "cover";
    const im = document.createElement("img"); im.loading = "lazy"; im.src = pageUrl(c.id, 0);
    im.onerror = () => { cov.innerHTML = '<span style="font-size:10px;color:#566;padding:6px;text-align:center;">' + c.ext.toUpperCase() + '</span>'; };
    cov.appendChild(im);
    if (c.ext === "pdf") { const badge = document.createElement("div"); badge.textContent = "PDF"; badge.style.cssText = "position:absolute;top:5px;right:5px;background:#b5402e;color:#fff;font:bold 9px ui-monospace,monospace;padding:2px 5px;border-radius:4px;letter-spacing:.5px;"; cov.style.position = "relative"; cov.appendChild(badge); }
    const t = document.createElement("div"); t.className = "ctitle"; t.textContent = c.name;
    card.append(cov, t);
    const go = () => { focusIdx = i; open(c.id, c.name); };
    card.onclick = go;
    card.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    g.appendChild(card);
  });
}

// controls
$("scan").onclick = async () => { await fetch("/comics/config", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ dir: $("dir").value.trim() }) }); loadGallery(); };
$("exportImgs").onclick = async () => {
  if (!cur) return; const b = $("exportImgs"); const lbl = b.textContent; b.disabled = true; b.textContent = "\u2026 exporting";
  try {
    const fmt = $("expFmt").value;
    const body = { id: cur };
    if (fmt === "embedded") { body.mode = "embedded"; }
    else { body.mode = "pages"; body.format = fmt; body.quality = parseInt($("expQ").value, 10) || 100; body.dpi = parseInt(viewDpi || 200, 10); }
    const r = await fetch("/comics/export-images", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).then(x => x.json());
    if (r.ok) $("msg").textContent = "\u2713 exported " + r.count + " image" + (r.count === 1 ? "" : "s") + " (" + (r.fmt || r.mode) + (r.dpi ? ", " + r.dpi + "dpi" : "") + ") \u2192 " + r.dir + (r.note ? " \u2014 " + r.note : "");
    else if (r.need === "PyMuPDF") needPyMuPDF("Image export needs PyMuPDF.");
    else $("msg").textContent = "\u2717 " + (r.error || "export failed");
  } catch (e) { $("msg").textContent = "\u2717 " + e.message; }
  b.disabled = false; b.textContent = lbl;
};
$("expFmt").onchange = () => { $("expQ").style.display = (curIsPdf && $("expFmt").value !== "png" && $("expFmt").value !== "embedded") ? "" : "none"; };
$("vq").onchange = () => { viewDpi = parseInt($("vq").value, 10) || 0; if (cur != null) showPage(); };
$("deleteBook").onclick = async () => {
  if (!cur) return;
  const nm = (comics.find(c => c.id === cur) || {}).name || "this file";
  if (!confirm("Delete \"" + nm + "\"?\n\nThis permanently removes the file from disk \u2014 it cannot be undone.")) return;
  const b = $("deleteBook"); b.disabled = true;
  try {
    const r = await fetch("/comics/delete", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: cur }) }).then(x => x.json());
    if (r.ok) { closeReader(); $("msg").textContent = "\u2713 deleted " + r.deleted; loadGallery(); }
    else $("msg").textContent = "\u2717 " + (r.error || "delete failed");
  } catch (e) { $("msg").textContent = "\u2717 " + e.message; }
  b.disabled = false;
};
$("browse").onclick = async () => { const p = await window.pickServerPath({ mode: "folder", title: "Pick the comics folder", start: $("dir").value.trim() }); if (p) { $("dir").value = p; $("scan").click(); } };
$("dir").addEventListener("keydown", e => { if (e.key === "Enter") $("scan").click(); });
$("back").onclick = closeReader; $("prev").onclick = () => step(-1); $("next").onclick = () => step(1);
$("fit").onchange = () => { applyFit(); saveReaderCfg(); };
$("crop").oninput = () => { applyFit(); saveReaderCfg(); };
$("autocrop").onchange = () => { optCrop = $("autocrop").checked; if (cur != null) showPage(); };
$("phoneopt").onchange = async () => {
  if ($("phoneopt").checked) {
    // phone-optimize needs Pillow — install (or prompt) before turning it on
    let e = null; try { e = await fetch("/autoinstall/ensure", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: "pillow" }) }).then(r => r.json()); } catch (er) {}
    if (e && e.installing) { $("msg").textContent = "\u2026 installing Pillow (image tools) \u2014 phone-optimize turns on when it finishes"; const t = setInterval(async () => { try { const l = await fetch("/autoinstall/list").then(r => r.json()); const it = l && l.items && l.items.find(x => x.id === "pillow"); if (it && it.installed) { clearInterval(t); $("msg").textContent = ""; optPhone = true; if (cur != null) showPage(); } else if (it && it.lastErr) { clearInterval(t); $("phoneopt").checked = false; $("msg").textContent = "\u2717 Pillow install failed: " + it.lastErr; } } catch (er) {} }, 1800); return; }
    if (e && e.need) { $("phoneopt").checked = false; $("msg").innerHTML = "phone-optimize needs <b>Pillow</b> \u2014 turn on Auto-Install (or install Pillow) in the engine settings first"; return; }
  }
  optPhone = $("phoneopt").checked; if (cur != null) showPage();
};
$("scrollDn").onclick = () => nudge(1);
$("tapL").onclick = () => step(-1); $("tapR").onclick = () => step(1);

// voice control: down/up/next/previous/top/bottom/close (Web Speech API)
let recog = null, voiceOn = false;
function stopVoice() { voiceOn = false; try { if (recog) recog.stop(); } catch (e) {} const b = $("voiceBtn"); if (b) b.textContent = "\uD83C\uDFA4"; }
function toggleVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { $("msg").textContent = "this browser has no speech recognition"; return; }
  if (voiceOn) { stopVoice(); return; }
  recog = new SR(); recog.continuous = true; recog.interimResults = false; recog.lang = "en-US";
  recog.onresult = (ev) => {
    const t = ev.results[ev.results.length - 1][0].transcript.toLowerCase();
    if (/\b(down|more|scroll down)\b/.test(t)) nudge(1);
    else if (/\b(up|scroll up)\b/.test(t)) nudge(-1);
    else if (/\bnext\b/.test(t)) step(1);
    else if (/\b(previous|prev|back)\b/.test(t)) step(-1);
    else if (/\btop\b/.test(t)) $("stage").scrollTop = 0;
    else if (/\bbottom\b/.test(t)) $("stage").scrollTop = $("stage").scrollHeight;
    else if (/\b(close|library|exit)\b/.test(t)) closeReader();
  };
  recog.onend = () => { if (voiceOn) { try { recog.start(); } catch (e) {} } };
  try { recog.start(); voiceOn = true; $("voiceBtn").textContent = "\uD83C\uDFA4\u2022"; } catch (e) { $("msg").textContent = "voice failed: " + e.message; }
}
$("voiceBtn").onclick = toggleVoice;

// keyboard + Android-TV D-pad
window.addEventListener("keydown", e => {
  if ($("reader").style.display === "flex") {
    if (e.key === "ArrowRight") { step(1); e.preventDefault(); }
    else if (e.key === "ArrowLeft") { step(-1); e.preventDefault(); }
    else if (e.key === "ArrowDown" || e.key === " " || e.key === "PageDown") { nudge(1); e.preventDefault(); }
    else if (e.key === "ArrowUp" || e.key === "PageUp") { nudge(-1); e.preventDefault(); }
    else if (e.key === "Escape" || e.key === "Backspace" || e.key === "GoBack") { closeReader(); e.preventDefault(); }
    return;
  }
  // gallery focus nav (D-pad)
  const cards = document.querySelectorAll(".card"); if (!cards.length) return;
  const cols = Math.max(1, Math.floor($("gallery").clientWidth / 122));
  let f = [...cards].indexOf(document.activeElement); if (f < 0) f = 0;
  if (e.key === "ArrowRight") f = Math.min(cards.length - 1, f + 1);
  else if (e.key === "ArrowLeft") f = Math.max(0, f - 1);
  else if (e.key === "ArrowDown") f = Math.min(cards.length - 1, f + cols);
  else if (e.key === "ArrowUp") f = Math.max(0, f - cols);
  else return;
  cards[f].focus(); e.preventDefault();
});

// touch swipe in reader
let sx = 0;
$("stage").addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive: true });
$("stage").addEventListener("touchend", e => { const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 60) step(dx < 0 ? 1 : -1); }, { passive: true });

(async () => {
  const c = await api("config"); $("dir").value = c.dir || "";
  // library defaults (set in engine settings): default fit + auto-crop + phone-optimize
  if (c.defaultFit && ["width", "height", "full"].includes(c.defaultFit)) $("fit").value = c.defaultFit;
  if (c.maxDim) optMax = c.maxDim; if (c.targetKB) optKB = c.targetKB;
  if (c.autoCrop) { optCrop = true; $("autocrop").checked = true; }
  if (c.phoneOptimize) { optPhone = true; $("phoneopt").checked = true; }
  loadGallery();
})();
</script>
