<!doctype html>
<!-- sea-host.html -- UNNUMBERED (the version is chosen at ship time).
     THE PATCHED VENDORED SEA, HOSTED. upstream's index page for the modular sources has this markup; this is the same (the element ids the sea looks for: c, hud, fps, panel, err)
     around world/ocean/seaMain.mjs -- upstream's main.js with the recorded patches of tools/ship/seaPatch.mjs -- and it publishes the sea's handle as window.seaApi so a SAME-ORIGIN parent can
     retune it (seaApi.setParams), move its camera (seaApi.camera), and read heights at up to 64 world points (seaApi.setPoints / seaApi.heights). It takes the same query parameters as the bundle.
     NOT SEEN HERE: any of it drawing (the sandbox has no WebGPU adapter). With no WebGPU the sea prints its own error into #err and seaApi.ready stays false. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="demo:title" content="Sea host">
<meta name="demo:desc" content="The patched vendored web-ocean sea, hosted for a parent page: live tuning, an external camera and a 64-point GPU height probe through window.seaApi. Needs WebGPU.">
<meta name="demo:category" content="graphics">
<title>SweK &middot; Sea host</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; left: 12px; top: 10px; font: 12px/1.45 ui-monospace, Consolas, monospace; color: #e8e2d6; text-shadow: 0 1px 2px #000a; pointer-events: none; user-select: none; }
  #hud .help { opacity: .7; }
  #panel { position: fixed; right: 12px; top: 10px; width: 300px; padding: 10px 12px; border-radius: 8px; background: #0b0f14c8; color: #e5e1d8; font: 12px/1.3 system-ui, sans-serif; }
  #panel.hidden { display: none; }
  #panel label { display: grid; grid-template-columns: 1fr 110px 40px; gap: 6px; align-items: center; margin: 3px 0; }
  #panel input { width: 110px; accent-color: #e2a04e; }
  #panel output { text-align: right; font-variant-numeric: tabular-nums; opacity: .8; }
  #err { position: fixed; inset: 0; display: none; padding: 40px; color: #f88; font: 16px system-ui; white-space: pre-wrap; background: #000; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="fps">starting&hellip;</div>
  <div class="help">patched web-ocean (MIT, Maksymilian Dendura) &middot; window.seaApi &middot; H panel</div>
</div>
<div id="panel" class="hidden"></div>
<div id="err"></div>
<script type="module">
  import { seaApi } from "/world/ocean/seaMain.mjs";
  window.seaApi = seaApi;
</script>
</body>
</html>
