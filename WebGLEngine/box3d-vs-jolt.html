<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="demo:title" content="box3d vs Jolt (visual)">
<meta name="demo:desc" content="The same physics scene stepped on box3d and Jolt side by side, with a live pixel-diff between the two renders. The visual companion to the trajectory divergence harness -- render-QA screenshots this on a rig to pixel-diff the backends. Jolt always runs; box3d needs its WASM built.">
<meta name="demo:category" content="physics">
<title>box3d vs Jolt</title>
<style>
  :root { --bg:#04060d; --amber:#f6a623; --cyan:#59d1ff; --green:#5fe08a; --red:#ff5d6c; --dim:#7c93b8; }
  body { margin:0; background:var(--bg); color:#dbe7ff; font:13px ui-monospace, Menlo, monospace; }
  #hud { padding:14px 16px; }
  h1 { font-size:15px; letter-spacing:.13em; text-transform:uppercase; color:var(--amber); margin:0 0 6px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:6px; }
  button { background:#0c1526; color:var(--cyan); border:1px solid #1c2942; border-radius:8px; padding:6px 12px; font:600 11px ui-monospace, monospace; letter-spacing:.05em; text-transform:uppercase; cursor:pointer; }
  button:hover { border-color:var(--cyan); }
  .stat { color:var(--dim); font-size:12px; } .stat b { color:#dbe7ff; }
  .panes { display:flex; gap:14px; flex-wrap:wrap; padding:0 16px; }
  .pane h2 { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); margin:0 0 6px; }
  canvas { border:1px solid #14203a; border-radius:8px; background:#04060d; display:block; }
  /* v2873 -- the action fills the page. This canvas is a DRAWING, so it scales with aspect held and WITHOUT pixelated, which on a curve is just jagged. */
  canvas { width: 100%; max-width: 900px; height: auto; display: block; }
  .miss { color:var(--red); }
</style>
</head>
<body>
<div id="hud">
  <h1>&#9670; box3d vs Jolt &middot; visual divergence</h1>
  <div class="row"><button onclick="restart()">Restart</button><span class="stat" id="diff"></span></div>
  <div class="stat">same scene, both backends, stepped together &middot; the pixel-diff panel is what render-QA compares on a rig.</div>
</div>
<div class="panes">
  <div class="pane"><h2 id="t1">box3d</h2><canvas id="cA" width="300" height="230"></canvas></div>
  <div class="pane"><h2 id="t2">Jolt</h2><canvas id="cB" width="300" height="230"></canvas></div>
  <div class="pane"><h2>pixel diff</h2><canvas id="cD" width="300" height="230"></canvas></div>
</div>
<script type="module">
import { createJoltBackend } from "./physics/jolt/joltLoader.js";

const W = 300, H = 230, PPM = 20;
const cA = document.getElementById("cA").getContext("2d"), cB = document.getElementById("cB").getContext("2d"), cD = document.getElementById("cD").getContext("2d");

// identical scene on any backend (ground + seeded pile), returns dynamic body indices
function buildScene(world, seedOffset = 0) {
  world.addBox({ type: "static", pos: [0, -0.5, 0], half: [30, 0.5, 30] });
  let s = 12345 + seedOffset; const r = () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
  const idx = [];
  for (let i = 0; i < 12; i++) { const b = world.addBox({ type: "dynamic", pos: [(i % 4) * 1.05 - 1.6, 2 + Math.floor(i / 4) * 1.1, 0], half: [0.5, 0.5, 0.5] }); world.setVelocity(b, [(r() - 0.5) * 2, 0, 0]); if (world.angularImpulse) world.angularImpulse(b, [0, 0, (r() - 0.5) * 3]); idx.push(b); }
  return idx;
}
function render(ctx, world, idx, col) {
  ctx.fillStyle = "#04060d"; ctx.fillRect(0, 0, W, H); ctx.strokeStyle = "#1c2942"; ctx.beginPath(); ctx.moveTo(0, H - 20); ctx.lineTo(W, H - 20); ctx.stroke();
  if (!world) return; const xf = world.readTransforms();
  for (const bi of idx) { const px = xf[bi * 7], py = xf[bi * 7 + 1], qz = xf[bi * 7 + 5], qw = xf[bi * 7 + 6]; const ang = Math.atan2(2 * qz * qw, 1 - 2 * qz * qz);
    ctx.save(); ctx.translate(W / 2 + px * PPM, H - 20 - py * PPM); ctx.rotate(-ang); ctx.fillStyle = col; ctx.fillRect(-0.5 * PPM, -0.5 * PPM, PPM, PPM); ctx.strokeStyle = "rgba(0,0,0,0.4)"; ctx.strokeRect(-0.5 * PPM, -0.5 * PPM, PPM, PPM); ctx.restore(); }
}
function diff() {
  const a = cA.getImageData(0, 0, W, H), b = cB.getImageData(0, 0, W, H), d = cD.createImageData(W, H); let n = 0;
  for (let i = 0; i < a.data.length; i += 4) { const dd = Math.max(Math.abs(a.data[i] - b.data[i]), Math.abs(a.data[i + 1] - b.data[i + 1]), Math.abs(a.data[i + 2] - b.data[i + 2]));
    if (dd > 24) { d.data[i] = 255; d.data[i + 1] = 60; d.data[i + 2] = 90; n++; } else { d.data[i] = d.data[i + 1] = d.data[i + 2] = 12; } d.data[i + 3] = 255; }
  cD.putImageData(d, 0, 0); return n / (W * H);
}

let backend = null, box3d = null, wA = null, wB = null, idxA = [], idxB = [];
async function init() {
  try { backend = await createJoltBackend(); } catch (e) {}
  try { const mod = await import("./physics/box3d/box3dLoader.js"); const t = mod.box3d.createWorld({ gravity: [0, -9.8, 0] }); t.destroy && t.destroy(); box3d = mod.box3d; } catch { box3d = null; }
  if (!box3d) { document.getElementById("t1").innerHTML = 'box3d <span class="miss">(build its WASM to compare)</span>'; }
  restart();
}
function restart() {
  if (wA && wA.destroy) wA.destroy(); if (wB && wB.destroy) wB.destroy();
  wA = box3d ? box3d.createWorld({ gravity: [0, -9.8, 0] }) : null; idxA = wA ? buildScene(wA) : [];
  wB = backend ? backend.createWorld({ gravity: [0, -9.8, 0] }) : null; idxB = wB ? buildScene(wB) : [];
}
function tick() {
  if (wA) wA.step(1 / 60, 2); if (wB) wB.step(1 / 60, 2);
  render(cA, wA, idxA, "#8a94a6"); render(cB, wB, idxB, "#59d1ff");
  const pct = (wA && wB) ? diff() : 0;
  document.getElementById("diff").innerHTML = (wA && wB) ? ("pixel diff <b>" + (pct * 100).toFixed(1) + "%</b> &middot; different solvers drift apart over time") : (wB ? "Jolt running; box3d WASM absent -> no cross-diff here (run on a rig)" : "no backend");
  requestAnimationFrame(tick);
}
init(); tick();
</script>
</body>
</html>
