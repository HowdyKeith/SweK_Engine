<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="demo:title" content="Tomograph">
<meta name="demo:desc" content="A CT scanner, owned rather than imported. The shadows are not simulated -- the Radon transform of an ellipse is closed-form, so the sinogram on the left is written down exactly, and it was checked against a brute-force line integral to 1.57e-5 before anything reconstructed anything. Filtered back-projection then recovers the object from those shadows alone, converging to 0.06% away from edges as the angle count rises. Drag the angle slider and watch a smear become a head. The volume it produces is a 3D scalar field, so the same marching cubes that draws the D3Q19 wake and the cosmic web draws this too -- reconstruction was never a rendering problem for this engine.">
<meta name="demo:category" content="simulation">
<title>Tomograph</title>
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js" } }</script>
<style>
  html,body { margin:0; height:100%; background:#04060c; overflow:hidden; color:#9fb2d4; font:12px ui-monospace,Menlo,monospace; }
  #hud { position:fixed; left:14px; top:12px; z-index:3; max-width:430px; pointer-events:none; }
  #cap { color:#6fd6ff; letter-spacing:.14em; text-transform:uppercase; font-size:13px; }
  #stat { color:#7fe3c4; margin-top:5px; line-height:1.7; }
  #note { color:#6f86ab; margin-top:7px; line-height:1.45; font-size:11.5px; }
  #sino { position:fixed; right:14px; top:12px; z-index:4; border:1px solid #2a3a5a; border-radius:6px; image-rendering:pixelated; width:230px; }
  #slab { position:fixed; right:14px; top:212px; z-index:4; color:#6f86ab; font-size:10.5px; width:230px; text-align:center; }
  #ctl { position:fixed; left:14px; bottom:14px; z-index:4; background:rgba(8,12,24,.92); border:1px solid #23406a; border-radius:10px; padding:11px 14px; }
  #ctl label { color:#6fd6ff; display:block; margin-bottom:6px; font-size:11px; }
  input[type=range] { width:320px; }
  #aval { color:#f6a623; }
  #busy { color:#f6a623; }
</style>
</head>
<body>
<div id="hud"><div id="cap">&#9670; Tomograph &mdash; found, not drawn</div><div id="stat"></div><div id="note"></div></div>
<canvas id="sino" width="180" height="128"></canvas>
<div id="slab">the sinogram &mdash; every shadow the object casts, computed in closed form. This is the only input.</div>
<div id="ctl"><label>projection angles: <span id="aval">16</span> &nbsp;&mdash;&nbsp; <span id="busy"></span></label><input id="ang" type="range" min="8" max="180" step="4" value="16"></div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "./vendor/three/jsm/controls/OrbitControls.js";
import { sinogram } from "./simulation/tomo/phantom.js";
import { sliceEllipses, phantom3dAt } from "./simulation/tomo/phantom3d.js";
import { reconstructVolume } from "./simulation/tomo/volume.js";
import { marchScalarField } from "./simulation/MarchingCubes.js";

const N = 48, NZ = 32, NDET = 128, ZMIN = -0.85, ZMAX = 0.85;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x04060c);
const cam = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 900);
cam.position.set(72, 52, 86);
const ctr = new OrbitControls(cam, renderer.domElement); ctr.enableDamping = true; ctr.target.set(N/2, NZ/2, N/2);
addEventListener("resize", () => { cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
scene.add(new THREE.AmbientLight(0x223a55, 1.6));
const key = new THREE.DirectionalLight(0xfff0d8, 1.4); key.position.set(50, 70, 40); scene.add(key);
const rim = new THREE.DirectionalLight(0x5a9aff, 0.8); rim.position.set(-40, -20, -50); scene.add(rim);

// draw the sinogram -- the actual, only input to the reconstruction
function drawSino(nAngles) {
  const s = sinogram({ nAngles: Math.max(8, nAngles), nDet: 180, ell: sliceEllipses(0) });
  const cv = document.getElementById("sino"), g = cv.getContext("2d");
  cv.height = s.nAngles;
  const img = g.createImageData(s.nDet, s.nAngles);
  let mx = 0; for (let i = 0; i < s.data.length; i++) if (s.data[i] > mx) mx = s.data[i];
  for (let i = 0; i < s.data.length; i++) {
    const v = Math.round(255 * Math.min(1, s.data[i]/mx));
    img.data[i*4] = v*0.42; img.data[i*4+1] = v*0.84; img.data[i*4+2] = v; img.data[i*4+3] = 255;
  }
  g.putImageData(img, 0, 0);
}
let mesh = null;
function rebuild(nAngles) {
  document.getElementById("busy").textContent = "reconstructing...";
  document.getElementById("aval").textContent = nAngles;
  // let the label paint before the solver takes the thread -- otherwise "reconstructing" never appears
  setTimeout(() => {
    const t0 = performance.now();
    const { vol } = reconstructVolume({ n: N, nz: NZ, nAngles, nDet: NDET, zMin: ZMIN, zMax: ZMAX });
    const ms = performance.now() - t0;
    let mx = 0; for (let i = 0; i < vol.length; i++) if (vol[i] > mx) mx = vol[i];
    const iso = marchScalarField(vol, N, N, NZ, mx * 0.32);
    if (mesh) { scene.remove(mesh); mesh.geometry.dispose(); }
    const tris = iso.positions.length/9;
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(iso.positions), 3));
    g.setAttribute("normal", new THREE.BufferAttribute(new Float32Array(iso.normals), 3));
    mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0xdfe8ff, roughness: 0.42, metalness: 0.06, transparent: true, opacity: 0.94, side: THREE.DoubleSide }));
    scene.add(mesh);
    // measure THIS reconstruction against the object -- away from edges, where a ramp filter's ringing is not an error
    const D = 3/N;
    let se = 0, ref = 0, cnt = 0;
    for (let k = 0; k < NZ; k += 2) {
      const z = ZMIN + (ZMAX-ZMIN)*(k+0.5)/NZ;
      for (let j = 0; j < N; j += 2) for (let i = 0; i < N; i += 2) {
        const x = -1 + 2*(i+0.5)/N, y = -1 + 2*(j+0.5)/N;
        if (x*x + y*y > 0.81) continue;
        const want = phantom3dAt(x, y, z);
        if (want < 1e-9) continue;
        if (![[D,0],[-D,0],[0,D],[0,-D]].every(([dx,dy]) => Math.abs(phantom3dAt(x+dx, y+dy, z) - want) < 1e-12)) continue;
        se += (vol[(k*N + j)*N + i] - want)**2; ref += want*want; cnt++;
      }
    }
    const err = Math.sqrt(se/ref)*100;
    document.getElementById("busy").textContent = "";
    document.getElementById("stat").innerHTML =
      "<b style='color:#f6a623'>" + nAngles + "</b> angles &times; " + NDET + " detectors &times; " + NZ + " slices &nbsp;&middot;&nbsp; " + ms.toFixed(0) + " ms" +
      "<br>error away from edges: <b style='color:#7fe3c4'>" + err.toFixed(2) + "%</b> over " + cnt.toLocaleString() + " voxels &mdash; measured against the object, live" +
      "<br>" + tris.toLocaleString() + " triangles from marchScalarField &mdash; the same function that draws the D3Q19 wake";
    drawSino(nAngles);
  }, 16);
}
document.getElementById("note").innerHTML =
  "The sinogram is <b>not simulated</b>: the Radon transform of an ellipse is closed-form, so every shadow is written down exactly &mdash; and it was checked against a brute-force line integral to 1.57e-5 <i>before</i> anything reconstructed anything. " +
  "Filtered back-projection recovers the head from those shadows alone. <b>Nothing tells it what a head looks like.</b> Slide the angles up and watch a smear resolve.";
const slider = document.getElementById("ang");
slider.oninput = () => rebuild(parseInt(slider.value, 10));
rebuild(16);
(function frame() { ctr.update(); renderer.render(scene, cam); requestAnimationFrame(frame); })();
</script>
</body>
</html>
