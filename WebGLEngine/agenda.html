<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🗓 Agenda — SweK Engine</title>
<style>
  :root { --bg:#0a0d12; --card:#0e131b; --edge:#23303f; --txt:#e8eef8; --dim:#8b97a8; --accent:#9bd6ff; --good:#9fe88f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif; }
  #bar { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--edge); position:sticky; top:0; background:linear-gradient(180deg,#0c1119,#0a0d12); z-index:5; }
  #bar h1 { font-size:18px; margin:0; } #bar h1 small { color:var(--dim); font-weight:400; font-size:12px; }
  #status { font-size:12px; color:var(--dim); }
  .btn { padding:5px 12px; background:#16202c; color:var(--accent); border:1px solid var(--edge); border-radius:6px; cursor:pointer; font-size:12px; }
  a.engine { color:var(--accent); text-decoration:none; font-size:12px; }
  .wrap { padding:14px 16px; max-width:920px; margin:0 auto; display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media (max-width:680px){ .wrap { grid-template-columns:1fr; } }
  h2 { font-size:12px; color:var(--accent); text-transform:uppercase; letter-spacing:1.5px; margin:0 0 8px; border-bottom:1px solid var(--edge); padding-bottom:5px; }
  .day { margin:10px 0 4px; font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; }
  .ev { display:flex; gap:8px; align-items:baseline; padding:5px 8px; border-radius:6px; background:#0c121a; border:1px solid var(--edge); margin-bottom:5px; }
  .ev .t { font-size:11px; color:var(--dim); min-width:62px; }
  .ev .m { flex:1; } .ev .src { width:7px; height:7px; border-radius:50%; flex:0 0 auto; align-self:center; }
  .legend { display:flex; flex-wrap:wrap; gap:10px; font-size:11px; color:var(--dim); margin-bottom:8px; }
  .legend span { display:inline-flex; align-items:center; gap:5px; }
  .legend i { width:8px; height:8px; border-radius:50%; display:inline-block; }
  .task { display:flex; gap:8px; align-items:center; padding:5px 8px; border-radius:6px; background:#0c121a; border:1px solid var(--edge); margin-bottom:5px; font-size:13px; }
  .task.done { opacity:.5; text-decoration:line-through; }
  .tasklist h3 { font-size:13px; margin:14px 0 6px; color:var(--txt); } .tasklist h3 small { color:var(--dim); font-weight:400; }
  .muted { color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<div id="bar">
  <h1>🗓 Agenda <small>SweK Engine</small></h1>
  <span id="status">…</span>
  <span style="flex:1"></span>
  <button class="btn" id="refresh">Refresh</button>
  <a class="engine" href="/">‹ engine</a>
</div>
<div class="wrap">
  <div>
    <h2>Next 7 days</h2>
    <div class="legend" id="legend"></div>
    <div id="events"><div class="muted">loading…</div></div>
  </div>
  <div>
    <h2>Tasks &amp; lists</h2>
    <div class="tasklist" id="tasks"><div class="muted">loading…</div></div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const COLORS = ["#9bd6ff","#9fe88f","#ffd884","#ff9fb0","#c5a3ff","#7fe0d4"];

function fmtDay(d) { return d.toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric" }); }
function fmtTime(s, allDay) { if (allDay) return "all day"; const d = new Date(s); return isNaN(d) ? "" : d.toLocaleTimeString(undefined, { hour:"numeric", minute:"2-digit" }); }

async function load() {
  $("status").textContent = "loading…"; $("status").style.color = "var(--dim)";
  let states;
  try {
    const r = await fetch("/ha/states", { cache:"no-store" });
    if (!r.ok) { $("status").textContent = r.status === 401 ? "HA 401 — fix token" : ("HA " + r.status); $("status").style.color = "#ffd884"; return; }
    states = await r.json();
    if (!Array.isArray(states)) states = Array.isArray(states?.states) ? states.states : [];  // /ha/states may 404 or return an error object when HA is not connected
  } catch (e) { $("status").textContent = "(bridge offline)"; $("status").style.color = "#ffd884"; return; }
  $("status").textContent = "✓ connected"; $("status").style.color = "var(--good)";

  const cals = states.filter(s => s.entity_id.startsWith("calendar.")).map(s => s.entity_id).sort();
  const todos = states.filter(s => s.entity_id.startsWith("todo.")).map(s => ({ id:s.entity_id, count:s.state, name:(s.attributes&&s.attributes.friendly_name)||s.entity_id })).sort((a,b)=>a.id.localeCompare(b.id));
  const nameOf = id => { const e = states.find(s => s.entity_id === id); return (e && e.attributes && e.attributes.friendly_name) || id.split(".")[1]; };

  // legend
  $("legend").innerHTML = cals.map((c,i) => `<span><i style="background:${COLORS[i%COLORS.length]}"></i>${nameOf(c)}</span>`).join("");

  // events
  const all = [];
  await Promise.all(cals.map(async (c, i) => {
    try {
      const j = await (await fetch("/ha/calendar?entity=" + encodeURIComponent(c) + "&days=7", { cache:"no-store" })).json();
      if (j.ok) for (const ev of j.events) {
        const startObj = ev.start || {}; const s = startObj.dateTime || startObj.date || ev.start;
        const allDay = !!(startObj.date && !startObj.dateTime);
        all.push({ s, allDay, summary: ev.summary || ev.message || "(busy)", color: COLORS[i%COLORS.length], cal: nameOf(c) });
      }
    } catch (e) {}
  }));
  all.sort((a,b) => new Date(a.s) - new Date(b.s));
  if (!all.length) { $("events").innerHTML = '<div class="muted">No events in the next 7 days.</div>'; }
  else {
    let html = "", curDay = "";
    for (const ev of all) {
      const d = new Date(ev.s); const dk = isNaN(d) ? "" : d.toDateString();
      if (dk !== curDay) { curDay = dk; html += `<div class="day">${isNaN(d) ? "" : fmtDay(d)}</div>`; }
      html += `<div class="ev"><span class="src" style="background:${ev.color}"></span><span class="t">${fmtTime(ev.s, ev.allDay)}</span><span class="m">${esc(ev.summary)}</span></div>`;
    }
    $("events").innerHTML = html;
  }

  // tasks
  let thtml = "";
  for (const t of todos) {
    let items = null;
    try { const j = await (await fetch("/ha/todo?entity=" + encodeURIComponent(t.id), { cache:"no-store" })).json(); if (j.ok) items = j.items; } catch (e) {}
    thtml += `<h3>${esc(t.name)} <small>${items ? items.length : t.count} item${(items?items.length:t.count)==1?"":"s"}</small></h3>`;
    if (items && items.length) {
      const open = items.filter(i => i.status !== "completed");
      const done = items.filter(i => i.status === "completed");
      thtml += open.map(i => `<div class="task">☐ ${esc(i.summary || i.name || "")}</div>`).join("");
      thtml += done.slice(0,5).map(i => `<div class="task done">☑ ${esc(i.summary || i.name || "")}</div>`).join("");
      if (!items.length) thtml += '<div class="muted">empty</div>';
    } else if (items && !items.length) {
      thtml += '<div class="muted">empty</div>';
    } else {
      thtml += `<div class="muted">${t.count} item${t.count==1?"":"s"} (open the list in HA to view)</div>`;
    }
  }
  $("tasks").innerHTML = thtml || '<div class="muted">No to-do lists found.</div>';
}
function esc(s){ return String(s==null?"":s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

$("refresh").onclick = load;
load();
setInterval(load, 5*60*1000);
</script>
<!-- v1759 page gauges + avatar dock (non-render pages) -->
<script type="module">try{const{mountPageGauges}=await import("/ui/pageGauges.js");mountPageGauges();}catch(e){}</script>
</body>
</html>
