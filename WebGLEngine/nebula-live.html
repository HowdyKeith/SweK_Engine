<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="demo:title" content="Living Nebula">
<meta name="demo:desc" content="The nebula gas swirls for real -- a handful of vortex particles (vortons) induce a divergence-free velocity field that rotates the wisps around drifting cores, the Gourlay/VorteGrid technique. Verified CPU vorton physics; this is the ES-jump backdrop, alive.">
<meta name="demo:category" content="fx">
<title>Living Nebula</title>
<style>
  :root { --amber:#f6a623; --cyan:#59d1ff; }
  html,body { margin:0; height:100%; background:#02030a; overflow:hidden; color:#dbe7ff; font:13px ui-monospace,Menlo,monospace; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #cap { position:fixed; left:14px; top:12px; color:var(--amber); letter-spacing:.15em; text-transform:uppercase; z-index:3; }
  #st { position:fixed; right:14px; top:12px; color:#7c93b8; font-size:11px; z-index:3; }
  #bar { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); z-index:3; display:flex; gap:10px; }
  button { background:rgba(8,14,26,.7); color:var(--cyan); border:1px solid #1c2942; border-radius:8px; padding:8px 15px; font:600 12px ui-monospace,monospace; letter-spacing:.06em; text-transform:uppercase; cursor:pointer; }
  button:hover { border-color:var(--cyan); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cap">&#9670; Living Nebula</div>
<div id="st"></div>
<div id="bar"><button id="stir">Stir the gas</button><button id="cores">Show cores</button></div>
<script type="module">
import { nebulaColorAt } from "./fx/nebula/nebula.js";
import { makeVortons, step2D, renderNebulaSwirlCPU } from "./fx/vorton/vortonNebula.js";

const cv = document.getElementById("c"), ctx = cv.getContext("2d"), st = document.getElementById("st");
let W = 0, H = 0, SC = 4;   // render downsampled on CPU, upscale (verified CPU path runs everywhere)
function resize() { W = innerWidth; H = innerHeight; cv.width = W; cv.height = H; }
addEventListener("resize", resize); resize();

let vortons = makeVortons(7), cam = { x: 0, y: 0 }, t = 0, showCores = false;
document.getElementById("stir").addEventListener("click", () => { for (const v of vortons) v.s *= -1.15; });
document.getElementById("cores").addEventListener("click", () => { showCores = !showCores; });

const rw = 260;   // internal render width; height matches aspect
function frame() {
  t += 0.016; step2D(vortons, 0.016, 0.35);
  const rh = Math.max(120, Math.floor(rw * H / W));
  const buf = renderNebulaSwirlCPU(rw, rh, cam, t, vortons, 0.35, 46, nebulaColorAt, 2);
  const img = new ImageData(buf, rw, rh), tmp = new OffscreenCanvas(rw, rh); tmp.getContext("2d").putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = true; ctx.drawImage(tmp, 0, 0, W, H);
  if (showCores) { for (const v of vortons) { const sx = (v.x / 1.6 * 0.5 + 0.5) * W, sy = (v.y / 1.1 * 0.5 + 0.5) * H; ctx.strokeStyle = v.s > 0 ? "rgba(89,209,255,.7)" : "rgba(246,166,35,.7)"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(sx, sy, 14, 0, 6.283); ctx.stroke(); ctx.beginPath(); ctx.arc(sx, sy, 3, 0, 6.283); ctx.stroke(); } }
  st.textContent = vortons.length + " vortons \u00b7 divergence-free swirl \u00b7 verified CPU field";
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
