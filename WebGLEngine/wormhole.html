<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SweK &middot; Ellis Wormhole (WebGPU)</title>
<style>
  html,body { margin:0; height:100%; background:#02030a; color:#dfe7f2; font:12px ui-monospace,Menlo,monospace; overflow:hidden; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #hud { position:fixed; left:12px; top:10px; z-index:5; display:flex; gap:14px; align-items:center; flex-wrap:wrap; background:rgba(6,10,22,.66); border:1px solid #1a2440; border-radius:10px; padding:8px 13px; backdrop-filter:blur(6px); }
  b.t { color:#9d8bff; } #mode { padding:2px 8px; border-radius:5px; border:1px solid #3a2a6a; background:#160f26; color:#c9b8ff; }
  #mode.fallback { border-color:#5a4520; background:#1a1400; color:#e8c45a; }
  label { color:#9fb0c8; } input[type=range] { vertical-align:middle; }
  button { font:11px ui-monospace,monospace; padding:3px 10px; border-radius:5px; cursor:pointer; background:#171f36; color:#c3b8ff; border:1px solid #34406c; }
  a { color:#8fd1ff; text-decoration:none; }
  #fallback { position:fixed; inset:0; display:none; align-items:center; justify-content:center; text-align:center; }
  #fallback .card { max-width:520px; background:rgba(8,10,26,.92); border:1px solid #1a2440; border-radius:12px; padding:22px 26px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <b class="t">&#127756; Ellis Wormhole</b>
  <span id="mode" class="fallback">detecting&hellip;</span>
  <label>throat <input id="k" type="range" min="0.4" max="3.5" step="0.1" value="1.4"></label>
  <label>distance <input id="dist" type="range" min="4" max="14" step="0.5" value="7"></label>
  <button id="spin">&#8635; orbit: on</button>
  <a href="/gallery.html">&#129526; gallery</a>
</div>
<div id="fallback"><div class="card">
  <h2 style="color:#e8c45a;margin:0 0 8px">WebGPU isn't available here</h2>
  <p id="fbwhy" style="color:#8a94a8"></p>
  <p>This is a curved-spacetime ray tracer &mdash; it needs WebGPU (Chrome/Edge, or Safari&nbsp;18+).</p>
  <p><a href="/gallery.html">&#8594; Back to the demo gallery</a></p>
</div></div>

<script type="module">
const canvas = document.getElementById("c");
function fallback(why) { document.getElementById("hud").style.display = "none"; canvas.style.display = "none"; document.getElementById("fbwhy").textContent = why || ""; document.getElementById("fallback").style.display = "flex"; }

const WGSL = `
struct U { a: vec4f, b: vec4f };   // a = (resX, resY, time, camDist);  b = (throatK, yaw, pitch, _)
@group(0) @binding(0) var<uniform> u: U;

@vertex fn vs(@builtin(vertex_index) vid: u32) -> @builtin(position) vec4f {
  var p = array<vec2f,3>(vec2f(-1.,-1.), vec2f(3.,-1.), vec2f(-1.,3.));
  return vec4f(p[vid], 0., 1.);
}

fn h1(n: f32) -> f32 { return fract(sin(n) * 43758.5453); }
fn n3(p: vec3f) -> f32 { return fract(sin(dot(p, vec3f(12.9898, 78.233, 37.719))) * 43758.5453); }

// procedural sky sampled along a 3D direction; warm=1 tints the "far" universe differently.
fn sky(dir: vec3f, warm: f32) -> vec3f {
  let neb = 0.5 + 0.5 * sin(dir.x * 3.1 + dir.z * 2.3 + dir.y * 1.7);
  let neb2 = 0.5 + 0.5 * sin(dir.z * 5.0 - dir.x * 4.0);
  let coolN = (vec3f(0.03, 0.05, 0.12) * neb + vec3f(0.02, 0.03, 0.07) * neb2);
  let warmN = (vec3f(0.12, 0.05, 0.03) * neb + vec3f(0.09, 0.04, 0.02) * neb2);
  var c = mix(coolN, warmN, warm);
  for (var o = 0; o < 3; o = o + 1) {
    let sc = 55.0 * pow(2.0, f32(o));
    let g = dir * sc; let id = floor(g); let fp = fract(g);
    let hh = n3(id + f32(o) * 17.0);
    if (hh > 0.985) {
      let d = length(fp - vec3f(0.5));
      let star = smoothstep(0.55, 0.0, d) * (hh - 0.985) / 0.015;
      let tint = mix(vec3f(0.7, 0.82, 1.0), vec3f(1.0, 0.86, 0.62), clamp(warm * 0.7 + n3(id + 3.0) * 0.4, 0.0, 1.0));
      c = c + tint * star * 1.3;
    }
  }
  return c;
}

// Ellis wormhole (a=0) reduced geodesic: y = (l, phi, dl, dphi)
fn deriv(y: vec4f, k2: f32) -> vec4f {
  let l = y.x; let dl = y.z; let dp = y.w; let b2 = k2 + l * l;
  return vec4f(dl, dp, l * dp * dp, -2.0 * l / b2 * dl * dp);
}

@fragment fn fs(@builtin(position) frag: vec4f) -> @location(0) vec4f {
  let dist = u.a.w; let yaw = u.b.y; let pitch = u.b.z; let K = u.b.x; let k2 = K * K;
  let ro = dist * vec3f(cos(pitch) * sin(yaw), sin(pitch), cos(pitch) * cos(yaw));
  let er = normalize(ro);            // center -> camera
  let f = -er;                       // camera -> center
  var r = normalize(cross(vec3f(0., 1., 0.), f)); let up = cross(f, r);
  let uv = (frag.xy - 0.5 * u.a.xy) / u.a.y;
  let rd = normalize(f + 1.15 * (uv.x * r - uv.y * up));

  let ci = dot(rd, f);               // cos angle toward center
  let tang = rd - ci * f; let stl = length(tang);
  let s = select(r, tang / max(stl, 1e-6), stl > 1e-4);   // tangential unit in the ray's plane
  let l0 = -dist; let b0 = sqrt(k2 + l0 * l0);
  var y = vec4f(l0, 0.0, ci, stl / b0);

  let hstep = 0.085; var minL = 1e9;
  for (var i = 0; i < 300; i = i + 1) {
    let a = deriv(y, k2); let b = deriv(y + 0.5 * hstep * a, k2); let c2 = deriv(y + 0.5 * hstep * b, k2); let d = deriv(y + hstep * c2, k2);
    y = y + hstep / 6.0 * (a + 2.0 * b + 2.0 * c2 + d);
    minL = min(minL, abs(y.x));
    if (abs(y.x) > 14.0) { break; }
  }
  let phi = y.y; let cph = cos(phi); let sph = sin(phi);
  let fr = cph * f + sph * s; let sr = -sph * f + cph * s;      // frame rotated by the swept angle
  let bEnd = sqrt(k2 + y.x * y.x);
  let dir = normalize(y.z * fr + (bEnd * y.w) * sr);
  let warm = select(0.0, 1.0, y.x > 0.0);                       // exited to the far universe?
  var col = sky(dir, warm);

  // faint blue rim where rays graze the throat (Einstein-ring feel)
  let ring = smoothstep(K * 1.9, K * 0.9, minL) * smoothstep(K * 0.2, K * 0.95, minL);
  col = col + vec3f(0.25, 0.45, 0.9) * ring * 0.5;

  col = col / (col + vec3f(1.0));                               // tonemap
  col = pow(col, vec3f(0.85));
  return vec4f(col, 1.0);
}
`;

let device, ctx, format, uBuf, pipe, bind;
async function initGPU() {
  if (!navigator.gpu) {
    // v4452 -- SAY WHICH OF THE TWO IT IS. "no WebGPU" reads as "this browser cannot do it", and on a LAN
    // address that is false: navigator.gpu is only exposed in a SECURE CONTEXT, and http://192.168.x.x is
    // not one while http://localhost is. Keith reopened these pages on localhost for weeks without the
    // page ever saying that was the fix. ui/webgpuProbe.mjs has known the difference since v3981; this
    // page simply never asked it.
    try {
      const m = await import("./ui/webgpuProbe.mjs");
      const p = m.describeWebGPU({ navigator, isSecureContext: window.isSecureContext, location });
      if (p.reason === "insecure-origin") { m.showOriginBanner(p); fallback(p.message); return false; }
    } catch (e) {}
    fallback("navigator.gpu is undefined (no WebGPU in this browser).");
    return false;
  }
  let adapter; try { adapter = await navigator.gpu.requestAdapter({ powerPreference: "high-performance" }); } catch (e) { fallback("requestAdapter threw: " + e.message); return false; }
  if (!adapter) { fallback("no GPU adapter."); return false; }
  try { device = await adapter.requestDevice(); } catch (e) { fallback("requestDevice threw: " + e.message); return false; }
  device.lost.then((i) => { if (i && i.reason !== "destroyed") fallback("GPU device lost: " + i.message); });
  ctx = canvas.getContext("webgpu"); if (!ctx) { fallback("getContext('webgpu') null."); return false; }
  format = navigator.gpu.getPreferredCanvasFormat();
  ctx.configure({ device, format, alphaMode: "opaque" });
  const mod = device.createShaderModule({ code: WGSL });
  if (mod.getCompilationInfo) { const ci = await mod.getCompilationInfo(); for (const m of ci.messages) if (m.type === "error") { fallback("WGSL error: " + m.message + " (line " + m.lineNum + ")"); return false; } }
  uBuf = device.createBuffer({ size: 32, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  try {
    pipe = device.createRenderPipeline({ layout: "auto", vertex: { module: mod, entryPoint: "vs" }, fragment: { module: mod, entryPoint: "fs", targets: [{ format }] }, primitive: { topology: "triangle-list" } });
  } catch (e) { fallback("pipeline failed: " + e.message); return false; }
  bind = device.createBindGroup({ layout: pipe.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: uBuf } }] });
  return true;
}

let spin = true, yaw = 0.5, pitch = 0.12, t0 = performance.now();
function frame() {
  requestAnimationFrame(frame);
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.floor(innerWidth * dpr), h = Math.floor(innerHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  const t = (performance.now() - t0) / 1000;
  if (spin) yaw = 0.5 + t * 0.12;
  const K = +document.getElementById("k").value, dist = +document.getElementById("dist").value;
  device.queue.writeBuffer(uBuf, 0, new Float32Array([canvas.width, canvas.height, t, dist, K, yaw, pitch, 0]));
  const enc = device.createCommandEncoder();
  const pass = enc.beginRenderPass({ colorAttachments: [{ view: ctx.getCurrentTexture().createView(), clearValue: { r: 0, g: 0, b: 0, a: 1 }, loadOp: "clear", storeOp: "store" }] });
  pass.setPipeline(pipe); pass.setBindGroup(0, bind); pass.draw(3); pass.end();
  device.queue.submit([enc.finish()]);
}

// drag to look around (disables auto-orbit)
let drag = false, px = 0, py = 0;
canvas.addEventListener("pointerdown", (e) => { drag = true; px = e.clientX; py = e.clientY; spin = false; document.getElementById("spin").textContent = "\u21bb orbit: off"; });
addEventListener("pointerup", () => { drag = false; });
addEventListener("pointermove", (e) => { if (!drag) return; yaw -= (e.clientX - px) * 0.006; pitch = Math.max(-1.3, Math.min(1.3, pitch + (e.clientY - py) * 0.006)); px = e.clientX; py = e.clientY; });
document.getElementById("spin").onclick = (e) => { spin = !spin; e.target.textContent = "\u21bb orbit: " + (spin ? "on" : "off"); if (spin) t0 = performance.now() - (yaw - 0.5) / 0.12 * 1000; };

(async () => {
  const ok = await initGPU(); if (!ok) return;
  document.getElementById("mode").textContent = "WebGPU \u00b7 curved-ray tracer"; document.getElementById("mode").className = "";
  frame();
})();
</script>
</body>
</html>
