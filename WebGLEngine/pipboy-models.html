<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SweK Pip-Boy Models</title>
<style>
  :root{ --bg:#04140a; --panel:#08210f; --line:#1c5a30; --accent:#33ff88; --amber:#ffcf6b; --txt:#cdeed9; --dim:#5f9e73; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:radial-gradient(120% 120% at 50% -10%,#0a2614,#02100a); color:var(--txt); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
  #view{ position:fixed; inset:0; }
  canvas{ display:block; }
  .panel{ position:fixed; top:14px; left:14px; width:300px; background:rgba(4,20,10,.82); border:1px solid var(--line); border-radius:12px; padding:14px; backdrop-filter:blur(6px); box-shadow:0 10px 30px rgba(0,0,0,.5); max-height:calc(100vh - 28px); max-height:calc(100dvh - 28px); overflow-y:auto; overscroll-behavior:contain; }
  h1{ margin:0 0 2px; font-size:17px; letter-spacing:1px; color:var(--accent); }
  .sub{ color:var(--dim); font-size:11.5px; margin-bottom:10px; }
  label{ display:block; color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:1px; margin:10px 0 4px; }
  select,input[type=range]{ width:100%; }
  select{ background:#06180d; color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:8px; font-family:inherit; font-size:13px; }
  .row{ display:flex; gap:8px; margin-top:10px; }
  button{ flex:1; font-family:inherit; font-weight:700; cursor:pointer; border-radius:8px; border:1px solid var(--line); background:#0c2a16; color:var(--txt); padding:8px; font-size:12px; transition:.12s; }
  button:hover{ border-color:var(--accent); color:#eafff2; }
  .meta{ margin-top:12px; padding-top:10px; border-top:1px solid var(--line); font-size:11.5px; line-height:1.5; }
  .meta a{ color:var(--accent); text-decoration:none; word-break:break-all; }
  .meta a:hover{ text-decoration:underline; }
  .warn{ color:var(--amber); }
  #status{ position:fixed; bottom:14px; left:50%; transform:translateX(-50%); background:rgba(4,20,10,.9); border:1px solid var(--line); border-radius:10px; padding:10px 18px; font-size:13px; max-width:560px; text-align:center; }
  #loadbar{ position:fixed; left:0; right:0; bottom:0; height:3px; background:rgba(4,20,10,.6); z-index:40; display:none; }

  #status.err{ border-color:#a4760f; color:var(--amber); }
  code{ background:#06180d; border:1px solid var(--line); border-radius:4px; padding:1px 5px; color:#eafff2; }
  a.back{ position:fixed; top:16px; right:18px; color:var(--dim); font-size:12px; text-decoration:none; }
  a.back:hover{ color:var(--accent); }
  #copyout{ width:100%; margin-top:8px; background:#06180d; color:var(--accent); border:1px solid var(--line); border-radius:8px; padding:6px; font:11px ui-monospace,monospace; display:none; height:60px; resize:none; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js" } }

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "./vendor/three/jsm/loaders/GLTFLoader.js";
import { enableMeshopt } from "/vendor/three/jsm/libs/meshoptGltf.js";
import { OrbitControls } from "./vendor/three/jsm/controls/OrbitControls.js";
import { createPipboyWireframe } from "./ui/pipboyWireframe.js";
import { buildWireframeHead } from "/face/wireframeHead.js";
import { asciify } from "/tools/render-qa/asciify.mjs";

// v3240 -- SCREEN 1 SHOWS THE REAL RIG, VIA RENDER-TO-TEXTURE.
//
// *** THIS IS THE HOST'S JOB BECAUSE THE HOST OWNS THE RENDERER. *** ui/pipboyWireframe.js is handed THREE and
// nothing else -- it composes objects and paints canvases, and asking it to render would mean handing it a
// renderer it has no other use for. It takes a texture instead: setScreen1Texture(tex).
//
// THE HEAD IS THE ONE FROM face/wireframeHead.js, WHICH IS THE POINT. thead.html draws the same shape from the
// same module (v3239), so the Pip-Boy's screen and the head page cannot drift apart -- a second copy of those
// fifty lines would have been the ninth instance this session of a thing declared twice and compared never.
//
// 256x216 IS HALF THE CANVAS SCREEN'S RESOLUTION AND DELIBERATE: the plane is about a centimetre of screen on a
// rotating unit, and a full-size target costs four times the fill for a picture nobody can read at that size.
let _headRT = null, _headScene = null, _headCam = null, _headRig = null, _headT = 0;
function mountHead(){
  try {
    if (!_pipWire || !_pipWire.setScreen1Texture) return;
    if (!_headRT) {
      _headRT = new THREE.WebGLRenderTarget(256, 216, { depthBuffer: true });
      _headScene = new THREE.Scene();
      _headCam = new THREE.PerspectiveCamera(38, 256 / 216, 0.1, 20);
      _headCam.position.set(0, 0.1, 2.35);
      _headRig = buildWireframeHead(THREE);
      _headScene.add(_headRig.root);
      _headScene.add(new THREE.HemisphereLight(0x88ddff, 0x102018, 0.9));
    }
    _pipWire.setScreen1Texture(_headRT.texture);
    _asciiWire = _pipWire;
    if (_screen1Mode() === "ascii") _mountAscii();
  } catch (e) { console.warn("[pipboy] head screen unavailable:", e); }
}
// A SLOW IDLE TURN AND A BLINK, AND NOTHING THAT CLAIMS TO BE LIP-SYNC. thead.html's ~450 lines of moods,
// channels and gestures stayed on that page ON PURPOSE (v3239) -- what is here is the SHAPE, animated only
// enough that a still image is not mistaken for a frozen screen.
// v3323 -- *** THE SAME FRAME, AS ASCII, ON THE PIP-BOY'S OWN SCREEN. ***
// Keith: "can the ascii effect work in the pip boy viewer?" YES, AND CHEAPLY, because the two halves already
// exist and meet exactly here: setScreen1(fn) hands out a 2D CONTEXT (v3234) and asciify takes RGBA and returns
// TEXT (v3322). The only new code is readPixels between them.
//
// TWO MODES OVER ONE SOURCE, NOT TWO SOURCES. Both paths render THE SAME rig into THE SAME target; only the
// last step differs. A second head built for the ASCII view would be the copy this tree spends its rounds
// removing, and would drift the moment either was touched.
//
// ?screen1=ascii PICKS IT and the default is unchanged -- a new mode that altered what everybody already sees
// would be a preference wearing a feature's clothes.
let _asciiWire = null, _asciiBuf = null;
function _screen1Mode() {
    try { return new URLSearchParams(location.search).get("screen1") || "texture"; } catch { return "texture"; }
}
function _mountAscii() {
    if (!_asciiWire || !_headRT) return;
    // THE TEXTURE IS HANDED BACK FIRST. setScreen1Texture(null) restores the canvas path (v3240); without it the
    // material keeps sampling the render target while the 2D callback paints underneath, unseen.
    _asciiWire.setScreen1Texture(null);
    _asciiWire.setScreen1((ctx, cv) => {
        if (!_asciiBuf) _asciiBuf = new Uint8Array(256 * 216 * 4);
        try {
            const gl = renderer.getContext();
            const prev = renderer.getRenderTarget();
            renderer.setRenderTarget(_headRT);
            gl.readPixels(0, 0, 256, 216, gl.RGBA, gl.UNSIGNED_BYTE, _asciiBuf);
            renderer.setRenderTarget(prev);
        } catch (e) { return; }
        // readPixels is BOTTOM-UP and asciify walks top-down -- the same flip ascii-object.html needs. Without
        // it the head is upside down and reads as a broken sampler rather than a coordinate convention.
        const flip = new Uint8ClampedArray(_asciiBuf.length);
        for (let y = 0; y < 216; y++) flip.set(_asciiBuf.subarray((215 - y) * 256 * 4, (216 - y) * 256 * 4), y * 256 * 4);
        const r = asciify(flip, 256, 216, { cols: 44 });
        ctx.fillStyle = "#04140b"; ctx.fillRect(0, 0, cv.width, cv.height);
        ctx.fillStyle = "#6effa0"; ctx.font = "10px ui-monospace,monospace"; ctx.textBaseline = "top";
        const lh = cv.height / Math.max(1, r.rows);
        r.text.split("\n").forEach((line, i) => ctx.fillText(line, 4, i * lh));
    });
}

function _headTick(dt){
  if (!_headRig) return;
  _headT += dt;
  _headRig.head.rotation.y = Math.sin(_headT * 0.5) * 0.35;
  _headRig.head.rotation.x = Math.sin(_headT * 0.31) * 0.10;
}

// ---- Named model registry --------------------------------------------------
// Drop each .glb into GPU_Assets/pipboy/ using the `file` name below (or edit
// `file` to match your download). `rotationY` + `targetSize` are placement
// defaults; tune live with the Spin slider + "Copy placement", then bake here.
const MODELS = [
  { key:"wireframe", name:"\u2726 SweK Wireframe Pip-Boy (default)", file:"", wireframe:true, rotationY:0 },
  { key:"retro-editable", name:"Retro-Modernized (editable screen)",
    file:"retro-modernized-pip-boy-editable-screen.glb",
    url:"https://sketchfab.com/3d-models/retro-modernized-pip-boy-editable-screen-02df9777058e4cdea4fadee7660f7b43",
    rotationY:0, targetSize:2.2, textured:true, note:"Has an editable screen surface." },
  { key:"3-billion", name:"The Famous Pip-Boy (3 billion)",
    file:"the-famous-pip-boy-3-billion.glb",
    url:"https://sketchfab.com/3d-models/the-famous-pip-boy-3-billion-adec10493e06436c967d5797f7085225",
    rotationY:0, targetSize:2.2, textured:true, note:"" },
  { key:"pipboy", name:"Pip-Boy",
    file:"pipboy.glb",
    url:"https://sketchfab.com/3d-models/pipboy-d4216090cfa740a491eb89d608971d3a",
    rotationY:0, targetSize:2.2, textured:true, note:"" },
  { key:"fo76", name:"FO76 Pip-Boy (untextured)",
    file:"fo76-pipboy.glb",
    url:"https://sketchfab.com/3d-models/fo76-pipboy-d78412ada76b422d9a015fa4c293765d",
    rotationY:0, targetSize:2.2, textured:false, note:"Sketchfab preview shows no baked textures \u2014 expect plain grey." }
];
const DIR = "/GPU_Assets/pipboy/";

// ---- Scene -----------------------------------------------------------------
const view = document.getElementById("view");
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05140b);

const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 1000);
camera.position.set(0, 0.5, 4);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
if ("outputColorSpace" in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace;
view.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
// v1966 — shared 3D navigation pad (buttons + keyboard + gamepad) driving these OrbitControls.
import("/ui/orbitNavPad.js").then(m => m.mountOrbitNavPad({ camera, controls, THREE })).catch(()=>{});
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.target.set(0, 0, 0);

scene.add(new THREE.HemisphereLight(0xbfeacb, 0x16301f, 1.05));
const key = new THREE.DirectionalLight(0xffffff, 1.5); key.position.set(3, 5, 4); scene.add(key);
const fill = new THREE.DirectionalLight(0x9fd8b4, 0.6); fill.position.set(-4, 1, -2); scene.add(fill);
scene.add(new THREE.AmbientLight(0x335544, 0.5));
// faint floor grid for scale
const grid = new THREE.GridHelper(8, 16, 0x1c5a30, 0x123a20); grid.position.y = -1.2; scene.add(grid);

function resize(){ const w = innerWidth, h = innerHeight; camera.aspect = w/h; camera.updateProjectionMatrix(); renderer.setSize(w, h); }
addEventListener("resize", resize); resize();

// ---- Model loading ---------------------------------------------------------
const loader = new GLTFLoader(); enableMeshopt(loader);
function setLoadBar(pct){ const f = document.getElementById("loadbarFill"); if (f) f.style.width = Math.max(0, Math.min(100, pct)) + "%"; }
function showLoadBar(on){ const b = document.getElementById("loadbar"); if (b) b.style.display = on ? "block" : "none"; if (!on) setLoadBar(0); }
let pivot = null, autoRot = false, baseRotY = 0, autoSpin = 0;
let _pipWire = null;   // v1686 — active wireframe Pip-Boy instance (drives its screens each frame)
let _afterLoad = null;   // set by the overlay system to (re)bind the 3D screen
const statusEl = document.getElementById("status");
const metaEl = document.getElementById("meta");
const spinEl = document.getElementById("spin");

function setStatus(msg, err){ statusEl.textContent = msg; statusEl.className = err ? "err" : ""; statusEl.style.display = msg ? "" : "none"; }

function clearPivot(){ if (_pipWire){ try { _pipWire.dispose(); } catch {} _pipWire = null; } if (pivot){ scene.remove(pivot); pivot.traverse(o => { if (o.geometry) o.geometry.dispose?.(); if (o.material){ (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.dispose?.()); } }); pivot = null; } }

function showMeta(cfg, ok){
  metaEl.innerHTML =
    "<div><b>" + cfg.name + "</b></div>" +
    (cfg.note ? "<div class='" + (cfg.textured?"":"warn") + "'>" + cfg.note + "</div>" : "") +
    "<div style='margin-top:6px'>Source: <a href='" + cfg.url + "' target='_blank' rel='noopener'>Sketchfab \u2197</a></div>" +
    (ok ? "" : "<div class='warn' style='margin-top:6px'>File not found. Download from the link, export <code>.glb</code>, and drop it in <code>GPU_Assets/pipboy/</code> as <code>" + cfg.file + "</code>.</div>");
}

function frame(cfg){
  // measure with the pivot at identity so the box is clean
  pivot.position.set(0, 0, 0); pivot.scale.setScalar(1);
  const box = new THREE.Box3().setFromObject(pivot);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  const s = (cfg.targetSize || 2) / maxDim;
  // Recenter the CONTENT (the loaded scene) at the pivot's local origin, THEN scale
  // the pivot in place. (The old code moved the pivot itself and scaled around its
  // origin, which left any model whose geometry was offset from the file origin
  // displaced by center*(s-1) — often far outside the view, so it "loaded" but
  // never appeared. Models that happened to be origin-centered still showed.)
  pivot.children.forEach(ch => ch.position.sub(center));
  pivot.scale.setScalar(s);
  const dist = (cfg.targetSize || 2) * 1.9;
  camera.position.set(0, (cfg.targetSize||2) * 0.25, dist);
  controls.target.set(0, 0, 0);
  controls.update();
}

  function applyCornerPin(){ const w = cpCanvas.width, h = cpCanvas.height, c = cpCorners;
    const S = basis(0,0, w,0, 0,h, w,h), D = basis(c[0][0],c[0][1], c[1][0],c[1][1], c[2][0],c[2][1], c[3][0],c[3][1]); const t = mm(D, adj(S)); for (let i = 0; i < 9; i++) t[i] /= t[8];
    const m3d = [t[0],t[3],0,t[6], t[1],t[4],0,t[7], 0,0,1,0, t[2],t[5],0,t[8]];
    cpCanvas.style.transformOrigin = "0 0"; cpCanvas.style.transform = "matrix3d(" + m3d.join(",") + ")"; positionHandles(); }
  function positionHandles(){ cpHandles.forEach((hh, i) => { hh.style.left = cpCorners[i][0] + "px"; hh.style.top = cpCorners[i][1] + "px"; hh.style.display = (cpOn && cpEditing) ? "block" : "none"; }); }
  cpHandles.forEach((hh, i) => { hh.addEventListener("mousedown", (e) => { e.preventDefault(); e.stopPropagation(); const move = (ev) => { cpCorners[i] = [ev.clientX, ev.clientY]; applyCornerPin(); }; const up = () => { removeEventListener("mousemove", move); removeEventListener("mouseup", up); save(); }; addEventListener("mousemove", move); addEventListener("mouseup", up); }); });
  function showCornerPin(on){ cpOn = on; cornerPin.style.display = on ? "block" : "none"; cpToggle.textContent = on ? "Pin: on" : "4-corner pin"; if (on) { applyCornerPin(); startTick(); } positionHandles(); save(); }
  cpToggle.onclick = () => showCornerPin(!cpOn);
  cpEdit.onclick = () => { cpEditing = !cpEditing; cpEdit.textContent = cpEditing ? "Done" : "Edit corners"; if (cpEditing && !cpOn) showCornerPin(true); positionHandles(); };

  // ---- favorites: capture the whole orient + screen setup, per model ----
  function favKey(){ const cfg = models[+pick.value] || {}; return "voxelengine.pipboyFav." + (cfg.file || cfg.key || "x"); }
  document.getElementById("favSave").onclick = () => { const b = document.getElementById("favSave"); const fav = { cam: camera.position.toArray(), tgt: controls.target.toArray(), spin: +spinEl.value, corners: cpCorners, cpOn, mesh: meshSel.value || "", content: content.value, url: urlIn.value }; try { localStorage.setItem(favKey(), JSON.stringify(fav)); } catch {} b.textContent = "\u2713 Saved"; setTimeout(() => b.textContent = "\u2605 Mark favorite", 1200); };
  function loadFav(){ let fav = null; try { fav = JSON.parse(localStorage.getItem(favKey()) || "null"); } catch {} if (!fav) return false;
    if (fav.cam) camera.position.fromArray(fav.cam); if (fav.tgt) controls.target.fromArray(fav.tgt); controls.update();
    if (fav.spin != null) { spinEl.value = fav.spin; applySpin(); }
    if (fav.content) { content.value = fav.content; applyMode(); } if (fav.url) urlIn.value = fav.url;
    if (fav.corners) cpCorners = fav.corners.map(c => c.slice());
    if (fav.mesh) { meshSel.style.display = "block"; meshSel.value = fav.mesh; bindScreen(fav.mesh); }
    if (fav.cpOn) showCornerPin(true); else applyCornerPin();
    return true; }
  document.getElementById("favLoad").onclick = loadFav;
  // auto-apply a saved favorite when a model (re)loads
  const _prevAfter = _afterLoad;
  _afterLoad = () => { try { _prevAfter && _prevAfter(); } catch {} setTimeout(loadFav, 120); };

  content.value = mode; applyMode(); startTick(); applyCornerPin(); if (pivot) _afterLoad();

  // ---- physical RGB: push the pip-boy screen color to case lights (/rgb/all) ----
  const rgbColor = document.getElementById("rgbColor"), rgbPush = document.getElementById("rgbPush"), rgbFollow = document.getElementById("rgbFollow");
  const samp = document.createElement("canvas"); samp.width = samp.height = 1; const sampCtx = samp.getContext("2d"); let rgbTimer = null;
  async function pushRgb(hex){ try { await fetch("/rgb/all", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ color: hex }) }); } catch (e) {} }
  function screenAvgHex(){ try { sampCtx.drawImage(SCV, 0, 0, 1, 1); const d = sampCtx.getImageData(0, 0, 1, 1).data; return "#" + [d[0], d[1], d[2]].map(x => x.toString(16).padStart(2, "0")).join(""); } catch { return rgbColor.value; } }
  rgbPush.onclick = () => pushRgb(rgbColor.value);
  rgbFollow.onclick = () => { if (rgbTimer) { clearInterval(rgbTimer); rgbTimer = null; rgbFollow.textContent = "Follow screen"; } else { rgbFollow.textContent = "Following\u2026"; const t = () => { const hex = screenAvgHex(); rgbColor.value = hex; pushRgb(hex); }; t(); rgbTimer = setInterval(t, 2000); } };

  // ---- voice control (browser SpeechRecognition: switch screen by spoken word) ----
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; let recog = null, voiceOn = false;
  const voiceBtn = document.getElementById("ovVoice");
  function setContent(v){ content.value = v; applyMode(); }
  function handleVoice(text){ const t = (text || "").toLowerCase();
    if (/dashboard|clock|home assistant/.test(t)) setContent("dashboard");
    else if (/fidget|spin|toy/.test(t)) setContent("fidget");
    else if (/gauge/.test(t)) setContent("gauges");
    else if (/comic/.test(t)) setContent("comic");
    else if (/photo|slide|picture/.test(t)) setContent("slideshow");
    else if (/camera|security|cam\b/.test(t)) setContent("camera");
    else if (/video|movie/.test(t)) setContent("video");
    else if (/next/.test(t)) nextB.click();
    else if (/back|previous|\bprev/.test(t)) prevB.click();
    else if (/\bpin\b/.test(t)) showCornerPin(!cpOn);
    else if (/screen|three ?d|3d/.test(t)) btn3d.click();
    else { const m = t.match(/show (?:the )?(.+)/); if (m && mode === "camera") { const name = m[1].trim(); for (const o of camSel.options) { if (o.value && o.textContent.toLowerCase().includes(name)) { camSel.value = o.value; startCam(o.value); break; } } } } }
  if (SR && voiceBtn) {
    voiceBtn.onclick = () => { if (voiceOn) { voiceOn = false; try { recog.stop(); } catch {} voiceBtn.textContent = "\uD83C\uDFA4 Voice"; return; }
      recog = new SR(); recog.continuous = true; recog.interimResults = false; recog.lang = "en-US";
      recog.onresult = (e) => { const r = e.results[e.results.length - 1]; if (r && r.isFinal) handleVoice(r[0].transcript); };
      recog.onend = () => { if (voiceOn) { try { recog.start(); } catch {} } };
      recog.onerror = () => {};
      try { recog.start(); voiceOn = true; voiceBtn.textContent = "\uD83C\uDFA4 Listening\u2026"; } catch {} };
  } else if (voiceBtn) { voiceBtn.disabled = true; voiceBtn.textContent = "\uD83C\uDFA4 n/a"; voiceBtn.title = "SpeechRecognition not supported here"; }

  // ---- alert watch: HA person/motion detection -> flash RGB + flip to that camera ----
  const alertBtn = document.getElementById("ovAlert"); let alertOn = false, alertTimer = null; const lastDet = {}; let alertBanner = null;
  function showBanner(txt){ if (!alertBanner) { alertBanner = document.createElement("div"); alertBanner.style.cssText = "position:absolute;left:0;right:0;top:0;z-index:40;background:rgba(255,40,40,.85);color:#fff;font:bold 13px ui-monospace,monospace;text-align:center;padding:6px;text-shadow:0 0 6px #000;"; document.body.appendChild(alertBanner); } alertBanner.textContent = txt; alertBanner.style.display = "block"; clearTimeout(alertBanner._t); alertBanner._t = setTimeout(() => { if (alertBanner) alertBanner.style.display = "none"; }, 6000); }
  async function pulseAlert(){ for (const c of ["#ff1020", "#200000", "#ff1020", "#200000", "#ff1020"]) { pushRgb(c); await new Promise(r => setTimeout(r, 220)); } pushRgb(rgbColor.value); }
  function tryFlipCamera(id){ if (mode !== "camera") { content.value = "camera"; applyMode(); } const idl = id.toLowerCase();
    setTimeout(() => {
      const pick = (want) => { const w = want.toLowerCase(); for (const o of camSel.options) { if (o.value && o.value.toLowerCase() === w) { camSel.value = o.value; startCam(o.value); return true; } } for (const o of camSel.options) { if (o.value && o.value.toLowerCase().includes(w)) { camSel.value = o.value; startCam(o.value); return true; } } return false; };
      // explicit alert map first (entity-text = camera name)
      for (const k in camMap) { if (idl.includes(k) && pick(camMap[k])) return; }
      // fallback: camera name appears in the entity id
      for (const o of camSel.options) { if (o.value && idl.includes(o.value.toLowerCase())) { camSel.value = o.value; startCam(o.value); return; } }
    }, 500); }
  async function pollAlerts(){ if (!alertOn) return;
    try { const lists = await Promise.all([fetch("/ha/states?domain=sensor", { cache: "no-store" }).then(r => r.json()).catch(() => null), fetch("/ha/states?domain=binary_sensor", { cache: "no-store" }).then(r => r.json()).catch(() => null)]);
      const all = []; for (const st of lists) { const l = Array.isArray(st) ? st : ((st && (st.states || st.entities)) || []); if (Array.isArray(l)) all.push(...l); }
      for (const e of all) { const id = (e && e.entity_id) || ""; if (!/person|occupancy|motion/i.test(id)) continue; const v = String(e.state).toLowerCase(); const det = (v === "on") || (!isNaN(parseFloat(v)) && parseFloat(v) > 0); const prev = lastDet[id] || false; lastDet[id] = det;
        if (det && !prev) { showBanner("\u26A0 DETECTED \u2014 " + ((e.attributes && e.attributes.friendly_name) || id)); pulseAlert(); tryFlipCamera(id); } } } catch {} }
  if (alertBtn) alertBtn.onclick = () => { alertOn = !alertOn; alertBtn.textContent = alertOn ? "Alert: watching" : "Alert watch"; if (alertOn) { if (alertTimer) clearInterval(alertTimer); pollAlerts(); alertTimer = setInterval(pollAlerts, 4000); } else if (alertTimer) { clearInterval(alertTimer); alertTimer = null; } };

  // ---- v1346: Restore original textures (unbind both screens, forget bindings) ----
  const restoreBtn = document.getElementById("ovRestore");
  if (restoreBtn) restoreBtn.onclick = () => {
    unbindScreen(); unbindScreen2(); scr2On = false;
    if (meshSel)  { meshSel.value = "";  meshSel.style.display = "none"; }
    if (meshSel2) { meshSel2.value = ""; meshSel2.style.display = "none"; }
    if (btn3d)  btn3d.textContent  = "On 3D screen";
    if (btn3d2) btn3d2.textContent = "2nd screen";
    try { localStorage.removeItem("voxelengine.pipboyMesh"); localStorage.removeItem("voxelengine.pipboyMesh2"); } catch {}
    setStatus("Restored original textures", false); setTimeout(() => setStatus("", false), 2000);
  };

  // ---- v1346: model light meshes — detect emissive / light-named meshes, toggle on/off ----
  const lightsBtn = document.getElementById("ovLights"), lightsBox = document.getElementById("ovLightsBox");
  const _lightSaved = new Map();   // material.uuid -> { e:Color|null, i:Number }
  function findLightMeshes(){
    const out = []; if (!pivot) return out;
    const NAME = /light|led|lamp|bulb|glow|neon|blink|indicator|lumin|emiss/i;
    pivot.traverse(o => {
      if (!o.isMesh || !o.material) return;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      const lit = mats.some(m => m && m.emissive && (m.emissive.r + m.emissive.g + m.emissive.b) > 0.05);
      if (lit || NAME.test(o.name || "")) out.push(o);
    });
    return out;
  }
  function setMeshLight(o, on){
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    mats.forEach(m => {
      if (!m) return;
      if (!_lightSaved.has(m.uuid)) _lightSaved.set(m.uuid, { e: m.emissive ? m.emissive.clone() : null, i: ("emissiveIntensity" in m) ? m.emissiveIntensity : 1 });
      const sv = _lightSaved.get(m.uuid);
      if (on) { if (m.emissive && sv.e) m.emissive.copy(sv.e); if ("emissiveIntensity" in m) m.emissiveIntensity = sv.i; }
      else    { if (m.emissive) m.emissive.setRGB(0, 0, 0); if ("emissiveIntensity" in m) m.emissiveIntensity = 0; }
      m.needsUpdate = true;
    });
  }
  function renderLights(){
    const meshes = findLightMeshes();
    if (!meshes.length) { lightsBox.innerHTML = '<div style="color:#7fd6a8;font-size:11px;padding:4px;">No emissive / light-named meshes found on this model. Tell me the exact mesh names and I can target them directly.</div>'; return; }
    let html = '<div class="row" style="margin-bottom:4px;"><button id="ovLAllOn">All on</button><button id="ovLAllOff">All off</button></div><div class="row" style="flex-wrap:wrap;gap:4px;">';
    meshes.forEach((o, i) => { if (o.userData._lt === undefined) o.userData._lt = true; html += '<button class="lt" data-i="' + i + '" style="font-size:11px;padding:5px 8px;">' + ((o.name || ("mesh " + i)).slice(0, 22)) + '</button>'; });
    html += '</div>';
    lightsBox.innerHTML = html;
    const paint = () => lightsBox.querySelectorAll("button.lt").forEach(b => { const o = meshes[+b.dataset.i]; b.style.background = (o.userData._lt === false) ? "" : "#0c5a30"; });
    lightsBox.querySelectorAll("button.lt").forEach(b => b.onclick = () => { const o = meshes[+b.dataset.i]; const on = (o.userData._lt === false); o.userData._lt = on; setMeshLight(o, on); paint(); });
    const all = (on) => meshes.forEach(o => { o.userData._lt = on; setMeshLight(o, on); });
    lightsBox.querySelector("#ovLAllOn").onclick = () => { all(true); paint(); };
    lightsBox.querySelector("#ovLAllOff").onclick = () => { all(false); paint(); };
    paint();
  }
  if (lightsBtn) lightsBtn.onclick = () => { const show = lightsBox.style.display === "none"; lightsBox.style.display = show ? "block" : "none"; if (show) renderLights(); };
})();

</script>
