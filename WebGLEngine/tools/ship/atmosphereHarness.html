<!doctype html>
<meta charset="utf-8">
<title>atmosphere harness</title>
<canvas id="c" width="32" height="32"></canvas>
<script type="module">
import * as A from "/render/atmosphere.mjs";

const P = A.EARTH;
const gl = document.getElementById("c").getContext("webgl2", { antialias: false });
const floatOK = !!gl.getExtension("EXT_color_buffer_float");
gl.getExtension("OES_texture_float_linear");

const VERT = `#version 300 es
precision highp float;
void main() {
    vec2 p = vec2((gl_VertexID == 1) ? 3.0 : -1.0, (gl_VertexID == 2) ? 3.0 : -1.0);
    gl_Position = vec4(p, 0.0, 1.0);
}`;

function compile(fs) {
    const p = gl.createProgram();
    for (const [type, src] of [[gl.VERTEX_SHADER, VERT], [gl.FRAGMENT_SHADER, fs]]) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src); gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
        gl.attachShader(p, s);
    }
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    return p;
}

// The transmittance table, built by the SAME CPU code the gate compares against, uploaded as float32 RGB.
// Building it here rather than on the GPU is deliberate for this round: the precomputation is graded on the
// CPU in sections 1-5, and what section 7 asks is whether the SHADER READS AND USES it correctly.
const LUT = A.buildTransmittanceLUT(P, { w: 128, h: 32, steps: 256 });
const lutTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, lutTex);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB32F, LUT.w, LUT.h, 0, gl.RGB, gl.FLOAT, LUT.data);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

// one float32 pixel out, so the comparison is not quantised to 8 bits before it is made
const N = 32;
const outTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, outTex);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, N, N, 0, gl.RGBA, gl.FLOAT, null);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
const fbo = gl.createFramebuffer();
gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, outTex, 0);
const vao = gl.createVertexArray();

function setCommon(prog) {
    gl.useProgram(prog);
    const u = (n) => gl.getUniformLocation(prog, n);
    gl.uniform1f(u("uRg"), P.Rg); gl.uniform1f(u("uRt"), P.Rt);
    gl.uniform1f(u("uHr"), P.Hr); gl.uniform1f(u("uHm"), P.Hm);
    gl.uniform1f(u("uBetaMe"), P.betaMe); gl.uniform1f(u("uBetaMs"), P.betaMs);
    gl.uniform1f(u("uMieG"), P.mieG);
    gl.uniform3f(u("uBetaR"), P.betaR[0], P.betaR[1], P.betaR[2]);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, lutTex);
    gl.uniform1i(u("uTransmittance"), 0);
}
function render(prog, extra) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.viewport(0, 0, N, N);
    setCommon(prog);
    if (extra) extra(prog);
    gl.bindVertexArray(vao);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    const px = new Float32Array(N * N * 4);
    gl.readPixels(0, 0, N, N, gl.RGBA, gl.FLOAT, px);
    return px;
}

// The (r, mu) grid both probes walk. Spread over the whole shell and the whole cosine range, with the
// horizon (mu near 0) deliberately included because that is where every approximation here is worst.
const grid = [];
for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    grid.push({ r: P.Rg + (P.Rt - P.Rg) * (j + 0.5) / N, mu: -1 + 2 * (i + 0.5) / N });
}

const TRANSMITTANCE_FRAG = `#version 300 es
precision highp float;
${A.ATMOSPHERE_GLSL}
uniform float uN;
out vec4 fragColor;
void main() {
    float i = floor(gl_FragCoord.x), j = floor(gl_FragCoord.y);
    float r = uRg + (uRt - uRg) * (j + 0.5) / uN;
    float mu = -1.0 + 2.0 * (i + 0.5) / uN;
    fragColor = vec4(atm_transmittance(r, mu), 1.0);
}`;

window.__transmittance = () => {
    const px = render(compile(TRANSMITTANCE_FRAG), (p) => gl.uniform1f(gl.getUniformLocation(p, "uN"), N));
    return { samples: grid.map((g, k) => ({ r: g.r, mu: g.mu, rgb: [px[k * 4], px[k * 4 + 1], px[k * 4 + 2]] })) };
};

// The sky: a coarse grid of view directions and sun elevations. STEPS is small and identical on both sides,
// because the point is agreement between two implementations of the same integral, not convergence of the
// integral itself -- that was section 1's job.
const STEPS = 32;
const SKY_FRAG = `#version 300 es
precision highp float;
${A.ATMOSPHERE_GLSL}
uniform float uN;
out vec4 fragColor;
void main() {
    float i = floor(gl_FragCoord.x), j = floor(gl_FragCoord.y);
    float mu = -0.2 + 1.2 * (i + 0.5) / uN;
    float muSun = -0.3 + 1.3 * (j + 0.5) / uN;
    float nu = clamp(mu * muSun + 0.3, -1.0, 1.0);
    fragColor = vec4(atm_singleScattering(uRg + 0.5, mu, muSun, nu, ${STEPS}), 1.0);
}`;

window.__sky = () => {
    const px = render(compile(SKY_FRAG), (p) => gl.uniform1f(gl.getUniformLocation(p, "uN"), N));
    const samples = [];
    let finite = true, nonNegative = true;
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
        const k = j * N + i;
        const mu = -0.2 + 1.2 * (i + 0.5) / N;
        const muSun = -0.3 + 1.3 * (j + 0.5) / N;
        const nu = Math.max(-1, Math.min(1, mu * muSun + 0.3));
        const rgb = [px[k * 4], px[k * 4 + 1], px[k * 4 + 2]];
        for (const v of rgb) { if (!Number.isFinite(v)) finite = false; if (v < 0) nonNegative = false; }
        // only every fourth, so the gate's CPU side does not integrate 1024 skies
        if (k % 4 === 0) samples.push({ r: P.Rg + 0.5, mu, muSun, nu, steps: STEPS, rgb });
    }
    return { samples, finite, nonNegative };
};

window.__ready = true;
window.__floatOK = floatOK;
</script>
