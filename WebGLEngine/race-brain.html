<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="demo:title" content="Race brain (the GPU Brain's driving policy trained in idle time, and brains racing brains on box3d)">
<meta name="demo:desc" content="Racing city 3: brain/drivePolicy.mjs is a driving policy in the GPU Brain's own shape -- two MLP layers (9 features, 8 relu, 2 outputs) run through the f32 twin of brain/mlp.js's kernel -- trained by the tree's (1+1)-ES against lap progress, a lap bonus and an off-asphalt penalty, judged the way brain/blobAutoTrain.mjs judges: a held-out track the store ratchets on, an audit track that never votes, and REGRET (the best audit ever seen less the held policy's audit) as the watchdog. Train runs attempts in the browser's idle time (requestIdleCallback) from the stored policy (localStorage) or the hand policy; Race puts the stored brain, the hand, a perturbed brain and the zero policy in ONE box3d world on the seeded grid track in lockstep -- every input from the poses before the step, one step, box3d's state hash folded into the race fingerprint every tick -- with the machine's box3d fingerprint breaking ties, the trucks drawn at their chassis poses on WebGPU or WebGL2. The HUD names the attempts, acceptances, held-out and audit scores, regret, the race order, laps and fingerprint. Not real time as a rule: the race runs at 60 Hz physics per frame, four steps a frame at most.">
<meta name="demo:category" content="world">
<title>Race brain on the GPU</title>
<style>
  html,body { margin:0; height:100%; background:#050805; color:#9fb2d4; font:12px ui-monospace,Menlo,monospace; }
  #c { display:block; width:100%; }
  #hud { padding:10px 14px; }
  #cap { color:#f6a623; letter-spacing:.14em; text-transform:uppercase; }
  #be { color:#59d1ff; font-size:14px; margin-top:4px; }
  #sub { color:#5f7aa0; font-size:11px; margin-top:2px; line-height:1.7; }
  .bad { color:#ff9a9a; }
  a { color:#59d1ff; }
  input[type=number] { width:48px; background:#0c140f; color:#9fb2d4; border:1px solid #2a3a30; font:inherit; }
</style>
</head>
<body>
<div id="hud">
  <div id="cap">Race brain on the GPU: the driving policy trained in idle time, brains racing brains on box3d</div>
  <div id="be">requesting a device&hellip;</div>
  <div id="sub">seed <input id="seed" type="number" value="1" min="1"> &middot; <button id="train">Train in idle time</button> <button id="stopTrain" disabled>Stop</button> &middot; <button id="race">Race</button> &middot; <button id="forget">Forget the stored brain</button>
    &middot; <a href="?webgl=1">force WebGL2</a><br>
    <span id="tick">loading the racing kit and box3d&hellip;</span><br><span id="brain">no stored brain: the hand policy drives</span><br><span id="racing"></span> &middot; drag to orbit, wheel to dolly</div>
</div>
<canvas id="c"></canvas>
<script type="module" src="/ui/originNotice.js"></script>
<script type="module">
import { requestDevice } from "./gfx/device.js";
import * as G from "./render/gpuDriven.mjs";
import * as L from "./render/litSphere.mjs";
import { loadKit, kitScene, imageToColormap } from "./world/kenneyKit.mjs";
import { generateTrack, tilePlacements, trackWorld, describeTrack, checkpoints } from "./world/raceTrack.mjs";
import { trackSurface, createCar, stepCars, carPose, lapTracker, truckPlacement, addBuildings, foldHash, clampInput, CAR } from "./physics/raceCar.mjs";
import * as D from "./brain/drivePolicy.mjs";
import { miniWorld, meshWorld, SUN } from "./render/voxelDevice.mjs";
import { CityGen } from "./world/CityGen.js";
import { box3d } from "./physics/box3d/box3dLoader.js";
import { worldFromModule } from "./render/slugTicker.mjs";

const cvs = document.getElementById("c"), beEl = document.getElementById("be");
const fail = (m) => { beEl.innerHTML = '<span class="bad">' + m + "</span>"; };
const $ = (id) => document.getElementById(id);
const KEY = "swek.driveBrain.v1", FILES = ["vehicle-truck-red.glb", "vehicle-truck-green.glb", "vehicle-truck-yellow.glb", "vehicle-truck-purple.glb"];
let device, scene = null, kit = null, physMod = null, worldFrom = null, store = null, trainer = null, training = false, fleet = "00000000";
let phys = null, cars = [], drivers = [], trackers = [], surface = null, placements = [], packed = null, hash = 0x811c9dc5, ticks = 0, names = [];
let yaw = 0.6, pitch = 0.7, dist = 190, dragging = null, camNow = null, centre = [0, 0, 0], acc = 0, lastT = 0;

const readBytes = async (p) => { const r = await fetch("/" + p); if (!r.ok) throw new Error(`${p}: HTTP ${r.status}`); return r.arrayBuffer(); };
const readImage = async (p) => { const r = await fetch("/" + p); if (!r.ok) throw new Error(`${p}: HTTP ${r.status}`); const bmp = await createImageBitmap(await r.blob(), { colorSpaceConversion: "none", premultiplyAlpha: "none" }); const oc = new OffscreenCanvas(bmp.width, bmp.height), ctx = oc.getContext("2d"); ctx.drawImage(bmp, 0, 0); return imageToColormap(ctx.getImageData(0, 0, bmp.width, bmp.height)); };

function brainLine() {
  const cur = store.current(), rep = trainer ? trainer.report() : null;
  $("brain").textContent = (cur ? `stored brain ${cur.hash}: held-out score ${cur.score.toFixed(1)}` : "no stored brain: the hand policy drives") +
    (rep ? ` -- ${rep.attempts} attempts, ${rep.accepted} accepted, best audit ${rep.bestAuditEver.toFixed(1)} at attempt ${rep.bestAuditAt}, held audit ${rep.heldAudit == null ? "-" : rep.heldAudit.toFixed(1)}, regret ${rep.regret == null ? "-" : rep.regret.toFixed(2)}` : "") + ` -- fleet ${fleet}`;
}

function setupRace() {
  const t0 = performance.now();
  const track = generateTrack({ seed: Math.max(1, +$("seed").value | 0) });
  placements = tilePlacements(track);
  const world = miniWorld(), { rects } = trackWorld(track, world, CityGen); packed = meshWorld(world);
  surface = trackSurface(track);
  if (phys) phys.destroy();
  phys = worldFrom(); addBuildings(phys, rects);
  const cur = store.current(), rng = (() => { let a = 99; return () => { a = (Math.imul(a, 1664525) + 1013904223) >>> 0; return a / 4294967296; }; })();
  const brains = cur ? [cur.weights, D.handWeights(), D.perturb(cur.weights, 0.05, rng), D.zeroWeights()] : [D.handWeights(), D.perturb(D.handWeights(), 0.05, rng), D.perturb(D.handWeights(), 0.1, rng), D.zeroWeights()];
  names = cur ? ["stored brain", "hand", "stored + noise", "zero"] : ["hand", "hand + noise 0.05", "hand + noise 0.1", "zero"];
  const cp = checkpoints(track)[0];
  cars = brains.map((w, i) => createCar(phys, { x: cp.x + 5 - 4 * i, z: cp.z, yaw: Math.PI / 2 }));
  drivers = brains.map((w, i) => D.policyDriver(w, surface, cars[i])); trackers = cars.map(() => lapTracker(surface));
  hash = 0x811c9dc5; ticks = 0; acc = 0;
  const trucks = cars.map((c, i) => ({ file: FILES[i], ...truckPlacement(carPose(phys, c)) }));
  if (scene && scene.destroy) scene.destroy();
  scene = kitScene(device, kit, [...placements, ...trucks], G, L, { light: SUN, dynamic: true, extraFleets: [{ name: "world", mesh: packed.mesh, pipeline: L.litPipelineDesc({ cull: "none" }), bind: L.litBind(SUN), records: Float32Array.from([0, 0, 0, 1]), extras: new Float32Array(4) }] });
  $("tick").textContent = `${describeTrack(track)}; ${rects.length} buildings; four cars: ${names.join(", ")} (red, green, yellow, purple); built in ${(performance.now() - t0).toFixed(0)} ms on ${scene.path}`;
}

function stepRace() {
  if (!phys) return;
  const xf = phys.readTransforms(), vel = phys.readVelocities();
  const inputs = cars.map((c, i) => clampInput(drivers[i](carPose(phys, c, xf, vel))));
  const rs = stepCars(phys, cars, surface, inputs, CAR.dt);
  rs.forEach((r, i) => trackers[i].update(r.pose));
  hash = foldHash(hash, phys.stateHash()); ticks++;
}

function idleTrain(deadline) {
  if (!training) return;
  const row = trainer.attempt(trainer.history.length + 1);
  brainLine();
  $("racing").textContent = `attempt ${row.attempt}: train ${row.train.toFixed(1)}, held-out ${row.held.toFixed(1)}, audit ${row.audit.toFixed(1)}, ${row.accepted ? "ACCEPTED" : "kept the better policy"}`;
  if (window.requestIdleCallback) requestIdleCallback(idleTrain, { timeout: 4000 }); else setTimeout(idleTrain, 50);
}

async function main() {
  const forceGl = new URLSearchParams(location.search).get("webgl") === "1";
  try { device = await requestDevice(cvs, forceGl ? { backend: "webgl2" } : { prefer: "webgpu" }); }
  catch (e) { return fail("requestDevice threw: " + e.message); }
  beEl.textContent = `device: ${device.backend}`;
  try {
    const t0 = performance.now(), baseUrlOf = (p) => new URL("/" + p, location.href).href;
    kit = await loadKit("racing", { readBytes, readImage, baseUrlOf });
    const ps = await box3d.init(); if (!ps.ready) return fail("box3d: " + ps.reason);
    physMod = box3d._mod; worldFrom = () => worldFromModule(physMod, [0, -9.81, 0]); fleet = D.machineFingerprint(physMod);
    beEl.textContent += ` -- ${kit.models.size} racing models and box3d's wasm loaded in ${(performance.now() - t0).toFixed(0)} ms`;
  } catch (e) { return fail("loading threw: " + e.message); }
  store = D.driveStore({ persist: (o) => { try { localStorage.setItem(KEY, JSON.stringify(o)); } catch {} }, restore: () => { try { const j = JSON.parse(localStorage.getItem(KEY) || "null"); return j && j.weights ? { ...j, weights: Float32Array.from(j.weights) } : null; } catch { return null; } } });
  brainLine(); setupRace();
  $("seed").addEventListener("change", setupRace); $("race").addEventListener("click", setupRace);
  $("forget").addEventListener("click", () => { try { localStorage.removeItem(KEY); } catch {} store = D.driveStore({ persist: (o) => { try { localStorage.setItem(KEY, JSON.stringify(o)); } catch {} } }); trainer = null; brainLine(); setupRace(); });
  $("train").addEventListener("click", () => {
    if (!store.current()) { const hand = D.handWeights(); store.offer({ weights: hand, score: D.evaluate(worldFrom, hand, D.HELD_OUT_SEEDS, { seconds: 45 }).score, by: "hand" }); }
    trainer = trainer || D.createAutoTrainer(worldFrom, { store, itersPerAttempt: 8, seconds: 45 });
    training = true; $("train").disabled = true; $("stopTrain").disabled = false; brainLine();
    if (window.requestIdleCallback) requestIdleCallback(idleTrain, { timeout: 4000 }); else setTimeout(idleTrain, 50);
  });
  $("stopTrain").addEventListener("click", () => { training = false; $("train").disabled = false; $("stopTrain").disabled = true; });
  cvs.addEventListener("pointerdown", (e) => { dragging = [e.clientX, e.clientY]; });
  addEventListener("pointerup", () => { dragging = null; });
  addEventListener("pointermove", (e) => { if (!dragging) return; yaw += (e.clientX - dragging[0]) * 0.006; pitch = Math.max(0.05, Math.min(1.5, pitch + (e.clientY - dragging[1]) * 0.006)); dragging = [e.clientX, e.clientY]; });
  cvs.addEventListener("wheel", (e) => { e.preventDefault(); dist = Math.max(8, Math.min(600, dist * Math.exp(e.deltaY * 0.001))); }, { passive: false });
  requestAnimationFrame(frame);
}

function frame(t) {
  requestAnimationFrame(frame);
  const w = cvs.clientWidth | 0, h = Math.max(200, (innerHeight - document.getElementById("hud").offsetHeight - 4) | 0);
  if (cvs.width !== w || cvs.height !== h) { cvs.width = w; cvs.height = h; }
  if (!scene || !phys) return;
  const dt = Math.min(0.1, (t - (lastT || t)) / 1000); lastT = t; acc += dt; let n = 0;
  while (acc >= CAR.dt && n < 4) { stepRace(); acc -= CAR.dt; n++; }
  const poses = cars.map((c) => carPose(phys, c));
  poses.forEach((p, i) => { const tp = truckPlacement(p), k = placements.length + i; scene.kitRecords.set([tp.pos[0], tp.pos[1], tp.pos[2], 1], k * 4); scene.kitExtras.set(tp.quat, k * 4); });
  const order = trackers.map((tk, i) => ({ i, laps: tk.laps, hit: tk.hit })).sort((a, b) => (b.laps - a.laps) || (b.hit - a.hit));
  $("racing").textContent = training ? $("racing").textContent : `${(ticks * CAR.dt).toFixed(1)} s: ` + order.map((o, k) => `${k + 1}. ${names[o.i]} (${o.laps} laps, ${o.hit} checkpoints)`).join("  ") + ` -- fingerprint ${(hash >>> 0).toString(16).padStart(8, "0")}`;
  const lead = poses[order[0].i]; centre = [lead.pos[0], 0, lead.pos[2]];
  const eye = [centre[0] + dist * Math.sin(yaw) * Math.cos(pitch), centre[1] + dist * Math.sin(pitch), centre[2] + dist * Math.cos(yaw) * Math.cos(pitch)];
  camNow = { viewProj: G.multiply(G.perspective(0.9, w / h, 0.5, 2000), G.lookAt(eye, centre)), eye };
  scene.frame({ ...camNow, clear: [0.03, 0.05, 0.08, 1] });
}

main();
</script>
</body>
</html>
