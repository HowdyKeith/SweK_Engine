<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SweK &middot; Krbn Avatar (pencil-drawn, in the panel)</title>
<meta name="demo:title" content="Krbn Avatar" />
<meta name="demo:desc" content="The rigged avatar GLB drawn by Krbn as a pencil sketch -- skinned, posed, and re-drawn slowly because a pencil frame costs half a second." />
<script type="importmap">
{ "imports": { "three": "/vendor/three/three.module.js" } }
</script>
<style>
  html,body { margin:0; height:100%; background:#f4f1ea; overflow:hidden; }
  #wrap { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  #wrap svg { width:100%; height:100%; display:block; }
  #msg { position:absolute; left:0; right:0; bottom:0; font:10px ui-monospace,Menlo,monospace;
         color:#5a5348; background:#f4f1eacc; padding:2px 4px; text-align:center; }
  #msg.err { color:#8a2b22; }
  /* v4049 -- TOP-LEFT, never top-right: ui/avatarSwitch.js's OWN mode-switch button sits at top:2px;right:2px
     over this whole box (it lives in the HOST document, this iframe just fills the box beneath it), so a
     control placed there would sit under a button that already owns that corner. */
  #ctl { position:absolute; top:2px; left:2px; z-index:3; display:flex; gap:2px; }
  #ctl select, #ctl button { font:9px ui-monospace,Menlo,monospace; background:#efece3cc; color:#5a5348;
    border:1px solid #c3bcaa; border-radius:4px; padding:1px 2px; max-width:58px; cursor:pointer; }
  #ctl button { max-width:20px; padding:1px 3px; }
</style>
</head>
<body>
<div id="wrap"></div>
<div id="ctl">
  <select id="modelSel" title="Load a different avatar"><option value="">(default)</option></select>
  <button id="modelFileBtn" title="Load a .glb/.gltf file">&#128193;</button>
  <input type="file" id="modelFile" accept=".glb,.gltf" style="display:none" />
</div>
<div id="msg">loading…</div>
<script type="module">
// krbn-avatar.html -- v4046
// -----------------------------------------------------------------------------------------------------------
// Keith: "so can we have a krbn avatar switch to on server.html?"
//
// The rigged avatar GLB, drawn by Krbn as a pencil sketch, sized to whatever box it is embedded in. It is a
// surface for ui/avatarSwitch.js's rotation, so it obeys that file's rules: it is an IFRAME the switch mounts
// and REMOVES (never hides), and it must cost nothing once torn down.
//
// *** IT REDRAWS ON A TIMER AND NOT PER FRAME, AND THAT IS THE WHOLE DESIGN CONSTRAINT. *** krbn.html measured
// ~708 ms for one Krbn frame and concluded "renders on RELEASE, not on drag"; krbn-compare.html measured ~520 ms
// and throttles to one render in flight. A pencil renderer cannot animate, so this does not pretend to: it draws
// a still, then advances the orbit by a step every REDRAW_MS. The avatar corner is a thing you glance at, and a
// slow sketch that is honest about being slow beats a fast one that is not a Krbn drawing at all -- which is
// exactly the bug v4042 found on krbn-compare.html's own "krbn" pane.
//
// AND IT IS DECLARED `heavy` IN ui/avatarSwitch.js's MODES, beside the WebGPU and MediaPipe surfaces, so the
// button says what the click costs BEFORE it is paid.
// v4049 -- Keith: "so we could have the next avatar choice after live krbn avatar, to be a loaded model
// converted to krbn" -- then, correcting himself -- "adding a button on the live krbn, to convert and load
// live, instead of the next choice". So this is not a new avatarSwitch mode: it is a control ON this one,
// reusing the exact favourites+preset+file picker krbn-compare.html already built (extracted to
// ui/modelPicker.js this round for exactly this reuse) rather than a third copy.
import { gltfToMeshInput, computeFit, fitDistance, loadGLTF } from "./tools/krbn/glbMesh.js";
import { mountModelPicker } from "./ui/modelPicker.js";

const q = new URLSearchParams(location.search);
let GLB = (q.get("glb") || "RobotExpressive").replace(/[^A-Za-z0-9_.-]/g, "");   // no traversal into GPU_Assets
const REDRAW_MS = Math.max(1200, Number(q.get("ms")) || 2600);
const SCALE = Math.PI / 4.2;
const wrap = document.getElementById("wrap"), msg = document.getElementById("msg");
const say = (t, err) => { msg.textContent = t; msg.className = err ? "err" : ""; };
let THREE = null, GLTFLoader = null;

// The box this is embedded in decides the aspect. avatarSwitch mounts a 143x210 PORTRAIT iframe, which is why
// glbMesh.fitDistance takes the min of the two half-FOVs rather than assuming landscape: in portrait the
// HORIZONTAL is the narrower one, and fitting to the vertical alone would push the figure off both sides.
const view = () => ({ width: Math.max(64, wrap.clientWidth | 0), height: Math.max(64, wrap.clientHeight | 0) });

let K = null, scene = null, mesh = null, fit = null, t = 0, timer = 0, busy = false, dead = false, loadErr = "";

function camAt(u, v) {
  const a = u * Math.PI * 2, d = fitDistance(fit.radius, SCALE, v);
  const ELEV = Math.atan2(0.65, 1.75);                 // the same 20.4 degrees krbn-compare orbits at
  const R = d * Math.cos(ELEV), h = d * Math.sin(ELEV);
  return { eye: [fit.center[0] + R*Math.cos(a), fit.center[1] + R*Math.sin(a), fit.center[2] + h],
           target: fit.center, up: [0,0,1], projection: "perspective",
           scale: SCALE * 2,                            // Krbn's `scale` is the FULL vertical FOV; ours is half
           viewport: v };
}

function draw() {
  // *** A LOAD ERROR MUST OUTLIVE THE NEXT TICK, OR IT NEVER READS AS AN ERROR AT ALL. *** The redraw timer
  // fires every REDRAW_MS regardless of what loadAvatar() is doing, and it used to call say() with the
  // ROUTINE status unconditionally -- so a failed load's error message (a 404 on a moved favourite, a bad
  // file) displayed for at most REDRAW_MS (2.6s) before the next ordinary tick silently overwrote it with
  // the OLD model's still-fine status line. MEASURED: a synthetic 404 read as a successful load within one
  // redraw cycle. loadErr is now sticky until a NEW load attempt starts (which clears it before trying).
  if (loadErr) { say(loadErr, true); return; }
  if (dead || busy || !K || !scene || !fit) return;
  busy = true;
  try {
    const v = view();
    wrap.innerHTML = scene.toSVG(camAt(t, v));
    say(GLB + " · Krbn pencil" + (mesh.posedBy ? " · " + mesh.posedBy : ""));
  } catch (e) {
    say("Krbn could not draw it: " + (e && e.message ? e.message : e), true);
  }
  busy = false;
}

/**
 * Load a source into the drawn mesh -- shared by the default boot fetch AND the live picker, so there is
 * ONE place that builds a Scene, not an original path and a second one that quietly drifts from it.
 * @param src   {name, arrayBuffer()} -- a File, or the {name,text,arrayBuffer} shape mountModelPicker hands a preset
 * @param label what to call it in the status line and the option that gets selected afterward
 */
async function loadAvatar(src, label) {
  loadErr = "";   // a NEW attempt clears any previous one -- see draw()'s own note on why this has to be sticky
  say("loading " + label + "…");
  let newMesh;
  try {
    const gltf = await loadGLTF(src, GLTFLoader);
    newMesh = gltfToMeshInput(gltf, THREE);     // skinned, posed, Z-up, sanitised -- one shared implementation
  } catch (e) { loadErr = "could not load " + label + ": " + (e && e.message ? e.message : e); say(loadErr, true); return; }

  mesh = newMesh; GLB = label;
  fit = computeFit(mesh);
  // *** DRAWN SMALL IS NOT DRAWN THE SAME, AND SETTING IT WRONG LOOKS EXACTLY LIKE SETTING IT RIGHT. ***
  // RobotExpressive is 3349 strokes; in a 143px panel a 3234-triangle mesh puts several crease lines inside
  // every few pixels and they merge into a smudge. Krbn's own stage-3 `abstraction.minFeaturePx` ("drop
  // features whose projected extent < this many px, importance-scaled") is built for exactly this.
  //
  // *** THE FIRST ATTEMPT SET IT AND IT DID NOTHING -- IDENTICAL STROKE COUNT *AND* IDENTICAL BYTE COUNT AT
  // minFeaturePx=16. *** The cause is in Krbn's own abstract.js: `cutoffFor(importance, base) =
  // base * (1 - importance)`, with the doc comment "importance 1 -> cutoff 0 (never dropped)". This page had
  // `setImportance(1, {role:"subject"})`, so the knob was MATHEMATICALLY INERT -- a setting that reads as
  // deliberate tuning and cannot ever fire, which is the "a flag that lies is worse than no flag" shape this
  // tree keeps finding. Importance and role are separate arguments, so the fix keeps SUBJECT STYLING and
  // lowers only the number the cutoff is scaled by.
  //
  // AND minFeaturePx IS A FIXED VALUE ON PURPOSE. It did not need deriving from the box, because the unit is
  // PIXELS and therefore already self-correcting: the same setting does more work exactly where a LOADED
  // model happens to be denser or drawn smaller, with no per-model tuning needed.
  scene = new K.Scene({ svg: { background: "#f4f1ea" }, light: { direction: [-0.4,-0.5,-0.7] },
                        style: { wobble: 0.4 }, abstraction: { minFeaturePx: 14 } });
  scene.add(new K.Mesh(mesh)).setImportance(0.45, { role: "subject" })
       .style({ weight: 1.1, hatch: { mode: "cross", angle: 20, spacingPx: 9, field: true } });
  t = 0;
  draw();
}

(async function boot() {
  // Krbn first: if it is absent there is nothing to draw and NO FALLBACK IS DRAWN. krbn.html's v2597 rule --
  // a page that quietly draws something else when its subject is missing is lying about what it shows -- and
  // avatarSwitch's own missing-asset path already knows how to say "not found" and fall back to the SVG robot.
  try { K = await import("/vendor/krbn/index.js"); }
  catch (e) { say("Krbn is not vendored (/vendor/krbn/index.js)", true); return; }

  try {
    const [gl, th] = await Promise.all([
      import("./vendor/three/jsm/loaders/GLTFLoader.js"),
      import("three"),
    ]);
    GLTFLoader = gl.GLTFLoader; THREE = th;
  } catch (e) { say("could not load three.js: " + (e && e.message ? e.message : e), true); return; }

  const r = await fetch("/GPU_Assets/" + GLB + ".glb").catch(() => null);
  if (!r || !r.ok) { say(GLB + ".glb not found" + (r ? " (HTTP " + r.status + ")" : ""), true); return; }
  await loadAvatar(r, GLB);
  if (!mesh) return;   // loadAvatar already said why

  // THE LIVE-LOAD CONTROL. Mounted after the default boot so a picked model REPLACES it via the same
  // loadAvatar() path -- one mesh loader for both the fixed default and anything picked afterward.
  mountModelPicker({
    select: document.getElementById("modelSel"),
    file: document.getElementById("modelFile"),
    presets: [{ url: "/GPU_Assets/RobotExpressive.glb", label: "RobotExpressive" }],
    onPick: (picked) => loadAvatar(picked, picked.name.replace(/\.(glb|gltf)$/i, "")),
    // a preset FETCH failing (a starred favourite whose file has moved) never reaches loadAvatar at all, so
    // it has to set the same sticky loadErr itself or it is just as vulnerable to the next tick stomping it
    onError: (msg2) => { loadErr = msg2; say(loadErr, true); },
  });
  document.getElementById("modelFileBtn").onclick = () => document.getElementById("modelFile").click();

  // the redraw timer OUTLIVES any one loaded model -- it just keeps calling draw() against whatever mesh/scene
  // loadAvatar() most recently set, so picking a new model does not need its own timer management
  timer = setInterval(() => { t = (t + 0.035) % 1; draw(); }, REDRAW_MS);
})();

// *** TEARDOWN MATTERS HERE MORE THAN USUAL. *** ui/avatarSwitch.js removes the iframe and points it at
// about:blank precisely because a hidden surface that keeps working is "a second GPU context burning frames
// behind a panel nobody is looking at". This one burns CPU rather than GPU, on the main thread, for half a
// second at a time -- so the interval is cleared on unload rather than left to the frame's destruction timing.
addEventListener("pagehide", () => { dead = true; clearInterval(timer); });
addEventListener("unload",   () => { dead = true; clearInterval(timer); });

// Re-fit when the host box changes shape. Cheap: it only re-draws, it does not re-parse the GLB.
let rz = 0;
addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(draw, 250); });
</script>
</body>
</html>
