<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="demo:title" content="Projective Slug Text (WebGL2 / WebGPU)">
<meta name="demo:desc" content="Slug outline text rotated on screen and laid on a plane in perspective through gfx/device.js on either backend: the shipped SlugDilate keeps its half-pixel edge under a varying w, held by tools/ship/slugProjective-selfcheck.mjs. Drag the sliders.">
<meta name="demo:category" content="fx">
<title>Projective Slug Text</title>
<style>
  html,body { margin:0; height:100%; background:#050805; color:#9fb2d4; font:12px ui-monospace,Menlo,monospace; }
  #c { display:block; width:100%; }
  #hud { padding:10px 14px; }
  #cap { color:#f6a623; letter-spacing:.14em; text-transform:uppercase; }
  #be { color:#59d1ff; font-size:14px; margin-top:4px; }
  #sub { color:#5f7aa0; font-size:11px; margin-top:2px; }
  .bad { color:#ff9a9a; }
  a { color:#59d1ff; }
</style>
</head>
<body>
<div id="hud">
  <div id="cap">Projective Slug text: rotated, and on a plane in perspective</div>
  <div id="be">requesting a device&hellip;</div>
  <div id="sub">Font: IBM Plex Serif &copy; 2017 IBM Corp., Reserved Font Name &ldquo;Plex&rdquo;, SIL OFL 1.1 (vendor/fonts/IBMPlexSerif-OFL.txt). <span id="notice"></span>
    &middot; <a href="./slug-device.html">flat text on the device</a> &middot; <a href="?webgl=1">force WebGL2</a><div id="ctl">angle <input id="angle" type="range" min="-180" max="180" value="20"> <span id="angleV"></span> &middot; yaw <input id="yaw" type="range" min="-80" max="80" value="35"> <span id="yawV"></span> &middot; tilt <input id="tilt" type="range" min="-80" max="80" value="30"> <span id="tiltV"></span> &middot; distance <input id="dist" type="range" min="120" max="900" value="340"> <span id="distV"></span></div></div>
</div>
<canvas id="c"></canvas>
<script type="module" src="/ui/originNotice.js"></script>
<script type="module">
import { requestDevice } from "./gfx/device.js";
import { parseFont } from "./text/slugFont.js";
import { SlugFontDevice, SlugDeviceBatch } from "./render/slugDevice.mjs";
import { rotatedRows, perspectiveRows, wRange } from "./render/slugProjective.mjs";

const cvs = document.getElementById("c"), beEl = document.getElementById("be"), subEl = document.getElementById("sub");
const FONT_URL = "./vendor/fonts/IBMPlexSerif-Regular.ttf";
const SAMPLE = "Sphinx of black quartz, judge my vow";
const SIZE = 26;
const CHARS = " " + SAMPLE + "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789.,'%";
const fail = (m) => { beEl.innerHTML = '<span class="bad">' + m + "</span>"; };

// Four rows read as (m.x, m.y, -, m.w): vertices arrive in PIXELS (em * size), y-up, baseline at Y = 0; this places the
// baseline origin at screen pixel (px, py) with y down. The same rows slug-text.html uses.
function placeRows(W, H, px, py) {
  return new Float32Array([2 / W, 0, 0, (2 / W) * px - 1,  0, 2 / H, 0, 1 - (2 / H) * py,  0, 0, 0, 0,  0, 0, 0, 1]);
}

let device, fontDevice, batches = [];
async function init() {
  const forceGl = new URLSearchParams(location.search).get("webgl") === "1";
  try { device = await requestDevice(cvs, forceGl ? { backend: "webgl2" } : { prefer: "webgpu" }); }
  catch (e) { return fail("requestDevice threw: " + e.message); }
  if (!device || device.backend === "null") return fail("no GPU backend here (WebGPU needs a secure origin: localhost or https).");
  let ab;
  try { const r = await fetch(FONT_URL); if (!r.ok) throw new Error("HTTP " + r.status); ab = await r.arrayBuffer(); }
  catch (e) { return fail("could not load " + FONT_URL + " (" + e.message + ")"); }
  let font;
  try { font = parseFont(ab); fontDevice = new SlugFontDevice(device, font, CHARS); }
  catch (e) { return fail("font/atlas/pipeline: " + e.message); }
  document.getElementById("notice").textContent = fontDevice.notice;
  const kb = (fontDevice.byteSize / 1024).toFixed(0);
  beEl.textContent = "backend: " + device.backend + " · atlas " + kb + " KiB (rgba16float + rg16uint) · logWidth " + fontDevice.logWidth;
  batch = new SlugDeviceBatch(fontDevice);
  laid = batch.set(SAMPLE, { size: SIZE * dpr(), color: [0.92, 0.95, 1, 1] });
  for (const id of ["angle", "yaw", "tilt", "dist"]) document.getElementById(id).addEventListener("input", draw);
  draw();
  addEventListener("resize", draw);
}
let batch, laid;
function dpr() { return Math.min(2, devicePixelRatio || 1); }
const val = (id) => Number(document.getElementById(id).value);
function draw() {
  const d = dpr(), w = Math.round((cvs.clientWidth || 1200) * d), h = Math.round(420 * d);
  if (cvs.width !== w || cvs.height !== h) { cvs.width = w; cvs.height = h; }
  const angle = val("angle") * Math.PI / 180, yaw = val("yaw") * Math.PI / 180, tilt = val("tilt") * Math.PI / 180, dist = val("dist");
  document.getElementById("angleV").textContent = val("angle") + " deg"; document.getElementById("yawV").textContent = val("yaw") + " deg";
  document.getElementById("tiltV").textContent = val("tilt") + " deg"; document.getElementById("distV").textContent = dist;
  // top half: the rotation about the text's start; bottom half: the plane in perspective, the text centred on the plane
  const rot = rotatedRows(w, h, w * 0.5 - (laid.width / 2) * Math.cos(angle), h * 0.28 + (laid.width / 2) * Math.sin(angle), angle);
  const persp = perspectiveRows(w, h, { yaw, tilt, dist, ox: -laid.width / 2, oy: -SIZE * d * 0.35 + 0, scale: 1 });
  // the perspective rows place the plane's centre at the frame's centre; shift it to the lower half through the ortho part of P
  const p2 = new Float32Array(persp); p2[4] -= 0; 
  const corners = [[0, 0], [laid.width, 0], [0, SIZE * d], [laid.width, SIZE * d]];
  const wr = wRange(persp, corners, w, h);
  device.frame(({ pass }) => {
    pass.clear([0.02, 0.031, 0.024, 1]);
    batch.draw(pass, rot, [w, h]);
    // the perspective case: the same rows, the clip y offset down by 0.45 of the frame (row 1's w column is the clip-space y offset scaled by w, so add to row 1 as -0.45 * w-row)
    const lower = new Float32Array(persp); for (let k = 0; k < 4; k++) lower[4 + k] += -0.45 * persp[12 + k];
    batch.draw(pass, lower, [w, h]);
  });
  beEl.textContent = "backend: " + device.backend + " \u00b7 perspective w from " + wr.lo.toFixed(0) + " to " + wr.hi.toFixed(0) + " across the text (ratio " + wr.ratio.toFixed(2) + ") \u00b7 the dilation stays half a pixel per axis on screen at every corner (gated)";
}
init();
</script>
</body>
</html>
