<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="demo:title" content="Race track (a seeded grid track from Kenney's tiles with CityGen's blocks on gfx/device.js)">
<meta name="demo:desc" content="Racing city 1, phase 1 on the flat: world/raceTrack.mjs lays a seeded closed loop of cells on a 12 x 12 grid of 10-unit cells -- a rectangle ring grown by seeded bumps (two consecutive cells pushed sideways, so the loop stays a simple cycle by construction) -- and turns every cell into one of Kenney's tiles: a straight where the cell's two ports are opposite, a corner where they are not, the first straight the finish gate, each turned by the quarter turns that make its measured asphalt edges meet its neighbours'. The centreline (edge midpoints and radius-5 arcs about the corners' tile corners), the kerb lines, one checkpoint per tile at its entry edge and CityGen's buildings (one per free block, facades on, stamped into a one-voxel grass floor through the sandbox's own generator) are all derived from the same cell list. Drawn on WebGPU or WebGL2 through gpuDriven: the tiles as instanced fleets in litSphere's quat mode, the floor and buildings as the sandbox's greedy-meshed world in the same scene. Seed, bumps and buildings live; the HUD names the tiles, corners, hairpins, lap length and hash; drag to orbit, wheel to dolly.">
<meta name="demo:category" content="world">
<title>Race track on the GPU</title>
<style>
  html,body { margin:0; height:100%; background:#050805; color:#9fb2d4; font:12px ui-monospace,Menlo,monospace; }
  #c { display:block; width:100%; }
  #hud { padding:10px 14px; }
  #cap { color:#f6a623; letter-spacing:.14em; text-transform:uppercase; }
  #be { color:#59d1ff; font-size:14px; margin-top:4px; }
  #sub { color:#5f7aa0; font-size:11px; margin-top:2px; line-height:1.7; }
  .bad { color:#ff9a9a; }
  a { color:#59d1ff; }
  input[type=number] { width:48px; background:#0c140f; color:#9fb2d4; border:1px solid #2a3a30; font:inherit; }
</style>
</head>
<body>
<div id="hud">
  <div id="cap">Race track on the GPU: a seeded loop of Kenney's tiles with CityGen's blocks, through gfx/device.js</div>
  <div id="be">requesting a device&hellip;</div>
  <div id="sub">seed <input id="seed" type="number" value="1" min="1"> &middot; bumps <input id="bumps" type="number" value="8" min="0" max="40"> &middot; <label><input type="checkbox" id="city" checked> buildings on the free blocks</label>
    &middot; <a href="?webgl=1">force WebGL2</a><br>
    <span id="tick">loading the racing kit&hellip;</span><br><span id="desc"></span> &middot; drag to orbit, wheel to dolly</div>
</div>
<canvas id="c"></canvas>
<script type="module" src="/ui/originNotice.js"></script>
<script type="module">
import { requestDevice } from "./gfx/device.js";
import * as G from "./render/gpuDriven.mjs";
import * as L from "./render/litSphere.mjs";
import { loadKit, kitScene, imageToColormap } from "./world/kenneyKit.mjs";
import { generateTrack, tilePlacements, trackWorld, describeTrack, hairpins, checkpoints } from "./world/raceTrack.mjs";
import { miniWorld, meshWorld, SUN } from "./render/voxelDevice.mjs";
import { CityGen } from "./world/CityGen.js";

const cvs = document.getElementById("c"), beEl = document.getElementById("be");
const fail = (m) => { beEl.innerHTML = '<span class="bad">' + m + "</span>"; };
const $ = (id) => document.getElementById(id);
let device, scene = null, kit = null, yaw = 0.6, pitch = 0.7, dist = 190, dragging = null, dirty = true, camNow = null, centre = [0, 0, 0];

const readBytes = async (p) => { const r = await fetch("/" + p); if (!r.ok) throw new Error(`${p}: HTTP ${r.status}`); return r.arrayBuffer(); };
const readImage = async (p) => { const r = await fetch("/" + p); if (!r.ok) throw new Error(`${p}: HTTP ${r.status}`); const bmp = await createImageBitmap(await r.blob(), { colorSpaceConversion: "none", premultiplyAlpha: "none" }); const oc = new OffscreenCanvas(bmp.width, bmp.height), ctx = oc.getContext("2d"); ctx.drawImage(bmp, 0, 0); return imageToColormap(ctx.getImageData(0, 0, bmp.width, bmp.height)); };

function rebuild() {
  if (!kit) return;
  const t0 = performance.now();
  const track = generateTrack({ seed: Math.max(1, +$("seed").value | 0), bumps: Math.max(0, +$("bumps").value | 0) });
  const placements = tilePlacements(track);
  const world = miniWorld(), { rects } = trackWorld(track, world, CityGen, { fill: $("city").checked ? 0.8 : 0 });
  const packed = meshWorld(world);
  const t1 = performance.now();
  if (scene && scene.destroy) scene.destroy();
  scene = kitScene(device, kit, placements, G, L, { light: SUN, extraFleets: [{ name: "world", mesh: packed.mesh, pipeline: L.litPipelineDesc({ cull: "none" }), bind: L.litBind(SUN), records: Float32Array.from([0, 0, 0, 1]), extras: new Float32Array(4) }] });
  $("tick").textContent = `${placements.length} tiles, ${rects.length} buildings on ${world.chunks.size} chunks (${packed.triangles.toLocaleString()} triangles), ${checkpoints(track).length} checkpoints; built in ${(t1 - t0).toFixed(0)} ms, scene in ${(performance.now() - t1).toFixed(0)} ms on ${scene.path}`;
  $("desc").textContent = describeTrack(track) + `, ${hairpins(track).length} hairpins`;
  dirty = true;
}

async function main() {
  const forceGl = new URLSearchParams(location.search).get("webgl") === "1";
  try { device = await requestDevice(cvs, forceGl ? { backend: "webgl2" } : { prefer: "webgpu" }); }
  catch (e) { return fail("requestDevice threw: " + e.message); }
  beEl.textContent = `device: ${device.backend}`;
  try {
    const t0 = performance.now(), baseUrlOf = (p) => new URL("/" + p, location.href).href;
    kit = await loadKit("racing", { readBytes, readImage, baseUrlOf });
    if (kit.failed.length) fail("models that did not load: " + kit.failed.map((f) => f.file + " (" + f.error + ")").join(", "));
    beEl.textContent += ` -- ${kit.models.size} racing models loaded in ${(performance.now() - t0).toFixed(0)} ms`;
  } catch (e) { return fail("loading the kit threw: " + e.message); }
  rebuild();
  for (const id of ["seed", "bumps", "city"]) $(id).addEventListener("change", rebuild);
  cvs.addEventListener("pointerdown", (e) => { dragging = [e.clientX, e.clientY]; });
  addEventListener("pointerup", () => { dragging = null; });
  addEventListener("pointermove", (e) => { if (!dragging) return; yaw += (e.clientX - dragging[0]) * 0.006; pitch = Math.max(0.05, Math.min(1.5, pitch + (e.clientY - dragging[1]) * 0.006)); dragging = [e.clientX, e.clientY]; dirty = true; });
  cvs.addEventListener("wheel", (e) => { e.preventDefault(); dist = Math.max(20, Math.min(600, dist * Math.exp(e.deltaY * 0.001))); dirty = true; }, { passive: false });
  requestAnimationFrame(frame);
}

function frame() {
  requestAnimationFrame(frame);
  const w = cvs.clientWidth | 0, h = Math.max(200, (innerHeight - document.getElementById("hud").offsetHeight - 4) | 0);
  if (cvs.width !== w || cvs.height !== h) { cvs.width = w; cvs.height = h; dirty = true; }
  if (!scene || !dirty) return;
  dirty = false;
  const eye = [centre[0] + dist * Math.sin(yaw) * Math.cos(pitch), centre[1] + dist * Math.sin(pitch), centre[2] + dist * Math.cos(yaw) * Math.cos(pitch)];
  camNow = { viewProj: G.multiply(G.perspective(0.9, w / h, 0.5, 2000), G.lookAt(eye, centre)), eye };
  scene.frame({ ...camNow, clear: [0.03, 0.05, 0.08, 1] });
}

main();
</script>
</body>
</html>
