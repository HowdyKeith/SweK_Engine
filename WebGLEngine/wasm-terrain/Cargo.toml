[package]
name = "terrain-wasm"
version = "0.1.0"
edition = "2021"
description = "SweK VoxelEngine terrain generation (heightmap + erosion + chunk fill) compiled to WASM"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Uncomment to shrink the .wasm further at a small speed cost:
# [profile.release]
# opt-level = "s"
