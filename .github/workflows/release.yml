# SweK Engine -- release build (v3947)
#
# THE ITEM THIS CLOSES, IN KEITH'S WORDS ON rig.html: "You hand-carry a zip to a house in another town."
# The rig entry called a CI release matrix "THE HIGHEST-VALUE ITEM ON THIS PAGE" and pointed at Velfi/Vizza's
# workflow, which ships six platform artifacts per release.
#
# *** WHERE THIS DELIBERATELY DOES NOT COPY THAT MATRIX, AND WHY. *** Vizza is a Tauri app: six artifacts because
# six platforms need six BINARIES. This engine ships ONE platform-independent zip -- JS, WASM and assets -- so a
# six-way build matrix here would produce six byte-identical zips and call it coverage. That is the shape of
# rigour without the substance, and this tree has a name for numbers that look like checks.
#
# WHAT IS WORTH STEALING IS THE OTHER HALF OF WHAT THE MATRIX BUYS: the artifact gets exercised somewhere other
# than the machine that made it. Hand-carrying a zip to another town is precisely a build that has never been
# opened anywhere else. So: TAKE THE PUBLISHED ARCHIVE and VERIFY THAT ONE ARTIFACT ON ubuntu, macOS AND
# Windows -- unpack it and make the tree answer for itself on each. That tests the thing hand-carrying never
# did, and it is aimed squarely at the class of bug this repo keeps finding: path handling that only fails on
# Windows.
#
# *** v4070 -- IT VERIFIES THE PUBLISHED ARCHIVE NOW, NOT ONE IT PACKED ITSELF, AND THAT DISTINCTION IS THE
# WHOLE VALUE OF THIS FILE. *** "the artifact gets exercised somewhere other than the machine that made it" was
# only ever half true here: CI packed its own zip, vetted that, unpacked that on three platforms, and the copy
# on the releases page -- the only one anybody downloads -- was touched by nothing. Since v4068 the rig is the
# publisher, so CI's zip had no users at all. The three unpacks, the ship gate and the credential sweep all
# read the published archive now.
#
# *** v4068 -- THIS WORKFLOW DOES NOT PUBLISH ANY MORE, AND IT NEVER SUCCESSFULLY DID. *** Every run since it
# was written -- ten of them, v3958 through v4067 -- ended red on `gh release create` with "a release with the
# same tag name already exists", and THE BUILD WAS NEVER THE PROBLEM. The rig is the publisher: the GitHub
# panel's button packs the zip, creates the release, uploads the asset AND PUSHES THE TAG -- and it is that tag
# push which starts this workflow. Measured on v4067: the release was published at 17:13:34Z and this run began
# at 17:13:36Z, two seconds behind the thing that started it. The job was racing a publisher that had already
# finished, and losing by construction, every single time.
#
# *** AND THE OBVIOUS REPAIR -- upload --clobber -- WOULD HAVE BEEN WORSE THAN THE RED X. *** The zip is NOT
# byte-reproducible across machines: the packer walks a live tree, so the same commit (dbc0855, v4067) produced
# 26,775,683 bytes on this runner, 27,424,068 on the rig, and 27,766,762 in a third checkout. Clobbering would
# replace the artifact the rig built, verified and shipped with a different one assembled elsewhere, silently,
# under a release somebody had already downloaded.
#
# So publishing is left to the rig, which was doing it correctly all along, and this workflow keeps the half it
# was actually valuable for and the half that has always passed: BUILD ONCE, VERIFY ON THREE PLATFORMS.
name: release

on:
  push:
    tags: ["v*"]
  # *** THE dry_run INPUT IS GONE BECAUSE IT NEVER DID ANYTHING -- A FLAG THAT LIES. *** It was declared with
  # the description "Build and verify, but publish nothing" and was REFERENCED NOWHERE: the publish job gated on
  # `github.event_name == 'push' && github.ref_type == 'tag'`, which is already false for a manual run, so the
  # button was a dry run whether the toggle said true or false. A control that reads as a choice and is wired to
  # nothing is worse than no control, and with publishing gone it would now be doubly meaningless.
  workflow_dispatch:

permissions:
  contents: read         # v4068: was `write` for creating releases. Nothing here writes any more, so it asks
                         # for nothing it cannot use -- the token's reach should end where the job's work does.

jobs:
  # *** v4070 -- THIS JOB FETCHES THE PUBLISHED RELEASE INSTEAD OF PACKING ITS OWN, AND THAT IS THE WHOLE
  # POINT OF THE CHANGE. *** Until now it ran packRelease itself, vetted THAT archive, and handed THAT archive
  # to the three-platform matrix. But the rig is the publisher (v4068), so the zip CI built was one nobody would
  # ever download: the credential sweep, the ship gate and all three unpacks were exercising an artifact with no
  # users, while the one on the releases page was checked by nothing.
  #
  # THE CREDENTIAL SWEEP IS THE HALF THAT MATTERS. Its own note calls it "the one claim in this workflow worth
  # checking twice, because it is the only one whose failure cannot be taken back once a release is public" --
  # and it was reading the wrong file. If the rig's packer ever drifted from SKIP_FILES, CI would have gone
  # green on its own clean zip while the published archive carried the secret. Now it reads what people
  # download.
  #
  # AND CI STILL PACKS NOTHING, so the v4068 finding holds: the zip is not byte-reproducible across machines,
  # so there is no build here to be tempted into uploading over the rig's.
  fetch:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.tree }}
      zipname: ${{ steps.get.outputs.zipname }}
    steps:
      # The checkout is still needed -- not to build, but because the two things that VET the archive live in
      # the tree: verify_zip.py, and the SKIP_FILES list the credential sweep derives its names from.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # THE TREE STATES ITS OWN VERSION AND NOTHING HERE MAY DISAGREE WITH IT.
      # A tag that says one thing while main.js says another is the mislabeled build the ship ritual exists to
      # stop -- and it is worst here, because the tag is what everybody downloads by. Read, compared, refused.
      - name: Version marker vs tag
        id: ver
        run: |
          set -euo pipefail
          VER=$(node -e 'process.stdout.write(require("./WebGLEngine/ai-bridge/packagerBridge.js").engineVersion()||"")')
          test -n "$VER" || { echo "::error::no ENGINE_VERSION marker in WebGLEngine/main.js"; exit 2; }
          echo "tree=$VER" >> "$GITHUB_OUTPUT"
          echo "the tree says $VER"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            echo "the tag says ${GITHUB_REF_NAME}"
            if [ "${GITHUB_REF_NAME}" != "$VER" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match ENGINE_VERSION $VER -- the published build is mislabeled"
              exit 1
            fi
          fi

      # *** THE ASSET IS WAITED FOR RATHER THAN ASSUMED PRESENT, BECAUSE THE RACE IS REAL AND MEASURED. *** The
      # rig pushes the tag as part of publishing, so this workflow starts WHILE the upload is still finishing:
      # on v4067 the run began at 17:13:36Z against an asset whose own updated_at was 17:13:37Z. Reading once
      # and failing would be a flake generator. A BOUNDED wait, not an unbounded one -- if the rig never
      # published, that is a real finding about the release and this job should say so and stop, not hang.
      - name: Wait for the published archive, then take it
        id: get
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          COUNT=0
          for i in $(seq 1 20); do
            COUNT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
                      --jq '[.assets[] | select(.name | endswith(".zip"))] | length' 2>/dev/null || echo 0)
            [ "${COUNT:-0}" -gt 0 ] && break
            echo "  no .zip on release $TAG yet (attempt $i/20) -- the rig may still be uploading"
            sleep 15
          done
          if [ "${COUNT:-0}" -eq 0 ]; then
            echo "::error::release $TAG carries no .zip after 5 minutes. Either the rig did not publish, or it"
            echo "::error::published without a build. Nothing here can verify a release that does not exist."
            exit 1
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.zip' --dir dl
          ZIP=$(ls dl/*.zip | head -1)
          echo "zipname=$(basename "$ZIP")" >> "$GITHUB_OUTPUT"
          echo "took $(basename "$ZIP") ($(stat -c%s "$ZIP") bytes) off the release"
          # A PARTIAL UPLOAD IS A REAL STATE AND unzip -t IS THE ONLY THING THAT ACTUALLY DISPROVES IT. An
          # asset that exists and a complete archive are different facts; a size check would pass a truncated
          # one, and this is the moment to find out rather than three matrix jobs later.
          unzip -t "$ZIP" >/dev/null || { echo "::error::the published archive is not a complete zip"; exit 1; }
          echo "the archive is structurally complete"

      # THE REPO'S OWN HARD-FAIL GATE, not a reimplementation of it: mislabeled build, nested project root,
      # and a size that is implausible either way. It is the script the ship-ritual skill already runs by hand
      # -- pointed at THE PUBLISHED ARCHIVE now, which is the copy the claim is actually about.
      - name: Ship gate (verify_zip.py) on the published archive
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.tree }}"
          python3 agent-skills/ship-ritual/scripts/verify_zip.py \
            --zip "dl/${{ steps.get.outputs.zipname }}" \
            --version "$VER" \
            --version-file "SweK_Engine_${VER}/WebGLEngine/main.js" \
            --project-prefix "SweK_Engine_v"

      # A SECOND, INDEPENDENT LOOK FOR CREDENTIALS. verify_zip.py checks labelling and shape; it does not know
      # what a secret is. This asserts the SKIP_FILES names are absent from the finished archive rather than
      # trusting that the packer applied its own list -- the one claim in this workflow worth checking twice,
      # because it is the only one whose failure cannot be taken back once a release is public.
      #
      # *** AND AS OF v4070 IT READS THE PUBLISHED ARCHIVE, WHICH IS THE ONLY COPY THE SENTENCE ABOVE WAS EVER
      # TRUE OF. *** Run against a zip CI packed itself, it could only ever prove that CI's packer was clean --
      # a fact about a file with no users, while the public download went unchecked.
      - name: No credential files in the published archive
        run: |
          set -euo pipefail
          ZIP="dl/${{ steps.get.outputs.zipname }}"
          NAMES=$(node -e '
            const s=require("fs").readFileSync("WebGLEngine/ai-bridge/packagerBridge.js","utf8");
            const m=s.match(/const SKIP_FILES = new Set\(\[([\s\S]*?)\]\)/);
            if(!m){console.error("could not read SKIP_FILES");process.exit(2);}
            const names=[...m[1].matchAll(/"([^"]+)"/g)].map(x=>x[1]).filter(n=>n.endsWith(".json"));
            if(!names.length){console.error("SKIP_FILES held no .json names -- refusing to pass vacuously");process.exit(2);}
            process.stdout.write(names.join("\n"));')
          echo "checking the PUBLISHED archive for $(echo "$NAMES" | wc -l) credential filenames"
          HIT=0
          while read -r n; do
            [ -z "$n" ] && continue
            if unzip -Z1 "$ZIP" | grep -qE "(^|/)${n}$"; then echo "::error::$n is inside the PUBLISHED release archive"; HIT=1; fi
          done <<< "$NAMES"
          [ "$HIT" = "0" ] || exit 1
          echo "none present"

      # Downloaded once, handed to the three platforms, so all three open THE SAME BYTES -- and the same bytes
      # the public gets. Re-downloading per matrix job would let a mid-run re-upload split them.
      - uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: dl/*.zip
          retention-days: 7
          if-no-files-found: error

  # BUILD ONCE, OPEN IT SOMEWHERE ELSE -- the half of the matrix idea that this project can actually use.
  verify:
    needs: fetch
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/download-artifact@v4
        with:
          name: release-zip
          path: dl

      - name: Unpack and make the tree answer for itself
        shell: bash
        run: |
          set -euo pipefail
          cd dl
          # bash on the windows runner has unzip; Expand-Archive is not needed and would only add a second spelling
          unzip -q "${{ needs.fetch.outputs.zipname }}"
          cd "SweK_Engine_${{ needs.fetch.outputs.version }}/WebGLEngine"
          # shipRitual reads the tree live -- version markers, the gate count, the launch index -- so it is a real
          # smoke test of an UNPACKED build rather than a "did the file arrive" check. It also walks a few
          # thousand paths, which is the part that has historically only ever failed on Windows.
          node tools/ship/shipRitual.mjs
          # and the two markers must still agree after a round trip through zip
          node -e '
            const fs=require("fs");
            const eng=(fs.readFileSync("main.js","utf8").match(/ENGINE_VERSION\s*=\s*"([^"]+)"/)||[])[1];
            const brn=(fs.readFileSync("brain/brain.js","utf8").match(/BRAIN_BUILD\s*=\s*"([^"]+)"/)||[])[1];
            if(!eng||eng!==brn){console.error("markers disagree after unpack: "+eng+" vs "+brn);process.exit(1);}
            if(eng!=="${{ needs.fetch.outputs.version }}"){console.error("unpacked tree says "+eng);process.exit(1);}
            console.log("unpacked build agrees: "+eng);'
